<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPIC - Clinical Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ===== css/ehr-theme.css ===== */
/* =========================================================
   EHR PORTAL — DESIGN TOKENS
   Visual target: Epic Hyperspace. Steel-blue chrome, squared
   corners, high information density, flat surfaces, colour used
   only to carry clinical meaning.
   ========================================================= */

:root{
  /* Chrome — Hyperspace steel blue */
  --steel-950:#0E2338;
  --steel-900:#173C5C;
  --steel-800:#1F5178;
  --steel-700:#2A6591;
  --steel-600:#3B7BAB;
  --steel-500:#5E9AC4;
  --steel-300:#A8C6DC;
  --steel-100:#DCE9F2;
  --steel-050:#EFF5F9;

  /* Accent — Epic's cyan-teal action colour */
  --accent-700:#0A6E77;
  --accent-600:#0D8892;
  --accent-500:#12A3AE;
  --accent-100:#D5EFF1;

  /* Clinical status */
  --amber-600:#B4740F;
  --amber-500:#D9920F;
  --amber-050:#FDF4E3;
  --red-700:#992319;
  --red-600:#C03327;
  --red-050:#FBE9E7;
  --green-700:#1A6B43;
  --green-600:#1F8A55;
  --green-050:#E7F5EC;
  --blue-700:#1F4EA8;
  --blue-050:#E9EFFA;
  --violet-600:#4A4CC4;
  --violet-050:#EDEDFB;

  /* Neutrals — cool grid greys */
  --ink-900:#16202B;
  --ink-700:#374453;
  --ink-500:#63707F;
  --ink-400:#8A96A3;
  --line-strong:#B7C2CD;
  --line:#CFD8E0;
  --line-soft:#E3E9EE;
  --fill-050:#F4F7F9;
  --fill-100:#EAEFF3;
  --white:#FFFFFF;

  /* Shape — Epic is nearly square */
  --radius:3px;
  --radius-lg:4px;
  --shadow-sm:0 1px 0 rgba(22,32,43,.06);
  --shadow-md:0 2px 6px rgba(22,32,43,.14);
  --shadow-lg:0 6px 22px rgba(14,35,56,.28);

  /* Type — dense clinical UI */
  --sans:'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,Tahoma,sans-serif;
  --mono:'IBM Plex Mono','Consolas','SFMono-Regular',monospace;
  --fs-base:12.5px;

  /* Chrome dimensions */
  --topbar-h:44px;
  --tabbar-h:32px;
  --sidebar-w:212px;
  --statusbar-h:24px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}

body{
  font-family:var(--sans);
  background:var(--fill-100);
  color:var(--ink-900);
  font-size:var(--fs-base);
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
}

a{color:var(--steel-800);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:12.5px;}
::selection{background:var(--steel-500);color:var(--white);}

h1,h2,h3,h4{margin:0;font-weight:600;color:var(--steel-950);}

:focus-visible{outline:2px solid var(--accent-500);outline-offset:1px;}

::-webkit-scrollbar{width:12px;height:12px;}
::-webkit-scrollbar-track{background:var(--fill-100);}
::-webkit-scrollbar-thumb{background:var(--line-strong);border:3px solid var(--fill-100);border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:var(--ink-400);}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}

/* ===== css/layout.css ===== */
/* =========================================================
   EHR PORTAL — SHELL LAYOUT
   Epic Hyperspace chrome: login gate, identity bar, workspace
   tab row, activity rail, dense canvas, status bar.
   ========================================================= */

.app{display:flex;flex-direction:column;min-height:100vh;}

/* ================= LOGIN GATE ================= */
.login-screen{
  position:fixed;inset:0;z-index:5000;
  background:
    radial-gradient(1200px 600px at 20% -10%, var(--steel-700), transparent 60%),
    linear-gradient(160deg,var(--steel-950) 0%,var(--steel-900) 55%,#0A1A2A 100%);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.login-card{
  width:100%;max-width:394px;background:var(--white);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  overflow:hidden;border-top:4px solid var(--accent-500);
}
.login-head{padding:22px 26px 16px;border-bottom:1px solid var(--line-soft);}
.login-logo{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
.login-mark{
  width:30px;height:30px;border-radius:var(--radius);
  background:var(--steel-800);color:#fff;font-weight:700;font-size:12px;
  display:flex;align-items:center;justify-content:center;
}
.login-title{font-size:17px;font-weight:600;color:var(--steel-950);}
.login-sub{font-size:11.5px;color:var(--ink-500);margin-top:3px;}
.login-body{padding:20px 26px 24px;}
.login-body .form-field{margin-bottom:13px;}
.login-foot{
  padding:11px 26px;background:var(--fill-050);
  border-top:1px solid var(--line-soft);
  font-size:10.5px;color:var(--ink-400);line-height:1.5;
}

/* ================= IDENTITY BAR ================= */
.topbar{
  height:var(--topbar-h);flex-shrink:0;
  background:linear-gradient(180deg,var(--steel-800),var(--steel-900));
  border-bottom:1px solid var(--steel-950);
  color:var(--white);
  display:flex;align-items:center;gap:12px;padding:0 12px;
  position:sticky;top:0;z-index:60;
}
.brand{display:flex;align-items:center;gap:8px;}
.brand-mark{
  width:25px;height:25px;border-radius:var(--radius);flex-shrink:0;
  background:var(--white);color:var(--steel-800);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;letter-spacing:-.3px;
}
.brand-name{font-size:14.5px;font-weight:700;letter-spacing:.3px;}
.brand-sub{
  font-size:10.5px;color:var(--steel-300);font-weight:400;
  padding-left:9px;margin-left:1px;border-left:1px solid rgba(255,255,255,.22);
}
.env-chip{
  font-size:10px;font-weight:700;letter-spacing:.4px;
  padding:2px 7px;border-radius:2px;
  background:var(--amber-500);color:#241703;
}
.topbar-spacer{flex:1;}
.topbar-icon-btn{
  background:none;border:none;color:var(--steel-100);
  width:28px;height:28px;border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;
}
.topbar-icon-btn:hover{background:rgba(255,255,255,.16);color:#fff;}

/* The signed-in clinician. Epic always shows who is charting. */
.topbar-user{
  display:flex;align-items:center;gap:8px;
  padding-left:11px;margin-left:3px;
  border-left:1px solid rgba(255,255,255,.22);
}
.avatar{
  width:26px;height:26px;border-radius:50%;flex-shrink:0;
  background:var(--accent-600);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:700;
}
.user-meta{display:flex;flex-direction:column;line-height:1.2;}
.user-name{font-size:12px;font-weight:600;}
.user-role{font-size:10px;color:var(--steel-300);}
.signout{
  background:none;border:1px solid rgba(255,255,255,.28);
  color:var(--steel-100);font-size:10.5px;font-weight:600;
  padding:3px 8px;border-radius:2px;margin-left:6px;
}
.signout:hover{background:rgba(255,255,255,.16);color:#fff;}

/* ================= WORKSPACE TAB ROW ================= */
/* Hyperspace keeps open workspaces as squared tabs under the identity bar. */
.workspacebar{
  height:var(--tabbar-h);flex-shrink:0;
  background:var(--steel-100);
  border-bottom:1px solid var(--line-strong);
  display:flex;align-items:stretch;gap:1px;padding:0 8px;
  overflow-x:auto;
}
.ws-tab{
  display:flex;align-items:center;gap:7px;
  background:transparent;border:none;
  padding:0 14px;font-size:12px;font-weight:600;
  color:var(--steel-800);white-space:nowrap;
  border-bottom:3px solid transparent;
}
.ws-tab:hover{background:rgba(255,255,255,.7);}
.ws-tab.active{
  background:var(--white);color:var(--steel-950);
  border-bottom-color:var(--accent-500);
  box-shadow:inset 0 1px 0 var(--white);
}
.ws-tab svg{opacity:.75;}

/* ================= SHELL + ACTIVITY RAIL ================= */
.shell{display:flex;flex:1;min-height:0;}

.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--white);
  border-right:1px solid var(--line);
  padding:0 0 14px;
  display:flex;flex-direction:column;
  overflow-y:auto;
}
.side-section-label{
  font-size:10px;font-weight:700;letter-spacing:.6px;
  color:var(--white);background:var(--steel-700);
  padding:5px 11px;margin-top:0;
  border-bottom:1px solid var(--steel-800);
}
.side-item{
  display:flex;align-items:center;gap:9px;width:100%;
  background:none;border:none;border-bottom:1px solid var(--line-soft);
  text-align:left;padding:7px 11px;
  color:var(--ink-700);font-size:12px;font-weight:500;
}
.side-item svg{flex-shrink:0;color:var(--steel-600);}
.side-item span:first-of-type{flex:1;}
.side-item:hover{background:var(--steel-050);color:var(--steel-900);}
.side-item.active{
  background:var(--accent-100);color:var(--steel-950);font-weight:700;
  box-shadow:inset 4px 0 0 var(--accent-600);
}
.side-item.active svg{color:var(--accent-700);}
.side-badge{
  background:var(--green-600);color:#fff;
  font-size:9.5px;font-weight:700;letter-spacing:.3px;
  padding:1px 5px;border-radius:2px;
}
.sidebar-footer{
  margin-top:auto;padding:10px 11px;
  font-size:10px;color:var(--ink-400);line-height:1.5;
  border-top:1px solid var(--line-soft);
}

/* ================= CANVAS ================= */
.main{flex:1;min-width:0;padding:0 0 var(--statusbar-h);background:var(--fill-100);}

/* Activity header — the band Epic puts above every activity. */
.activity-head{
  background:var(--white);
  border-bottom:1px solid var(--line);
  padding:11px 18px 0;
}
.crumbs{font-size:10.5px;color:var(--ink-400);margin-bottom:4px;}
.crumbs b{color:var(--ink-500);font-weight:600;}
.page-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:14px;flex-wrap:wrap;padding-bottom:10px;
}
.page-title{font-size:17px;font-weight:600;color:var(--steel-950);letter-spacing:-.1px;}
.page-sub{font-size:11.5px;color:var(--ink-500);margin-top:2px;}
.page-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}

.module-body{padding:14px 18px 30px;}

/* Activity tab strip inside a module */
.tabstrip{
  display:flex;gap:0;align-items:stretch;
  border-bottom:1px solid var(--line);
  background:var(--white);margin:0 -18px 14px;padding:0 18px;
  overflow-x:auto;
}
.tab{
  background:none;border:none;
  padding:7px 13px;
  font-size:12px;font-weight:600;color:var(--ink-500);
  border-bottom:3px solid transparent;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
.tab:hover{color:var(--steel-800);background:var(--steel-050);}
.tab.active{color:var(--steel-950);border-bottom-color:var(--accent-500);}

.view{display:none;}
.view.active{display:block;}

/* ================= STATUS BAR ================= */
.statusbar{
  position:fixed;bottom:0;left:0;right:0;height:var(--statusbar-h);
  background:var(--steel-900);color:var(--steel-300);
  border-top:1px solid var(--steel-950);
  display:flex;align-items:center;gap:16px;padding:0 12px;
  font-size:10.5px;z-index:70;
}
.statusbar .sb-sep{width:1px;height:12px;background:rgba(255,255,255,.2);}
.statusbar b{color:var(--white);font-weight:600;}

.footer-note{
  text-align:center;font-size:10.5px;color:var(--ink-400);
  margin-top:24px;padding-top:12px;border-top:1px solid var(--line);
}

/* ================= RESPONSIVE ================= */
@media(max-width:1020px){
  .sidebar{width:46px;}
  .side-item span,.side-section-label,.sidebar-footer{display:none;}
  .side-item{justify-content:center;padding:9px 0;}
}
@media(max-width:760px){
  .module-body{padding:12px 12px 30px;}
  .activity-head{padding:10px 12px 0;}
  .tabstrip{margin:0 -12px 12px;padding:0 12px;}
  .brand-sub,.user-meta,.ws-tab span{display:none;}
}

/* ===== css/components.css ===== */
/* =========================================================
   EHR PORTAL — SHARED COMPONENTS
   Buttons, cards, tables, badges, KPI tiles, overlays,
   forms, documents, timeline, toasts.
   Every POC module builds its screens out of these.
   ========================================================= */

/* ---------------- Buttons ---------------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid transparent;border-radius:7px;
  padding:7px 13px;font-size:12.5px;font-weight:600;
  background:var(--line-soft);color:var(--ink-700);
  transition:background .14s,border-color .14s,color .14s,transform .06s;
}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:var(--steel-800);color:#fff;}
.btn-primary:hover:not(:disabled){background:var(--steel-700);}
.btn-teal{background:var(--accent-600);color:#fff;}
.btn-teal:hover:not(:disabled){background:var(--accent-500);}
.btn-outline{background:#fff;color:var(--steel-800);border-color:var(--line-strong);}
.btn-outline:hover:not(:disabled){border-color:var(--steel-600);background:var(--fill-050);}
.btn-ghost{background:transparent;color:var(--ink-700);}
.btn-ghost:hover:not(:disabled){background:var(--line-soft);}
.btn-green{background:var(--green-600);color:#fff;}
.btn-green:hover:not(:disabled){background:var(--green-700);}
.btn-red{background:var(--red-600);color:#fff;}
.btn-red:hover:not(:disabled){background:#A72E22;}
.btn-amber{background:var(--amber-500);color:#fff;}
.btn-amber:hover:not(:disabled){background:#BD7712;}
.btn-sm{padding:5px 10px;font-size:11.5px;border-radius:6px;}
.btn-block{width:100%;justify-content:center;}
.icon-btn{
  background:none;border:none;color:var(--ink-500);
  padding:5px;border-radius:6px;
  display:inline-flex;align-items:center;justify-content:center;
}
.icon-btn:hover{background:var(--line-soft);color:var(--steel-800);}

/* ---------------- KPI tiles ---------------- */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.kpi-row.six{grid-template-columns:repeat(6,1fr);}
.kpi-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:14px 16px 14px 18px;position:relative;overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.kpi-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--accent-500);
}
.kpi-card.amber::before{background:var(--amber-500);}
.kpi-card.green::before{background:var(--green-600);}
.kpi-card.navy::before{background:var(--steel-700);}
.kpi-card.red::before{background:var(--red-600);}
.kpi-label{
  font-size:11px;color:var(--ink-500);font-weight:600;letter-spacing:.2px;
}
.kpi-value{font-size:26px;font-weight:800;color:var(--steel-950);margin-top:4px;line-height:1.1;}
.kpi-delta{font-size:11px;color:var(--green-600);font-weight:600;margin-top:5px;}
.kpi-delta.neutral{color:var(--ink-500);}

/* ---------------- Cards ---------------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);}
.card-head{
  padding:13px 18px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.card-title{font-size:13.5px;font-weight:700;color:var(--steel-950);display:flex;align-items:center;gap:8px;}
.card-sub{font-size:11.5px;color:var(--ink-500);font-weight:500;}
.card-body{padding:18px;}
.card-body.flush{padding:0;}

/* ---------------- Tables ---------------- */
.table-wrap{overflow-x:auto;}
table.data{width:100%;border-collapse:collapse;font-size:12.5px;}
table.data thead th{
  text-align:left;padding:9px 14px;
  background:var(--fill-050);color:var(--ink-500);
  font-size:11px;font-weight:700;letter-spacing:.3px;
  border-bottom:1px solid var(--line);white-space:nowrap;
}
table.data tbody td{padding:10px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
table.data tbody tr:last-child td{border-bottom:none;}
table.data tbody tr.clickable{cursor:pointer;transition:background .12s;}
table.data tbody tr.clickable:hover{background:var(--accent-100);}
table.data tbody tr.selected{background:var(--accent-100);box-shadow:inset 3px 0 0 var(--accent-500);}
.cell-strong{font-weight:600;color:var(--steel-950);}
.cell-mono{font-family:var(--mono);font-size:11.8px;color:var(--ink-700);}
.cell-sub{font-size:11px;color:var(--ink-500);margin-top:1px;}
/* Base: only a non-cell container flexes. A td keeps table-cell
   layout — see the action-column section further down. */
.cell-actions{white-space:nowrap;}

/* ---------------- Badges + pills ---------------- */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 9px;border-radius:20px;
  font-size:11px;font-weight:700;white-space:nowrap;
  background:var(--line-soft);color:var(--ink-700);
}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge-new,.badge-info{background:var(--blue-050);color:var(--blue-700);}
.badge-review,.badge-pended,.badge-warn{background:var(--amber-050);color:var(--amber-600);}
.badge-escalated{background:#FCEEE8;color:#C0561C;}
.badge-autoapproved,.badge-approved,.badge-ok{background:var(--green-050);color:var(--green-600);}
.badge-approvedcond{background:#EAF7EE;color:#1E7A4D;}
.badge-denied,.badge-error{background:var(--red-050);color:var(--red-600);}
.badge-processing{background:var(--violet-050);color:var(--violet-600);}
.badge-teal{background:var(--accent-100);color:var(--accent-600);}
.priority-high{color:var(--red-600);font-weight:700;font-size:11px;}
.priority-standard{color:var(--ink-500);font-weight:600;font-size:11px;}

/* ---------------- Filter bar ---------------- */
.filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:#fff;border:1px solid var(--line-strong);border-radius:7px;
  padding:7px 11px;min-width:280px;flex:1;max-width:460px;
  color:var(--ink-500);
}
.search-box input{border:none;outline:none;font-size:12.5px;flex:1;background:transparent;color:var(--ink-900);}
.chip-filter{
  background:#fff;border:1px solid var(--line-strong);border-radius:20px;
  padding:5px 12px;font-size:11.5px;font-weight:600;color:var(--ink-700);
}
.chip-filter.active{background:var(--steel-900);color:#fff;border-color:var(--steel-900);}
select.field-select{
  background:#fff;border:1px solid var(--line-strong);border-radius:7px;
  padding:7px 10px;font-size:12.5px;color:var(--ink-700);outline:none;
}
select.field-select:focus{border-color:var(--accent-500);box-shadow:0 0 0 3px var(--accent-100);}

/* ---------------- Forms ---------------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
.form-field.full{grid-column:1/-1;}
.form-field label{display:block;font-size:11px;font-weight:700;color:var(--ink-700);margin-bottom:4px;}
.form-field input,.form-field select,.form-field textarea{
  width:100%;border:1px solid var(--line-strong);border-radius:7px;
  padding:7px 10px;font-size:12.5px;background:#fff;color:var(--ink-900);
}
.form-field textarea{min-height:74px;resize:vertical;line-height:1.5;}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{
  outline:none;border-color:var(--accent-500);box-shadow:0 0 0 3px var(--accent-100);
}
.dropzone{
  border:1.5px dashed var(--line-strong);border-radius:var(--radius);
  padding:18px;text-align:center;font-size:12px;color:var(--ink-500);
  background:var(--fill-050);transition:border-color .15s,background .15s;
}
.dropzone.drag{border-color:var(--accent-500);background:var(--accent-100);color:var(--accent-600);}

/* ---------------- Read-only field grid (chart data) ---------------- */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;}
.info-item.full{grid-column:1/-1;}
.info-item-label{font-size:10.5px;letter-spacing:.3px;color:var(--ink-500);font-weight:700;margin-bottom:2px;}
.info-item-value{font-size:13px;color:var(--steel-950);font-weight:600;word-break:break-word;}
.info-item-value.mono{font-family:var(--mono);font-weight:500;}
.info-item-value.body{font-weight:500;line-height:1.55;}

.section-label{
  font-size:11px;letter-spacing:.4px;color:var(--ink-500);font-weight:700;
  display:flex;align-items:center;gap:10px;margin:0 0 10px;
}
.section-label .line{flex:1;height:1px;background:var(--line);}

/* ---------------- Documents ---------------- */
.doc-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);
  background:#fff;margin-bottom:8px;
}
.doc-icon{
  width:30px;height:30px;border-radius:7px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--line-soft);color:var(--ink-500);
}
.doc-icon.pdf{background:var(--red-050);color:var(--red-600);}
.doc-meta{flex:1;min-width:0;}
.doc-name{font-size:12.5px;font-weight:600;color:var(--steel-950);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.doc-sub{font-size:10.8px;color:var(--ink-500);margin-top:1px;}
.doc-actions{display:flex;gap:6px;flex-shrink:0;}

.pdf-frame{
  margin-top:10px;border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;background:var(--fill-050);height:460px;
}
.pdf-frame iframe{width:100%;height:100%;border:none;display:none;background:#fff;}
.pdf-placeholder{
  height:100%;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:20px;font-size:12px;color:var(--ink-500);
}

/* ---------------- Confidence bars ---------------- */
.conf-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.conf-label{width:150px;font-size:12px;color:var(--ink-700);flex-shrink:0;}
.conf-bar-track{flex:1;height:7px;border-radius:6px;background:var(--line-soft);overflow:hidden;}
.conf-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent-500),var(--green-600));}
.conf-bar-fill.low{background:linear-gradient(90deg,#E8B23D,var(--amber-500));}
.conf-pct{width:40px;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--ink-700);font-weight:600;}

.field-extract-table{width:100%;font-size:12px;border-collapse:collapse;}
.field-extract-table td{padding:5px 4px;border-bottom:1px dashed var(--line);}
.field-extract-table td:first-child{color:var(--ink-500);width:46%;}
.field-extract-table td:last-child{font-weight:600;color:var(--steel-950);}

.checklist{list-style:none;margin:0;padding:0;}
.checklist li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:5px 0;color:var(--ink-700);}
.check-ok{color:var(--green-600);flex-shrink:0;margin-top:1px;}
.check-warn{color:var(--amber-500);flex-shrink:0;margin-top:1px;}

.ai-reasoning-box{
  background:var(--accent-100);border:1px solid #BFE6E1;border-left:3px solid var(--accent-500);
  border-radius:var(--radius);padding:12px 14px;font-size:12.3px;color:var(--ink-700);line-height:1.55;
}
.ai-decision-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap;}
.decision-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;}
.notes{
  width:100%;min-height:70px;border:1px solid var(--line-strong);border-radius:var(--radius);
  padding:9px 11px;font-size:12.3px;resize:vertical;line-height:1.5;
}
.notes:focus{outline:none;border-color:var(--accent-500);box-shadow:0 0 0 3px var(--accent-100);}

.auth-callout{
  background:var(--green-050);border:1px solid #BFE3CE;border-radius:var(--radius);
  padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.auth-num{font-family:var(--mono);font-size:16px;font-weight:800;color:var(--green-600);letter-spacing:.5px;}

/* ---------------- Timeline ---------------- */
.timeline{list-style:none;margin:0;padding:0;}
.timeline li{display:flex;gap:10px;padding-bottom:14px;position:relative;}
.timeline li:not(:last-child)::before{
  content:"";position:absolute;left:8px;top:20px;bottom:-2px;width:1px;background:var(--line);
}
.tl-dot{
  width:17px;height:17px;border-radius:50%;flex-shrink:0;z-index:1;
  background:var(--line);color:var(--ink-500);
  display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;
}
.tl-dot.done{background:var(--green-600);color:#fff;}
.tl-dot.active{background:var(--accent-500);color:#fff;box-shadow:0 0 0 4px rgba(18,167,155,.18);}
.tl-title{font-size:12.5px;font-weight:600;color:var(--steel-950);}
.tl-sub{font-size:11px;color:var(--ink-500);margin-top:1px;}

/* ---------------- Overlay / slide-over panel ---------------- */
.overlay{
  display:none;position:fixed;inset:0;z-index:900;
  background:rgba(8,18,38,.55);
  align-items:flex-start;justify-content:center;
  padding:34px 20px;overflow-y:auto;
}
.overlay.open{display:flex;}
.case-panel{
  background:#fff;border-radius:12px;width:100%;max-width:1080px;
  box-shadow:var(--shadow-lg);overflow:hidden;animation:panelin .2s ease;
}
@keyframes panelin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.case-header{
  background:linear-gradient(120deg,var(--steel-900),var(--steel-800));
  color:#fff;padding:18px 24px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
}
.case-header-left{display:flex;flex-direction:column;gap:6px;}
.case-id-row{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:#BFD3F5;}
.case-title{font-size:19px;font-weight:800;}
.case-subtitle{font-size:12.5px;color:#CBD9F2;}
.case-header-badges{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;}
.close-x{
  background:rgba(255,255,255,.14);border:none;color:#fff;
  width:30px;height:30px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.close-x:hover{background:rgba(255,255,255,.24);}
.case-body{padding:20px 24px 30px;display:grid;grid-template-columns:1.55fr 1fr;gap:18px;}
.stack{display:flex;flex-direction:column;gap:16px;}

/* ---------------- Patient context banner ---------------- */
.patient-banner{
  background:linear-gradient(120deg,var(--steel-900),var(--steel-800));
  color:#fff;border-radius:var(--radius-lg);
  padding:14px 18px;margin-bottom:16px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.patient-banner .avatar{width:38px;height:38px;font-size:13px;background:var(--accent-600);}
.pb-name{font-size:16px;font-weight:700;}
.pb-meta{font-size:11.5px;color:#BFD3F5;font-family:var(--mono);margin-top:2px;}
.pb-facts{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap;}
.pb-fact-label{font-size:10px;color:#8FA9D2;font-weight:600;}
.pb-fact-value{font-size:12.5px;font-weight:600;}

/* ---------------- Empty + status states ---------------- */
.empty-state{
  padding:36px 20px;text-align:center;color:var(--ink-500);font-size:12.5px;
}
.empty-state strong{display:block;color:var(--steel-950);font-size:13.5px;margin-bottom:4px;}
.empty-hint{font-size:11.5px;color:var(--ink-500);padding:10px 0;}
.live-state{font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}

/* ---------------- Toasts ---------------- */
.toast-region{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--steel-900);color:#fff;
  padding:10px 15px;border-radius:var(--radius);
  font-size:12.5px;font-weight:600;
  display:flex;align-items:center;gap:9px;
  box-shadow:var(--shadow-lg);animation:toastin .22s ease;
  max-width:380px;
}
.toast.success{background:#12513A;}
.toast.error{background:#5C2019;}
@keyframes toastin{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:none;}}

/* ---------------- Utility ---------------- */
.hidden{display:none !important;}
.spinner{
  width:14px;height:14px;border-radius:50%;
  border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
  animation:spin .7s linear infinite;display:inline-block;
}
.spinner-dark{border:2px solid var(--line-strong);border-top-color:var(--accent-600);}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------------- Split working view (list + detail) ---------------- */
.split{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;align-items:start;}

@media(max-width:1180px){
  .kpi-row,.kpi-row.six{grid-template-columns:repeat(3,1fr);}
  .split{grid-template-columns:1fr;}
  .case-body{grid-template-columns:1fr;}
}
@media(max-width:700px){
  .kpi-row,.kpi-row.six{grid-template-columns:repeat(2,1fr);}
  .form-grid,.info-grid{grid-template-columns:1fr;}
  .decision-btns{grid-template-columns:1fr;}
}

/* =========================================================
   EPIC DENSITY PASS
   Hyperspace is squared, flat and tight. These rules override
   the softer defaults above so every module reads as one
   clinical application rather than a web dashboard.
   ========================================================= */

/* ---- Buttons: squared, bordered, compact ---- */
.btn{
  border-radius:var(--radius);padding:5px 11px;
  font-size:11.5px;font-weight:600;
  border:1px solid var(--line-strong);
  background:linear-gradient(180deg,var(--white),var(--fill-050));
  color:var(--ink-700);
}
.btn:hover:not(:disabled){background:var(--steel-050);border-color:var(--steel-500);}
.btn-primary{background:linear-gradient(180deg,var(--steel-700),var(--steel-800));border-color:var(--steel-900);color:#fff;}
.btn-primary:hover:not(:disabled){background:var(--steel-700);}
.btn-teal{background:linear-gradient(180deg,var(--accent-500),var(--accent-600));border-color:var(--accent-700);color:#fff;}
.btn-teal:hover:not(:disabled){background:var(--accent-500);}
.btn-green{background:linear-gradient(180deg,var(--green-600),var(--green-700));border-color:var(--green-700);color:#fff;}
.btn-red{background:linear-gradient(180deg,var(--red-600),var(--red-700));border-color:var(--red-700);color:#fff;}
.btn-amber{background:linear-gradient(180deg,var(--amber-500),var(--amber-600));border-color:var(--amber-600);color:#fff;}
.btn-outline{background:var(--white);border-color:var(--line-strong);color:var(--steel-800);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-700);}
.btn-ghost:hover:not(:disabled){background:var(--fill-100);border-color:var(--line);}
.btn-sm{padding:3px 8px;font-size:11px;}

/* ---- Cards: squared with a filled section header ---- */
.card{border-radius:var(--radius);border-color:var(--line);box-shadow:var(--shadow-sm);}
.card-head{
  padding:0;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--steel-100),var(--steel-050));
  min-height:29px;padding:5px 12px;
}
.card-title{font-size:12px;font-weight:700;color:var(--steel-900);letter-spacing:.2px;}
.card-sub{font-size:10.5px;color:var(--ink-500);}
.card-body{padding:12px;}

/* ---- KPI tiles: flat metric strip, not floating cards ---- */
.kpi-row{gap:1px;margin-bottom:14px;border:1px solid var(--line);background:var(--line);}
.kpi-card{
  border:none;border-radius:0;box-shadow:none;
  padding:8px 12px 9px 13px;background:var(--white);
}
.kpi-card::before{width:3px;}
.kpi-label{font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--ink-500);text-transform:uppercase;}
.kpi-value{font-size:21px;font-weight:700;margin-top:1px;color:var(--steel-950);}
.kpi-delta{font-size:10px;margin-top:2px;}

/* ---- Tables: Epic grid. Thin rules, tight rows, banding ---- */
table.data{font-size:12px;}
table.data thead th{
  /* Header text renders exactly as written in the markup: no
     text-transform, so "Payer / Member ID" is not shouted. */
  padding:5px 10px;font-size:11px;letter-spacing:.2px;
  background:linear-gradient(180deg,var(--steel-100),var(--steel-050));
  color:var(--steel-900);font-weight:700;
  border-bottom:1px solid var(--line-strong);
  border-right:1px solid var(--line-soft);
}
table.data thead th:last-child{border-right:none;}
table.data tbody td{padding:5px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
table.data tbody tr:nth-child(even){background:var(--fill-050);}
table.data tbody tr.clickable:hover{background:var(--accent-100);}
table.data tbody tr.selected{background:var(--accent-100);box-shadow:inset 4px 0 0 var(--accent-600);}
.cell-sub{font-size:10.5px;}
.cell-mono{font-size:11px;}

/* ---- Badges: squared status flags ---- */
.badge{
  border-radius:2px;padding:1px 6px;font-size:10px;font-weight:700;
  letter-spacing:.3px;text-transform:uppercase;
}
.badge-dot{width:5px;height:5px;border-radius:1px;}

/* ---- Filters: a toolbar, not a search hero ---- */
.filter-bar{
  gap:6px;margin-bottom:12px;padding:6px 8px;
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
}
.search-box{padding:4px 8px;border-radius:var(--radius);min-width:230px;max-width:380px;}
.search-box input{font-size:12px;}
select.field-select{padding:4px 7px;border-radius:var(--radius);font-size:11.5px;}

/* ---- Field grids ---- */
.info-grid{gap:8px 18px;}
.info-item-label{font-size:10px;text-transform:uppercase;letter-spacing:.4px;}
.info-item-value{font-size:12.5px;}
.section-label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--steel-900);font-weight:700;margin-bottom:7px;
}

/* ---- Forms ---- */
.form-field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-500);}
.form-field input,.form-field select,.form-field textarea{
  border-radius:var(--radius);padding:5px 8px;font-size:12px;border-color:var(--line-strong);
}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{
  border-color:var(--accent-500);box-shadow:0 0 0 2px var(--accent-100);
}

/* ---- Documents ---- */
.doc-row{border-radius:var(--radius);padding:6px 9px;margin-bottom:5px;border-color:var(--line);}
.doc-icon{width:26px;height:26px;border-radius:var(--radius);}
.doc-name{font-size:12px;}
.pdf-frame{border-radius:var(--radius);height:420px;}

/* ---- Patient banner: Epic's storyboard header ---- */
.patient-banner{
  border-radius:var(--radius);padding:9px 13px;margin-bottom:12px;gap:12px;
  background:linear-gradient(180deg,var(--steel-800),var(--steel-900));
  border-bottom:3px solid var(--accent-500);
}
.patient-banner .avatar{width:34px;height:34px;font-size:12px;border-radius:var(--radius);}
.pb-name{font-size:14.5px;font-weight:700;}
.pb-meta{font-size:11px;color:var(--steel-300);}
.pb-facts{gap:18px;}
.pb-fact-label{font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--steel-300);}
.pb-fact-value{font-size:12px;}

/* ---- Overlays ---- */
.case-panel{border-radius:var(--radius-lg);}
.case-header{
  padding:12px 18px;
  background:linear-gradient(180deg,var(--steel-800),var(--steel-900));
  border-bottom:3px solid var(--accent-500);
}
.case-title{font-size:16px;}
.case-body{padding:14px 18px 22px;gap:14px;}
.close-x{border-radius:var(--radius);width:26px;height:26px;}

/* ---- Timeline ---- */
.tl-title{font-size:12px;}
.tl-sub{font-size:10.5px;}

/* ---- Toasts ---- */
.toast{border-radius:var(--radius);font-size:12px;padding:8px 13px;background:var(--steel-900);}
.toast.success{background:var(--green-700);}
.toast.error{background:var(--red-700);}
.toast-region{bottom:calc(var(--statusbar-h) + 12px);}

/* ---- Empty states ---- */
.empty-state{padding:26px 16px;font-size:12px;}
.empty-state strong{font-size:12.5px;}

/* =========================================================
   HOME
   The one screen in the portal that is meant to be read
   rather than scanned, so it runs wider and looser than the
   dense working views.
   ========================================================= */

.home-intro{
  font-size:14px;line-height:1.65;color:var(--ink-700);
  max-width:62ch;margin:0 0 22px;
}

.home-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:14px;margin-bottom:22px;
}

.home-card{cursor:pointer;transition:border-color .14s, box-shadow .14s;}
.home-card:hover{border-color:var(--steel-500);box-shadow:var(--shadow-md);}
.home-card .card-body{display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px;}

.home-blurb{
  font-size:13px;line-height:1.6;color:var(--ink-700);
  margin:0;max-width:56ch;
}

.home-list{
  margin:0;padding:0;list-style:none;
  display:flex;flex-direction:column;gap:6px;
}
.home-list li{
  font-size:12.5px;line-height:1.5;color:var(--ink-700);
  padding-left:16px;position:relative;
}
.home-list li::before{
  content:"";position:absolute;left:0;top:7px;
  width:5px;height:5px;border-radius:1px;background:var(--accent-500);
}

.home-cta{align-self:flex-start;margin-top:2px;}

.home-note .card-body{padding:16px;}
.home-two{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px 26px;
}
.home-note-h{
  font-size:12.5px;font-weight:700;color:var(--steel-900);margin-bottom:3px;
}

@media(max-width:700px){
  .home-intro{font-size:13.5px;}
}

/* =========================================================
   TABLE ACTION COLUMN

   A <td> must stay display:table-cell. Setting display:flex on it
   takes it out of the table's column grid, and its content then
   overlaps the neighbouring column. So the cell stays a table cell
   and the buttons are laid out inline instead.
   ========================================================= */

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}

table.data{min-width:100%;}

/* Keep the action column tight and its buttons on one line. */
table.data th:last-child{width:1%;white-space:nowrap;text-align:right;}

table.data td.cell-actions{
  display:table-cell;          /* never flex: see note above */
  width:1%;
  white-space:nowrap;
  text-align:right;
  padding-right:12px;
  vertical-align:middle;
}
table.data td.cell-actions .btn,
table.data td.cell-actions .icon-btn,
table.data td.cell-actions a{
  display:inline-flex;
  vertical-align:middle;
}
table.data td.cell-actions > * + *{margin-left:5px;}

/* Outside a table the class is still a flex row (document rows,
   card headers, detail panels). */
.cell-actions:not(td){
  display:flex;
  gap:5px;
  align-items:center;
  flex-wrap:nowrap;
}

/* Wide tables inside the two-column split need room to scroll. */
.split table.data{min-width:640px;}

/* ===== pages/payer/payer.css ===== */
/* =========================================================
   MODULE STYLES — PAYER REVIEW
   Bridges the PayerConnect markup onto the shared EHR
   components. No colour values here — tokens only.
   ========================================================= */

/* PayerConnect renders bare <table> elements; give them the
   portal's shared data-table treatment without touching its JS. */
#payerModule table{width:100%;border-collapse:collapse;font-size:12.5px;}
#payerModule thead th{
  /* Same as the shared data table: header text renders as written. */
  text-align:left;padding:7px 12px;
  background:var(--slate-050);color:var(--slate-500);
  font-size:11px;font-weight:700;letter-spacing:.2px;
  border-bottom:1px solid var(--slate-200);white-space:nowrap;
}
#payerModule tbody td{padding:11px 14px;border-bottom:1px solid var(--slate-100);vertical-align:middle;}
#payerModule tbody tr:last-child td{border-bottom:none;}
#payerModule tbody tr.clickable{cursor:pointer;transition:background .12s;}
#payerModule tbody tr.clickable:hover{background:var(--teal-050);}

/* The portal already prints the module title, so each view's own
   header steps down a level rather than competing with it. */
#payerModule .page-title{font-size:15px;}
#payerModule .page-head{margin-bottom:14px;}
#payerModule .crumbs{display:none;}

/* The action cell must remain a table cell here too, or its buttons
   overlap the column to its left. */
#payerModule td.cell-actions{
  display:table-cell;
  width:1%;
  white-space:nowrap;
  text-align:right;
  padding-right:12px;
  vertical-align:middle;
}
#payerModule td.cell-actions .btn{display:inline-flex;vertical-align:middle;}
#payerModule td.cell-actions > * + *{margin-left:5px;}
#payerModule thead th:last-child{width:1%;white-space:nowrap;text-align:right;}

/* ===== pages/caregap/caregap.css ===== */
/* =========================================================
   CARE GAP — page styles

   The Care Gap POC renders its own markup with its own class
   names, which are kept because UiPath selectors depend on the
   element ids and structure. Rather than rewrite that markup,
   its classes are styled here with the portal's own design
   tokens, so the page reads as part of EPIC.

   Every rule is scoped under .cg, so these generic names
   (.card, .btn, .tab, .head) cannot collide with the portal's
   shared component library.
   ========================================================= */

.cg{
  font-family:var(--sans);
  color:var(--ink-900);
  font-size:12.5px;
}

.cg *{box-sizing:border-box;}
.cg button{font-family:inherit;cursor:pointer;}
.cg input,.cg select,.cg textarea{font-family:inherit;font-size:12.5px;}

/* ---------------- Tab strip ---------------- */

.cg .tabs{
  display:flex;gap:0;align-items:stretch;
  border-bottom:1px solid var(--line);
  background:var(--white);
  margin:0 -18px 14px;
  padding:0 18px;
  overflow-x:auto;
}
.cg .tab{
  background:none;border:none;
  padding:7px 13px;
  font-size:12px;font-weight:600;color:var(--ink-500);
  border-bottom:3px solid transparent;
  white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
.cg .tab:hover{color:var(--steel-800);background:var(--steel-050);}
.cg .tab.active{color:var(--steel-950);border-bottom-color:var(--accent-500);}

/* The row-count badge each tab can carry. */
.cg .tab .count{
  background:var(--line-soft);color:var(--ink-500);
  font-size:10px;font-weight:700;
  padding:1px 5px;border-radius:2px;
}
.cg .tab.active .count{background:var(--accent-100);color:var(--accent-700);}

/* ---------------- Cards ---------------- */

.cg .card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  margin-bottom:14px;
}
.cg .card .head{
  padding:5px 12px;min-height:29px;
  background:linear-gradient(180deg,var(--steel-100),var(--steel-050));
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;
}
.cg .card-title{
  font-size:12px;font-weight:700;color:var(--steel-900);
  letter-spacing:.2px;
  display:flex;align-items:center;gap:7px;
}
.cg .card .body{padding:12px;}
.cg .card .body.flush{padding:0;}

.cg .section-title{
  font-size:10.5px;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;
  color:var(--steel-900);
  margin:0 0 7px;
}

/* ---------------- Stat tiles ---------------- */

.cg .stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:1px;background:var(--line);
  border:1px solid var(--line);
  margin-bottom:14px;
}
.cg .stat{
  background:var(--white);
  padding:8px 12px 9px 13px;
  position:relative;overflow:hidden;
}
.cg .stat::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent-500);
}
.cg .stat .l{
  font-size:10px;font-weight:700;letter-spacing:.4px;
  text-transform:uppercase;color:var(--ink-500);
}
.cg .stat .n{
  font-size:21px;font-weight:700;color:var(--steel-950);
  margin-top:1px;line-height:1.15;
}
.cg .stat .sub{font-size:10.5px;color:var(--ink-500);margin-top:2px;}

/* ---------------- Tables ---------------- */

.cg table{width:100%;border-collapse:collapse;font-size:12px;}
.cg thead th{
  text-align:left;
  padding:5px 10px;
  background:linear-gradient(180deg,var(--steel-100),var(--steel-050));
  color:var(--steel-900);
  font-size:11px;font-weight:700;letter-spacing:.2px;
  border-bottom:1px solid var(--line-strong);
  border-right:1px solid var(--line-soft);
  white-space:nowrap;
}
.cg thead th:last-child{border-right:none;}
.cg tbody td{
  padding:5px 10px;
  border-bottom:1px solid var(--line-soft);
  vertical-align:middle;
}
.cg tbody tr:nth-child(even){background:var(--fill-050);}
.cg tbody tr:hover{background:var(--accent-100);}
.cg .pt-name{font-weight:600;color:var(--steel-950);}
.cg .meta{font-size:10.5px;color:var(--ink-500);margin-top:1px;}
.cg .mono{font-family:var(--mono);font-size:11.5px;}
.cg .mono-soft{font-family:var(--mono);font-size:11px;color:var(--ink-500);}
.cg .time{font-family:var(--mono);font-size:11px;color:var(--ink-500);}
.cg .muted{color:var(--ink-500);}
.cg .soft{color:var(--ink-400);}
.cg .hide-sm{}

/* A row the table can show as a divider. */
.cg .line{border-top:1px solid var(--line-soft);}
.cg .line.none{border-top:none;}

/* ---------------- Buttons ---------------- */

.cg .btn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line-strong);border-radius:var(--radius);
  background:linear-gradient(180deg,var(--white),var(--fill-050));
  color:var(--ink-700);
  padding:5px 11px;
  font-size:11.5px;font-weight:600;
}
.cg .btn:hover:not(:disabled){background:var(--steel-050);border-color:var(--steel-500);}
.cg .btn:disabled{opacity:.45;cursor:not-allowed;}
.cg .btn-primary{
  background:linear-gradient(180deg,var(--steel-700),var(--steel-800));
  border-color:var(--steel-900);color:#fff;
}
.cg .btn-primary:hover:not(:disabled){background:var(--steel-700);}
.cg .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-700);}
.cg .btn-ghost:hover:not(:disabled){background:var(--fill-100);border-color:var(--line);}
.cg .actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}

/* ---------------- Forms ---------------- */

.cg .form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:11px;}
.cg .field{min-width:180px;}
.cg .field.grow{flex:1;}
.cg .field label,
.cg .field > .l{
  display:block;
  font-size:10.5px;font-weight:700;
  letter-spacing:.3px;text-transform:uppercase;
  color:var(--ink-500);margin-bottom:4px;
}
.cg .field input,
.cg .field select,
.cg .field textarea{
  width:100%;
  border:1px solid var(--line-strong);border-radius:var(--radius);
  padding:5px 8px;background:#fff;color:var(--ink-900);
}
.cg .field textarea{min-height:90px;resize:vertical;line-height:1.5;}
.cg .field input:focus,
.cg .field select:focus,
.cg .field textarea:focus{
  outline:none;border-color:var(--accent-500);
  box-shadow:0 0 0 2px var(--accent-100);
}
.cg .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;}
.cg .block{display:block;width:100%;}

/* ---------------- Chips and status ---------------- */

.cg .chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:1px 6px;border-radius:2px;
  font-size:10px;font-weight:700;
  letter-spacing:.3px;text-transform:uppercase;
  background:var(--accent-100);color:var(--accent-700);
  white-space:nowrap;
}
.cg .chip.muted{background:var(--line-soft);color:var(--ink-500);}
.cg .chip.ok{background:var(--green-050);color:var(--green-700);}
.cg .chip.bad{background:var(--red-050);color:var(--red-600);}
.cg .chip.wait{background:var(--amber-050);color:var(--amber-600);}
.cg .chip.info{background:var(--blue-050);color:var(--blue-700);}
.cg .unknown-status{background:var(--amber-050);color:var(--amber-600);}

/* ---------------- Messages ---------------- */

.cg .msg{
  border-radius:var(--radius);
  padding:9px 12px;
  font-size:12px;line-height:1.55;
  margin-bottom:11px;
  background:var(--accent-100);
  border:1px solid #BFE6E1;
  border-left:3px solid var(--accent-500);
  color:var(--ink-700);
}
.cg .msg.ok{
  background:var(--green-050);border-color:#BFE3CE;
  border-left-color:var(--green-600);
}
.cg .msg.bad{
  background:var(--red-050);border-color:#E9B6B0;
  border-left-color:var(--red-600);
}
.cg .msg.info{
  background:var(--blue-050);border-color:#C3D4F2;
  border-left-color:var(--blue-700);
}
.cg .msg.wait{
  background:var(--amber-050);border-color:#EDD9AE;
  border-left-color:var(--amber-500);
}
.cg .banner{
  background:var(--fill-050);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:9px 12px;
  font-size:11.5px;color:var(--ink-500);
  margin-bottom:12px;
}
.cg .note{
  font-size:11.5px;color:var(--ink-500);line-height:1.55;
  margin-top:7px;
}
.cg .empty{
  padding:26px 16px;
  text-align:center;
  color:var(--ink-500);font-size:12px;
}
.cg .empty strong{
  display:block;
  color:var(--steel-950);font-size:12.5px;
  margin-bottom:4px;
}

/* ---------------- Drop zone ---------------- */

.cg .dropzone{
  border:1.5px dashed var(--line-strong);
  background:var(--fill-050);
  border-radius:var(--radius);
  padding:18px;
  text-align:center;
  font-size:12px;color:var(--ink-500);
  cursor:pointer;
  transition:border-color .14s, background .14s;
}
.cg .dropzone:hover{border-color:var(--accent-500);background:var(--accent-100);}
.cg .dropzone.drag{border-color:var(--accent-600);background:var(--accent-100);}
.cg .dropzone strong{display:block;color:var(--steel-950);font-size:12.5px;margin-bottom:3px;}

/* ---------------- Responsive ---------------- */

@media(max-width:760px){
  .cg .tabs{margin:0 -12px 12px;padding:0 12px;}
  .cg .grid-2{grid-template-columns:1fr;}
  .cg .hide-sm{display:none;}
}

/* =========================================================
   ELEMENT-LEVEL RULES

   The page builds real HTML elements rather than only divs:
   definition lists for the patient header, h2 for card titles,
   and label for form fields. Without rules for those, browser
   defaults show through — a dl indents every value onto its
   own line, which is what made the patient details card look
   wrong. These rules give them the portal's treatment.
   ========================================================= */

/* Cards are used directly, with no inner .body wrapper, so the
   padding belongs on the card itself. */
.cg .card{padding:12px;}
.cg .card .head{margin:-12px -12px 12px;}
.cg .card .body{padding:0;}

/* Card titles are h2 elements. */
.cg h2,
.cg h2.card-title{
  margin:0;
  font-size:13px;font-weight:700;
  color:var(--steel-950);
  letter-spacing:-.1px;
}
.cg h3{
  margin:0 0 6px;
  font-size:11px;font-weight:700;
  letter-spacing:.4px;text-transform:uppercase;
  color:var(--ink-500);
}
.cg .card > .sub{
  font-size:11.5px;color:var(--ink-500);
  margin-top:2px;
}

/* ---------------- Definition lists ----------------
   Label and value sit side by side on a two-column grid, so the
   values line up instead of being indented under their labels. */

.cg dl{
  display:grid;
  grid-template-columns:minmax(150px,190px) 1fr;
  gap:0;
  margin:12px 0 0;
  border-top:1px solid var(--line-soft);
}
.cg dl.meta{margin-top:12px;}

.cg dt{
  margin:0;
  padding:6px 12px 6px 0;
  font-size:11px;font-weight:600;
  color:var(--ink-500);
  border-bottom:1px solid var(--line-soft);
}
.cg dd{
  margin:0;                       /* the browser default indent */
  padding:6px 0;
  font-size:12.5px;font-weight:600;
  color:var(--steel-950);
  border-bottom:1px solid var(--line-soft);
  word-break:break-word;
}
.cg dd.mono{
  font-family:var(--mono);
  font-size:11.5px;font-weight:500;
  color:var(--ink-700);
}
.cg dd:empty::after{
  content:"\2014";
  color:var(--ink-400);font-weight:400;
}

/* Labels outside .field still need the same micro-caps look. */
.cg label{
  display:block;
  font-size:10.5px;font-weight:700;
  letter-spacing:.3px;text-transform:uppercase;
  color:var(--ink-500);
  margin-bottom:4px;
}

/* History blocks sit in a two-column grid and read as panels. */
.cg .grid-2 > div{
  background:var(--fill-050);
  border:1px solid var(--line-soft);
  border-radius:var(--radius);
  padding:10px 12px;
}
.cg .grid-2 .empty{padding:10px 0;text-align:left;}

@media(max-width:700px){
  /* Stacked, but the value stays flush with the label. */
  .cg dl{grid-template-columns:1fr;}
  .cg dt{padding-bottom:0;border-bottom:none;}
  .cg dd{padding-top:2px;}
}

/* ===== pages/claims/claims.css ===== */
/* =========================================================
   CLAIMS ANOMALY — page styles

   The page's own markup and JavaScript are kept verbatim, because
   its behaviour must not change. Its appearance is retargeted
   instead: the source declared its palette as custom properties,
   so those properties are re-pointed at the portal's tokens and
   every rule below follows without being rewritten.

   A short override block at the end handles the things a token
   swap cannot reach — corner radius, gradients, micro-caps table
   headers, squared pills — so the page reads as EPIC rather than
   as a differently coloured version of itself.

   Everything is scoped under .claims-app. The page uses generic
   names (.panel, .btn, .tab, .row, .card) that would otherwise
   collide with the portal's shared component library.
   ========================================================= */

.claims-app{
  /* ---- the source's own tokens, re-pointed at portal tokens ---- */

  --border:      var(--line);

  /* Epic is nearly square, so the source's 8px becomes 3px. The
     portal's own --radius cannot be referenced here: redeclaring a
     property in terms of itself resolves to nothing. */
  --radius:      3px;

  font-family:var(--sans);
  color:var(--ink-900);

/* =========================================================
   EPIC OVERRIDES

   What a token swap cannot express: shape, density and the
   gradient-and-micro-caps treatment the rest of the portal uses.
   ========================================================= */

/* ---- The page header is supplied by the portal, so the module's
        own header only carries its toolbar. ---- */
.claims-app header{
  background:transparent;
  color:var(--ink-900);
  padding:0 0 12px;
  border-bottom:none;
}
.claims-app header h1{display:none;}
.claims-app .brand{display:flex;align-items:center;gap:10px;}
.claims-app .batch-id{
  font-family:var(--mono);font-size:11.5px;
  color:var(--ink-500);
  background:var(--fill-050);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:3px 8px;
}
.claims-app .header-meta{font-size:11.5px;color:var(--ink-500);}
.claims-app .header-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}

/* ---- Buttons: squared, bordered, gradient, like the portal's ---- */
.claims-app .btn{
  border-radius:var(--radius);
  padding:5px 11px;
  font-size:11.5px;font-weight:600;
  border:1px solid var(--line-strong);
  background:linear-gradient(180deg,var(--white),var(--fill-050));
  color:var(--ink-700);
}
.claims-app .btn:hover:not(:disabled){
  background:var(--steel-050);border-color:var(--steel-500);
}
.claims-app .btn.primary{
  background:linear-gradient(180deg,var(--steel-700),var(--steel-800));
  border-color:var(--steel-900);color:#fff;
}
.claims-app .btn.primary:hover:not(:disabled){background:var(--steel-700);}
.claims-app .btn:disabled{opacity:.45;cursor:not-allowed;}
.claims-app .link-btn{
  background:none;border:none;color:var(--steel-700);
  font-weight:600;font-size:11.5px;cursor:pointer;padding:0;
}

/* ---- Tab bar: the portal's activity strip ---- */
.claims-app .tabbar{
  background:var(--white);
  border-bottom:1px solid var(--line);
  padding:0;
  gap:0;
  position:static;
  overflow-x:auto;
}
.claims-app .tab{
  padding:7px 13px;
  font-size:12px;font-weight:600;
  color:var(--ink-500);
  border-bottom:3px solid transparent;
  white-space:nowrap;
}
.claims-app .tab:hover{color:var(--steel-800);background:var(--steel-050);}
.claims-app .tab.active{
  color:var(--steel-950);
  border-bottom-color:var(--accent-500);
  background:transparent;
}
.claims-app .tab .count{
  background:var(--line-soft);color:var(--ink-500);
  font-family:var(--mono);font-size:10px;font-weight:700;
  padding:1px 5px;border-radius:2px;margin-left:5px;
}
.claims-app .tab.active .count{background:var(--accent-100);color:var(--accent-700);}

/* ---- Panels: squared, with the portal's gradient section header ---- */
.claims-app .panel{
  border-radius:var(--radius);
  border-color:var(--line);
  box-shadow:var(--shadow-sm);
}
.claims-app .panel-head{
  padding:5px 12px;min-height:29px;
  background:linear-gradient(180deg,var(--steel-100),var(--steel-050));
  border-bottom:1px solid var(--line);
}
.claims-app .panel-head h3{
  margin:0;
  font-size:12px;font-weight:700;
  color:var(--steel-900);letter-spacing:.2px;
}
.claims-app .panel-body{padding:12px;}

/* ---- Stat cards become the portal's flat metric strip ---- */
.claims-app .stat-grid{gap:1px;background:var(--line);border:1px solid var(--line);}
.claims-app .stat-card{
  border:none;border-radius:0;
  padding:8px 12px 9px 13px;
  position:relative;overflow:hidden;
}
.claims-app .stat-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--steel-700);
}
.claims-app .stat-card.accent-red::before{background:var(--red-600);}
.claims-app .stat-card.accent-teal::before{background:var(--accent-600);}
.claims-app .stat-card .num{
  font-size:21px;font-weight:700;color:var(--steel-950);line-height:1.15;
}
.claims-app .stat-card .label{
  font-size:10px;font-weight:700;letter-spacing:.4px;
  text-transform:uppercase;color:var(--ink-500);
}

/* ---- Tables: the portal's dense grid ---- */
.claims-app table{border-collapse:collapse;width:100%;font-size:12px;}
.claims-app th{
  text-align:left;
  padding:5px 10px;
  background:linear-gradient(180deg,var(--steel-100),var(--steel-050));
  color:var(--steel-900);
  font-size:10px;font-weight:700;
  letter-spacing:.4px;text-transform:uppercase;
  border-bottom:1px solid var(--line-strong);
  border-right:1px solid var(--line-soft);
  white-space:nowrap;
}
.claims-app th:last-child{border-right:none;}
.claims-app td{
  padding:5px 10px;
  border-bottom:1px solid var(--line-soft);
  vertical-align:middle;
}
.claims-app tbody tr:nth-child(even){background:var(--fill-050);}
.claims-app .claim-row:hover{background:var(--accent-100);cursor:pointer;}
.claims-app .claim-row.expanded{background:var(--accent-100);}
.claims-app .mono{font-family:var(--mono);font-size:11.5px;}

/* ---- Pills, tags and badges: squared status flags ---- */
.claims-app .pill,
.claims-app .chan-badge,
.claims-app .finding-badge,
.claims-app .dup-tag,
.claims-app .sent-badge,
.claims-app .claim-chip,
.claims-app .rule-code{
  border-radius:2px;
  font-size:10px;font-weight:700;
  letter-spacing:.3px;
  padding:1px 6px;
}
.claims-app .disp-tag{
  font-family:var(--sans);
  font-size:10px;font-weight:700;
  letter-spacing:.3px;text-transform:uppercase;
  border-radius:2px;padding:1px 6px;
}
.claims-app .disp-tag.Pending{background:var(--amber-050);color:var(--amber-600);}
.claims-app .disp-tag.Reviewed{background:var(--blue-050);color:var(--blue-700);}
.claims-app .disp-tag.AutoCleared{background:var(--green-050);color:var(--green-700);}
.claims-app .disp-tag.Rejected{background:var(--red-050);color:var(--red-600);}

/* ---- Severity retains its meaning, in the portal's palette ---- */
.claims-app .Critical{background:var(--red-050);color:var(--red-600);}
.claims-app .High{background:var(--amber-050);color:var(--amber-600);}
.claims-app .Low{background:var(--blue-050);color:var(--blue-700);}

/* ---- Cards inside panels ---- */
.claims-app .rule-summary-card,
.claims-app .analysis-card,
.claims-app .dup-claim-card,
.claims-app .finding-box,
.claims-app .analysis-box,
.claims-app .review-comment-box,
.claims-app .file-drop{
  border-radius:var(--radius);
  border-color:var(--line);
}
.claims-app .file-drop{
  border:1.5px dashed var(--line-strong);
  background:var(--fill-050);
}
.claims-app .file-drop:hover{border-color:var(--accent-500);background:var(--accent-100);}

/* ---- Bars reuse the portal's confidence-bar geometry ---- */
.claims-app .band-bar,
.claims-app .track,
.claims-app .compare-bar{
  border-radius:6px;
  background:var(--line-soft);
  overflow:hidden;
}
.claims-app .fill-provider{background:linear-gradient(90deg,var(--accent-500),var(--accent-600));}
.claims-app .fill-peer{background:var(--line-strong);}

/* ---- Modals become the portal's overlay ---- */
.claims-app .overlay,
.overlay.claims-overlay{
  background:rgba(8,18,38,.55);
}
.claims-app .modal{
  border-radius:var(--radius-lg);
  border:1px solid var(--line);
  box-shadow:var(--shadow-lg);
}
.claims-app .modal h3{
  font-size:13px;font-weight:700;color:var(--steel-900);
}
.claims-app .field-label{
  font-size:10.5px;font-weight:700;
  letter-spacing:.3px;text-transform:uppercase;
  color:var(--ink-500);
}
.claims-app .field-input,
.claims-app input[type="text"],
.claims-app select,
.claims-app textarea{
  border:1px solid var(--line-strong);
  border-radius:var(--radius);
  padding:5px 8px;
  font-size:12px;
  background:#fff;color:var(--ink-900);
}
.claims-app .field-input:focus,
.claims-app input:focus,
.claims-app select:focus,
.claims-app textarea:focus{
  outline:none;border-color:var(--accent-500);
  box-shadow:0 0 0 2px var(--accent-100);
}

/* ---- Review actions ---- */
.claims-app .review-action-btn.send,
.claims-app .send-btn,
.claims-app .send-mini-btn{
  background:linear-gradient(180deg,var(--steel-700),var(--steel-800));
  border-color:var(--steel-900);color:#fff;
}
.claims-app .review-action-btn.autoclear{
  background:linear-gradient(180deg,var(--green-600),var(--green-700));
  border-color:var(--green-700);color:#fff;
}
.claims-app .review-action-btn.reject{
  background:linear-gradient(180deg,var(--red-600),var(--red-700));
  border-color:var(--red-700);color:#fff;
}

/* ---- Empty states ---- */
.claims-app .empty-state{
  padding:26px 16px;text-align:center;
  color:var(--ink-500);font-size:12px;
}

/* ---- The drawer keeps its own geometry but the portal's chrome ---- */
.claims-app .drawer{
  border-radius:var(--radius);
  border-color:var(--line);
  box-shadow:var(--shadow-md);
}

/* ===== pages/pocsource/pocsource.css ===== */
/* =========================================================
   POC SOURCE — OnBase visual identity

   Deliberately NOT the portal's Hyperspace theme. This page stands
   in for a separate document-management system, so it keeps its own
   look: steel navy chrome, a ribbon, and a records-management grid.
   Making it match EPIC would hide the fact that it is a different
   system the portal talks to.

   Every rule is scoped under .onbase so nothing here can affect the
   rest of the portal, and the portal's own tokens cannot bleed in.
   ========================================================= */

.onbase{
  /* Original OnBase palette, extended into a fuller scale so the
     surfaces, borders and states are consistent rather than ad hoc. */
  --ob-navy-900:#1a2836;
  --ob-navy-800:#24364b;
  --ob-navy-700:#2e455e;
  --ob-navy-600:#35506b;
  --ob-blue-700:#255b86;
  --ob-blue-600:#2f6fa3;
  --ob-blue-500:#3f86bd;
  --ob-blue-100:#dceaf5;
  --ob-blue-050:#eef5fa;

  --ob-ink:#25313d;
  --ob-muted:#667789;
  --ob-faint:#8b9aa8;
  --ob-line:#cbd3db;
  --ob-line-soft:#dfe5ea;
  --ob-bg:#eef1f4;
  --ob-surface:#ffffff;
  --ob-rail:#f4f6f8;

  --ob-green-700:#2f6146;
  --ob-green-600:#3d7d5a;
  --ob-green-050:#e8f2ec;
  --ob-red-700:#8b3d3d;
  --ob-red-600:#a84b4b;
  --ob-red-050:#f7ebeb;
  --ob-amber-600:#9a6f24;
  --ob-amber-050:#f8f1e2;

  --ob-mono:'IBM Plex Mono','Consolas',monospace;
  --ob-sans:'Segoe UI','Inter',-apple-system,sans-serif;

  font-family:var(--ob-sans);
  color:var(--ob-ink);
  font-size:13px;
  background:var(--ob-bg);
  display:block;
  border:1px solid var(--ob-line);
  border-radius:3px;
  overflow:hidden;
  box-shadow:0 1px 3px rgba(26,40,54,.10);
}

.onbase *{box-sizing:border-box;}
.onbase button{font-family:inherit;cursor:pointer;}
.onbase input,.onbase select{font-family:inherit;font-size:13px;}

/* ---------------- Application chrome ---------------- */

.onbase .ob-topbar{
  height:44px;
  background:linear-gradient(180deg,var(--ob-navy-700),var(--ob-navy-800));
  color:#fff;
  display:flex;align-items:center;gap:16px;
  padding:0 14px;
  border-bottom:1px solid var(--ob-navy-900);
}
.onbase .ob-brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;}
.onbase .ob-brandmark{
  width:26px;height:26px;flex-shrink:0;
  border:1px solid #7e9ab3;
  background:var(--ob-navy-600);
  display:grid;place-items:center;
  font-weight:700;font-size:11px;letter-spacing:.5px;
}
.onbase .ob-brand-sub{
  font-size:10.5px;font-weight:400;color:#a9bdcd;
  padding-left:10px;border-left:1px solid rgba(255,255,255,.2);
}
.onbase .ob-topsearch{
  margin-left:auto;
  display:flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);
  border-radius:2px;
  padding:4px 9px;
  min-width:220px;
  color:#cddae4;font-size:12px;
}
.onbase .ob-topsearch input{
  border:none;background:none;outline:none;color:#fff;font-size:12px;width:100%;
}
.onbase .ob-topsearch input::placeholder{color:#8fa6b8;}
.onbase .ob-user{display:flex;align-items:center;gap:8px;font-size:12px;}
.onbase .ob-avatar{
  width:25px;height:25px;border-radius:50%;
  background:var(--ob-blue-600);
  display:grid;place-items:center;font-size:10.5px;font-weight:700;
}

/* ---------------- Ribbon ---------------- */

.onbase .ob-ribbon-tabs{
  display:flex;
  background:var(--ob-navy-900);
  padding:0 8px;
}
.onbase .ob-ribbon-tab{
  background:none;border:none;
  color:#a9bdcd;
  padding:6px 15px;
  font-size:12px;font-weight:600;
  border-bottom:2px solid transparent;
}
.onbase .ob-ribbon-tab:hover{color:#fff;background:rgba(255,255,255,.06);}
.onbase .ob-ribbon-tab.active{
  color:var(--ob-navy-800);
  background:var(--ob-rail);
  border-bottom-color:var(--ob-blue-600);
}

.onbase .ob-ribbon{
  background:var(--ob-rail);
  border-bottom:1px solid var(--ob-line);
  display:flex;align-items:stretch;
  padding:7px 10px;gap:0;
  overflow-x:auto;
}
.onbase .ob-ribbon-group{
  display:flex;gap:3px;
  padding:0 12px;
  border-right:1px solid var(--ob-line-soft);
}
.onbase .ob-ribbon-group:first-child{padding-left:0;}
.onbase .ob-ribbon-group:last-child{border-right:none;}
.onbase .ob-rbtn{
  background:none;border:1px solid transparent;border-radius:2px;
  padding:5px 10px;
  font-size:11.5px;font-weight:600;color:var(--ob-navy-800);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  min-width:62px;
}
.onbase .ob-rbtn .ob-rbtn-icon{font-size:15px;line-height:1;color:var(--ob-blue-600);}
.onbase .ob-rbtn:hover{background:var(--ob-blue-100);border-color:var(--ob-blue-500);}
.onbase .ob-rbtn:disabled{color:var(--ob-faint);cursor:not-allowed;}
.onbase .ob-rbtn:disabled .ob-rbtn-icon{color:var(--ob-faint);}

/* ---------------- Workspace ---------------- */

.onbase .ob-workspace{display:flex;min-height:560px;background:var(--ob-bg);}

.onbase .ob-sidebar{
  width:212px;flex-shrink:0;
  background:var(--ob-surface);
  border-right:1px solid var(--ob-line);
  display:flex;flex-direction:column;
}
.onbase .ob-sidehead{
  font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:#fff;background:var(--ob-navy-600);
  padding:5px 11px;
}
.onbase .ob-navitem{
  display:flex;align-items:center;gap:8px;
  padding:7px 11px;
  font-size:12.5px;color:var(--ob-ink);
  border-bottom:1px solid var(--ob-line-soft);
  cursor:pointer;
}
.onbase .ob-navitem span:first-child{color:var(--ob-blue-600);width:14px;text-align:center;}
.onbase .ob-navitem:hover{background:var(--ob-blue-050);}
.onbase .ob-navitem.active{
  background:var(--ob-blue-100);font-weight:700;
  box-shadow:inset 3px 0 0 var(--ob-blue-600);
}

.onbase .ob-applist{overflow-y:auto;max-height:280px;}
.onbase .ob-appitem{
  display:flex;align-items:center;gap:8px;
  padding:7px 11px;
  border-bottom:1px solid var(--ob-line-soft);
  cursor:pointer;font-size:12px;
}
.onbase .ob-appitem span:first-child{color:var(--ob-blue-600);}
.onbase .ob-appitem:hover{background:var(--ob-blue-050);}
.onbase .ob-appitem.active{background:var(--ob-blue-100);font-weight:700;}
.onbase .ob-appitem small{
  display:block;font-family:var(--ob-mono);font-size:10px;
  color:var(--ob-faint);font-weight:400;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.onbase .ob-sidefoot{
  margin-top:auto;padding:10px;
  border-top:1px solid var(--ob-line);
}

/* ---------------- Content ---------------- */

.onbase .ob-content{flex:1;min-width:0;padding:0 0 22px;}

.onbase .ob-crumb{
  background:var(--ob-surface);
  border-bottom:1px solid var(--ob-line);
  padding:6px 16px;
  font-size:11.5px;color:var(--ob-muted);
}
.onbase .ob-crumb b{color:var(--ob-ink);}

.onbase .ob-pagetitle{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:14px;flex-wrap:wrap;
  padding:16px 16px 12px;
}
.onbase .ob-pagetitle h1{
  margin:0;font-size:17px;font-weight:600;color:var(--ob-navy-800);
}
.onbase .ob-pagetitle p{
  margin:3px 0 0;font-size:12px;color:var(--ob-muted);max-width:64ch;
}
.onbase .ob-pageactions{display:flex;gap:7px;flex-wrap:wrap;}

.onbase .ob-view{display:none;padding:0 16px;}
.onbase .ob-view.active{display:block;}

/* ---------------- Tiles ---------------- */

.onbase .ob-tiles{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:10px;margin-bottom:16px;
}
.onbase .ob-tile{
  background:var(--ob-surface);
  border:1px solid var(--ob-line);
  border-top:3px solid var(--ob-navy-600);
  border-radius:2px;
  padding:11px 13px;
}
.onbase .ob-tile.docs{border-top-color:var(--ob-blue-600);}
.onbase .ob-tile.size{border-top-color:var(--ob-green-600);}
.onbase .ob-tile.queued{border-top-color:var(--ob-amber-600);}
.onbase .ob-tile-top{
  display:flex;align-items:center;justify-content:space-between;
  font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:var(--ob-muted);
}
.onbase .ob-tile-num{
  font-size:24px;font-weight:700;color:var(--ob-navy-800);
  margin-top:3px;line-height:1.1;
}
.onbase .ob-tile-sub{font-size:11px;color:var(--ob-faint);margin-top:2px;}

/* ---------------- Panels ---------------- */

.onbase .ob-panel{
  background:var(--ob-surface);
  border:1px solid var(--ob-line);
  border-radius:2px;
  margin-bottom:14px;
}
.onbase .ob-panel-head{
  background:linear-gradient(180deg,#f7f9fa,#eef1f4);
  border-bottom:1px solid var(--ob-line);
  padding:7px 13px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-wrap:wrap;
}
.onbase .ob-panel-title{
  font-size:12px;font-weight:700;color:var(--ob-navy-800);
  display:flex;align-items:center;gap:7px;
}
.onbase .ob-panel-sub{font-size:11px;color:var(--ob-muted);}
.onbase .ob-panel-body{padding:13px;}
.onbase .ob-panel-body.flush{padding:0;}

/* ---------------- Tables ---------------- */

.onbase table.ob-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.onbase table.ob-table thead th{
  text-align:left;
  background:linear-gradient(180deg,#f2f5f7,#e7ebef);
  color:var(--ob-navy-800);
  font-size:11px;font-weight:700;
  padding:6px 11px;
  border-bottom:1px solid var(--ob-line);
  border-right:1px solid var(--ob-line-soft);
  white-space:nowrap;
}
.onbase table.ob-table thead th:last-child{border-right:none;}
.onbase table.ob-table tbody td{
  padding:6px 11px;
  border-bottom:1px solid var(--ob-line-soft);
  vertical-align:middle;
}
.onbase table.ob-table tbody tr:nth-child(even){background:#fafbfc;}
.onbase table.ob-table tbody tr:hover{background:var(--ob-blue-050);}
.onbase .ob-filename{
  font-weight:600;color:var(--ob-navy-800);
  display:flex;align-items:center;gap:7px;
}
.onbase .ob-filename .ob-fileicon{color:var(--ob-red-600);}
.onbase .ob-cell-mono{font-family:var(--ob-mono);font-size:11.5px;color:var(--ob-muted);}
.onbase td.ob-actions{
  width:1%;white-space:nowrap;text-align:right;
}
.onbase td.ob-actions .ob-btn{display:inline-flex;vertical-align:middle;}
.onbase td.ob-actions > * + *{margin-left:5px;}

/* ---------------- Buttons ---------------- */

.onbase .ob-btn{
  display:inline-flex;align-items:center;gap:5px;
  border:1px solid var(--ob-line);
  background:linear-gradient(180deg,#fff,#f1f4f6);
  color:var(--ob-navy-800);
  padding:5px 11px;border-radius:2px;
  font-size:11.5px;font-weight:600;
}
.onbase .ob-btn:hover:not(:disabled){border-color:var(--ob-blue-500);background:var(--ob-blue-050);}
.onbase .ob-btn:disabled{opacity:.5;cursor:not-allowed;}
.onbase .ob-btn.primary{
  background:linear-gradient(180deg,var(--ob-blue-600),var(--ob-blue-700));
  border-color:var(--ob-blue-700);color:#fff;
}
.onbase .ob-btn.primary:hover:not(:disabled){background:var(--ob-blue-600);}
.onbase .ob-btn.danger{
  background:linear-gradient(180deg,var(--ob-red-600),var(--ob-red-700));
  border-color:var(--ob-red-700);color:#fff;
}
.onbase .ob-btn.export{
  background:linear-gradient(180deg,var(--ob-green-600),var(--ob-green-700));
  border-color:var(--ob-green-700);color:#fff;
}
.onbase .ob-btn.export:hover:not(:disabled){background:var(--ob-green-600);}
.onbase .ob-btn.sm{padding:3px 8px;font-size:11px;}

/* ---------------- Drop zone ---------------- */

.onbase .ob-dropzone{
  border:1.5px dashed var(--ob-line);
  background:#f9fbfc;
  border-radius:2px;
  padding:22px;
  text-align:center;
  color:var(--ob-muted);font-size:12px;
  cursor:pointer;
  transition:border-color .14s, background .14s;
}
.onbase .ob-dropzone:hover{border-color:var(--ob-blue-500);background:var(--ob-blue-050);}
.onbase .ob-dropzone.drag{border-color:var(--ob-blue-600);background:var(--ob-blue-100);}
.onbase .ob-dropzone strong{display:block;color:var(--ob-navy-800);font-size:13px;margin-bottom:3px;}
.onbase .ob-dropzone .ob-dz-icon{font-size:24px;color:var(--ob-blue-600);}

/* ---------------- Status chips ---------------- */

.onbase .ob-status{
  display:inline-block;
  padding:1px 7px;border-radius:2px;
  font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  background:var(--ob-blue-100);color:var(--ob-blue-700);
}
.onbase .ob-status.ok{background:var(--ob-green-050);color:var(--ob-green-700);}
.onbase .ob-status.err{background:var(--ob-red-050);color:var(--ob-red-700);}
.onbase .ob-status.warn{background:var(--ob-amber-050);color:var(--ob-amber-600);}

/* ---------------- Forms, notes, empty ---------------- */

.onbase .ob-field{margin-bottom:11px;}
.onbase .ob-field label{
  display:block;font-size:11px;font-weight:700;
  color:var(--ob-muted);margin-bottom:3px;
}
.onbase .ob-field input,.onbase .ob-field select{
  width:100%;
  border:1px solid var(--ob-line);border-radius:2px;
  padding:6px 9px;background:#fff;color:var(--ob-ink);
}
.onbase .ob-field input:focus,.onbase .ob-field select:focus{
  outline:none;border-color:var(--ob-blue-600);
  box-shadow:0 0 0 2px var(--ob-blue-100);
}
.onbase .ob-note{
  font-size:11.5px;color:var(--ob-muted);line-height:1.55;
}
.onbase .ob-callout{
  background:var(--ob-blue-050);
  border:1px solid #c3d9e9;
  border-left:3px solid var(--ob-blue-600);
  border-radius:2px;
  padding:10px 12px;
  font-size:11.5px;color:var(--ob-ink);line-height:1.55;
}
.onbase .ob-callout.err{
  background:var(--ob-red-050);border-color:#e0c0c0;border-left-color:var(--ob-red-600);
}
.onbase .ob-callout.ok{
  background:var(--ob-green-050);border-color:#c2ddce;border-left-color:var(--ob-green-600);
}
.onbase .ob-empty{
  padding:30px 18px;text-align:center;
  color:var(--ob-muted);font-size:12px;
}
.onbase .ob-empty .ob-empty-icon{font-size:34px;color:var(--ob-line);display:block;margin-bottom:8px;}
.onbase .ob-empty strong{display:block;color:var(--ob-navy-800);font-size:14px;margin-bottom:4px;}
.onbase .ob-hidden{display:none !important;}

/* ---------------- Modal ---------------- */

.onbase-modal{
  display:none;position:fixed;inset:0;z-index:1200;
  background:rgba(26,40,54,.55);
  align-items:center;justify-content:center;padding:24px;
  font-family:'Segoe UI','Inter',sans-serif;
}
.onbase-modal.show{display:flex;}
.onbase-modal .ob-dialog{
  background:#fff;border-radius:3px;
  width:100%;max-width:440px;
  box-shadow:0 12px 34px rgba(26,40,54,.34);
  overflow:hidden;
  color:#25313d;font-size:13px;
}
.onbase-modal .ob-dialog-head{
  background:linear-gradient(180deg,#2e455e,#24364b);
  color:#fff;padding:11px 16px;
  font-size:14px;font-weight:600;
  display:flex;align-items:center;justify-content:space-between;
}
.onbase-modal .ob-dialog-head button{
  background:rgba(255,255,255,.15);border:none;color:#fff;
  width:24px;height:24px;border-radius:2px;
}
.onbase-modal .ob-dialog-body{padding:16px;}
.onbase-modal .ob-dialog-foot{
  padding:11px 16px;background:#f4f6f8;
  border-top:1px solid #cbd3db;
  display:flex;justify-content:flex-end;gap:7px;
}

/* ---------------- Responsive ---------------- */

@media(max-width:900px){
  .onbase .ob-workspace{flex-direction:column;}
  .onbase .ob-sidebar{width:100%;border-right:none;border-bottom:1px solid var(--ob-line);}
  .onbase .ob-topsearch{display:none;}
}

</style>
</head>

<script>
/* ===== js/common.js ===== */
