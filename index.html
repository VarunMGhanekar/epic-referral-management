<script>
/* ===== js/common.js ===== */
/* =========================================================
   EHR PORTAL — SHARED UTILITIES
   Exposed on window.EHR so every POC module can use the same
   helpers without importing anything. No module-specific
   logic and no backend config belongs in this file.
   ========================================================= */

/* The module registry must exist before any POC file runs, because
   each module registers itself the moment its script is parsed. */
window.EHR_MODULES = window.EHR_MODULES || {};

window.EHR = (function () {
  "use strict";

  /* ---------------- Icons (16px stroke set) ---------------- */
  const s = 'xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  const ICONS = {
    dashboard: `<svg ${s}><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>`,
    referral: `<svg ${s}><path d="M7 17 17 7"/><path d="M8 7h9v9"/><circle cx="5" cy="19" r="2"/></svg>`,
    queue: `<svg ${s}><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>`,
    payer: `<svg ${s}><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>`,
    patients: `<svg ${s}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>`,
    file: `<svg ${s}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>`,
    criteria: `<svg ${s}><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`,
    letters: `<svg ${s}><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>`,
    reports: `<svg ${s}><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>`,
    settings: `<svg ${s}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.5.6.9 1.11 1H21a2 2 0 1 1 0 4h-.09c-.51.1-.97.5-1.11 1z"/></svg>`,
    bell: `<svg ${s}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>`,
    search: `<svg ${s}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>`,
    plus: `<svg ${s}><path d="M12 5v14M5 12h14"/></svg>`,
    refresh: `<svg ${s}><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>`,
    check: `<svg ${s}><path d="M20 6 9 17l-5-5"/></svg>`,
    x: `<svg ${s}><path d="M18 6 6 18M6 6l12 12"/></svg>`,
    warn: `<svg ${s}><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>`,
    bolt: `<svg ${s}><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>`,
    download: `<svg ${s}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>`,
    eye: `<svg ${s}><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>`,
    trash: `<svg ${s}><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>`,
    edit: `<svg ${s}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>`,
  };

  /* ---------------- Escaping + formatting ---------------- */
  const clean = (v) => (v === null || v === undefined ? "" : String(v).trim());

  function esc(v) {
    return clean(v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  function initials(name) {
    const parts = clean(name).split(/\s+/).filter(Boolean);
    if (!parts.length) return "--";
    return (parts[0][0] + (parts[parts.length - 1][0] || "")).toUpperCase();
  }

  /* Date-only values stay date-only. No timezone conversion, ever —
     a YYYY-MM-DD from the database must display as that same day. */
  function fmtDate(value) {
    const raw = clean(value);
    if (!raw) return "";
    const dateOnly = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (dateOnly) {
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      return `${months[Number(dateOnly[2]) - 1]} ${Number(dateOnly[3])}, ${dateOnly[1]}`;
    }
    return raw;
  }

  function nowStamp() {
    const d = new Date();
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) +
      " " + d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
  }

  function fmtBytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
    return (n / 1024 / 1024).toFixed(1) + " MB";
  }

  function uid(prefix) {
    return prefix + "-" + Math.random().toString(36).slice(2, 8).toUpperCase();
  }

  function randDigits(n) {
    let out = "";
    for (let i = 0; i < n; i++) out += Math.floor(Math.random() * 10);
    return out;
  }

  /* ---------------- Toasts (one implementation, portal-wide) ---------------- */
  function toast(message, type) {
    const region = document.getElementById("toastRegion");
    if (!region) return;
    const el = document.createElement("div");
    el.className = "toast" + (type ? " " + type : "");
    el.innerHTML = (type === "success" ? ICONS.check : type === "error" ? ICONS.warn : "") +
      "<span>" + esc(message) + "</span>";
    region.appendChild(el);
    setTimeout(() => {
      el.style.opacity = "0";
      el.style.transform = "translateX(20px)";
      el.style.transition = "all .25s";
      setTimeout(() => el.remove(), 260);
    }, 3200);
  }

  /* ---------------- Shared markup builders ---------------- */
  /* The Epic activity header band: breadcrumb, title, toolbar.
     Modules follow this with <div class="module-body"> for content. */
  function pageHead(opts) {
    return `
      <div class="activity-head">
        <div class="crumbs">EPIC <b>\u203a</b> ${esc(opts.module || "")}${opts.crumb ? " <b>\u203a</b> " + esc(opts.crumb) : ""}</div>
        <div class="page-head">
          <div>
            <div class="page-title">${esc(opts.title)}</div>
            <div class="page-sub">${opts.subHtml || esc(opts.sub || "")}</div>
          </div>
          <div class="page-actions">${opts.actions || ""}</div>
        </div>
      </div>`;
  }

  function kpi(label, value, tone, delta) {
    return `<div class="kpi-card ${tone || ""}">
      <div class="kpi-label">${esc(label)}</div>
      <div class="kpi-value">${esc(value)}</div>
      ${delta ? `<div class="kpi-delta neutral">${esc(delta)}</div>` : ""}
    </div>`;
  }

  function infoItem(label, value, opts) {
    opts = opts || {};
    if (!clean(value) && !opts.showEmpty) return "";
    return `<div class="info-item ${opts.full ? "full" : ""}">
      <div class="info-item-label">${esc(label)}</div>
      <div class="info-item-value ${opts.mono ? "mono" : ""} ${opts.body ? "body" : ""}">${esc(value) || "—"}</div>
    </div>`;
  }

  function sectionLabel(text) {
    return `<div class="section-label">${esc(text)}<span class="line"></span></div>`;
  }

  function emptyState(title, hint) {
    return `<div class="empty-state"><strong>${esc(title)}</strong>${esc(hint || "")}</div>`;
  }

  return {
    ICONS, esc, clean, initials, fmtDate, nowStamp, fmtBytes, uid, randDigits,
    toast, pageHead, kpi, infoItem, sectionLabel, emptyState,
  };
})();


/* ===== js/session.js ===== */
/* =========================================================
   EHR PORTAL — SESSION
   A sign-in gate so the portal shows who is charting. The name
   entered here drives the identity bar, the status bar, and any
   module that stamps a user onto a record.

   This is presentation-layer identity for a demo. It is not
   authentication and grants no access control.
   ========================================================= */

window.EHR_SESSION = (function () {
  "use strict";

  const KEY = "ehr.session";
  let user = null;                 // { name, role, initials }
  const listeners = [];

  const ROLES = [
    "Physician",
    "Registered Nurse",
    "Medical Case Manager",
    "Referral Coordinator",
    "Prior Authorization Specialist",
    "Utilization Review Nurse",
    "Administrator",
  ];

  /* sessionStorage is unavailable in some sandboxed previews, so every
     access is guarded and the session simply falls back to memory. */
  function readStored() {
    try {
      const raw = window.sessionStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function writeStored(value) {
    try {
      if (value) window.sessionStorage.setItem(KEY, JSON.stringify(value));
      else window.sessionStorage.removeItem(KEY);
    } catch (e) { /* memory-only session */ }
  }

  function initials(name) {
    const parts = String(name || "").trim().split(/\s+/)
      .filter(p => !/^(dr|dr\.|mr|mr\.|mrs|mrs\.|ms|ms\.)$/i.test(p));
    if (!parts.length) return "--";
    return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
  }

  function loginScreen() {
    return `
      <div class="login-screen" id="loginScreen">
        <div class="login-card">
          <div class="login-head">
            <div class="login-logo">
              <div class="login-mark">E</div>
              <div>
                <div class="login-title">EPIC</div>
                <div class="login-sub">Clinical Operations</div>
              </div>
            </div>
            <div class="login-sub">Enter your name to open the workspace. Your name appears on every activity you touch.</div>
          </div>

          <div class="login-body">
            <div class="form-field">
              <label for="loginName">Full name</label>
              <input id="loginName" placeholder="e.g. Dr. Lisa Chen, MD" autocomplete="name" autofocus>
            </div>
            <div class="form-field">
              <label for="loginRole">Role</label>
              <select id="loginRole">
                ${ROLES.map(r => `<option${r === "Medical Case Manager" ? " selected" : ""}>${r}</option>`).join("")}
              </select>
            </div>
            <div class="form-field">
              <label for="loginDept">Department</label>
              <input id="loginDept" value="Clinical Operations">
            </div>
            <div id="loginError" style="display:none;color:var(--red-600);font-size:11px;font-weight:600;margin-bottom:10px;"></div>
            <button class="btn btn-teal btn-block" id="loginBtn" style="padding:7px 12px;font-size:12.5px;">Open workspace</button>
          </div>

          <div class="login-foot">
            Demo environment. This screen sets the display identity for the session only — it is not authentication and does not control access to data.
          </div>
        </div>
      </div>`;
  }

  function showLogin(onDone) {
    const wrap = document.createElement("div");
    wrap.innerHTML = loginScreen();
    document.body.appendChild(wrap.firstElementChild);

    const nameEl = document.getElementById("loginName");
    const errEl = document.getElementById("loginError");

    function submit() {
      const name = nameEl.value.trim();
      if (name.length < 2) {
        errEl.textContent = "Enter the name that should appear on your activities.";
        errEl.style.display = "block";
        nameEl.focus();
        return;
      }
      user = {
        name,
        role: document.getElementById("loginRole").value,
        dept: document.getElementById("loginDept").value.trim() || "Clinical Operations",
        initials: initials(name),
        since: new Date(),
      };
      writeStored(user);
      const screen = document.getElementById("loginScreen");
      if (screen) screen.remove();
      onDone(user);
    }

    document.getElementById("loginBtn").addEventListener("click", submit);
    document.getElementById("loginScreen").addEventListener("keydown", (e) => {
      if (e.key === "Enter") submit();
    });
    nameEl.focus();
  }

  return {
    ROLES,
    /* Resolves with the signed-in user, prompting only when needed. */
    require(onDone) {
      const stored = readStored();
      if (stored && stored.name) {
        user = stored;
        user.initials = user.initials || initials(user.name);
        onDone(user);
        return;
      }
      showLogin(onDone);
    },
    get() { return user; },
    signOut() {
      user = null;
      writeStored(null);
      location.reload();
    },
    onChange(fn) { listeners.push(fn); },
  };
})();


/* ===== js/navigation.js ===== */
/* =========================================================
   EHR PORTAL — NAVIGATION
   The single place where POC modules are registered in the
   left rail. Adding a POC means adding one entry here plus
   one file under /pages. Nothing else in the shell changes.
   ========================================================= */

window.EHR_NAV = [
  {
    section: "Chart Review",
    items: [
      { id: "dashboard", label: "Home", icon: "dashboard" },
      { id: "patients", label: "Patient Lookup", icon: "patients" },
      { id: "caregap", label: "Care Gap", icon: "criteria" },
      { id: "pocsource", label: "POC Source", icon: "file" },
    ],
  },
  {
    section: "Care Coordination",
    items: [
      { id: "referrals", label: "Referral Management", icon: "referral", badge: "LIVE" },
      { id: "priorauth", label: "Prior Authorization", icon: "queue" },
      { id: "payer", label: "Payer Review", icon: "payer" },
      { id: "providers", label: "Provider", icon: "patients" },
    ],
  },
  {
    section: "Revenue Cycle",
    items: [
      { id: "claims", label: "Claims", icon: "reports" },
      { id: "reports", label: "Reports", icon: "reports" },
    ],
  },
];

window.EHR_NAV_RENDER = function renderNav(activeId) {
  const I = window.EHR.ICONS;
  return window.EHR_NAV.map((group) => {
    const items = group.items.map((item) => {
      const badge = item.badge
        ? `<span class="side-badge" data-badge="${item.id}">${window.EHR.esc(item.badge)}</span>`
        : "";
      return `<button class="side-item ${item.id === activeId ? "active" : ""}" data-nav="${item.id}">
        ${I[item.icon] || I.dashboard}<span>${window.EHR.esc(item.label)}</span>${badge}
      </button>`;
    }).join("");
    return `<div class="side-section-label">${window.EHR.esc(group.section)}</div>${items}`;
  }).join("");
};


/* ===== pages/dashboard/dashboard.js ===== */
/* =========================================================
   MODULE — HOME
   The clinician's landing page. It answers "what needs my
   attention and where do I go next", not "how is this system
   put together". No table names, endpoints or infrastructure
   detail belongs on this screen.
   ========================================================= */

(function () {
  "use strict";

  const U = window.EHR;

  const WORK_AREAS = [
    {
      id: "referrals",
      name: "Referral Management",
      blurb: "Incoming referral documents are read, matched to a patient and validated before they reach the schedule.",
      doing: [
        "Review referrals waiting on human validation",
        "Check a referral's documents and clinical detail",
        "Correct extracted data before it is filed",
      ],
      cta: "Open referrals",
    },
    {
      id: "priorauth",
      name: "Prior Authorization",
      blurb: "Cases needing payer approval before a procedure can go ahead. Packets are assembled here and sent for review.",
      doing: [
        "Work the queue of cases awaiting intake",
        "Attach the clinical notes and orders a payer requires",
        "Submit a completed packet, or route it to a nurse",
      ],
      cta: "Open work queue",
    },
    {
      id: "payer",
      name: "Payer Review",
      blurb: "The other side of the same request. Submitted packets are checked against clinical criteria and a determination is issued.",
      doing: [
        "Review requests against the criteria library",
        "Approve, pend for more information, or deny",
        "Generate the determination letter for the provider",
      ],
      cta: "Open review queue",
    },
  ];

  function greeting() {
    const h = new Date().getHours();
    if (h < 12) return "Good morning";
    if (h < 17) return "Good afternoon";
    return "Good evening";
  }

  /* "Dr. Lisa Chen, MD" reads better as "Dr. Lisa Chen" in a greeting. */
  function shortName(full) {
    return String(full || "").replace(/,.*$/, "").trim();
  }

  function today() {
    return new Date().toLocaleDateString("en-US", {

/* ===== pages/patients/patients.js ===== */
/* =========================================================
   MODULE — PATIENT LOOKUP
   A cross-module patient index. It reads what the other modules
   already have loaded rather than introducing a query of its own,
   so it needs no new table, endpoint or Edge Function.

   Referral patients come from the live Supabase read the Referral
   module performs; PA and payer patients come from their case data.
   ========================================================= */

(function () {
  "use strict";

  const U = window.EHR;
  const $ = (id) => document.getElementById(id);
  const esc = U.esc;

  const SOURCES = {
    referral: { label: "Referrals", cls: "badge-teal", route: "referrals" },
    pa: { label: "Prior Auth", cls: "badge-review", route: "priorauth" },
    payer: { label: "Payer Review", cls: "badge-info", route: "payer" },
  };

  let people = [];

  /* Same person can appear in several modules. Match on MRN or member
     id where we have one, otherwise on name + date of birth. */
  function keyFor(p) {
    const id = U.clean(p.mrn || p.memberId).toUpperCase();
    if (id) return "ID:" + id;
    return "ND:" + U.clean(p.name).toLowerCase() + "|" + U.clean(p.dob);
  }

  function merge(list) {
    const map = new Map();
    for (const p of list) {
      if (!U.clean(p.name)) continue;
      const k = keyFor(p);
      const existing = map.get(k);
      if (!existing) {
        map.set(k, Object.assign({ sources: {}, records: [] }, p));
        map.get(k).sources[p.source] = true;
        map.get(k).records.push(p);
      } else {
        existing.sources[p.source] = true;
        existing.records.push(p);
        existing.mrn = existing.mrn || p.mrn;
        existing.memberId = existing.memberId || p.memberId;
        existing.dob = existing.dob || p.dob;
        existing.payer = existing.payer || p.payer;
      }
    }
    return Array.from(map.values())
      .sort((a, b) => U.clean(a.name).localeCompare(U.clean(b.name)));
  }

  /* ---------- Collectors, one per module ---------- */

  function fromReferrals() {
    const rows = (window.REFERRAL_PATIENTS && window.REFERRAL_PATIENTS()) || [];
    return rows.map(r => ({
      source: "referral",
      name: r.name,
      dob: r.dob,
      mrn: r.mrn,
      detail: r.type ? r.type + " referral" : "Referral",
      status: r.status,
      ref: r.referralId,
    }));
  }

  function fromPriorAuth() {
    const cases = (window.PRIORAUTH_CASES_LIVE && window.PRIORAUTH_CASES_LIVE()) || window.PRIORAUTH_CASES || [];
    return cases.map(c => ({
      source: "pa",
      name: c.patient,
      dob: c.dob,
      memberId: c.member,
      payer: c.payer,
      detail: c.procedure ? c.procedure + " (CPT " + c.cpt + ")" : "Prior authorization",
      status: c.status,
      ref: c.id,
    }));
  }

  function fromPayer() {
    const cases = (window.PAYER_CASES && window.PAYER_CASES()) || [];
    return cases.map(c => ({
      source: "payer",
      name: c.patientName,
      dob: c.dob,
      memberId: c.memberId,
      payer: c.payer,
      detail: c.procedure || "Payer review",
      status: c.status,
      ref: c.id,
    }));
  }

  function collect() {
    return merge([].concat(fromReferrals(), fromPriorAuth(), fromPayer()));
  }

  /* ---------- Rendering ---------- */

  function sourcePills(p) {
    return Object.keys(p.sources)
      .map(s => `<span class="badge ${SOURCES[s].cls}">${esc(SOURCES[s].label)}</span>`)
      .join(" ");
  }

  function shell() {
    return U.pageHead({
      module: "Patient Lookup",
      title: "Patient Lookup",
      sub: "Every patient known to the portal, drawn from all active areas",
      actions: `<button class="btn btn-outline btn-sm" id="plRefresh">${U.ICONS.refresh} Refresh</button>`
    }) + `
      <div class="module-body">
        <div class="kpi-row" id="plKpi"></div>

        <div class="filter-bar">
          <div class="search-box">${U.ICONS.search}
            <input id="plSearch" placeholder="Search name, MRN, member ID…">
          </div>
          <select class="field-select" id="plSource">
            <option value="">All areas</option>
            <option value="referral">Referrals</option>
            <option value="pa">Prior Auth</option>
            <option value="payer">Payer Review</option>
          </select>
        </div>

        <div class="split">
          <div class="card">
            <div class="card-head">
              <div class="card-title">Patients</div>
              <div class="card-sub" id="plCount"></div>
            </div>
            <div class="card-body flush">
              <div class="table-wrap">
                <table class="data">
                  <thead><tr>
                    <th>Patient</th><th>Identifier</th><th>Appears in</th><th>Records</th>
                  </tr></thead>
                  <tbody id="plRows"></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <div class="card-title">Patient record</div>
              <div class="card-sub" id="plDetailSub">Select a patient</div>
            </div>
            <div class="card-body" id="plDetail">
              ${U.emptyState("No patient selected", "Choose a patient to see everything the portal holds for them.")}
            </div>
          </div>
        </div>
      </div>`;
  }

  function render() {
    const q = U.clean($("plSearch").value).toLowerCase();
    const src = $("plSource").value;

    const view = people.filter(p => {
      const hay = [p.name, p.mrn, p.memberId, p.dob].map(U.clean).join(" ").toLowerCase();
      return (!q || hay.includes(q)) && (!src || p.sources[src]);
    });

    $("plKpi").innerHTML = [
      U.kpi("Patients", people.length, "navy"),
      U.kpi("In referrals", people.filter(p => p.sources.referral).length, ""),
      U.kpi("In prior auth", people.filter(p => p.sources.pa).length, "amber"),
      U.kpi("In payer review", people.filter(p => p.sources.payer).length, "green"),
    ].join("");

    $("plCount").textContent = view.length + " patient" + (view.length === 1 ? "" : "s");

    $("plRows").innerHTML = view.length ? view.map((p, i) => `
      <tr class="clickable" data-idx="${i}">
        <td><div class="cell-strong">${esc(p.name)}</div>
            <div class="cell-sub">${esc(U.fmtDate(p.dob)) || "DOB unknown"}</div></td>
        <td class="cell-mono">${esc(p.mrn || p.memberId || "—")}</td>
        <td>${sourcePills(p)}</td>
        <td class="cell-mono">${p.records.length}</td>
      </tr>`).join("")
      : `<tr><td colspan="4">${U.emptyState("No patients match", "Clear the filters, or open an area to load its records first.")}</td></tr>`;

    $("plRows").querySelectorAll("tr.clickable").forEach(tr =>
      tr.addEventListener("click", () => showPatient(view[Number(tr.dataset.idx)])));
  }

  function showPatient(p) {
    if (!p) return;
    $("plDetailSub").textContent = p.name;

    const records = p.records.map(r => `
      <div class="doc-row">
        <div class="doc-icon">${U.ICONS.file}</div>
        <div class="doc-meta">
          <div class="doc-name">${esc(r.detail || "Record")}</div>
          <div class="doc-sub">${esc(r.ref || "")}${r.status ? " · " + esc(r.status) : ""}</div>
        </div>
        <div class="doc-actions">
          <span class="badge ${SOURCES[r.source].cls}">${esc(SOURCES[r.source].label)}</span>
          <button class="btn btn-outline btn-sm pl-open" data-route="${SOURCES[r.source].route}">Open</button>
        </div>
      </div>`).join("");

    $("plDetail").innerHTML = `
      <div class="patient-banner">
        <div class="avatar">${esc(U.initials(p.name))}</div>
        <div>
          <div class="pb-name">${esc(p.name)}</div>
          <div class="pb-meta">${esc(U.fmtDate(p.dob)) || "DOB unknown"} · ${esc(p.mrn || p.memberId || "no identifier")}</div>
        </div>
        <div class="pb-facts">
          <div><div class="pb-fact-label">Records</div><div class="pb-fact-value">${p.records.length}</div></div>
          <div><div class="pb-fact-label">Areas</div><div class="pb-fact-value">${Object.keys(p.sources).length}</div></div>
        </div>
      </div>

      ${U.sectionLabel("Demographics")}
      <div class="info-grid">
        ${U.infoItem("Name", p.name, { showEmpty: true })}
        ${U.infoItem("Date of birth", U.fmtDate(p.dob), { showEmpty: true })}
        ${U.infoItem("MRN", p.mrn, { mono: true, showEmpty: true })}
        ${U.infoItem("Member ID", p.memberId, { mono: true, showEmpty: true })}
        ${U.infoItem("Payer", p.payer, { showEmpty: true })}
      </div>

      <div style="margin-top:16px;">
        ${U.sectionLabel("Records across the portal")}
        ${records}
      </div>`;

    $("plDetail").querySelectorAll(".pl-open").forEach(b =>
      b.addEventListener("click", () => { location.hash = "#/" + b.dataset.route; }));
  }

  window.EHR_MODULES.patients = {
    mount(container) {
      container.innerHTML = shell();
      people = collect();

      ["plSearch", "plSource"].forEach(id => {
        $(id).addEventListener("input", render);
        $(id).addEventListener("change", render);
      });
      $("plRefresh").addEventListener("click", () => {
        people = collect();
        render();
        U.toast("Patient index refreshed.", "success");
      });

      render();

      /* Referral patients only exist once that module has read Supabase.
         Re-collect shortly after mount so they appear without a click. */
      setTimeout(() => {
        const again = collect();
        if (again.length !== people.length) { people = again; render(); }
      }, 1800);
    }
  };
})();

/* =========================================================
   REFERRAL MANAGEMENT — DOCUMENT STORAGE CLIENT
   Adds upload and download to the referral module without
   changing anything that already worked. The Supabase project
   and key are the same values the referral portal has always
   used; only new endpoints are introduced.
   ========================================================= */

window.REFERRAL_STORAGE = (function () {
  "use strict";

  /* ---------- MODULE CONFIG — Referral Management ---------- */
  const SUPABASE_URL = "https://wysnjsnbraiwopolgxgv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_rUdw6p2HW394IjHoMexMXw_GhEYimpQ";

  const FUNCTIONS_BASE = SUPABASE_URL + "/functions/v1";
  const FUNCTIONS = {
    upload: FUNCTIONS_BASE + "/document-upload2o",
    documentUrl: FUNCTIONS_BASE + "/document-url2o"
  };

  const MODULE = "referral";
  const BUCKET = "referral-documents";
  /* --------------------------------------------------------- */

  function headers(extra) {
    return Object.assign({
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY
    }, extra || {});
  }

  function who() {
    const u = window.EHR_SESSION && window.EHR_SESSION.get();
    return u ? u.name : "";
  }

  /*
   * Upload against a referral. referralRowId must be the referral_s
   * row uuid, not the business REF-... id, because document_s.referral_id
   * is a uuid foreign key. patientRowId is optional but fills in
   * document_s.patient_id when we know it.
   */
  async function upload(referralRowId, file, opts) {
    opts = opts || {};
    const form = new FormData();
    form.append("module", MODULE);
    form.append("file", file);
    form.append("caseId", referralRowId);
    if (opts.patientId) form.append("patientId", opts.patientId);
    if (opts.documentType) form.append("documentType", opts.documentType);
    form.append("uploadedBy", who());

    const r = await fetch(FUNCTIONS.upload, {
      method: "POST",
      headers: headers(),          // no Content-Type: the browser sets the boundary
      body: form
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || "Upload failed");
    }
    return body.document;
  }

  /* Signed URL, used for both the viewer and the download link. */
  async function signedUrl(id) {
    const r = await fetch(
      FUNCTIONS.documentUrl + "?module=" + MODULE + "&id=" + encodeURIComponent(id),
      { headers: headers() }
    );
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.url) {
      throw new Error(body.error || body.message || "Unable to open document");
    }
    return body.url;
  }

  /* Removes the stored file and the document_s row together, which the
     old direct REST delete could not do — it left the file orphaned. */
  async function remove(id) {
    const r = await fetch(
      FUNCTIONS.documentUrl + "?module=" + MODULE + "&id=" + encodeURIComponent(id),
      { method: "DELETE", headers: headers() }
    );
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || "Delete failed");
    }
    return true;
  }

  /* Pull a document into memory and hand the browser a save dialog. */
  async function download(id, fileName) {
    const url = await signedUrl(id);
    const res = await fetch(url);
    if (!res.ok) throw new Error("Stored file could not be read");
    const blob = await res.blob();
    const objectUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = objectUrl;
    a.download = fileName || "document.pdf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(objectUrl), 4000);
  }

  return {
    upload, signedUrl, remove, download,
    config: { SUPABASE_URL, FUNCTIONS, MODULE, BUCKET }
  };
})();

(function () {
  "use strict";

  const U = window.EHR;

  /* ============================================================
     EMBEDDED SUPABASE CONFIG  —  DO NOT MODIFY
     The publishable/anon key is intentionally embedded because
     this is a browser-hosted POC. Never use a service-role key here.
     ============================================================ */
  const SUPABASE_URL = "https://wysnjsnbraiwopolgxgv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_rUdw6p2HW394IjHoMexMXw_GhEYimpQ";

  /* Only the three requested Edge Functions are used. */
  const FUNCTIONS_BASE = SUPABASE_URL + "/functions/v1";
  const FUNCTIONS = {
    ingest: FUNCTIONS_BASE + "/maestro-ingest2o",
    documentUrl: FUNCTIONS_BASE + "/document-url2o",
    reset: FUNCTIONS_BASE + "/reset-referrals2o"
  };

  const TABLES = {
    patients: "patient_s",
    referrals: "referral_s",
    documents: "document_s"
  };
  /* ==================== END CONFIG ==================== */

  let patients = [];
  let referrals = [];
  let documents = [];
  let view = [];
  let selected = null;
  let editing = null;
  let host = null;

  const $ = (id) => document.getElementById(id);
  const clean = U.clean;
  const esc = U.esc;
  const toast = (m, isError) => U.toast(m, isError ? "error" : "success");

  function headers(extra) {
    return Object.assign({
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    }, extra || {});
  }

  async function supabaseSelect(table) {
    const url = SUPABASE_URL + "/rest/v1/" + table + "?select=*";
    const r = await fetch(url, { headers: headers() });
    const body = await r.json().catch(() => []);
    if (!r.ok) throw new Error(body && body.message ? body.message : "Unable to read " + table);
    return Array.isArray(body) ? body : [];
  }

  async function supabaseUpdate(table, id, payload) {
    const url = SUPABASE_URL + "/rest/v1/" + table + "?id=eq." + encodeURIComponent(id);
    const r = await fetch(url, {
      method: "PATCH",
      headers: headers({ "Prefer": "return=representation" }),
      body: JSON.stringify(payload)
    });
    const body = await r.json().catch(() => []);
    if (!r.ok) throw new Error(body && (body.message || body.error) ? (body.message || body.error) : "Unable to update " + table);
    return body;
  }

  async function supabaseDelete(table, id) {
    const url = SUPABASE_URL + "/rest/v1/" + table + "?id=eq." + encodeURIComponent(id);
    const r = await fetch(url, {
      method: "DELETE",
      headers: headers({ "Prefer": "return=representation" })
    });
    const body = await r.json().catch(() => []);
    if (!r.ok) throw new Error(body && (body.message || body.error) ? (body.message || body.error) : "Unable to delete " + table);
    return body;
  }

  function first(obj, keys) {
    for (const k of keys) {
      if (obj && obj[k] !== undefined && obj[k] !== null && clean(obj[k]) !== "") return obj[k];
    }
    return "";
  }

  function normalize() {
    return referrals.map((r, index) => {
      const patientId = first(r, ["patient_id", "patientId"]);
      const mrn = first(r, ["mrn", "patient_mrn", "patientMRN"]);
      let p = patients.find(x => patientId && String(x.id) === String(patientId));
      if (!p && mrn) p = patients.find(x => String(first(x, ["mrn", "patient_mrn", "patientMRN"])) === String(mrn));

      const rid = first(r, ["id", "referral_id", "referralId"]) || ("ROW-" + index);
      const referralId = first(r, ["referral_id", "referralId", "external_referral_id"]) || rid;
      const docs = documents.filter(d => {
        const drid = first(d, ["referral_id", "referralId"]);
        return (drid && String(drid) === String(rid)) ||
               (drid && String(drid) === String(referralId));
      });

      return {
        raw: r, patient: p || {},
        rowId: rid, referralId,
        name: first(r, ["patient_name", "patientName", "name"]) || first(p, ["name", "patient_name", "patientName"]),
        dob: first(r, ["dob", "date_of_birth", "dateOfBirth"]) || first(p, ["dob", "date_of_birth", "dateOfBirth"]),
        mrn: mrn || first(p, ["mrn", "patient_mrn", "patientMRN"]),
        type: first(r, ["referral_type", "specialty", "type", "referred_specialty", "referredSpecialty"]),
        documentType: first(r, ["document_type", "documentType"]) || first(docs[0], ["document_type", "documentType"]),
        date: first(r, ["referral_date", "referralDate", "date", "created_at", "createdAt"]),
        provider: first(r, ["referring_provider", "referringProvider", "provider"]),
        providerNPI: first(r, ["provider_npi", "providerNPI", "npi"]),
        receivingProvider: first(r, ["receiving_provider", "receivingProvider"]),
        urgency: first(r, ["urgency", "priority"]),
        diagnosis: first(r, ["diagnosis", "diag"]),
        icd10: first(r, ["icd10", "icd_10", "primary_icd10", "primaryICD10"]),
        cptCode: first(r, ["cpt_code", "cptCode", "procedure_code", "procedureCode"]),
        reason: first(r, ["reason", "reason_for_referral", "reasonForReferral"]),
        requestedService: first(r, ["requested_service", "requestedService"]),
        requestedProcedure: first(r, ["requested_procedure", "requestedProcedure"]),
        chiefComplaint: first(r, ["chief_complaint", "chiefComplaint"]),
        clinicalSummary: first(r, ["clinical_summary", "clinicalSummary"]),
        agentSummary: first(r, ["agent_summary", "agentSummary"]),
        epicRecordCreatedDate: first(r, ["epic_record_created_date", "epicRecordCreatedDate"]),
        validation: first(r, ["validation_status", "validationStatus", "validation"]),
        status: first(r, ["processing_status", "processingStatus", "status"]),
        docs
      };
    });
  }

  function getDocId(d) { return first(d, ["id", "document_id", "documentId"]); }

  function isToday(value) {
    const raw = clean(value);
    if (!raw) return false;
    const dt = new Date(raw);
    if (Number.isNaN(dt.getTime())) {
      const m = raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
      if (!m) return false;
      const a = Number(m[1]), b = Number(m[2]), y = Number(m[3]);
      const localToday = new Date();
      return (a === localToday.getMonth() + 1 && b === localToday.getDate() && y === localToday.getFullYear()) ||
             (b === localToday.getMonth() + 1 && a === localToday.getDate() && y === localToday.getFullYear());
    }
    const now = new Date();
    return dt.getFullYear() === now.getFullYear() &&
           dt.getMonth() === now.getMonth() &&
           dt.getDate() === now.getDate();
  }

  function validationKind(r) {
    const raw = r.raw || {};
    const combined = [
      r.validation, r.status,
      first(raw, ["validation_status", "validationStatus", "validation_result", "validationResult"]),
      first(raw, ["validated_by", "validatedBy", "validation_source", "validationSource"]),
      first(raw, ["review_status", "reviewStatus"])
    ].map(clean).join(" ").toLowerCase();

    const humanFlag = first(raw, ["human_validated", "humanValidated", "is_human_validated", "isHumanValidated"]);
    const agentFlag = first(raw, ["agent_validated", "agentValidated", "is_agent_validated", "isAgentValidated"]);

    if (["true", "1", "yes"].includes(String(humanFlag).toLowerCase()) ||
        combined.includes("human_validated") || combined.includes("human validated") ||
        combined.includes("hitl_validated") || combined.includes("hitl validated") ||
        combined.includes("human-validation") || combined.includes("human validation"))
      return "human";

    if (["true", "1", "yes"].includes(String(agentFlag).toLowerCase()) ||
        combined.includes("agent_validated") || combined.includes("agent validated") ||
        combined.includes("agent-validation") || combined.includes("agent validation"))
      return "agent";

    return "";
  }

    return `<span class="badge ${cls}"><span class="badge-dot"></span>${esc(stat)}</span>`;

  /* ---------------- Document upload / download ----------------
     Uploads go through document-upload2o with module=referral, which
     writes the file into referral-documents and the row into
     document_s. The Maestro ingest path is unaffected. */

  function uploadNote(text, tone) {
    const el = $("refUploadNote");
    if (!el) return;
    el.innerHTML = text
      ? `<div class="empty-hint" style="color:${tone === "error" ? "var(--red-600)" : "var(--ink-500)"}">${esc(text)}</div>`
      : "";
  }

  async function uploadReferralFiles(r, files) {
    const list = Array.from(files || []);
    if (!list.length || !r) return;

    /* document_s.referral_id is a uuid, so we must send the referral_s
       row id rather than the business REF-... identifier. */
    const referralRowId = r.rowId;
    const patientId = first(r.patient, ["id"]) || "";

    let done = 0;
    for (let i = 0; i < list.length; i++) {
      const file = list[i];
      uploadNote(`Uploading ${file.name} (${i + 1} of ${list.length})\u2026`);
      try {
        await window.REFERRAL_STORAGE.upload(referralRowId, file, {
          patientId: patientId,
          documentType: r.documentType || "Referral Document"
        });
        done++;
      } catch (e) {
        uploadNote(`${file.name} failed: ${e.message}`, "error");
        toast(file.name + " could not be uploaded: " + e.message, true);
      }
    }

    if (done) {
      uploadNote("");
      toast(done + (done === 1 ? " document" : " documents") + " attached to the referral.");
      await loadData();
      const fresh = normalize().find(x => String(x.rowId) === String(referralRowId));
      if (fresh) showDetail(fresh);
    }
  }

  function wireReferralUpload(r) {
    const zone = $("refDropzone");
    const input = $("refFileInput");

    if (input) {
      input.addEventListener("change", () => {
        uploadReferralFiles(r, input.files);
        input.value = "";
      });
    }

    if (zone) {
      ["dragenter", "dragover"].forEach(ev =>
        zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add("drag"); }));
      ["dragleave", "drop"].forEach(ev =>
        zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove("drag"); }));
      zone.addEventListener("drop", e => {
        if (e.dataTransfer && e.dataTransfer.files.length) {
          uploadReferralFiles(r, e.dataTransfer.files);
        }
      });
    }
  }

  async function downloadDocument(id, name, button) {
    button.disabled = true;
    try {
      await window.REFERRAL_STORAGE.download(id, name);
    } catch (e) {
      toast(e.message || "Unable to download document", true);
    } finally {
      button.disabled = false;
    }
  }

  async function viewDocument(id, button) {
    button.disabled = true;
    try {
      const r = await fetch(FUNCTIONS.documentUrl + "?id=" + encodeURIComponent(id), { headers: headers() });
      const body = await r.json().catch(() => ({}));
      if (!r.ok || !body.url) throw new Error(body.error || body.message || "Unable to retrieve document");
      $("pdfViewer").src = body.url;
      $("pdfViewer").style.display = "block";
      $("pdfPlaceholder").style.display = "none";
    } catch (e) { toast(e.message || "Unable to open document", true); }
    finally { button.disabled = false; }
  }

  function wireEditUpload(r) {
    const zone = $("editDropzone");
    const input = $("editFileInput");
    const note = $("editUploadNote");

    async function send(files) {
      const list = Array.from(files || []);
      if (!list.length) return;
      const referralRowId = r.rowId;
      const patientId = first(r.patient, ["id"]) || "";
      let done = 0;

      for (let i = 0; i < list.length; i++) {
        const file = list[i];
        if (note) note.innerHTML = `<div class="empty-hint">Uploading ${esc(file.name)} (${i + 1} of ${list.length})\u2026</div>`;
        try {
          await window.REFERRAL_STORAGE.upload(referralRowId, file, {
            patientId: patientId,
            documentType: r.documentType || "Referral Document"
          });
          done++;
        } catch (e) {
          if (note) note.innerHTML = `<div class="empty-hint" style="color:var(--red-600)">${esc(file.name)} failed: ${esc(e.message)}</div>`;
          toast(file.name + " could not be uploaded: " + e.message, true);
        }
      }

      if (done) {
        if (note) note.innerHTML = "";
        toast(done + (done === 1 ? " document" : " documents") + " attached.");
        await loadData();
        const fresh = normalize().find(x => String(x.rowId) === String(referralRowId));
        if (fresh) { editing = fresh; renderEditDocs(fresh); if (selected) showDetail(fresh); }
      }
    }

    if (input) {
      input.addEventListener("change", () => { send(input.files); input.value = ""; });
    }
    if (zone) {
      ["dragenter", "dragover"].forEach(ev =>
        zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add("drag"); }));
      ["dragleave", "drop"].forEach(ev =>
        zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove("drag"); }));
      zone.addEventListener("drop", e => {
        if (e.dataTransfer && e.dataTransfer.files.length) send(e.dataTransfer.files);
      });
    }
  }

  async function saveEdit() {
    if (!editing) return;
    const payload = {};
    $("editGrid").querySelectorAll("[data-key]").forEach(el => payload[el.dataset.key] = el.value.trim());
    const btn = $("saveEdit"); btn.disabled = true; btn.textContent = "Saving…";
    try {
      /*
       * The UI uses the actual referral_s row id for the PATCH.
       * Patient fields are updated separately when a matching patient_s
       * row can be identified. RLS UPDATE policies are required.
       */
      const referralPayload = {
        referral_id: payload.referral_id || editing.raw.referral_id || editing.referralId,
        document_type: payload.document_type,
        referral_type: payload.referral_type,
        referral_date: payload.referral_date,
        referring_provider: payload.referring_provider,
        provider_npi: payload.provider_npi,
        receiving_provider: payload.receiving_provider,
        urgency: payload.urgency,
        diagnosis: payload.diagnosis,
        icd10: payload.icd10,
        procedure_code: payload.procedure_code,
        requested_service: payload.requested_service,
        requested_procedure: payload.requested_procedure,
        reason_for_referral: payload.reason_for_referral,
        chief_complaint: payload.chief_complaint,
        epic_record_created_date: payload.epic_record_created_date,
        clinical_summary: payload.clinical_summary,
        agent_summary: payload.agent_summary
      };
      Object.keys(referralPayload).forEach(k => { if (referralPayload[k] === "") delete referralPayload[k]; });
      await supabaseUpdate(TABLES.referrals, editing.rowId, referralPayload);

      const pid = first(editing.patient, ["id"]);
      if (pid) {
        const patientPayload = { patient_name: payload.patient_name, dob: payload.dob, mrn: payload.mrn };
        Object.keys(patientPayload).forEach(k => { if (patientPayload[k] === "") delete patientPayload[k]; });
        await supabaseUpdate(TABLES.patients, pid, patientPayload);
      }
      closeEdit(); await loadData(); toast("Referral updated in Supabase.");
      if (selected) {
        const fresh = normalize().find(x => String(x.rowId) === String(selected.rowId));
        if (fresh) showDetail(fresh);
      }
    } catch (e) { toast(e.message || "Update failed", true); }
    finally { btn.disabled = false; btn.textContent = "Save to Supabase"; }
  }

  async function deleteReferral(r) {
    if (!r) return;
    if (!confirm("Delete this referral and its patient record? This cannot be undone.")) return;
    try {
      for (const d of r.docs) {
        const id = getDocId(d);
        if (id) await supabaseDelete(TABLES.documents, id);
      }
      await supabaseDelete(TABLES.referrals, r.rowId);
      const pid = first(r.patient, ["id"]);
      if (pid) await supabaseDelete(TABLES.patients, pid);
      selected = null; await loadData();
      $("detailBody").innerHTML = U.emptyState("No referral selected", "Referral details and documents appear here after you select a record.");
      toast("Referral deleted.");
    } catch (e) { toast(e.message || "Delete failed. Check Supabase DELETE policy.", true); }
  }

  async function deleteDocument(id) {
    if (!id || !confirm("Delete this document record and its stored file?")) return;
    try {
      /* Goes through document-url2o so the stored file is removed as well.
         The previous direct REST delete removed only the row and left the
         file orphaned in the bucket. */
      await window.REFERRAL_STORAGE.remove(id);
      await loadData();
      const fresh = selected ? normalize().find(x => String(x.rowId) === String(selected.rowId)) : null;
      if (fresh) showDetail(fresh); else render();
      toast("Document deleted.");
    } catch (e) {
      toast(e.message || "Document delete failed.", true);
    }
  }

  async function resetData() {
    if (!confirm("Reset ALL patient, referral and document records? This cannot be undone.")) return;
    const b = $("resetBtn"); b.disabled = true; b.textContent = "Resetting…";
    try {
      const r = await fetch(FUNCTIONS.reset, {
        method: "POST", headers: headers(), body: JSON.stringify({ confirm: true })
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok || body.success === false) throw new Error(body.error || body.message || "Reset failed");
      patients = []; referrals = []; documents = []; selected = null; render();
      $("detailBody").innerHTML = U.emptyState("No referral selected", "Referral details and documents appear here after you select a record.");
      toast("All referral management data was reset.");
    } catch (e) { toast(e.message || "Reset failed", true); }
    finally { b.disabled = false; b.textContent = "Reset demo data"; }
  }

  async function loadData() {
    const live = $("liveState");
    if (!live) return;
    live.textContent = "● Loading live records…";
    live.style.color = "var(--amber-500)";
    try {
      const [p, r, d] = await Promise.all([
        supabaseSelect(TABLES.patients),
        supabaseSelect(TABLES.referrals),
        supabaseSelect(TABLES.documents)
      ]);
      patients = p; referrals = r; documents = d;
      render();
      clearConnBanner();
      live.textContent = "● Live Supabase records connected · " +
        referrals.length + " referrals, " + patients.length + " patients, " +
        documents.length + " documents";
      live.style.color = "var(--green-600)";
    } catch (e) {
      patients = []; referrals = []; documents = []; render();
      live.textContent = "● Live data read failed";
      live.style.color = "var(--red-600)";
      showConnBanner(e);
      toast(e.message || "Unable to load live records", true);
      console.error("[referrals] live read failed:", e);
    }
  }

  function clearConnBanner() {
    const el = $("connBanner");
    if (el) el.innerHTML = "";
  }

  /* A failed read is almost always the browser blocking the request
     rather than a bad configuration, so say which and show the raw error. */
  function showConnBanner(err) {
    const el = $("connBanner");
    if (!el) return;
    const msg = (err && err.message) || String(err);
    const looksBlocked = /failed to fetch|networkerror|load failed|blocked/i.test(msg);
    el.innerHTML = `
      <div class="card" style="border-left:4px solid var(--red-600);margin-bottom:12px;">
        <div class="card-head"><div class="card-title">Live Supabase read failed</div>
          <button class="btn btn-outline btn-sm" id="connRetry">${U.ICONS.refresh} Retry</button>
        </div>
        <div class="card-body">
          <div style="font-size:12px;color:var(--ink-700);margin-bottom:10px;">
            ${looksBlocked
              ? "The request never reached Supabase. An embedded preview frame blocks cross-origin calls \u2014 open index.html directly in a browser tab, or serve the folder over http, and the live records will load."
              : "Supabase answered but rejected the read. Check the row-level security SELECT policy on the three tables."}
          </div>
          <div class="info-grid">
            ${U.infoItem("Project", SUPABASE_URL, { full: true, mono: true })}
            ${U.infoItem("Tables", TABLES.patients + " \u00b7 " + TABLES.referrals + " \u00b7 " + TABLES.documents, { full: true, mono: true })}
            ${U.infoItem("Error", msg, { full: true, mono: true })}
          </div>
        </div>
      </div>`;
    const retry = $("connRetry");
    if (retry) retry.addEventListener("click", loadData);
  }

  /* Read-only view of the live referral rows, so cross-module pages
     (Patient Lookup, Reports) can use what this module already loaded
     instead of querying Supabase again. */
  window.REFERRAL_PATIENTS = function () {
    try { return normalize(); } catch (e) { return []; }
  };

  /* ---------------- Module contract ---------------- */
  window.EHR_MODULES.referrals = {
    mount(container) {
      host = container;
      selected = null;
      container.innerHTML = shell();

      $("refreshBtn").addEventListener("click", loadData);
      $("resetBtn").addEventListener("click", resetData);
      $("closeEdit").addEventListener("click", closeEdit);
      $("cancelEdit").addEventListener("click", closeEdit);
      $("saveEdit").addEventListener("click", saveEdit);
      $("editBackdrop").addEventListener("click", e => { if (e.target === $("editBackdrop")) closeEdit(); });
      ["search", "statusFilter", "specialtyFilter", "documentTypeFilter"].forEach(id => {
        $(id).addEventListener("input", render);
        $(id).addEventListener("change", render);
      });

      render();
      loadData();
    }
  };
})();

/* =========================================================
   PRIOR AUTHORIZATION — CASE API CLIENT
   Cases now live in Supabase rather than in the browser, so a case
   added here survives a refresh. Workflow state (Start PA, Submit
   PA, nurse routing) stays in memory by design.
   ========================================================= */

window.PA_CASES = (function () {
  "use strict";

  /* ---------- MODULE CONFIG — Prior Authorization only ---------- */
  const SUPABASE_URL = "https://wysnjsnbraiwopolgxgv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_rUdw6p2HW394IjHoMexMXw_GhEYimpQ";

  const ENDPOINT = SUPABASE_URL + "/functions/v1/case-crud2o";
  const MODULE = "pa";
  const TABLE = "pa_case_s";
  /* -------------------------------------------------------------- */

  function headers() {
    return {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    };
  }

  function who() {
    const u = window.EHR_SESSION && window.EHR_SESSION.get();
    return u ? u.name : "";
  }

  async function call(action, payload) {
    const r = await fetch(ENDPOINT, {
      method: "POST",
      headers: headers(),
      body: JSON.stringify(Object.assign({ module: MODULE, action }, payload || {}))
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || action + " failed");
    }
    return body;
  }

  /* Database row -> the shape the Prior Auth module already renders.
     Keeping the old field names means the UI needs no rewrite. */
  function toCase(row) {
    return {
      id: row.pa_case_id,
      rowId: row.id,
      label: row.label || "",
      patient: row.patient || "",
      dob: row.dob || "",
      member: row.member_id || "",
      payer: row.payer || "",
      procedure: row.procedure || "",
      cpt: row.cpt || "",
      diagnosis: row.diagnosis || "",
      physician: row.physician || "",
      npi: row.npi || "",
      requirement: row.requirement || "",
      priority: row.priority || "Standard",
      status: row.status || "Pending Intake",
      owner: row.owner || "",
      scenario: row.scenario || "",
      outcome: row.outcome || "",
      time: "",
      createdBy: row.created_by || "",
      createdAt: row.created_at || ""
    };
  }

  /* The reverse: form values -> database columns. */
  function toRow(form) {
    return {
      pa_case_id: form.id || "",
      label: form.label,
      patient: form.patient,
      dob: form.dob,
      member_id: form.member,
      payer: form.payer,
      procedure: form.procedure,
      cpt: form.cpt,
      diagnosis: form.diagnosis,
      physician: form.physician,
      npi: form.npi,
      requirement: form.requirement,
      priority: form.priority,
      status: form.status,
      owner: form.owner,
      scenario: form.scenario,
      outcome: form.outcome,
      created_by: who()
    };
  }

  return {
    async list() {
      const body = await call("list");
      return (body.cases || []).map(toCase);
    },
    async create(form) {
      const body = await call("create", { data: toRow(form) });
      return toCase(body.case);
    },
    async update(caseId, form) {
      const body = await call("update", { caseId, data: toRow(form) });
      return toCase(body.case);
    },
    /* Removes the case, its document rows and the stored files. */
    async remove(caseId) {
      return await call("delete", { caseId });
    },
    config: { SUPABASE_URL, ENDPOINT, MODULE, TABLE }
  };
})();


/* ===== pages/priorauth/priorauth.storage.js ===== */
/* =========================================================
   PRIOR AUTHORIZATION — DOCUMENT STORAGE CLIENT
   This module's own backend configuration. It is intentionally
   declared here rather than shared, so Prior Auth can be pointed
   at a different project, bucket or function set without touching
   any other POC.
   ========================================================= */

window.PA_STORAGE = (function () {
  "use strict";

  /* ---------- MODULE CONFIG — Prior Authorization only ---------- */
  const SUPABASE_URL = "https://wysnjsnbraiwopolgxgv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_rUdw6p2HW394IjHoMexMXw_GhEYimpQ";

  const FUNCTIONS_BASE = SUPABASE_URL + "/functions/v1";
  const FUNCTIONS = {
    upload: FUNCTIONS_BASE + "/document-upload2o",
    /* Shared read/delete service. The module parameter selects this
       POC's bucket and table; referral keeps its own default path. */
    documentUrl: FUNCTIONS_BASE + "/document-url2o"
  };
  const MODULE = "pa";

  const TABLES = { documents: "pa_document_s" };
  const BUCKET = "pa-documents";
  /* -------------------------------------------------------------- */

  function headers(extra) {
    return Object.assign({
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY
    }, extra || {});
  }

  function who() {
    const u = window.EHR_SESSION && window.EHR_SESSION.get();
    return u ? u.name : "";
  }

  /* Upload one file against a PA case. Returns the stored document row. */
  async function upload(paCaseId, file, opts) {
    opts = opts || {};
    const form = new FormData();
    form.append("module", MODULE);
    form.append("file", file);
    form.append("caseId", paCaseId);
    if (opts.documentType) form.append("documentType", opts.documentType);
    /* Carried so documents can be looked up by member id and name,
       not only by case id. */
    if (opts.memberId) form.append("memberId", opts.memberId);
    if (opts.patientName) form.append("patientName", opts.patientName);
    if (opts.replacesName) form.append("replacesName", opts.replacesName);
    form.append("uploadedBy", who());

    const r = await fetch(FUNCTIONS.upload, {
      method: "POST",
      headers: headers(),          // no Content-Type: the browser sets the boundary
      body: form
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || "Upload failed");
    }
    return body.document;
  }

  async function list(paCaseId) {
    const r = await fetch(
      FUNCTIONS.documentUrl + "?module=" + MODULE + "&caseId=" + encodeURIComponent(paCaseId),
      { headers: headers() }
    );
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || "Unable to list documents");
    }
    return body.documents || [];
  }

  async function signedUrl(id) {
    const r = await fetch(
      FUNCTIONS.documentUrl + "?module=" + MODULE + "&id=" + encodeURIComponent(id),
      { headers: headers() }
    );
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.url) {
      throw new Error(body.error || body.message || "Unable to open document");
    }
    return body.url;
  }

  async function remove(id) {
    const r = await fetch(
      FUNCTIONS.documentUrl + "?module=" + MODULE + "&id=" + encodeURIComponent(id),
      { method: "DELETE", headers: headers() }
    );
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || "Delete failed");
    }
    return true;
  }

  return { upload, list, signedUrl, remove, config: { SUPABASE_URL, FUNCTIONS, TABLES, BUCKET } };
})();

      } catch (e) {
        progress(`${file.name} failed: ${e.message}`, "error");
        U.toast(file.name + " could not be uploaded: " + e.message, "error");
      }
    }

    if (done) {
      U.toast(done + (done === 1 ? " document" : " documents") + " stored in Supabase.", "success");
      progress("");
      if (openId === paCaseId) openCase(paCaseId);
    }
  }

  async function viewDoc(id) {
    try {
      const url = await window.PA_STORAGE.signedUrl(id);
      const frame = $("paViewer");
      if (frame) {
        frame.src = url;
        frame.style.display = "block";
        const ph = $("paViewerPlaceholder");
        if (ph) ph.style.display = "none";
      }
    } catch (e) {
      U.toast(e.message || "Unable to open document", "error");
    }
  }

  async function downloadDoc(id, name, button) {
    button.disabled = true;
    try {
      const url = await window.PA_STORAGE.signedUrl(id);
      const res = await fetch(url);
      if (!res.ok) throw new Error("Stored file could not be read");
      const blob = await res.blob();
      const objectUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = objectUrl;
      a.download = name || "document.pdf";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(objectUrl), 4000);
    } catch (e) {
      U.toast(e.message || "Download failed", "error");
    } finally {
      button.disabled = false;
    }
  }

  async function removeDoc(id, paCaseId) {
    if (!confirm("Delete this document from storage? This cannot be undone.")) return;
    try {
      await window.PA_STORAGE.remove(id);
      uploads[paCaseId] = (uploads[paCaseId] || []).filter(d => d.id !== id);
      U.toast("Document deleted.", "success");
      if (openId === paCaseId) openCase(paCaseId);
    } catch (e) {
      U.toast(e.message || "Delete failed", "error");
    }
  }

  function wireDocumentControls(c) {
    const zone = $("paDropzone");
    const input = $("paFileInput");

    if (input) {
      input.addEventListener("change", () => {
        uploadFiles(c.id, input.files, { documentType: "Supplemental" });
        input.value = "";
      });
    }

    if (zone) {
      ["dragenter", "dragover"].forEach(ev =>
        zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add("drag"); }));
      ["dragleave", "drop"].forEach(ev =>
        zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove("drag"); }));
      zone.addEventListener("drop", e => {
        if (e.dataTransfer && e.dataTransfer.files.length) {
          uploadFiles(c.id, e.dataTransfer.files, { documentType: "Supplemental" });
        }
      });
    }

    $("paPanel").querySelectorAll(".pa-view").forEach(btn =>
      btn.addEventListener("click", () => viewDoc(btn.dataset.doc)));
    $("paPanel").querySelectorAll(".pa-download").forEach(btn =>
      btn.addEventListener("click", () => downloadDoc(btn.dataset.doc, btn.dataset.name, btn)));
    $("paPanel").querySelectorAll(".pa-remove").forEach(btn =>
      btn.addEventListener("click", () => removeDoc(btn.dataset.doc, c.id)));
  }

  function openCase(id) {
    const c = cases.find(x => x.id === id);
    if (!c) return;
    openId = id;

    /* First open of a case pulls its stored documents, then repaints. */
    if (uploads[c.id] === undefined) {
      uploads[c.id] = [];
      refreshDocs(c.id, true);
    }

    const stored = uploads[c.id] || [];

    /* Nothing is assumed. The panel lists only what genuinely exists in
       Supabase for this case; before anything is uploaded it is empty. */
    const storedHTML = stored.length
      ? stored.map(d => {
          const meta = [
            d.documentKind || "Document",
            d.sizeBytes ? U.fmtBytes(d.sizeBytes) : "",
            d.uploadedBy || "",
            d.uploadedAt ? U.fmtDate(String(d.uploadedAt).slice(0, 10)) : ""
          ].filter(Boolean).join(" \u00b7 ");
          return `<div class="doc-row">
            <div class="doc-icon pdf">${U.ICONS.file}</div>
            <div class="doc-meta">
              <div class="doc-name">${esc(d.fileName)}</div>
              <div class="doc-sub">${esc(meta)}</div>
            </div>
            <div class="doc-actions">
              <button class="btn btn-outline btn-sm pa-view" data-doc="${esc(d.id)}">${U.ICONS.eye} View</button>
              <button class="btn btn-outline btn-sm pa-download" data-doc="${esc(d.id)}" data-name="${esc(d.fileName)}">${U.ICONS.download} Download</button>
              <button class="btn btn-red btn-sm pa-remove" data-doc="${esc(d.id)}">${U.ICONS.trash}</button>
            </div>

    $("paPanel").innerHTML = `

          <div class="case-title">${esc(c.patient)}</div>
          <div class="case-subtitle">${esc(c.payer)} \u00b7 expected demo time ${esc(c.time)}</div>
          <div class="case-header-badges">${badge(c.status)}
            <span class="badge ${c.priority === "High" ? "badge-denied" : "badge-info"}">${esc(c.priority)} priority</span>

        <button class="close-x" id="paClose">${U.ICONS.x}</button>
      </div>

      <div class="case-body">
        <div class="stack">
          <div class="card"><div class="card-head"><div class="card-title">Patient and coverage</div></div>
            <div class="card-body"><div class="info-grid">
              ${U.infoItem("Patient name", c.patient)}
              ${U.infoItem("Date of birth", c.dob)}
              ${U.infoItem("Member ID", c.member, { mono: true })}
              ${U.infoItem("Payer", c.payer)}
            </div></div>
          </div>

          <div class="card"><div class="card-head"><div class="card-title">Clinical and order details</div></div>
            <div class="card-body"><div class="info-grid">
              ${U.infoItem("Procedure", c.procedure + " (CPT " + c.cpt + ")")}
              ${U.infoItem("Diagnosis", c.diagnosis)}
              ${U.infoItem("Referring physician", c.physician)}
              ${U.infoItem("NPI", c.npi, { mono: true })}
              ${U.infoItem("Prior auth required", c.requirement, { full: true })}
            </div></div>
          </div>

          <div class="card">
            <div class="card-head">
              <div class="card-title">Documents</div>
              <div class="card-sub">${stored.length} stored in Supabase</div>
            </div>
            <div class="card-body">
              ${uploadError ? `<div class="ai-reasoning-box" style="background:var(--red-050);border-color:#E9B6B0;border-left-color:var(--red-600);margin-bottom:12px;">
                <b>Document storage unavailable</b><br>${esc(uploadError)}
              </div>` : ""}

              <div id="paStoredDocs">${storedHTML}</div>

              <label class="dropzone" id="paDropzone" style="cursor:pointer;display:block;margin-top:10px;">
                <div>${U.ICONS.download}</div>
                <div style="margin-top:4px;">Click or drop files to upload to this case</div>
                <div style="font-size:10.5px;margin-top:3px;">PDF, image or Word \u00b7 up to 25 MB each \u00b7 stored in the pa-documents bucket</div>
                <input type="file" id="paFileInput" class="hidden" multiple>
              </label>
              <div id="paUploadProgress"></div>

        <div class="stack">

              <div class="pdf-frame" style="height:300px;margin-top:0;">
                <iframe id="paViewer" title="Stored PA document"></iframe>

    $("paOverlay").classList.add("open");
    $("paClose").addEventListener("click", closeCase);
    $("paStart").addEventListener("click", () => startPA(c.id));
    $("paSubmit").addEventListener("click", () => submitPA(c.id));
    $("paValidate").addEventListener("click", () => U.toast("Clinical criteria validation completed", "success"));
