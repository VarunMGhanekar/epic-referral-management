          <div class="analysis-summary" style="padding:12px 0 0;border:0">${c.reasoning}</div>
          <div class="claim-chips">${(c.claimIds||[]).map(id=>`<span class="claim-chip">${id}</span>`).join("") || '<span class="provider-sub">No linked claims</span>'}</div>
        </div>`;

      const panel = `
        <div class="analysis-card">
          <div class="analysis-head">
            <div><h3>${p.name}</h3><div class="analysis-meta">NPI ${p.npi} · ${p.specialty} · ${p.peerGroup} Peer Group</div></div>
            <div class="analysis-score"><span class="pill ${o.band}">${o.band}</span><span class="score">Score ${o.score}</span></div>
          </div>
          <div class="analysis-grid">${mode==="coding" ? codingBox : utilBox}</div>
          <div class="analysis-summary">
            <strong>Overall:</strong> ${o.indicator} · ${o.band} · Score ${o.score}
            ${o.claimIds.length ? `<div class="claim-list">Linked claims: ${o.claimIds.join(", ")}</div>
            <div class="review-flag"><button class="send-mini-btn" data-provider-review="${o.claimIds[0]}">Review ${o.claimIds.length} linked claim${o.claimIds.length===1?"":"s"}</button></div>` : ""}
          </div>
        </div>`;

      target.innerHTML=panel;

      const reviewBtn=target.querySelector("[data-provider-review]");
      if(reviewBtn) reviewBtn.addEventListener("click",e=>openSendModal(e.currentTarget.dataset.providerReview));
    }

    function renderRuleTabs(){
      // R001-R004 remain claim-based and retain the original functional behavior.
      ["R001","R002","R003","R004"].forEach(code=>{
        const claims=DATA.claims.filter(c=>(c.findings||[]).some(f=>f.rule===code));
        const countEl=document.getElementById("count-"+code);
        countEl.textContent=claims.length;
        countEl.classList.toggle("zero",claims.length===0);
        const tbody=document.getElementById("tbody-"+code);
        tbody.innerHTML=claims.length ? claimRowsHtml(claims) : `<tr><td colspan="9"><div class="empty-state">No claims flagged under ${RULE_LABELS[code]} (${code}) in this batch.</div></td></tr>`;
        wireClaimRows(tbody);
      });

      renderProviderUtilization();
      renderCodingDistribution();

      renderStatusTabs();
    }

    function renderStatusTabs() {
      // Auto-cleared claims can be either:
      //   1) untouched claims with persisted disposition = AutoCleared, or
      //   2) claims explicitly reviewed with the AutoClear action.
      const autoCleared = DATA.claims.filter(c =>
        c.reviewAction === "AutoClear" ||
        (!c.reviewAction && c.disposition === "AutoCleared")
      );

      // These action tabs are driven by the persisted review_action value.
      // This is important because update-claim-review intentionally stores
      // disposition = "Reviewed" for completed human actions.
      const sent = DATA.claims.filter(c => c.reviewAction === "Send");
      const rejected = DATA.claims.filter(c => c.reviewAction === "Reject");

      const autoCount = document.getElementById("count-autoCleared");
      autoCount.textContent = autoCleared.length;
      autoCount.classList.toggle("zero", autoCleared.length === 0);
      document.getElementById("tbody-autoCleared").innerHTML = autoCleared.length
        ? claimRowsHtml(autoCleared)
        : `<tr><td colspan="9"><div class="empty-state">No auto-cleared claims.</div></td></tr>`;
      wireClaimRows(document.getElementById("tbody-autoCleared"));

      const sentCount = document.getElementById("count-sent");
      sentCount.textContent = sent.length;
      sentCount.classList.toggle("zero", sent.length === 0);
      document.getElementById("tbody-sent").innerHTML = sent.length
        ? claimRowsHtml(sent)
        : `<tr><td colspan="9"><div class="empty-state">No sent items.</div></td></tr>`;
      wireClaimRows(document.getElementById("tbody-sent"));

      const rejectedCount = document.getElementById("count-rejected");
      rejectedCount.textContent = rejected.length;
      rejectedCount.classList.toggle("zero", rejected.length === 0);
      document.getElementById("tbody-rejected").innerHTML = rejected.length
        ? claimRowsHtml(rejected)
        : `<tr><td colspan="9"><div class="empty-state">No rejected claims.</div></td></tr>`;
      wireClaimRows(document.getElementById("tbody-rejected"));
    }

    /* ---------------- Render: Review ---------------- */
    function renderReview() {
      const REVIEW_RULES = ["R001", "R002", "R003", "R004"];
      const claims = DATA.claims.filter(c =>
          c.disposition === "Pending" &&
          (c.band === "High" || c.band === "Critical") &&
          (c.findings || []).some(f => REVIEW_RULES.includes(f.rule))
        )
        .sort((a,b) => ({Critical:2,High:1,Low:0}[b.band] - ({Critical:2,High:1,Low:0}[a.band])));

      document.getElementById("count-review").textContent = claims.length;
      const tbody = document.getElementById("tbody-review");

      tbody.innerHTML = claims.length ? claims.map(c => `
        <tr class="claim-row review-claim-row" data-claim="${escapeHtml(c.claimId)}">
          <td class="mono" style="font-weight:600;">${escapeHtml(c.claimId)}</td>
          <td>${escapeHtml(c.provider)}</td>
          <td><span class="finding-badge ${escapeHtml(c.band)}">${escapeHtml(c.band)}</span></td>
          <td>${findingsBadgesHtml(c)}</td>
          <td class="mono">${Number(c.totalBilled).toFixed(2)}</td>
          <td>
            <div class="review-actions">
              <button class="send-mini-btn" data-send="${escapeHtml(c.claimId)}">Send →</button>
              <button class="review-action-btn autoclear" data-autoclear="${escapeHtml(c.claimId)}">Auto Clear</button>
              <button class="review-action-btn reject" data-reject="${escapeHtml(c.claimId)}">Reject</button>
            </div>
          </td>
        </tr>
        <tr class="detail-row"><td colspan="6">
          <div class="detail-wrap" id="detail-review-${escapeHtml(c.claimId)}">
            <div class="detail-label">SERVICE LINES</div>
            <table class="mini"><thead><tr><th>CPT</th><th>Modifiers</th><th>Units</th><th>Billed</th></tr></thead>
            <tbody>${(c.lineItems||[]).map(l => `<tr><td class="mono">${escapeHtml(l.cpt || "—")}</td><td class="mono">${(l.modifiers||[]).length?escapeHtml(l.modifiers.join(",")):"—"}</td><td>${escapeHtml(l.units ?? "—")}</td><td class="mono">${Number(l.billed || 0).toFixed(2)}</td></tr>`).join("")}</tbody></table>
            <div class="claim-header-grid">
              <div class="ch-field"><div class="k">Member</div><div class="v">${escapeHtml(c.member || "—")} (${escapeHtml(c.memberId || "—")})</div></div>
              <div class="ch-field"><div class="k">Provider</div><div class="v">${escapeHtml(c.provider || "—")} (${escapeHtml(c.providerNpi || "—")})</div></div>
              <div class="ch-field"><div class="k">Received</div><div class="v">${escapeHtml(c.receivedDate||"—")}</div></div>
              <div class="ch-field"><div class="k">Place of service</div><div class="v">${escapeHtml(c.placeOfService||"—")}</div></div>
              <div class="ch-field"><div class="k">Date of service</div><div class="v">${escapeHtml(c.dateOfService||"—")}</div></div>
              <div class="ch-field"><div class="k">Diagnoses</div><div class="v">${escapeHtml((c.diagnoses||[]).join(", ")||"—")}</div></div>
              <div class="ch-field"><div class="k">Total billed</div><div class="v">${Number(c.totalBilled).toFixed(2)}</div></div>
              <div class="ch-field"><div class="k">Disposition</div><div class="v"><span class="disp-tag ${escapeHtml(c.disposition)}">${escapeHtml(c.disposition)}</span></div></div>
            </div>
            ${findingsDetailHtml(c)}
            ${duplicateComparisonHtml(c)}
            <div class="review-comment-box">
              <div class="detail-label">REVIEW COMMENT</div>
              <textarea class="review-comment-input" data-comment="${escapeHtml(c.claimId)}" placeholder="Add a comment for this claim..."></textarea>
            </div>
            <div class="review-detail-actions">
              <button class="send-mini-btn" data-send-detail="${escapeHtml(c.claimId)}">Send →</button>
              <button class="review-action-btn autoclear" data-autoclear-detail="${escapeHtml(c.claimId)}">Auto Clear</button>
              <button class="review-action-btn reject" data-reject-detail="${escapeHtml(c.claimId)}">Reject</button>
            </div>
          </div>
        </td></tr>`).join("") : `<tr><td colspan="6"><div class="empty-state">No Duplicate, NCCI, High-Dollar, or Data Integrity claims in the High/Critical band awaiting review.</div></td></tr>`;

      // Review rows use their own detail ids, so wire them separately.
      Array.prototype.forEach.call(tbody.querySelectorAll(".review-claim-row"), row => {
        row.addEventListener("click", e => {
          if (e.target.closest("button")) return;
          const id = row.dataset.claim;
          const wrap = document.getElementById("detail-review-" + id);
          if (!wrap) return;
          const isOpen = wrap.classList.contains("open");
          Array.prototype.forEach.call(tbody.querySelectorAll(".detail-wrap"), w => w.classList.remove("open"));
          Array.prototype.forEach.call(tbody.querySelectorAll(".review-claim-row"), r => r.classList.remove("expanded"));
          if (!isOpen) { wrap.classList.add("open"); row.classList.add("expanded"); }
        });
      });

      Array.prototype.forEach.call(tbody.querySelectorAll("[data-send], [data-send-detail]"), btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          openSendModal(btn.dataset.send || btn.dataset.sendDetail);
        });
      });

      Array.prototype.forEach.call(tbody.querySelectorAll("[data-autoclear], [data-autoclear-detail]"), btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          performReviewAction(btn.dataset.autoclear || btn.dataset.autoclearDetail, "AutoClear");
        });
      });

      Array.prototype.forEach.call(tbody.querySelectorAll("[data-reject], [data-reject-detail]"), btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          performReviewAction(btn.dataset.reject || btn.dataset.rejectDetail, "Reject");
        });
      });
    }

    function getReviewComment(claimId) {
      const input = document.querySelector(`[data-comment="${CSS.escape(claimId)}"]`);
      return input ? input.value.trim() : "";
    }

    async function persistReview(claimId, action, comment) {
      const c = claimsById[claimId];
      if (!c) throw new Error(`Claim ${claimId} not found.`);

      const res = await fetch(`${SUPABASE_FUNCTIONS_BASE}/update-claim-review`, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          batchId: DATA.batch.batchId,
          claimId,
          action,
          comment: comment || null,
        }),
      });

      const body = await res.json().catch(() => ({}));
      if (!res.ok || body.success === false) {
        throw new Error(body.error || `HTTP ${res.status}`);
      }

      c.disposition = body.claim?.disposition || "Reviewed";
      c.reviewAction = body.claim?.reviewAction || action;
      c.reviewComment = body.claim?.reviewComment ?? (comment || null);
      c.reviewedAt = body.claim?.reviewedAt || new Date().toISOString();
      return c;
    }

    async function performReviewAction(claimId, action) {
      const comment = getReviewComment(claimId);
      try {
        await persistReview(claimId, action, comment);
        renderAll();
        const label =
          action === "AutoClear" ? "Auto Cleared" :
          action === "Send" ? "Sent" :
          "Rejected";
        const tabLabel =
          action === "AutoClear" ? "Auto Cleared" :
          action === "Send" ? "Sent Items" :
          "Rejected";
        showToast(`<strong>${label}</strong> — ${claimId} moved to the ${tabLabel} tab.`);
      } catch (e) {
        showToast(`<strong>Could not update ${claimId}</strong> — ${escapeHtml(e.message)}`);
      }
    }

    /* ---------------- Send modal ---------------- */
    function openSendModal(claimId) {
      sendTarget = claimsById[claimId];
      if (!sendTarget) return;
      const c = sendTarget;
      document.getElementById("send-title").textContent = c.claimId;
      document.getElementById("send-sub").textContent = `${c.provider} · Band ${c.band}`;
      document.getElementById("send-to").value = "";
      const REVIEW_RULES = ["R001", "R002", "R003", "R004"];
      const primaryFinding = c.findings.find(f => REVIEW_RULES.includes(f.rule)) || c.findings[0] || {};
      document.getElementById("send-subject").value = `[Claims Screening] ${c.claimId} — ${primaryFinding.label || "Review"}`;

      const serviceLinesText = (c.lineItems || []).map(l =>
        `- CPT ${l.cpt || "—"} | Modifiers: ${(l.modifiers||[]).length ? l.modifiers.join(", ") : "—"} | Units: ${l.units ?? "—"} | Billed: ${Number(l.billed || 0).toFixed(2)}`
      ).join("\n") || "- No service lines provided";
      const findingsText = c.findings.map(f => `- [${f.rule}] ${f.label} (${f.severity}): ${f.detail || "no detail provided"}`).join("\n") || "- None";
      const comment = getReviewComment(c.claimId) || c.reviewComment || "";
      const bodyParts = [
        `Batch: ${DATA.batch.batchId}`,
        `Claim: ${c.claimId}`,
        `Member: ${c.member} (${c.memberId})`,
        `Provider: ${c.provider} (${c.providerNpi})`,
        `Date of service: ${c.dateOfService}`,
        `Received date: ${c.receivedDate || "—"}`,
        `Place of service: ${c.placeOfService || "—"}`,
        `Diagnoses: ${(c.diagnoses || []).join(", ") || "—"}`,
        `Total billed: ${Number(c.totalBilled).toFixed(2)}`,
        ``,
        `Service lines:`,
        serviceLinesText,
        ``,
        `Findings:`,
        findingsText,
      ];

      if (c.findings.some(f => f.rule === "R001" && f.duplicateOf)) {
        const dup = c.findings.find(f => f.rule === "R001" && f.duplicateOf);
        const other = claimsById[dup.duplicateOf];
        if (other) {
          bodyParts.push(
            ``,
            `Duplicate comparison:`,
            `Matched claim: ${other.claimId}`,
            `Matched member: ${other.member} (${other.memberId})`,
            `Matched provider: ${other.provider} (${other.providerNpi})`,
            `Matched date of service: ${other.dateOfService}`,
            `Matched received date: ${other.receivedDate || "—"}`,
            `Matched channel: ${other.channel || "—"}`,
            `Matched total billed: ${Number(other.totalBilled).toFixed(2)}`,
            `Matched service lines:`,
            (other.lineItems || []).map(l => `- CPT ${l.cpt || "—"} | Modifiers: ${(l.modifiers||[]).length ? l.modifiers.join(", ") : "—"} | Units: ${l.units ?? "—"} | Billed: ${Number(l.billed || 0).toFixed(2)}`).join("\n") || "- None"
          );
        }
      }

      if (comment) {
        bodyParts.push(``, `Reviewer comment:`, comment);
      }

      bodyParts.push(``, `— sent from Claims Dashboard`);
      document.getElementById("send-body").value = bodyParts.join("\n");
      openOverlay("send-overlay");
    }
    document.getElementById("send-close").addEventListener("click", () => closeOverlay("send-overlay"));
    document.getElementById("send-overlay").addEventListener("click", (e) => { if (e.target.id === "send-overlay") closeOverlay("send-overlay"); });

    document.getElementById("send-confirm-btn").addEventListener("click", async () => {
      if (!sendTarget) return;
      const claimId = sendTarget.claimId;
      const to = document.getElementById("send-to").value.trim();
      const subject = document.getElementById("send-subject").value;
      const body = document.getElementById("send-body").value;
      const comment = getReviewComment(claimId) || sendTarget.reviewComment || "";

      if (!to) {
        showToast("<strong>Recipient required</strong> — enter an email address first.");
        return;
      }

      try {
        await persistReview(claimId, "Send", comment);
        window.location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        sentLog[claimId] = true;
        closeOverlay("send-overlay");
        renderAll();
        showToast(`<strong>Email opened</strong> — ${claimId} moved to Sent Items.`);
      } catch (e) {
        showToast(`<strong>Could not update ${claimId}</strong> — ${escapeHtml(e.message)}`);
      }
    });

    let toastTimer = null;
    function showToast(html) {
      const toast = document.getElementById("toast");
      toast.innerHTML = html; toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 4200);
    }

    function renderAll() { renderOverview(); renderClaims(); renderRuleTabs(); renderReview(); }

    /* ---------------- Init ---------------- */
    /* Two ways to auto-load on page open, checked in this order:
       1. ?batchId=X — fetches from THIS file's own baked-in Supabase project.
          This is the one to actually use once hosted: share a link like
          dashboard.html?batchId=BATCH-2026-0908-001 and it just works, no
          clicking anything.
       2. ?data=<url> — generic, fetches whatever JSON URL you point it at
          (any backend, not just this Supabase project). Kept for flexibility.

       If neither is present, or the fetch fails, this shows an explicit
       EMPTY state — NOT sample data. Silently substituting fake data on
       error is actively misleading: it looks like a real (if boring) batch
       instead of "nothing loaded." If you want to see the built-in demo
       content, use "Reset to sample data" in the Load Data modal — that's
       a deliberate action, not something that happens behind your back. */
    (function init() {
      if (typeof URLSearchParams === "undefined") {
        applyData(JSON.parse(JSON.stringify(EMPTY_DATA)));
        return;
      }
      const params = new URLSearchParams(window.location.search);
      const batchId = params.get("batchId");
      const dataUrl = params.get("data");

      if (batchId) {
        fetch(`${SUPABASE_FUNCTIONS_BASE}/get-batch?batchId=${encodeURIComponent(batchId)}`, {
          headers: { "Authorization": `Bearer ${SUPABASE_ANON_KEY}` },
        })
          .then(res => res.json().then(body => { if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`); return body; }))
          .then(obj => {
            const err = validateBatch(obj);
            if (err) throw new Error(err);
            applyData(obj);
            showToast(`<strong>Loaded from Supabase</strong> — ${obj.batch.batchId} (${obj.claims.length} claims).`);
          })
          .catch(e => {
            applyData(JSON.parse(JSON.stringify(EMPTY_DATA)));
            showToast(`<strong>Could not load batch "${batchId}"</strong> — ${e.message}`);
          });
        return;
      }

      if (dataUrl) {
        fetch(dataUrl)
          .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); })
          .then(obj => {
            const err = validateBatch(obj);
            if (err) throw new Error(err);
            applyData(obj);
            showToast(`<strong>Loaded from URL</strong> — ${obj.batch ? obj.batch.batchId : "batch"} (${obj.claims.length} claims).`);
          })
          .catch(e => {
            applyData(JSON.parse(JSON.stringify(EMPTY_DATA)));
            showToast(`<strong>Could not load ?data= URL</strong> — ${e.message}`);
          });
        return;
      }

      applyData(JSON.parse(JSON.stringify(EMPTY_DATA)));
    })();

  }

  /* ---------------- Module contract ---------------- */

  window.EHR_MODULES.claims = {
    mount(container) {
      container.innerHTML = U.pageHead({
        module: "Claims",
        title: "Claims Anomaly Review",
        sub: "Batch claim screening, findings review and disposition"
      }) + `
        <div class="module-body">
          <div class="claims-app" id="claimsApp">${MARKUP}</div>
        </div>`;

      bootClaims();
    }
  };
})();


/* ===== js/app.js ===== */
/* =========================================================
   EHR PORTAL — SHELL + ROUTER
   Gates on sign-in, renders the Hyperspace chrome once, then
   hands a clean canvas to whichever module the route points at.
   Modules register on window.EHR_MODULES and are mounted lazily.
   ========================================================= */

window.EHR_MODULES = window.EHR_MODULES || {};

(function () {
  "use strict";

  const I = window.EHR.ICONS;
  const esc = window.EHR.esc;
  const mounted = {};
  let current = null;

  /* Workspace tabs sit above the activity rail, as in Hyperspace. */
  const WORKSPACES = [
    { id: "dashboard", label: "Home", icon: "dashboard" },
    { id: "referrals", label: "Referrals", icon: "referral" },
    { id: "priorauth", label: "Prior Auth", icon: "queue" },
    { id: "payer", label: "Payer Review", icon: "payer" },
    { id: "providers", label: "Provider", icon: "patients" },
    { id: "caregap", label: "Care Gap", icon: "criteria" },
    { id: "pocsource", label: "POC Source", icon: "file" },
    { id: "sig", label: "SIG Processing", icon: "bolt" },
    { id: "protocol", label: "Protocol Validation", icon: "criteria" },
  ];

  function shellHTML(user) {
    return `
      <div class="topbar">
        <div class="brand">
          <div class="brand-mark">E</div>
          <div class="brand-name">EPIC</div>
          <div class="brand-sub">Clinical Operations</div>
        </div>
        <div class="env-chip">DEMO</div>
        <div class="topbar-spacer"></div>
        <button class="topbar-icon-btn" title="Search">${I.search}</button>
        <button class="topbar-icon-btn" title="Notifications" style="position:relative;">
          ${I.bell}
          <span style="position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--amber-500);"></span>
        </button>
        <div class="topbar-user">
          <div class="avatar" id="userAvatar">${esc(user.initials)}</div>
          <div class="user-meta">
            <div class="user-name" id="userName">${esc(user.name)}</div>
            <div class="user-role" id="userRole">${esc(user.role)} · ${esc(user.dept)}</div>
          </div>
          <button class="signout" id="signOutBtn">Sign out</button>
        </div>
      </div>

      <div class="workspacebar" id="workspacebar">
        ${WORKSPACES.map(w => `
          <button class="ws-tab" data-nav="${w.id}">${I[w.icon] || ""}<span>${esc(w.label)}</span></button>
        `).join("")}
      </div>

      <div class="shell">
        <nav class="sidebar" id="sidebar" aria-label="Activities"></nav>
        <main class="main" id="moduleHost"></main>
      </div>

      <div class="statusbar">
        <span>Signed in as <b id="sbUser">${esc(user.name)}</b></span>
        <span class="sb-sep"></span>
        <span>${esc(user.role)}</span>
        <span class="sb-sep"></span>
        <span>Session started <b>${new Date().toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" })}</b></span>
        <div style="flex:1"></div>
        <span id="sbContext">Ready</span>
      </div>`;
  }

  function routeId() {
    const id = (location.hash || "").replace(/^#\/?/, "").split("/")[0];
    return id || "dashboard";
  }

  function paint(activeId) {
    document.getElementById("sidebar").innerHTML = window.EHR_NAV_RENDER(activeId);
    document.querySelectorAll("#workspacebar .ws-tab").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.nav === activeId);
    });
    document.querySelectorAll("[data-nav]").forEach(btn => {
      if (btn.dataset.wired) return;
      btn.dataset.wired = "1";
      btn.addEventListener("click", () => { location.hash = "#/" + btn.dataset.nav; });
    });
    /* Sidebar is re-rendered each route, so rewire it every time. */
    document.querySelectorAll("#sidebar [data-nav]").forEach(btn => {
      btn.addEventListener("click", () => { location.hash = "#/" + btn.dataset.nav; });
    });
  }

  function setContext(text) {
    const el = document.getElementById("sbContext");
    if (el) el.textContent = text;
  }

  function placeholder(host, id) {
    const label = (window.EHR_NAV.flatMap(g => g.items).find(i => i.id === id) || {}).label || id;
    host.innerHTML = `
      <div class="activity-head">
        ${window.EHR.pageHead({ module: label, title: label, sub: "Reserved in the portal. No backend wired up yet." })}
      </div>
      <div class="module-body">
        <div class="card"><div class="card-body">
          ${window.EHR.emptyState(
            "Activity not connected",
            "The shell, theme and navigation slot are ready. Add the module file under /pages and register it in navigation.js to bring it online."
          )}
        </div></div>
      </div>`;
  }

  function mount(id) {
    const host = document.getElementById("moduleHost");
    if (current && mounted[current] && typeof mounted[current].unmount === "function") {
      mounted[current].unmount();
    }
    host.innerHTML = "";
    window.scrollTo({ top: 0 });

    const mod = window.EHR_MODULES[id];
    if (!mod) { placeholder(host, id); current = id; setContext("Activity not connected"); return; }

    mounted[id] = mod;
    current = id;
    try {
      mod.mount(host);
      setContext("Ready");
    } catch (err) {
      console.error("[EHR] module failed to mount:", id, err);
      host.innerHTML = `<div class="module-body">${window.EHR.emptyState(
        "This activity could not load", "Check the browser console for details."
      )}</div>`;
      setContext("Load error");
    }
  }

  function go() {
    const id = routeId();
    paint(id);
    mount(id);
  }

  window.EHR_SET_CONTEXT = setContext;

  document.addEventListener("DOMContentLoaded", () => {
    window.EHR_SESSION.require((user) => {
      document.getElementById("app").innerHTML = shellHTML(user);
      document.getElementById("signOutBtn").addEventListener("click", () => {
        if (confirm("Sign out of the EHR workspace?")) window.EHR_SESSION.signOut();
      });
      window.addEventListener("hashchange", go);
      if (!location.hash) location.hash = "#/dashboard";
      go();
      window.EHR.toast("Welcome, " + user.name.replace(/,.*$/, "") + ".", "success");
    });
  });
})();

</script>
</body>
</html>
