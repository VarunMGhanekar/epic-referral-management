    settings: `<svg ${s}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.5.6.9 1.11 1H21a2 2 0 1 1 0 4h-.09c-.51.1-.97.5-1.11 1z"/></svg>`,
    bell: `<svg ${s}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>`,
    search: `<svg ${s}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>`,
    plus: `<svg ${s}><path d="M12 5v14M5 12h14"/></svg>`,
    refresh: `<svg ${s}><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>`,
    check: `<svg ${s}><path d="M20 6 9 17l-5-5"/></svg>`,
    x: `<svg ${s}><path d="M18 6 6 18M6 6l12 12"/></svg>`,
    warn: `<svg ${s}><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>`,
    bolt: `<svg ${s}><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>`,
    download: `<svg ${s}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>`,
    eye: `<svg ${s}><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>`,
    trash: `<svg ${s}><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>`,
    edit: `<svg ${s}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>`,
  };

  /* ---------------- Escaping + formatting ---------------- */
  const clean = (v) => (v === null || v === undefined ? "" : String(v).trim());

  function esc(v) {
    return clean(v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  function initials(name) {
    const parts = clean(name).split(/\s+/).filter(Boolean);
    if (!parts.length) return "--";
    return (parts[0][0] + (parts[parts.length - 1][0] || "")).toUpperCase();
  }

  /* Date-only values stay date-only. No timezone conversion, ever —
     a YYYY-MM-DD from the database must display as that same day. */
  function fmtDate(value) {
    const raw = clean(value);
    if (!raw) return "";
    const dateOnly = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (dateOnly) {
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      return `${months[Number(dateOnly[2]) - 1]} ${Number(dateOnly[3])}, ${dateOnly[1]}`;
    }
    return raw;
  }

  function nowStamp() {
    const d = new Date();
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) +
      " " + d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
  }

  function fmtBytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
    return (n / 1024 / 1024).toFixed(1) + " MB";
  }

  function uid(prefix) {
    return prefix + "-" + Math.random().toString(36).slice(2, 8).toUpperCase();
  }

  function randDigits(n) {
    let out = "";
    for (let i = 0; i < n; i++) out += Math.floor(Math.random() * 10);
    return out;
  }

  /* ---------------- Toasts (one implementation, portal-wide) ---------------- */
  function toast(message, type) {
    const region = document.getElementById("toastRegion");
    if (!region) return;
    const el = document.createElement("div");
    el.className = "toast" + (type ? " " + type : "");
    el.innerHTML = (type === "success" ? ICONS.check : type === "error" ? ICONS.warn : "") +
      "<span>" + esc(message) + "</span>";
    region.appendChild(el);
    setTimeout(() => {
      el.style.opacity = "0";
      el.style.transform = "translateX(20px)";
      el.style.transition = "all .25s";
      setTimeout(() => el.remove(), 260);
    }, 3200);
  }

  /* ---------------- Shared markup builders ---------------- */
  /* The Epic activity header band: breadcrumb, title, toolbar.
     Modules follow this with <div class="module-body"> for content. */
  function pageHead(opts) {
    return `
      <div class="activity-head">
        <div class="crumbs">EPIC <b>\u203a</b> ${esc(opts.module || "")}${opts.crumb ? " <b>\u203a</b> " + esc(opts.crumb) : ""}</div>
        <div class="page-head">
          <div>
            <div class="page-title">${esc(opts.title)}</div>
            <div class="page-sub">${opts.subHtml || esc(opts.sub || "")}</div>
          </div>
          <div class="page-actions">${opts.actions || ""}</div>
        </div>
      </div>`;
  }

  function kpi(label, value, tone, delta) {
    return `<div class="kpi-card ${tone || ""}">
      <div class="kpi-label">${esc(label)}</div>
      <div class="kpi-value">${esc(value)}</div>
      ${delta ? `<div class="kpi-delta neutral">${esc(delta)}</div>` : ""}
    </div>`;
  }

  function infoItem(label, value, opts) {
    opts = opts || {};
    if (!clean(value) && !opts.showEmpty) return "";
    return `<div class="info-item ${opts.full ? "full" : ""}">
      <div class="info-item-label">${esc(label)}</div>
      <div class="info-item-value ${opts.mono ? "mono" : ""} ${opts.body ? "body" : ""}">${esc(value) || "—"}</div>
    </div>`;
  }

  function sectionLabel(text) {
    return `<div class="section-label">${esc(text)}<span class="line"></span></div>`;
  }

  function emptyState(title, hint) {
    return `<div class="empty-state"><strong>${esc(title)}</strong>${esc(hint || "")}</div>`;
  }

  return {
    ICONS, esc, clean, initials, fmtDate, nowStamp, fmtBytes, uid, randDigits,
    toast, pageHead, kpi, infoItem, sectionLabel, emptyState,
  };
})();


/* ===== js/session.js ===== */
/* =========================================================
   EHR PORTAL — SESSION
   A sign-in gate so the portal shows who is charting. The name
   entered here drives the identity bar, the status bar, and any
   module that stamps a user onto a record.

   This is presentation-layer identity for a demo. It is not
   authentication and grants no access control.
   ========================================================= */

window.EHR_SESSION = (function () {
  "use strict";

  const KEY = "ehr.session";
  let user = null;                 // { name, role, initials }
  const listeners = [];

  const ROLES = [
    "Physician",
    "Registered Nurse",
    "Medical Case Manager",
    "Referral Coordinator",
    "Prior Authorization Specialist",
    "Utilization Review Nurse",
    "Administrator",
  ];

  /* sessionStorage is unavailable in some sandboxed previews, so every
     access is guarded and the session simply falls back to memory. */
  function readStored() {
    try {
      const raw = window.sessionStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function writeStored(value) {
    try {
      if (value) window.sessionStorage.setItem(KEY, JSON.stringify(value));
      else window.sessionStorage.removeItem(KEY);
    } catch (e) { /* memory-only session */ }
  }

  function initials(name) {
    const parts = String(name || "").trim().split(/\s+/)
      .filter(p => !/^(dr|dr\.|mr|mr\.|mrs|mrs\.|ms|ms\.)$/i.test(p));
    if (!parts.length) return "--";
    return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
  }

  function loginScreen() {
    return `
      <div class="login-screen" id="loginScreen">
        <div class="login-card">
          <div class="login-head">
            <div class="login-logo">
              <div class="login-mark">E</div>
              <div>
                <div class="login-title">EPIC</div>
                <div class="login-sub">Clinical Operations</div>
              </div>
            </div>
            <div class="login-sub">Enter your name to open the workspace. Your name appears on every activity you touch.</div>
          </div>

          <div class="login-body">
            <div class="form-field">
              <label for="loginName">Full name</label>
              <input id="loginName" placeholder="e.g. Dr. Lisa Chen, MD" autocomplete="name" autofocus>
            </div>
            <div class="form-field">
              <label for="loginRole">Role</label>
              <select id="loginRole">
                ${ROLES.map(r => `<option${r === "Medical Case Manager" ? " selected" : ""}>${r}</option>`).join("")}
              </select>
            </div>
            <div class="form-field">
              <label for="loginDept">Department</label>
              <input id="loginDept" value="Clinical Operations">
            </div>
            <div id="loginError" style="display:none;color:var(--red-600);font-size:11px;font-weight:600;margin-bottom:10px;"></div>
            <button class="btn btn-teal btn-block" id="loginBtn" style="padding:7px 12px;font-size:12.5px;">Open workspace</button>
          </div>

          <div class="login-foot">
            Demo environment. This screen sets the display identity for the session only — it is not authentication and does not control access to data.
          </div>
        </div>
      </div>`;
  }

  function showLogin(onDone) {
    const wrap = document.createElement("div");
    wrap.innerHTML = loginScreen();
    document.body.appendChild(wrap.firstElementChild);

    const nameEl = document.getElementById("loginName");
    const errEl = document.getElementById("loginError");

    function submit() {
      const name = nameEl.value.trim();
      if (name.length < 2) {
        errEl.textContent = "Enter the name that should appear on your activities.";
        errEl.style.display = "block";
        nameEl.focus();
        return;
      }
      user = {
        name,
        role: document.getElementById("loginRole").value,
        dept: document.getElementById("loginDept").value.trim() || "Clinical Operations",
        initials: initials(name),
        since: new Date(),
      };
      writeStored(user);
      const screen = document.getElementById("loginScreen");
      if (screen) screen.remove();
      onDone(user);
    }

    document.getElementById("loginBtn").addEventListener("click", submit);
    document.getElementById("loginScreen").addEventListener("keydown", (e) => {
      if (e.key === "Enter") submit();
    });
    nameEl.focus();
  }

  return {
    ROLES,
    /* Resolves with the signed-in user, prompting only when needed. */
    require(onDone) {
      const stored = readStored();
      if (stored && stored.name) {
        user = stored;
        user.initials = user.initials || initials(user.name);
        onDone(user);
        return;
      }
      showLogin(onDone);
    },
    get() { return user; },
    signOut() {
      user = null;
      writeStored(null);
      location.reload();
    },
    onChange(fn) { listeners.push(fn); },
  };
})();

/* ===== pages/patients/patients.js ===== */
/* =========================================================
   MODULE — PATIENT LOOKUP
   A cross-module patient index. It reads what the other modules
   already have loaded rather than introducing a query of its own,
   so it needs no new table, endpoint or Edge Function.

   Referral patients come from the live Supabase read the Referral
   module performs; PA and payer patients come from their case data.
   ========================================================= */

(function () {
  "use strict";

  const U = window.EHR;
  const $ = (id) => document.getElementById(id);
  const esc = U.esc;

  const SOURCES = {
    referral: { label: "Referrals", cls: "badge-teal", route: "referrals" },
    pa: { label: "Prior Auth", cls: "badge-review", route: "priorauth" },
    payer: { label: "Payer Review", cls: "badge-info", route: "payer" },
  };

  let people = [];

  /* Same person can appear in several modules. Match on MRN or member
     id where we have one, otherwise on name + date of birth. */
  function keyFor(p) {
    const id = U.clean(p.mrn || p.memberId).toUpperCase();
    if (id) return "ID:" + id;
    return "ND:" + U.clean(p.name).toLowerCase() + "|" + U.clean(p.dob);
  }

  function merge(list) {
    const map = new Map();
    for (const p of list) {
      if (!U.clean(p.name)) continue;
      const k = keyFor(p);
      const existing = map.get(k);
      if (!existing) {
        map.set(k, Object.assign({ sources: {}, records: [] }, p));
        map.get(k).sources[p.source] = true;
        map.get(k).records.push(p);
      } else {
        existing.sources[p.source] = true;
        existing.records.push(p);
        existing.mrn = existing.mrn || p.mrn;
        existing.memberId = existing.memberId || p.memberId;
        existing.dob = existing.dob || p.dob;
        existing.payer = existing.payer || p.payer;
      }
    }
    return Array.from(map.values())
      .sort((a, b) => U.clean(a.name).localeCompare(U.clean(b.name)));
  }

  /* ---------- Collectors, one per module ---------- */

  function fromReferrals() {
    const rows = (window.REFERRAL_PATIENTS && window.REFERRAL_PATIENTS()) || [];
    return rows.map(r => ({
      source: "referral",
      name: r.name,
      dob: r.dob,
      mrn: r.mrn,
      detail: r.type ? r.type + " referral" : "Referral",
      status: r.status,
      ref: r.referralId,
    }));
  }

  function fromPriorAuth() {
    const cases = (window.PRIORAUTH_CASES_LIVE && window.PRIORAUTH_CASES_LIVE()) || window.PRIORAUTH_CASES || [];
    return cases.map(c => ({
      source: "pa",
      name: c.patient,
      dob: c.dob,
      memberId: c.member,
      payer: c.payer,
      detail: c.procedure ? c.procedure + " (CPT " + c.cpt + ")" : "Prior authorization",
      status: c.status,
      ref: c.id,
    }));
  }

  function fromPayer() {
    const cases = (window.PAYER_CASES && window.PAYER_CASES()) || [];
    return cases.map(c => ({
      source: "payer",
      name: c.patientName,
      dob: c.dob,
      memberId: c.memberId,
      payer: c.payer,
      detail: c.procedure || "Payer review",
      status: c.status,
      ref: c.id,
    }));
  }

  function collect() {
    return merge([].concat(fromReferrals(), fromPriorAuth(), fromPayer()));
  }

  /* ---------- Rendering ---------- */

  function sourcePills(p) {
    return Object.keys(p.sources)
      .map(s => `<span class="badge ${SOURCES[s].cls}">${esc(SOURCES[s].label)}</span>`)
      .join(" ");
  }

  function shell() {
    return U.pageHead({
      module: "Patient Lookup",
      title: "Patient Lookup",
      sub: "Every patient known to the portal, drawn from all active areas",
      actions: `<button class="btn btn-outline btn-sm" id="plRefresh">${U.ICONS.refresh} Refresh</button>`
    }) + `
      <div class="module-body">
        <div class="kpi-row" id="plKpi"></div>

        <div class="filter-bar">
          <div class="search-box">${U.ICONS.search}
            <input id="plSearch" placeholder="Search name, MRN, member ID…">
          </div>
          <select class="field-select" id="plSource">
            <option value="">All areas</option>
            <option value="referral">Referrals</option>
            <option value="pa">Prior Auth</option>

    mount(container) {
      container.innerHTML = shell();
      people = collect();

      ["plSearch", "plSource"].forEach(id => {
        $(id).addEventListener("input", render);
        $(id).addEventListener("change", render);
      });

        const again = collect();
        if (again.length !== people.length) { people = again; render(); }
      }, 1800);
    }
  };
})();

/* =========================================================
   REFERRAL MANAGEMENT — DOCUMENT STORAGE CLIENT
   Adds upload and download to the referral module without
   changing anything that already worked. The Supabase project
   and key are the same values the referral portal has always
   used; only new endpoints are introduced.
   ========================================================= */

window.REFERRAL_STORAGE = (function () {
  "use strict";

  /* ---------- MODULE CONFIG — Referral Management ---------- */
  const SUPABASE_URL = "https://wysnjsnbraiwopolgxgv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_rUdw6p2HW394IjHoMexMXw_GhEYimpQ";

  const FUNCTIONS_BASE = SUPABASE_URL + "/functions/v1";
  const FUNCTIONS = {
    upload: FUNCTIONS_BASE + "/document-upload2o",
    documentUrl: FUNCTIONS_BASE + "/document-url2o"
  };

  const MODULE = "referral";
  const BUCKET = "referral-documents";
  /* --------------------------------------------------------- */

  function headers(extra) {
    return Object.assign({
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY
    }, extra || {});
  }

  function who() {
    const u = window.EHR_SESSION && window.EHR_SESSION.get();
    return u ? u.name : "";
  }

  /*
   * Upload against a referral. referralRowId must be the referral_s
   * row uuid, not the business REF-... id, because document_s.referral_id
   * is a uuid foreign key. patientRowId is optional but fills in
   * document_s.patient_id when we know it.
   */
  async function upload(referralRowId, file, opts) {
    opts = opts || {};
    const form = new FormData();
    form.append("module", MODULE);
    form.append("file", file);
    form.append("caseId", referralRowId);
    if (opts.patientId) form.append("patientId", opts.patientId);
    if (opts.documentType) form.append("documentType", opts.documentType);
    form.append("uploadedBy", who());

    const r = await fetch(FUNCTIONS.upload, {
      method: "POST",
      headers: headers(),          // no Content-Type: the browser sets the boundary
      body: form
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || "Upload failed");
    }
    return body.document;
  }

  /* Signed URL, used for both the viewer and the download link. */
  async function signedUrl(id) {
    const r = await fetch(
      FUNCTIONS.documentUrl + "?module=" + MODULE + "&id=" + encodeURIComponent(id),
      { headers: headers() }
    );
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.url) {
      throw new Error(body.error || body.message || "Unable to open document");
    }
    return body.url;
  }

  /* Removes the stored file and the document_s row together, which the
     old direct REST delete could not do — it left the file orphaned. */
  async function remove(id) {
    const r = await fetch(
      FUNCTIONS.documentUrl + "?module=" + MODULE + "&id=" + encodeURIComponent(id),
      { method: "DELETE", headers: headers() }
    );
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || "Delete failed");
    }
    return true;
  }

  /* Pull a document into memory and hand the browser a save dialog. */
  async function download(id, fileName) {
    const url = await signedUrl(id);
    const res = await fetch(url);
    if (!res.ok) throw new Error("Stored file could not be read");
    const blob = await res.blob();
    const objectUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = objectUrl;
    a.download = fileName || "document.pdf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(objectUrl), 4000);
  }

  return {
    upload, signedUrl, remove, download,
    config: { SUPABASE_URL, FUNCTIONS, MODULE, BUCKET }
  };
})();

  async function supabaseSelect(table) {
    const url = SUPABASE_URL + "/rest/v1/" + table + "?select=*";
    const r = await fetch(url, { headers: headers() });
    const body = await r.json().catch(() => []);
    if (!r.ok) throw new Error(body && body.message ? body.message : "Unable to read " + table);
    return Array.isArray(body) ? body : [];
  }

  async function supabaseUpdate(table, id, payload) {
    const url = SUPABASE_URL + "/rest/v1/" + table + "?id=eq." + encodeURIComponent(id);
    const r = await fetch(url, {
      method: "PATCH",
      headers: headers({ "Prefer": "return=representation" }),
      body: JSON.stringify(payload)
    });
    const body = await r.json().catch(() => []);
    if (!r.ok) throw new Error(body && (body.message || body.error) ? (body.message || body.error) : "Unable to update " + table);

    return body;

  function first(obj, keys) {
    for (const k of keys) {
      if (obj && obj[k] !== undefined && obj[k] !== null && clean(obj[k]) !== "") return obj[k];
    }
    return "";
  }

  function normalize() {
    return referrals.map((r, index) => {
      const patientId = first(r, ["patient_id", "patientId"]);

  function isToday(value) {
    const raw = clean(value);

    const dt = new Date(raw);
    if (Number.isNaN(dt.getTime())) {
      const m = raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
      if (!m) return false;
      const a = Number(m[1]), b = Number(m[2]), y = Number(m[3]);
      const localToday = new Date();
      return (a === localToday.getMonth() + 1 && b === localToday.getDate() && y === localToday.getFullYear()) ||
             (b === localToday.getMonth() + 1 && a === localToday.getDate() && y === localToday.getFullYear());

    const now = new Date();
    return dt.getFullYear() === now.getFullYear() &&

  /* ---------------- Document upload / download ----------------
     Uploads go through document-upload2o with module=referral, which
     writes the file into referral-documents and the row into
     document_s. The Maestro ingest path is unaffected. */

  function uploadNote(text, tone) {
    const el = $("refUploadNote");
    if (!el) return;
    el.innerHTML = text
      ? `<div class="empty-hint" style="color:${tone === "error" ? "var(--red-600)" : "var(--ink-500)"}">${esc(text)}</div>`
      : "";
  }

  async function uploadReferralFiles(r, files) {
    const list = Array.from(files || []);
    if (!list.length || !r) return;

    /* document_s.referral_id is a uuid, so we must send the referral_s
       row id rather than the business REF-... identifier. */
    const referralRowId = r.rowId;
    const patientId = first(r.patient, ["id"]) || "";

    let done = 0;
    for (let i = 0; i < list.length; i++) {
      const file = list[i];
      uploadNote(`Uploading ${file.name} (${i + 1} of ${list.length})\u2026`);
      try {
        await window.REFERRAL_STORAGE.upload(referralRowId, file, {
          patientId: patientId,
          documentType: r.documentType || "Referral Document"
        });
        done++;
      } catch (e) {
        uploadNote(`${file.name} failed: ${e.message}`, "error");
        toast(file.name + " could not be uploaded: " + e.message, true);
      }
    }

    if (done) {
      uploadNote("");
      toast(done + (done === 1 ? " document" : " documents") + " attached to the referral.");
      await loadData();
      const fresh = normalize().find(x => String(x.rowId) === String(referralRowId));
      if (fresh) showDetail(fresh);
    }
  }

  function wireReferralUpload(r) {
    const zone = $("refDropzone");
    const input = $("refFileInput");

    if (input) {
      input.addEventListener("change", () => {
        uploadReferralFiles(r, input.files);
        input.value = "";
      });
    }

    if (zone) {
      ["dragenter", "dragover"].forEach(ev =>
        zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add("drag"); }));
      ["dragleave", "drop"].forEach(ev =>
        zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove("drag"); }));
      zone.addEventListener("drop", e => {
        if (e.dataTransfer && e.dataTransfer.files.length) {
          uploadReferralFiles(r, e.dataTransfer.files);
        }
      });
    }
  }

  async function downloadDocument(id, name, button) {
    button.disabled = true;
    try {
      await window.REFERRAL_STORAGE.download(id, name);
    } catch (e) {
      toast(e.message || "Unable to download document", true);
    } finally {
      button.disabled = false;
    }
  }

  async function viewDocument(id, button) {
    button.disabled = true;
    try {
      const r = await fetch(FUNCTIONS.documentUrl + "?id=" + encodeURIComponent(id), { headers: headers() });
      const body = await r.json().catch(() => ({}));
      if (!r.ok || !body.url) throw new Error(body.error || body.message || "Unable to retrieve document");
      $("pdfViewer").src = body.url;
      $("pdfViewer").style.display = "block";
      $("pdfPlaceholder").style.display = "none";
    } catch (e) { toast(e.message || "Unable to open document", true); }
    finally { button.disabled = false; }
  }

  function editInput(label, key, value, full, type) {
    const control = type === "textarea"
      ? `<textarea data-key="${esc(key)}">${esc(value)}</textarea>`
      : `<input data-key="${esc(key)}" value="${esc(value)}">`;
    return `<div class="form-field ${full ? "full" : ""}"><label>${esc(label)}</label>${control}</div>`;
  }

  function openEdit(r) {
    if (!r) return;
    editing = r;
    $("editGrid").innerHTML = [
      editInput("Patient name", "patient_name", r.name),
      editInput("DOB", "dob", r.dob),
      editInput("MRN", "mrn", r.mrn),
      editInput("Document type", "document_type", r.documentType),
      editInput("Specialty", "referral_type", r.type),
      editInput("Referral date", "referral_date", r.date),
      editInput("Referring provider", "referring_provider", r.provider),
      editInput("Provider NPI", "provider_npi", r.providerNPI),
      editInput("Receiving provider", "receiving_provider", r.receivingProvider),
      editInput("Urgency", "urgency", r.urgency),
      editInput("Diagnosis", "diagnosis", r.diagnosis),
      editInput("ICD-10", "icd10", r.icd10),
      editInput("CPT / procedure code", "procedure_code", r.cptCode),
      editInput("Requested service", "requested_service", r.requestedService),
      editInput("Requested procedure", "requested_procedure", r.requestedProcedure),
      editInput("Epic record created date", "epic_record_created_date", r.epicRecordCreatedDate),
      editInput("Reason for referral", "reason_for_referral", r.reason, true, "textarea"),
      editInput("Chief complaint", "chief_complaint", r.chiefComplaint, true, "textarea"),
      editInput("Clinical summary", "clinical_summary", r.clinicalSummary, true, "textarea"),
      editInput("Agent summary", "agent_summary", r.agentSummary, true, "textarea")
    ].join("");
    const who = window.EHR_SESSION && window.EHR_SESSION.get();
    $("editByLine").textContent = "Writes back to referral_s and patient_s"
      + (who ? " · editing as " + who.name : "");
    $("editBackdrop").classList.add("open");
  }

  function renderEditDocs(r) {
    const el = $("editDocList");
    if (!el) return;
    const docs = (r && r.docs) || [];
    el.innerHTML = docs.length
      ? docs.map(d => {
          const id = getDocId(d);
          const name = first(d, ["file_name", "fileName", "name"]) || "Document";
          return `<div class="doc-row">
            <div class="doc-icon pdf">${U.ICONS.file}</div>
            <div class="doc-meta"><div class="doc-name">${esc(name)}</div>
              <div class="doc-sub">${esc(first(d, ["document_type", "documentType"]) || "Document")}</div></div>
            <div class="doc-actions">
              ${id ? `<button class="btn btn-outline btn-sm edit-dl" data-id="${esc(id)}" data-name="${esc(name)}">${U.ICONS.download}</button>` : ""}
            </div>
          </div>`;
        }).join("")
      : `<div class="empty-hint">No documents attached yet.</div>`;

    el.querySelectorAll(".edit-dl").forEach(b =>
      b.addEventListener("click", () => downloadDocument(b.dataset.id, b.dataset.name, b)));
  }

  function wireEditUpload(r) {
    const zone = $("editDropzone");
    const input = $("editFileInput");
    const note = $("editUploadNote");

    async function send(files) {
      const list = Array.from(files || []);
      if (!list.length) return;
      const referralRowId = r.rowId;
      const patientId = first(r.patient, ["id"]) || "";
      let done = 0;

      for (let i = 0; i < list.length; i++) {
        const file = list[i];
        if (note) note.innerHTML = `<div class="empty-hint">Uploading ${esc(file.name)} (${i + 1} of ${list.length})\u2026</div>`;
        try {
          await window.REFERRAL_STORAGE.upload(referralRowId, file, {
            patientId: patientId,
            documentType: r.documentType || "Referral Document"
          });
          done++;
        } catch (e) {
          if (note) note.innerHTML = `<div class="empty-hint" style="color:var(--red-600)">${esc(file.name)} failed: ${esc(e.message)}</div>`;
          toast(file.name + " could not be uploaded: " + e.message, true);
        }
      }

      if (done) {
        if (note) note.innerHTML = "";
        toast(done + (done === 1 ? " document" : " documents") + " attached.");
        await loadData();
        const fresh = normalize().find(x => String(x.rowId) === String(referralRowId));
        if (fresh) { editing = fresh; renderEditDocs(fresh); if (selected) showDetail(fresh); }
      }
    }

    if (input) {
      input.addEventListener("change", () => { send(input.files); input.value = ""; });
    }
    if (zone) {
      ["dragenter", "dragover"].forEach(ev =>
        zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add("drag"); }));
      ["dragleave", "drop"].forEach(ev =>
        zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove("drag"); }));
      zone.addEventListener("drop", e => {
        if (e.dataTransfer && e.dataTransfer.files.length) send(e.dataTransfer.files);
      });
    }
  }

  function closeEdit() { editing = null; $("editBackdrop").classList.remove("open"); }

  async function saveEdit() {
    if (!editing) return;
    const payload = {};
    $("editGrid").querySelectorAll("[data-key]").forEach(el => payload[el.dataset.key] = el.value.trim());
    const btn = $("saveEdit"); btn.disabled = true; btn.textContent = "Saving…";
    try {
      /*
       * The UI uses the actual referral_s row id for the PATCH.
       * Patient fields are updated separately when a matching patient_s
       * row can be identified. RLS UPDATE policies are required.
       */
      const referralPayload = {
        referral_id: payload.referral_id || editing.raw.referral_id || editing.referralId,
        document_type: payload.document_type,
        referral_type: payload.referral_type,
        referral_date: payload.referral_date,
        referring_provider: payload.referring_provider,
        provider_npi: payload.provider_npi,
        receiving_provider: payload.receiving_provider,
        urgency: payload.urgency,
        diagnosis: payload.diagnosis,
        icd10: payload.icd10,
        procedure_code: payload.procedure_code,
        requested_service: payload.requested_service,
        requested_procedure: payload.requested_procedure,
        reason_for_referral: payload.reason_for_referral,
        chief_complaint: payload.chief_complaint,
        epic_record_created_date: payload.epic_record_created_date,
        clinical_summary: payload.clinical_summary,
        agent_summary: payload.agent_summary
      };
      Object.keys(referralPayload).forEach(k => { if (referralPayload[k] === "") delete referralPayload[k]; });
      await supabaseUpdate(TABLES.referrals, editing.rowId, referralPayload);

      const pid = first(editing.patient, ["id"]);
      if (pid) {
        const patientPayload = { patient_name: payload.patient_name, dob: payload.dob, mrn: payload.mrn };
        Object.keys(patientPayload).forEach(k => { if (patientPayload[k] === "") delete patientPayload[k]; });
        await supabaseUpdate(TABLES.patients, pid, patientPayload);
      }
      closeEdit(); await loadData(); toast("Referral updated in Supabase.");
      if (selected) {
        const fresh = normalize().find(x => String(x.rowId) === String(selected.rowId));
        if (fresh) showDetail(fresh);
      }
    } catch (e) { toast(e.message || "Update failed", true); }
    finally { btn.disabled = false; btn.textContent = "Save to Supabase"; }
  }

  async function deleteReferral(r) {
    if (!r) return;
    if (!confirm("Delete this referral and its patient record? This cannot be undone.")) return;
    try {
      for (const d of r.docs) {
        const id = getDocId(d);
        if (id) await supabaseDelete(TABLES.documents, id);
      }
      await supabaseDelete(TABLES.referrals, r.rowId);
      const pid = first(r.patient, ["id"]);
      if (pid) await supabaseDelete(TABLES.patients, pid);
      selected = null; await loadData();
      $("detailBody").innerHTML = U.emptyState("No referral selected", "Referral details and documents appear here after you select a record.");
      toast("Referral deleted.");
    } catch (e) { toast(e.message || "Delete failed. Check Supabase DELETE policy.", true); }
  }

  async function deleteDocument(id) {
    if (!id || !confirm("Delete this document record and its stored file?")) return;
    try {
      /* Goes through document-url2o so the stored file is removed as well.
         The previous direct REST delete removed only the row and left the
         file orphaned in the bucket. */
      await window.REFERRAL_STORAGE.remove(id);
      await loadData();
      const fresh = selected ? normalize().find(x => String(x.rowId) === String(selected.rowId)) : null;
      if (fresh) showDetail(fresh); else render();
      toast("Document deleted.");
    } catch (e) {
      toast(e.message || "Document delete failed.", true);
    }
  }

  async function resetData() {
    if (!confirm("Reset ALL patient, referral and document records? This cannot be undone.")) return;
    const b = $("resetBtn"); b.disabled = true; b.textContent = "Resetting…";
    try {
      const r = await fetch(FUNCTIONS.reset, {
        method: "POST", headers: headers(), body: JSON.stringify({ confirm: true })
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok || body.success === false) throw new Error(body.error || body.message || "Reset failed");
      patients = []; referrals = []; documents = []; selected = null; render();
      $("detailBody").innerHTML = U.emptyState("No referral selected", "Referral details and documents appear here after you select a record.");
      toast("All referral management data was reset.");
    } catch (e) { toast(e.message || "Reset failed", true); }
    finally { b.disabled = false; b.textContent = "Reset demo data"; }
  }

  async function loadData() {
    const live = $("liveState");
    if (!live) return;
    live.textContent = "● Loading live records…";
    live.style.color = "var(--amber-500)";
    try {
      const [p, r, d] = await Promise.all([
        supabaseSelect(TABLES.patients),
        supabaseSelect(TABLES.referrals),
        supabaseSelect(TABLES.documents)
      ]);
      patients = p; referrals = r; documents = d;
      render();
      clearConnBanner();
      live.textContent = "● Live Supabase records connected · " +
        referrals.length + " referrals, " + patients.length + " patients, " +
        documents.length + " documents";
      live.style.color = "var(--green-600)";
    } catch (e) {
      patients = []; referrals = []; documents = []; render();
      live.textContent = "● Live data read failed";
      live.style.color = "var(--red-600)";
      showConnBanner(e);
      toast(e.message || "Unable to load live records", true);
      console.error("[referrals] live read failed:", e);
    }
  }

  function clearConnBanner() {
    const el = $("connBanner");
    if (el) el.innerHTML = "";
  }

  /* A failed read is almost always the browser blocking the request
     rather than a bad configuration, so say which and show the raw error. */
  function showConnBanner(err) {
    const el = $("connBanner");
    if (!el) return;
    const msg = (err && err.message) || String(err);
    const looksBlocked = /failed to fetch|networkerror|load failed|blocked/i.test(msg);
    el.innerHTML = `
      <div class="card" style="border-left:4px solid var(--red-600);margin-bottom:12px;">
        <div class="card-head"><div class="card-title">Live Supabase read failed</div>
          <button class="btn btn-outline btn-sm" id="connRetry">${U.ICONS.refresh} Retry</button>
        </div>
        <div class="card-body">
          <div style="font-size:12px;color:var(--ink-700);margin-bottom:10px;">
            ${looksBlocked
              ? "The request never reached Supabase. An embedded preview frame blocks cross-origin calls \u2014 open index.html directly in a browser tab, or serve the folder over http, and the live records will load."
              : "Supabase answered but rejected the read. Check the row-level security SELECT policy on the three tables."}
          </div>
          <div class="info-grid">
            ${U.infoItem("Project", SUPABASE_URL, { full: true, mono: true })}
            ${U.infoItem("Tables", TABLES.patients + " \u00b7 " + TABLES.referrals + " \u00b7 " + TABLES.documents, { full: true, mono: true })}
            ${U.infoItem("Error", msg, { full: true, mono: true })}
          </div>
        </div>
      </div>`;
    const retry = $("connRetry");
    if (retry) retry.addEventListener("click", loadData);
  }

  /* Read-only view of the live referral rows, so cross-module pages
     (Patient Lookup, Reports) can use what this module already loaded
     instead of querying Supabase again. */
  window.REFERRAL_PATIENTS = function () {
    try { return normalize(); } catch (e) { return []; }
  };

  /* ---------------- Module contract ---------------- */
  window.EHR_MODULES.referrals = {
    mount(container) {
      host = container;
      selected = null;
      container.innerHTML = shell();

      $("refreshBtn").addEventListener("click", loadData);
      $("resetBtn").addEventListener("click", resetData);
      $("closeEdit").addEventListener("click", closeEdit);
      $("cancelEdit").addEventListener("click", closeEdit);
      $("saveEdit").addEventListener("click", saveEdit);
      $("editBackdrop").addEventListener("click", e => { if (e.target === $("editBackdrop")) closeEdit(); });
      ["search", "statusFilter", "specialtyFilter", "documentTypeFilter"].forEach(id => {
        $(id).addEventListener("input", render);
        $(id).addEventListener("change", render);
      });

      render();
      loadData();
    }
  };
})();

    return u ? u.name : "";
  }

  async function call(action, payload) {
    const r = await fetch(ENDPOINT, {
      method: "POST",
      headers: headers(),
      body: JSON.stringify(Object.assign({ module: MODULE, action }, payload || {}))
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || action + " failed");
    }
    return body;
  }

  /* Database row -> the shape the Prior Auth module already renders.
     Keeping the old field names means the UI needs no rewrite. */
  function toCase(row) {
    return {
      id: row.pa_case_id,
      rowId: row.id,
      label: row.label || "",
      patient: row.patient || "",
      dob: row.dob || "",
      member: row.member_id || "",
      payer: row.payer || "",
      procedure: row.procedure || "",
      cpt: row.cpt || "",
      diagnosis: row.diagnosis || "",
      physician: row.physician || "",
      npi: row.npi || "",
      requirement: row.requirement || "",
      priority: row.priority || "Standard",
      status: row.status || "Pending Intake",
      owner: row.owner || "",
      scenario: row.scenario || "",
      outcome: row.outcome || "",
      time: "",
      createdBy: row.created_by || "",
      createdAt: row.created_at || ""
    };
  }

  /* The reverse: form values -> database columns. */
  function toRow(form) {
    return {
      pa_case_id: form.id || "",
      label: form.label,
      patient: form.patient,
      dob: form.dob,
      member_id: form.member,
      payer: form.payer,
      procedure: form.procedure,
      cpt: form.cpt,
      diagnosis: form.diagnosis,
      physician: form.physician,
      npi: form.npi,
      requirement: form.requirement,
      priority: form.priority,
      status: form.status,
      owner: form.owner,
      scenario: form.scenario,
      outcome: form.outcome,
      created_by: who()
    };
  }

  return {
    async list() {
      const body = await call("list");
      return (body.cases || []).map(toCase);
    },
    async create(form) {
      const body = await call("create", { data: toRow(form) });
      return toCase(body.case);
    },
    async update(caseId, form) {
      const body = await call("update", { caseId, data: toRow(form) });
      return toCase(body.case);
    },
    /* Removes the case, its document rows and the stored files. */
    async remove(caseId) {
      return await call("delete", { caseId });
    },
    config: { SUPABASE_URL, ENDPOINT, MODULE, TABLE }
  };
})();

/* =========================================================
   PRIOR AUTHORIZATION — DOCUMENT STORAGE CLIENT
   This module's own backend configuration. It is intentionally
   declared here rather than shared, so Prior Auth can be pointed
   at a different project, bucket or function set without touching
   any other POC.
   ========================================================= */

window.PA_STORAGE = (function () {
  "use strict";

  /* ---------- MODULE CONFIG — Prior Authorization only ---------- */
  const SUPABASE_URL = "https://wysnjsnbraiwopolgxgv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_rUdw6p2HW394IjHoMexMXw_GhEYimpQ";

  const FUNCTIONS_BASE = SUPABASE_URL + "/functions/v1";
  const FUNCTIONS = {
    upload: FUNCTIONS_BASE + "/document-upload2o",
    /* Shared read/delete service. The module parameter selects this
       POC's bucket and table; referral keeps its own default path. */
    documentUrl: FUNCTIONS_BASE + "/document-url2o"
  };
  const MODULE = "pa";

  const TABLES = { documents: "pa_document_s" };
  const BUCKET = "pa-documents";
  /* -------------------------------------------------------------- */

  function headers(extra) {
    return Object.assign({
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY
    }, extra || {});
  }

  function who() {
    const u = window.EHR_SESSION && window.EHR_SESSION.get();
    return u ? u.name : "";
  }

  /* Upload one file against a PA case. Returns the stored document row. */
  async function upload(paCaseId, file, opts) {
    opts = opts || {};
    const form = new FormData();
    form.append("module", MODULE);
    form.append("file", file);
    form.append("caseId", paCaseId);
    if (opts.documentType) form.append("documentType", opts.documentType);
    /* Carried so documents can be looked up by member id and name,
       not only by case id. */
    if (opts.memberId) form.append("memberId", opts.memberId);
    if (opts.patientName) form.append("patientName", opts.patientName);
    if (opts.replacesName) form.append("replacesName", opts.replacesName);
    form.append("uploadedBy", who());

    const r = await fetch(FUNCTIONS.upload, {
      method: "POST",
      headers: headers(),          // no Content-Type: the browser sets the boundary
      body: form
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || "Upload failed");
    }
    return body.document;
  }

  async function list(paCaseId) {
    const r = await fetch(
      FUNCTIONS.documentUrl + "?module=" + MODULE + "&caseId=" + encodeURIComponent(paCaseId),
      { headers: headers() }
    );
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || "Unable to list documents");
    }
    return body.documents || [];
  }

  async function signedUrl(id) {
    const r = await fetch(
      FUNCTIONS.documentUrl + "?module=" + MODULE + "&id=" + encodeURIComponent(id),
      { headers: headers() }
    );
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.url) {
      throw new Error(body.error || body.message || "Unable to open document");
    }
    return body.url;
  }

  async function remove(id) {
    const r = await fetch(
      FUNCTIONS.documentUrl + "?module=" + MODULE + "&id=" + encodeURIComponent(id),
      { method: "DELETE", headers: headers() }
    );
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || "Delete failed");
    }
    return true;
  }

  return { upload, list, signedUrl, remove, config: { SUPABASE_URL, FUNCTIONS, TABLES, BUCKET } };
})();

      const a = document.createElement("a");
      a.href = objectUrl;

      document.body.appendChild(a);
      a.click();

                  <div class="tl-title">Intake</div><div class="tl-sub">Case created from referral / email intake</div></div></li>
                <li><span class="tl-dot done">${U.ICONS.check}</span><div>
                  <div class="tl-title">Validation</div><div class="tl-sub">Patient, payer, procedure and diagnosis matched</div></div></li>

          <div class="card"><div class="card-head"><div class="card-title">Expected outcome</div></div>

              <div style="display:grid;gap:6px;margin-top:14px;">
                <button class="btn btn-outline btn-block" id="paStart">Start PA</button>
                <button class="btn btn-teal btn-block" id="paSubmit">Submit PA</button>
                <button class="btn btn-ghost btn-block" id="paValidate">Validate criteria</button>

          <div class="card"><div class="card-head"><div class="card-title">Document viewer</div></div>
            <div class="card-body" style="padding:8px;">
              <div class="pdf-frame" style="height:300px;margin-top:0;">
                <iframe id="paViewer" title="Stored PA document"></iframe>

    $("paOverlay").classList.add("open");
    $("paClose").addEventListener("click", closeCase);
    $("paStart").addEventListener("click", () => startPA(c.id));
    $("paSubmit").addEventListener("click", () => submitPA(c.id));
    $("paValidate").addEventListener("click", () => U.toast("Clinical criteria validation completed", "success"));
    wireDocumentControls(c);
  }

  function closeCase() { openId = null; $("paOverlay").classList.remove("open"); }

  function startPA(id) {
    const c = cases.find(x => x.id === id);
    c.status = "In Progress"; c.owner = "PA Team";
    render(); openCase(id);
    U.toast(id + " moved to In Progress", "success");
  }

  function submitPA(id) {
    const c = cases.find(x => x.id === id);
    if (c.scenario === "complex" && c.status !== "Ready for Nurse Review") {
      c.status = "Ready for Nurse Review"; c.owner = "Nurse Review";
      render(); openCase(id);
      U.toast(id + " sent to nurse review", "success");
    } else {
      c.status = "Submitted";
      render(); openCase(id);
      U.toast(id + " submitted successfully", "success");
    }
  }

  /* ---------------- Case create / edit / delete ----------------
     Cases are stored in pa_case_s through case-crud2o. Workflow
     state (Start PA, Submit PA) stays in memory. */

  const FORM_FIELDS = [
    { key: "patient",     label: "Patient name",        required: true },
    { key: "dob",         label: "Date of birth",       placeholder: "MM/DD/YYYY" },
    { key: "member",      label: "Member ID" },
    { key: "payer",       label: "Payer" },
    { key: "procedure",   label: "Procedure" },
    { key: "cpt",         label: "CPT code" },
    { key: "diagnosis",   label: "Diagnosis",           full: true },
    { key: "physician",   label: "Referring physician" },
    { key: "npi",         label: "NPI" },
    { key: "requirement", label: "Prior auth required", full: true },
    { key: "priority",    label: "Priority",  options: ["Standard", "High"] },
    { key: "status",      label: "Status",
      options: ["Pending Intake", "In Progress", "Ready for Nurse Review", "Submitted"] },
    { key: "owner",       label: "Owner" },
    { key: "label",       label: "Case label" },
    { key: "outcome",     label: "Expected outcome", full: true, textarea: true },
  ];

  function formControl(f, value) {
    if (f.options) {
      return `<select data-field="${f.key}">` +
        f.options.map(o =>
          `<option${o === value ? " selected" : ""}>${esc(o)}</option>`).join("") +
        `</select>`;
    }
    if (f.textarea) {
      return `<textarea data-field="${f.key}">${esc(value)}</textarea>`;
    }
    return `<input data-field="${f.key}" value="${esc(value)}"` +
      (f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : "") + `>`;
  }

  function openCaseForm(caseId) {
    editingCase = caseId ? cases.find(c => c.id === caseId) : null;
    const source = editingCase || {};

    $("paFormTitle").textContent = editingCase
      ? "Edit " + editingCase.id
      : "New PA case";
    $("paFormSub").textContent = editingCase
      ? "Updating pa_case_s \u00b7 the case ID cannot be changed"
      : "A case ID is generated automatically";

    $("paFormGrid").innerHTML = FORM_FIELDS.map(f => `
      <div class="form-field ${f.full ? "full" : ""}">
        <label>${esc(f.label)}${f.required ? " *" : ""}</label>
        ${formControl(f, source[f.key] || "")}
      </div>`).join("");

    $("paFormNote").innerHTML = "";
    $("paFormOverlay").classList.add("open");
    const first = $("paFormGrid").querySelector("[data-field]");
    if (first) first.focus();
  }

  function closeCaseForm() {
    editingCase = null;
    $("paFormOverlay").classList.remove("open");
  }

  function formNote(text, tone) {
    const el = $("paFormNote");
    if (!el) return;
    el.innerHTML = text
      ? `<div class="empty-hint" style="color:${tone === "error" ? "var(--red-600)" : "var(--ink-500)"}">${esc(text)}</div>`
      : "";
  }

  async function saveCaseForm() {
    const form = {};
    $("paFormGrid").querySelectorAll("[data-field]").forEach(el => {
      form[el.dataset.field] = el.value.trim();
    });

    if (!form.patient) {
      formNote("Patient name is required.", "error");
      return;
    }

    const btn = $("paFormSave");
    btn.disabled = true;
    btn.textContent = "Saving\u2026";

    try {
      if (editingCase) {
        await window.PA_CASES.update(editingCase.id, form);
        U.toast(editingCase.id + " updated.", "success");
      } else {
        const created = await window.PA_CASES.create(form);
        U.toast("Case " + created.id + " created.", "success");
      }
      closeCaseForm();
      await loadCases();
    } catch (e) {
      formNote(e.message || "Save failed", "error");
      U.toast(e.message || "Save failed", "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Save case";
    }
  }

  async function deleteCase(caseId) {
    const c = cases.find(x => x.id === caseId);
    if (!c) return;

    const stored = (uploads[caseId] || []).length;
    const warning = stored
      ? `\n\nThis will also delete ${stored} stored document${stored === 1 ? "" : "s"} and the file${stored === 1 ? "" : "s"} behind them.`
      : "";

    if (!confirm(`Delete ${caseId} \u2014 ${c.patient}?${warning}\n\nThis cannot be undone.`)) return;

    try {
      const res = await window.PA_CASES.remove(caseId);
      delete uploads[caseId];
      if (openId === caseId) closeCase();

      const extra = res.documentsDeleted
        ? ` and ${res.documentsDeleted} document${res.documentsDeleted === 1 ? "" : "s"}`
        : "";
      U.toast(caseId + " deleted" + extra + ".", "success");
      await loadCases();
    } catch (e) {
      U.toast(e.message || "Delete failed", "error");
    }
  }

  function caseBanner(err) {
    const el = $("paCaseBanner");
    if (!el) return;
    el.innerHTML = err
      ? `<div class="card" style="border-left:4px solid var(--red-600);margin-bottom:12px;">
           <div class="card-head"><div class="card-title">Cases could not be loaded</div>
             <button class="btn btn-outline btn-sm" id="paCaseRetry">${U.ICONS.refresh} Retry</button>
           </div>
           <div class="card-body">
             <div style="font-size:12px;color:var(--ink-700);margin-bottom:8px;">
               The case list comes from ${esc(CONFIG.tables.cases)} through ${esc(CONFIG.caseFunction)}.
               Check that the table exists and the function is deployed.
             </div>
             ${U.infoItem("Error", err, { full: true, mono: true })}
           </div>
         </div>`
      : "";
    const retry = $("paCaseRetry");
    if (retry) retry.addEventListener("click", loadCases);
  }

  async function loadCases() {
    try {
      cases = await window.PA_CASES.list();
      caseError = null;
    } catch (e) {
      cases = [];
      caseError = e.message || "Unable to load cases.";
    }
    caseBanner(caseError);
    render();
  }

  /* Read-only view of the live PA cases for cross-module pages. */
  window.PRIORAUTH_CASES_LIVE = function () { return cases.slice(); };

  window.EHR_MODULES.priorauth = {
    config: CONFIG,
    mount(container) {
      cases = [];
      container.innerHTML = shell();

      ["paSearch", "paStatus", "paScenario"].forEach(id => {
        $(id).addEventListener("input", render);
        $(id).addEventListener("change", render);
      });
      $("paNewCase").addEventListener("click", () => openCaseForm(null));
      $("paReload").addEventListener("click", loadCases);
      $("paFormClose").addEventListener("click", closeCaseForm);
      $("paFormCancel").addEventListener("click", closeCaseForm);
      $("paFormSave").addEventListener("click", saveCaseForm);
      $("paFormOverlay").addEventListener("click", e => {
        if (e.target.id === "paFormOverlay") closeCaseForm();
      });
      $("paOverlay").addEventListener("click", e => {
        if (e.target.id === "paOverlay") closeCase();
      });

      render();
      loadCases();
    }
  };
})();


/* ===== pages/payer/payer.cases.js ===== */
/* =========================================================
   PAYER REVIEW — CASE API CLIENT
   Requests now live in Supabase rather than in the browser. Review
   workflow state (IXP extraction, AI validation, case-manager
   decisions, determination letters) stays in memory by design, so
   a demo can be re-run without touching the database.
   ========================================================= */

window.PAYER_CASES_API = (function () {
  "use strict";

  /* ---------- MODULE CONFIG — Payer Review only ---------- */
  const SUPABASE_URL = "https://wysnjsnbraiwopolgxgv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_rUdw6p2HW394IjHoMexMXw_GhEYimpQ";

  const ENDPOINT = SUPABASE_URL + "/functions/v1/case-crud2o";
  const MODULE = "payer";
  const TABLE = "payer_case_s";
  /* ------------------------------------------------------- */

  function headers() {
    return {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    };
  }

  function who() {
    const u = window.EHR_SESSION && window.EHR_SESSION.get();
    return u ? u.name : "";
  }

  async function call(action, payload) {
    const r = await fetch(ENDPOINT, {
      method: "POST",
      headers: headers(),
      body: JSON.stringify(Object.assign({ module: MODULE, action }, payload || {}))
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || action + " failed");
    }
    return body;
  }

  /* Database row -> the shape PayerConnect already renders, with the
     in-memory workflow objects attached so nothing downstream breaks. */
  function toCase(row) {
    return {
      id: row.payer_case_id,
      rowId: row.id,
      memberId: row.member_id || "",
      patientName: row.patient_name || "",
      dob: row.dob || "",
      payer: row.payer || "",
      payerShort: row.payer_short || "",
      planType: row.plan_type || "",
      provider: row.provider || "",
      providerOrg: row.provider_org || "",
      npi: row.npi || "",
      procedure: row.procedure || "",
      cptList: Array.isArray(row.cpt_list) ? row.cpt_list : [],
      diagnosisCode: row.diagnosis_code || "",
      diagnosisName: row.diagnosis_name || "",
      submitted: row.submitted || "",
      channel: row.channel || "Provider Portal",
      priority: row.priority || "Standard",
      status: row.status || "NEW",
      createdBy: row.created_by || "",
      createdAt: row.created_at || "",

      /* Workflow state, memory only. */
      authNumber: null, authValidFrom: null, authValidTo: null,
      documents: [],
      ixp: { ran: false, docs: {} },
      ai: { ran: false, decision: null, confidence: 0,
            criteriaMet: [], criteriaMissing: [], reasoning: "" },
      caseManager: { notes: "", decision: null, name: null, decidedAt: null },
      criteriaRef: null
    };
  }

  function toRow(form) {
    return {
      payer_case_id: form.id || "",
      member_id: form.memberId,
      patient_name: form.patientName,
      dob: form.dob,
      payer: form.payer,
      payer_short: form.payerShort,
      plan_type: form.planType,
      provider: form.provider,
      provider_org: form.providerOrg,
      npi: form.npi,
      procedure: form.procedure,
      cpt_list: form.cptList,
      diagnosis_code: form.diagnosisCode,
      diagnosis_name: form.diagnosisName,
      submitted: form.submitted,
      channel: form.channel,
      priority: form.priority,
      status: form.status,
      created_by: who()
    };
  }

  return {
    async list() {
      const body = await call("list");
      return (body.cases || []).map(toCase);
    },
    async create(form) {
      const body = await call("create", { data: toRow(form) });
      return toCase(body.case);
    },
    async update(caseId, form) {
      const body = await call("update", { caseId, data: toRow(form) });
      return toCase(body.case);
    },
    /* Removes the request, its document rows and the stored files. */
    async remove(caseId) {
      return await call("delete", { caseId });
    },
    config: { SUPABASE_URL, ENDPOINT, MODULE, TABLE }
  };
})();

/* =========================================================
   PAYER REVIEW — DOCUMENT STORAGE CLIENT
   This module's own backend configuration. It is intentionally
   declared here rather than shared, so Payer Review can be pointed
   at a different project, bucket or function set without touching
   any other POC.
   ========================================================= */

window.PAYER_STORAGE = (function () {
  "use strict";

  /* ---------- MODULE CONFIG — Payer Review only ---------- */
  const SUPABASE_URL = "https://wysnjsnbraiwopolgxgv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_rUdw6p2HW394IjHoMexMXw_GhEYimpQ";

  const FUNCTIONS_BASE = SUPABASE_URL + "/functions/v1";
  const FUNCTIONS = {
    upload: FUNCTIONS_BASE + "/document-upload2o",
    /* Shared read/delete service. The module parameter selects this
       POC's bucket and table; referral keeps its own default path. */
    documentUrl: FUNCTIONS_BASE + "/document-url2o"
  };
  const MODULE = "payer";

  const TABLES = { documents: "payer_document_s" };
  const BUCKET = "payer-documents";
  /* -------------------------------------------------------------- */

  function headers(extra) {
    return Object.assign({
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY
    }, extra || {});
  }

  function who() {
    const u = window.EHR_SESSION && window.EHR_SESSION.get();
    return u ? u.name : "";
  }

  /* Upload one file against a payer case. Returns the stored document row. */
  async function upload(payerCaseId, file, opts) {
    opts = opts || {};
    const form = new FormData();
    form.append("module", MODULE);
    form.append("file", file);
    form.append("caseId", payerCaseId);
    if (opts.documentKind) form.append("documentKind", opts.documentKind);
    /* Carried so documents can be looked up by member id and name,
       not only by case id. */
    if (opts.memberId) form.append("memberId", opts.memberId);
    if (opts.patientName) form.append("patientName", opts.patientName);
    if (opts.replacesName) form.append("replacesName", opts.replacesName);
    form.append("uploadedBy", who());

    const r = await fetch(FUNCTIONS.upload, {
      method: "POST",
      headers: headers(),          // no Content-Type: the browser sets the boundary
      body: form
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || "Upload failed");
    }
    return body.document;
  }

  async function list(payerCaseId) {
    const r = await fetch(
      FUNCTIONS.documentUrl + "?module=" + MODULE + "&caseId=" + encodeURIComponent(payerCaseId),
      { headers: headers() }
    );
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || "Unable to list documents");
    }
    return body.documents || [];
  }

  async function signedUrl(id) {
    const r = await fetch(
      FUNCTIONS.documentUrl + "?module=" + MODULE + "&id=" + encodeURIComponent(id),
      { headers: headers() }
    );
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.url) {
      throw new Error(body.error || body.message || "Unable to open document");
    }
    return body.url;
  }

  async function remove(id) {
    const r = await fetch(
      FUNCTIONS.documentUrl + "?module=" + MODULE + "&id=" + encodeURIComponent(id),
      { method: "DELETE", headers: headers() }
    );
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || "Delete failed");
    }
    return true;
  }

  return { upload, list, signedUrl, remove, config: { SUPABASE_URL, FUNCTIONS, TABLES, BUCKET } };
})();

const STATUS_META = {
  NEW:{label:'New', cls:'badge-new'},
  IN_REVIEW:{label:'In Review', cls:'badge-review'},
  AUTO_APPROVED:{label:'Auto Approved', cls:'badge-autoapproved'},
  ESCALATED:{label:'Escalated', cls:'badge-escalated'},
  PENDED:{label:'Pended', cls:'badge-pended'},
  APPROVED:{label:'Approved', cls:'badge-approved'},
  APPROVED_COND:{label:'Approved (Conditions)', cls:'badge-approvedcond'},
  DENIED:{label:'Denied', cls:'badge-denied'},
};
function statusBadge(s){
  const m = STATUS_META[s] || STATUS_META.NEW;
  return `<span class="badge ${m.cls}"><span class="badge-dot"></span>${m.label}</span>`;
}

/* Cases loaded from the database carry no criteria set, so build a
   sensible one on demand rather than guarding every call site. */
function criteriaFor(c){
  if(c.criteriaRef) return c.criteriaRef;
  c.criteriaRef = {
    payer: c.payerShort || c.payer || 'Payer',
    cpt: (c.cptList && c.cptList[0]) || '00000',
    name: c.procedure || 'Requested procedure',
    conditions: [
      'Documented clinical indication for the requested service',
      'Conservative or first-line treatment attempted where applicable',
      'Ordering provider justification on file',
      'No duplicate authorisation for the same episode'
    ]
  };
  return c.criteriaRef;
}

/* AI validation content is workflow state, so it is generated rather
   than stored. */
function aiFor(c){
  if(c.ai && c.ai.criteriaMet && c.ai.criteriaMet.length) return c.ai;
  c.ai = Object.assign({
    ran:false, decision:null, confidence:0,
    criteriaMet:[
      'Requested service matches a covered procedure for this plan',
      'Ordering provider NPI validated',
      'Diagnosis code consistent with the requested service'
    ],
    criteriaMissing: [],
    reasoning: 'Clinical validation compares the uploaded documentation against the closest matching payer criteria set on file for this procedure and plan.'
  }, c.ai || {});
  return c.ai;
}

function caseFormControl(f, value){
  if(f.options){
    return `<select data-field="${f.key}">` +
      f.options.map(o=>`<option${o===value?' selected':''}>${o}</option>`).join('') +
      `</select>`;
  }
  return `<input data-field="${f.key}" value="${String(value||'').replace(/"/g,'&quot;')}"` +
    (f.placeholder?` placeholder="${f.placeholder}"`:'') + `>`;
}

function openCaseForm(caseId){
  editingCase = caseId ? getCase(caseId) : null;
  const src = editingCase || {};

  document.getElementById('caseFormTitle').textContent =
    editingCase ? 'Edit ' + editingCase.id : 'New PA request';
  document.getElementById('caseFormSub').textContent =
    editingCase ? 'Updating payer_case_s \u00b7 the request ID cannot be changed'
                : 'A request ID is generated automatically';

  document.getElementById('caseFormGrid').innerHTML = CASE_FORM_FIELDS.map(f=>{
    let v = src[f.key] || '';
    if(f.key==='cptList' && Array.isArray(v)) v = v.join(', ');
    return `<div class="form-field ${f.full?'full':''}">
      <label>${f.label}${f.required?' *':''}</label>
      ${caseFormControl(f, v)}
    </div>`;
  }).join('');

  document.getElementById('caseFormNote').innerHTML = '';
  document.getElementById('caseFormOverlay').classList.add('open');
}

function closeCaseForm(){
  editingCase = null;
  document.getElementById('caseFormOverlay').classList.remove('open');
}

function caseFormNote(text, tone){
  const el = document.getElementById('caseFormNote');
  if(!el) return;
  el.innerHTML = text
    ? `<div class="empty-hint" style="color:${tone==='error'?'var(--red-600)':'var(--ink-500)'}">${text}</div>`
    : '';
}

async function saveCaseForm(){
  const form = {};
  document.getElementById('caseFormGrid').querySelectorAll('[data-field]').forEach(el=>{
    form[el.dataset.field] = el.value.trim();
  });

  if(!form.patientName){
    caseFormNote('Patient name is required.', 'error');
    return;
  }

  form.cptList = String(form.cptList||'').split(',').map(s=>s.trim()).filter(Boolean);
  if(!form.submitted) form.submitted = nowStamp();

  const btn = document.getElementById('caseFormSave');
  btn.disabled = true; btn.textContent = 'Saving\u2026';

  try{
    if(editingCase){
      await window.PAYER_CASES_API.update(editingCase.id, form);
      toast(editingCase.id + ' updated.', 'success');
    }else{
      const created = await window.PAYER_CASES_API.create(form);
      toast('Request ' + created.id + ' created.', 'success');
    }
    closeCaseForm();
    await loadPayerCases();
  }catch(e){
    caseFormNote(e.message || 'Save failed', 'error');
    toast(e.message || 'Save failed', 'error');
  }finally{
    btn.disabled = false; btn.textContent = 'Save request';
  }
}

async function deletePayerCase(caseId){
  const c = getCase(caseId);
  if(!c) return;

  const stored = (storedDocs[caseId]||[]).length;
  const warning = stored
    ? `\n\nThis will also delete ${stored} stored document${stored===1?'':'s'} and the file${stored===1?'':'s'} behind them.`
    : '';

  if(!confirm(`Delete ${caseId} \u2014 ${c.patientName}?${warning}\n\nThis cannot be undone.`)) return;

  try{
    const res = await window.PAYER_CASES_API.remove(caseId);
    delete storedDocs[caseId];
    if(state.activeCaseId === caseId) closeCase();

    const extra = res.documentsDeleted
      ? ` and ${res.documentsDeleted} document${res.documentsDeleted===1?'':'s'}`
      : '';
    toast(caseId + ' deleted' + extra + '.', 'success');
    await loadPayerCases();
  }catch(e){
    toast(e.message || 'Delete failed', 'error');
  }
}

async function loadPayerCases(){
  try{
    state.cases = await window.PAYER_CASES_API.list();
    caseError = null;
  }catch(e){
    state.cases = [];
    caseError = e.message || 'Unable to load requests.';
    toast(caseError, 'error');
  }
  switchView(state.activeView || 'dashboard');
}

function openCase(id){
  /* First open of a case pulls its stored packet documents. */
  if(storedDocs[id] === undefined){
    storedDocs[id] = [];
    refreshStoredDocs(id, true);
  }
  state.activeCaseId = id;
  document.getElementById('caseOverlay').classList.add('open');
  document.body.style.overflow='hidden';
  renderCasePanel();
}
function closeCase(){
  document.getElementById('caseOverlay').classList.remove('open');
  document.body.style.overflow='';
  state.activeCaseId=null;
}

function timelineForCase(c){
  const steps = [
    {key:'received', label:'PA Request Received', sub:c.submitted},
    {key:'ixp', label:'IXP Document Extraction', sub: c.ixp.ran ? 'Completed' : 'Pending'},
    {key:'ai', label:'AI Clinical Validation', sub: c.ai.ran ? (c.ai.decision==='AUTO_APPROVE'?'Auto-approve recommended':'Escalation recommended') : 'Pending'},
    {key:'cm', label:'Case Manager Decision', sub: c.caseManager.decision ? (c.caseManager.decision+' by '+c.caseManager.name) : (c.ai.ran && c.ai.decision==='ESCALATE' ? 'Awaiting review' : 'Not required if auto-approved')},
    {key:'letter', label:'Determination Letter', sub: c.authNumber ? ('Auth '+c.authNumber) : 'Pending'},
  ];
  let activeSet=false;
  return steps.map(s=>{
    let cls='';
    if(s.key==='received') cls='done';
    else if(s.key==='ixp') cls = c.ixp.ran ? 'done' : (!activeSet ? (activeSet=true,'active') : '');
    else if(s.key==='ai') cls = c.ai.ran ? 'done' : (c.ixp.ran && !activeSet ? (activeSet=true,'active') : '');
    else if(s.key==='cm') cls = c.caseManager.decision ? 'done' : (c.ai.ran && c.ai.decision==='ESCALATE' && !activeSet ? (activeSet=true,'active') : '');
    else if(s.key==='letter') cls = c.authNumber ? 'done' : (c.ai.ran && c.ai.decision==='AUTO_APPROVE' && !c.authNumber && !activeSet ? (activeSet=true,'active') : '');
    return `<li><span class="tl-dot ${cls}">${cls==='done'?ICONS.check:''}</span><div><div class="tl-title">${s.label}</div><div class="tl-sub">${s.sub}</div></div></li>`;
  }).join('');
}

/* ---- stored document actions ---- */
async function viewStored(id){
  try{
    const url = await window.PAYER_STORAGE.signedUrl(id);
    window.open(url, '_blank', 'noopener');
  }catch(e){ toast(e.message || 'Unable to open document', 'error'); }
}

async function downloadStored(id, name, btn){
  if(btn) btn.disabled = true;
  try{
    const url = await window.PAYER_STORAGE.signedUrl(id);
    const res = await fetch(url);
    if(!res.ok) throw new Error('Stored file could not be read');
    const blob = await res.blob();
    const objectUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objectUrl; a.download = name || 'document.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(objectUrl), 4000);
  }catch(e){ toast(e.message || 'Download failed', 'error'); }
  finally{ if(btn) btn.disabled = false; }
}

async function removeStored(caseId, id){
  if(!confirm('Delete this document from storage? This cannot be undone.')) return;
  try{
    await window.PAYER_STORAGE.remove(id);
    storedDocs[caseId] = (storedDocs[caseId]||[]).filter(d=>d.id!==id);
    toast('Document deleted.', 'success');
    renderCasePanel();
  }catch(e){ toast(e.message || 'Delete failed', 'error'); }
}

/* ---------------------- IXP / AI simulation ---------------------- */
function runIXP(caseId){
  const c = getCase(caseId);
  if(c.status==='NEW') c.status='IN_REVIEW';
  const btn = document.getElementById('runIxpBtn');
  if(btn){ btn.disabled=true; btn.innerHTML = '<span class="spinner spinner-dark"></span> Extracting...'; }
  renderCasePanel(); // reflect status change in header while processing shows next tick
  setTimeout(()=>{
    /* Extraction runs over the documents genuinely stored for this case,
       so the results always match what the user actually uploaded. */
    const stored = storedDocs[c.id] || [];
    c.ixp.docs = {};
    stored.forEach(d=>{
      const name = d.fileName;
      const base = /lab/i.test(name) ? 0.97
        : (/history/i.test(name) && c.id.endsWith('002')) ? 0.81
        : (0.90 + Math.random()*0.08);
      c.ixp.docs[name] = {
        conf: Math.min(0.99, base),
        fields: (c.ixp.sample || [['Member ID', c.memberId],['CPT Code', (c.cptList||[]).join(', ')],['Diagnosis Code', c.diagnosisCode],['Provider NPI', c.npi]])
      };
    });
    c.ixp.ran = true;
    toast('IXP extraction complete — structured data extracted from PA packet.', 'success');
    renderCasePanel();
    renderQueueTableFiltered();
  }, 1000);
}

function runAI(caseId){
  const c = getCase(caseId);
  const btn = document.getElementById('runAiBtn');
  if(btn){ btn.disabled=true; btn.innerHTML = '<span class="spinner spinner-dark"></span> Validating...'; }
  setTimeout(()=>{

    c.ai.decision = isAutoApprove ? 'AUTO_APPROVE' : 'ESCALATE';

    c.ai.ran = true;
    c.status = isAutoApprove ? 'AUTO_APPROVED' : 'ESCALATED';

function makeDecision(caseId, decision){
  const c = getCase(caseId);
  c.caseManager.decision = decision;
  c.caseManager.name = 'Dr. Lisa Chen, MD';
  c.caseManager.decidedAt = nowStamp();

    c.authNumber = `${c.payerShort==='Aetna'?'AET':'UHC'}-PA-2026-${randDigits(6)}`;
    const from = new Date(); const to = new Date(); to.setDate(to.getDate()+90);
    c.authValidFrom = from.toISOString().slice(0,10);

function buildLetterText(c){
  const lines = [];
  lines.push('PRIOR AUTHORIZATION DETERMINATION LETTER');
  lines.push(c.payer.toUpperCase());
  lines.push('----------------------------------------------------------------');
  lines.push('Case ID: '+c.id);
  lines.push('Date Issued: '+new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}));
  lines.push('');
  lines.push('Member: '+c.patientName+'   (DOB '+c.dob+')');
  lines.push('Member ID: '+c.memberId);
  lines.push('Health Plan: '+c.payer);
  lines.push('');
  lines.push('Requesting Provider: '+c.provider+'  (NPI '+c.npi+')');
  lines.push('Provider Organization: '+c.providerOrg);
  lines.push('');
  lines.push('Requested Procedure(s): '+c.procedure+'  (CPT '+c.cptList.join(', ')+')');
  lines.push('Diagnosis: '+c.diagnosisName+'  ('+c.diagnosisCode+')');
  lines.push('');
  lines.push('DETERMINATION: '+ (STATUS_META[c.status]?STATUS_META[c.status].label.toUpperCase():c.status));
  if(c.authNumber){
    lines.push('Authorization Number: '+c.authNumber);
    lines.push('Valid From: '+c.authValidFrom+'   Valid To: '+c.authValidTo);
  }
  lines.push('');
  lines.push('CLINICAL BASIS FOR DETERMINATION');
  lines.push(c.ai.ran ? c.ai.reasoning : 'Clinical validation pending at time of letter generation.');
  if(c.ai.criteriaMissing && c.ai.criteriaMissing.length){
    lines.push('');
    lines.push('Documentation flagged for review:');
    c.ai.criteriaMissing.forEach(m=> lines.push('  - '+m));
  }
  if(c.caseManager.notes){
    lines.push('');
    lines.push('Case Manager Notes ('+c.caseManager.name+'):');
    lines.push(c.caseManager.notes);
  }
  lines.push('');
  lines.push('NEXT STEPS FOR PROVIDER');
  if(c.status==='APPROVED' || c.status==='AUTO_APPROVED' || c.status==='APPROVED_COND'){
    lines.push('This authorization permits the above procedure(s) to be performed within the validity period. Please reference the authorization number on all related claims.');
  } else if(c.status==='DENIED'){
    lines.push('This request has been denied based on the clinical basis above. The provider or member may submit an appeal with additional supporting documentation within 30 days of this notice.');
  } else {
    lines.push('Additional documentation has been requested. Please submit the missing information listed above to avoid delay in the coverage determination.');
  }
  lines.push('');
  lines.push('This determination was generated with the assistance of AI-based clinical validation and reviewed under the applicable regulatory and payer clinical review standards. This is a demo document generated by the PayerConnect Prior Authorization Portal (Genzeon Services) and does not represent an actual coverage decision.');
  return lines.join('\n');
}

function downloadDeterminationLetter(caseId){
  const c = getCase(caseId);
  if(!c){ toast('Case not found.','error'); return; }
  const text = buildLetterText(c);
  const fileBase = c.patientName.replace(/[^a-z0-9]+/gi,'_') + '_Determination';
  try{
    if(window.jspdf && window.jspdf.jsPDF){
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({unit:'pt', format:'letter'});
      const margin = 54; let y = margin;
      doc.setFont('helvetica','bold'); doc.setFontSize(14);
      doc.setTextColor(11,29,58);
      doc.text('PayerConnect — Prior Authorization Determination', margin, y); y+=22;
      doc.setDrawColor(18,167,155); doc.setLineWidth(1.2); doc.line(margin,y,558,y); y+=18;
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(60,70,88);
      const bodyLines = text.split('\n');
      bodyLines.forEach(line=>{

          if(y>740){ doc.addPage(); y=margin; }
          if(/^[A-Z ]{6,}$/.test(line.trim()) && line.trim().length>0){ doc.setFont('helvetica','bold'); } else { doc.setFont('helvetica','normal'); }
          doc.text(w, margin, y);

        });
      });
