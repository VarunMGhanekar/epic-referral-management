/* ---------------------- Document upload / download ---------------------- */
/* ---------------------------------------------------------------
   DOCUMENT STORAGE
   Uploads go to the payer-documents bucket through the
   payer-document-upload Edge Function. The in-memory document
   list is kept in step so the rest of the panel, IXP extraction
   and letter generation keep working exactly as before.
   --------------------------------------------------------------- */

const storedDocs = {};      // caseId -> rows from payer_document_s
let storageError = null;

async function refreshStoredDocs(caseId, rerender){
  try{
    storedDocs[caseId] = await window.PAYER_STORAGE.list(caseId);
    storageError = null;
  }catch(e){
    storedDocs[caseId] = storedDocs[caseId] || [];
    storageError = e.message || 'Unable to reach the document service.';
  }
  if(rerender && state.activeCaseId === caseId) renderCasePanel();
}

function uploadNote(text, tone){
  const el = document.getElementById('payerUploadNote');
  if(!el) return;
  el.innerHTML = text
    ? `<div class="empty-hint" style="color:${tone==='error'?'var(--red-600)':'var(--ink-500)'}">${text}</div>`
    : '';
}

async function storeFiles(caseId, files, opts){
  const list = Array.from(files || []);
  if(!list.length) return [];

  /* Stamp the member id and patient name onto every document so it can
     be retrieved by module + member id + name. */
  const kase = getCase(caseId) || {};
  opts = Object.assign({ memberId: kase.memberId, patientName: kase.patientName }, opts || {});
  const rows = [];
  for(let i=0;i<list.length;i++){
    const f = list[i];
    uploadNote(`Uploading ${f.name} (${i+1} of ${list.length})…`);
    try{
      const row = await window.PAYER_STORAGE.upload(caseId, f, opts || {});
      storedDocs[caseId] = (storedDocs[caseId] || []).concat(row);
      rows.push(row);
    }catch(e){
      uploadNote(`${f.name} failed: ${e.message}`, 'error');
      toast(f.name + ' could not be uploaded: ' + e.message, 'error');
    }
  }
  if(rows.length) uploadNote('');
  return rows;
}

/* Replace one of the packet's required documents. */
async function handleDocUpload(caseId, idx, files){
  if(!files || !files.length) return;
  const c = getCase(caseId);
  const f = files[0];
  const doc = c.documents[idx];

  const rows = await storeFiles(caseId, [f], {
    documentKind: doc.kind || 'supplemental',
    replacesName: doc.name
  });

  /* Keep the local view usable whether or not storage succeeded. */
  doc.preloaded = false;
  doc.fileObj = f;
  doc.size = f.size;
  doc.uploadedAt = nowStamp();
  doc.blobUrl = URL.createObjectURL(f);
  if(rows.length){
    doc.storedId = rows[0].id;
    doc.uploadedBy = rows[0].uploadedBy;
    toast('Replaced "'+doc.name+'" with "'+f.name+'" and stored it in Supabase.', 'success');
  }else{
    toast('Replaced "'+doc.name+'" with "'+f.name+'" locally only.', 'error');
  }
  renderCasePanel();
}

/* Add supplemental documents to the packet. */
async function handleAddDocs(caseId, files){
  if(!files || !files.length) return;
  const c = getCase(caseId);
  const rows = await storeFiles(caseId, files, { documentKind: 'supplemental' });

  Array.from(files).forEach(f=>{
    const row = rows.find(r=>r.fileName === f.name);
    c.documents.push({
      name:f.name, kind:'supplemental', preloaded:false,
      size:f.size, uploadedAt:nowStamp(), fileObj:f,
      blobUrl:URL.createObjectURL(f),
      storedId: row ? row.id : null,
      uploadedBy: row ? row.uploadedBy : null
    });
  });

  if(rows.length){
    toast(rows.length+' document(s) uploaded to the payer-documents bucket.', 'success');
  }else{
    toast(files.length+' document(s) attached locally only.', 'error');
  }
  renderCasePanel();
}

    npi:          ["npi", "NPI", "provider_npi"],
    firstName:    ["first_name", "firstName", "fname", "given_name"],
    lastName:     ["last_name", "lastName", "lname", "family_name", "surname"],
    title:        ["title", "credential", "credentials", "suffix"],
    specialty:    ["specialty", "speciality", "specialty_code", "specialtyCode", "primary_specialty"],
    providerType: ["provider_type", "providerType", "type"],
    taxonomyCode: ["taxonomy_code", "taxonomyCode", "taxonomy"],
    taxId:        ["tax_id", "taxId", "tax_identification_number", "tin", "ein",
                   "tax_id_ein", "taxid", "tax_number", "federal_tax_id"],
    practiceName: ["practice_name", "practiceName", "practice", "organization_name", "org_name"],
    groupNpi:     ["group_npi", "groupNpi", "org_npi", "organization_npi"],
    address1:     ["address_line1", "address1", "address_line_1", "addr1", "address", "street_address"],
    address2:     ["address_line2", "address2", "address_line_2", "addr2", "suite"],
    city:         ["city", "town"],
    state:        ["state", "state_code", "province"],
    zip:          ["zip", "zip_code", "zipcode", "postal_code", "postalCode"],
    phone:        ["phone", "phone_number", "telephone", "contact_phone"],
    email:        ["email", "email_address", "contact_email"]
  };

  /* Logical field -> real column name, filled in on the first read. */
  let columnMap = null;
  let knownColumns = [];

  function learnColumns(row) {
    if (!row || typeof row !== "object") return;
    knownColumns = Object.keys(row);
    columnMap = {};
    for (const field in CANDIDATES) {
      const hit = CANDIDATES[field].find(n => knownColumns.indexOf(n) !== -1);
      if (hit) columnMap[field] = hit;
    }
  }

  function pick(row, names, fallback) {
    for (const n of names) {
      if (row && row[n] !== undefined && row[n] !== null && String(row[n]).trim() !== "") {
        return row[n];
      }
    }
    return fallback === undefined ? "" : fallback;
  }

  function toProvider(row) {
    if (!columnMap) learnColumns(row);

    /* Prefer the discovered column, then fall back to the candidates. */
    const get = (field) => {
      if (columnMap && columnMap[field] && row[columnMap[field]] !== undefined) {
        const v = row[columnMap[field]];
        return v === null ? "" : v;
      }
      return pick(row, CANDIDATES[field] || []);
    };

    return {
      raw: row,
      npi: get("npi"),
      firstName: get("firstName"),
      lastName: get("lastName"),
      title: get("title"),
      specialty: get("specialty"),
      providerType: get("providerType"),
      taxonomyCode: get("taxonomyCode"),
      taxId: get("taxId"),
      practiceName: get("practiceName"),
      groupNpi: get("groupNpi"),
      address1: get("address1"),
      address2: get("address2"),
      city: get("city"),
      state: get("state"),
      zip: get("zip"),
      phone: get("phone"),
      email: get("email"),
      updatedAt: pick(row, ["updated_at", "updatedAt"]),
      createdAt: pick(row, ["created_at", "createdAt"])
    };
  }

  const MODULE = "provider";

  /* All writes go through case-crud2o with module="provider". The
     provider_id business id and partial updates are handled there, so
     this client only has to pass the form through. */
  async function write(action, payload) {
    const r = await fetch(FUNCTIONS.write, {
      method: "POST",
      headers: headers(),
      body: JSON.stringify(Object.assign({ module: MODULE, action }, payload || {}))
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || action + " failed");
    }
    return body;
  }

  return {
    /* ---------- READ: via the provider Edge Function ---------- */

    async list() {
      const r = await fetch(FUNCTIONS.provider, { headers: headers() });
      const body = await r.json().catch(() => null);
      if (!r.ok) {
        throw new Error((body && (body.message || body.error)) || "Unable to load providers");
      }
      return (Array.isArray(body) ? body : []).map(toProvider);
    },

    async getByNpi(npi) {
      const r = await fetch(
        FUNCTIONS.provider + "?npi=" + encodeURIComponent(npi),
        { headers: headers() }
      );
      const body = await r.json().catch(() => null);

      if (r.status === 404) return null;                 // not in the source system
      if (!r.ok) {
        throw new Error((body && (body.message || body.error)) || "Lookup failed");
      }
      return toProvider(body);
    },

    /* ---------- WRITE: direct upsert on the providers table ---------- */

    /*
     * Editing uses PATCH keyed on NPI, which never touches the primary
     * key. Only a genuinely new record needs an INSERT, and this table
     * has a NOT NULL provider_id with no default, so that value has to
     * be supplied. Rather than assume its name or type, the insert is
     * retried once with a generated id for whichever column the database
     * complains about.
     */
    async save(form, isEdit) {
      /* case-crud2o writes real column names, so translate here. */
      const data = {
        npi: form.npi,
        first_name: form.firstName,
        last_name: form.lastName,
        title: form.title,
        specialty: form.specialty,
        provider_type: form.providerType,
        taxonomy_code: form.taxonomyCode,
        tax_id: form.taxId,
        practice_name: form.practiceName,
        group_npi: form.groupNpi,
        address_line1: form.address1,
        address_line2: form.address2,
        city: form.city,
        state: form.state,
        zip: form.zip,
        phone: form.phone,
        email: form.email
      };

      const body = await write(isEdit ? "update" : "create", {
        caseId: form.npi,
        data: data
      });

      return {
        provider: body.case ? toProvider(body.case) : null,
        unmapped: []
      };
    },

    async remove(npi) {
      return await write("delete", { caseId: npi });
    },

    /* Useful when a save fails: shows what the table actually looks like. */
    schema() {
      return { columnMap: columnMap, knownColumns: knownColumns.slice() };
    },

    config: { SUPABASE_URL, FUNCTIONS, TABLES }
  };
})();


/* ===== pages/providers/provider.js ===== */
/* =========================================================
   MODULE — PROVIDER MANAGEMENT (Source System)

   The provider master record other modules look up against. Every
   visual element comes from the shared EHR component library, so this
   page inherits the portal's type, colour, spacing and controls with
   nothing of its own.

   Reads go through the `provider` Edge Function. Writes upsert the
   providers table on NPI.
   ========================================================= */

(function () {
  "use strict";

  const U = window.EHR;
  const $ = (id) => document.getElementById(id);
  const esc = U.esc;

  /* ---------- MODULE CONFIG ---------- */
  const CONFIG = {
    source: "supabase",
    tables: { providers: "providers" },
    functions: { read: "provider" },
    writePath: "/rest/v1/providers (upsert on npi)"
  };
  /* ----------------------------------- */

  let providers = [];
  let selected = null;
  let editing = null;      // null = adding, otherwise the NPI being edited
  let loadError = null;

  /* Mirrors the source system's field set. */
  const FIELDS = [
    { key: "npi",          label: "NPI", required: true, mono: true,
      placeholder: "10 digits" },
    { key: "firstName",    label: "First name" },
    { key: "lastName",     label: "Last name" },
    { key: "title",        label: "Title", placeholder: "MD, DO, NP…" },
    { key: "specialty",    label: "Specialty" },
    { key: "providerType", label: "Provider type" },
    { key: "taxonomyCode", label: "Taxonomy code", mono: true },
    { key: "taxId",        label: "Tax ID / EIN", mono: true },
    { key: "practiceName", label: "Practice name" },
    { key: "groupNpi",     label: "Group NPI", mono: true },
    { key: "address1",     label: "Address line 1", full: true },
    { key: "address2",     label: "Address line 2", full: true },
    { key: "city",         label: "City" },
    { key: "state",        label: "State", placeholder: "WI" },
    { key: "zip",          label: "ZIP", mono: true },
    { key: "phone",        label: "Phone" },
    { key: "email",        label: "Email" }
  ];

  function fullName(p) {
    const n = [p.firstName, p.lastName].filter(Boolean).join(" ").trim();
    return n + (p.title ? ", " + p.title : "");
  }

  function location(p) {
    const line = [p.city, p.state].filter(Boolean).join(", ");
    return [line, p.zip].filter(Boolean).join(" ");
  }

  /* ---------------- Shell ---------------- */

  function shell() {
    return U.pageHead({
      module: "Provider Management",
      title: "Provider Management",
      subHtml: `<span class="live-state" id="prvState" style="color:var(--amber-500)">● Connecting to the source system…</span>`,
      actions: `
        <button class="btn btn-outline btn-sm" id="prvRefresh">${U.ICONS.refresh} Refresh</button>
        <button class="btn btn-teal btn-sm" id="prvNew">${U.ICONS.plus} Add provider</button>`
    }) + `
      <div class="module-body">
        <div id="prvBanner"></div>
        <div class="kpi-row" id="prvKpi"></div>

        <div class="card" style="margin-bottom:14px;">
          <div class="card-head">
            <div class="card-title">NPI lookup</div>
            <div class="card-sub">Queries the provider source system directly</div>
          </div>
          <div class="card-body">
            <div class="filter-bar" style="margin-bottom:0;border:none;padding:0;background:none;">
              <div class="search-box" style="max-width:280px;">${U.ICONS.search}
                <input id="prvNpi" placeholder="National Provider Identifier" maxlength="10">
              </div>
              <button class="btn btn-primary btn-sm" id="prvLookup">Search</button>
              <span id="prvLookupNote" style="font-size:11.5px;color:var(--ink-500);"></span>
            </div>
          </div>
        </div>

        <div class="split">
          <div class="card">
            <div class="card-head">
              <div class="card-title">All providers</div>
              <div class="card-sub" id="prvCount"></div>
            </div>
            <div class="card-body flush">
              <div class="filter-bar" style="margin:8px 10px;">
                <div class="search-box">${U.ICONS.search}
                  <input id="prvSearch" placeholder="Search name, NPI, specialty, practice…">
                </div>
                <select class="field-select" id="prvSpecialty">
                  <option value="">All specialties</option>
                </select>
              </div>
              <div class="table-wrap">
                <table class="data">

                    <th>NPI</th><th>Name</th><th>Specialty</th>
                    <th>Practice</th><th>Location</th><th>Tax ID</th><th>Action</th>
                  </tr></thead>
                  <tbody id="prvRows"></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <div class="card-title">Provider record</div>
              <div class="card-sub" id="prvDetailSub">Select a provider</div>
            </div>
            <div class="card-body" id="prvDetail">
              ${U.emptyState("No provider selected",
                "Search by NPI, or choose a row to see the full source record.")}
            </div>
          </div>
        </div>
      </div>

      <div class="overlay" id="prvFormOverlay">
        <div class="case-panel" style="max-width:840px;">
          <div class="case-header">
            <div class="case-header-left">
              <div class="case-title" id="prvFormTitle">Add provider</div>
              <div class="case-subtitle" id="prvFormSub">Upsert keyed on NPI</div>
            </div>
            <button class="close-x" id="prvFormClose">${U.ICONS.x}</button>
          </div>
          <div class="case-body" style="display:block;">
            <div class="form-grid" id="prvFormGrid"></div>
            <div id="prvFormNote" style="margin-top:10px;"></div>
            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px;">
              <button class="btn btn-ghost" id="prvFormCancel">Cancel</button>
              <button class="btn btn-teal" id="prvFormSave">Save provider</button>
            </div>
          </div>
        </div>
      </div>`;
  }

  /* ---------------- Rendering ---------------- */

  function populateSpecialties() {
    const el = $("prvSpecialty");
    const current = el.value;
    const unique = [...new Set(providers.map(p => U.clean(p.specialty)).filter(Boolean))].sort();
    el.innerHTML = '<option value="">All specialties</option>' +
      unique.map(s => `<option>${esc(s)}</option>`).join("");
    el.value = current;
  }

  function render() {
    const q = U.clean($("prvSearch").value).toLowerCase();
    const spec = $("prvSpecialty").value;

    const view = providers.filter(p => {
      const hay = [p.npi, p.firstName, p.lastName, p.specialty, p.practiceName,
                   p.taxId, p.city, p.state].map(U.clean).join(" ").toLowerCase();
      return (!q || hay.includes(q)) && (!spec || p.specialty === spec);
    });

    const withPractice = providers.filter(p => U.clean(p.practiceName)).length;
    const specialties = new Set(providers.map(p => U.clean(p.specialty)).filter(Boolean));

    $("prvKpi").innerHTML = [
      U.kpi("Providers", providers.length, "navy"),
      U.kpi("Specialties", specialties.size, ""),
      U.kpi("With practice on file", withPractice, "green"),
      U.kpi("Missing practice", providers.length - withPractice, "amber")
    ].join("");

    $("prvCount").textContent = view.length + " provider" + (view.length === 1 ? "" : "s");
    populateSpecialties();

    $("prvRows").innerHTML = view.length ? view.map(p => {
      const isSel = selected && String(selected.npi) === String(p.npi);
      return `<tr class="clickable ${isSel ? "selected" : ""}" data-npi="${esc(p.npi)}">
        <td class="cell-mono cell-strong">${esc(p.npi) || "—"}</td>
        <td><div class="cell-strong">${esc(fullName(p)) || "—"}</div>
            <div class="cell-sub">${esc(p.providerType)}</div></td>
        <td>${p.specialty ? `<span class="badge badge-teal">${esc(p.specialty)}</span>` : "—"}</td>
        <td>${esc(p.practiceName) || "—"}
            <div class="cell-sub cell-mono">${esc(p.groupNpi)}</div></td>
        <td>${esc(location(p)) || "—"}</td>
        <td class="cell-mono">${esc(p.taxId) || "—"}</td>
        <td class="cell-actions">
          <button class="btn btn-outline btn-sm prv-edit" data-npi="${esc(p.npi)}">Edit</button>
          <button class="btn btn-red btn-sm prv-del" data-npi="${esc(p.npi)}">${U.ICONS.trash}</button>
        </td>
      </tr>`;
    }).join("")
      : `<tr><td colspan="7">${providers.length
          ? U.emptyState("No providers match", "Clear the filters to see the full list.")
          : U.emptyState("No providers on file", "Use Add provider to create the first record.")}</td></tr>`;

    $("prvRows").querySelectorAll("tr.clickable").forEach(tr =>
      tr.addEventListener("click", e => {
        if (e.target.closest("button")) return;
        showProvider(providers.find(p => String(p.npi) === String(tr.dataset.npi)));
      }));
    $("prvRows").querySelectorAll(".prv-edit").forEach(b =>
      b.addEventListener("click", e => { e.stopPropagation(); openForm(b.dataset.npi); }));
    $("prvRows").querySelectorAll(".prv-del").forEach(b =>
      b.addEventListener("click", e => { e.stopPropagation(); removeProvider(b.dataset.npi); }));
  }

  function showProvider(p) {
    if (!p) return;
    selected = p;
    render();

    $("prvDetailSub").textContent = (fullName(p) || "Provider") + " · " + p.npi;

    const address = [p.address1, p.address2, location(p)].filter(Boolean).join("\n");

    $("prvDetail").innerHTML = `
      <div class="patient-banner">
        <div class="avatar">${esc(U.initials(fullName(p) || p.npi))}</div>
        <div>
          <div class="pb-name">${esc(fullName(p)) || "Unnamed provider"}</div>
          <div class="pb-meta">NPI ${esc(p.npi)}${p.groupNpi ? " · Group " + esc(p.groupNpi) : ""}</div>
        </div>
        <div class="pb-facts">
          <div><div class="pb-fact-label">Specialty</div>
               <div class="pb-fact-value">${esc(p.specialty) || "—"}</div></div>
          <div><div class="pb-fact-label">Tax ID</div>
               <div class="pb-fact-value">${esc(p.taxId) || "—"}</div></div>
        </div>
      </div>

      ${U.sectionLabel("Identity")}
      <div class="info-grid">
        ${U.infoItem("First name", p.firstName, { showEmpty: true })}
        ${U.infoItem("Last name", p.lastName, { showEmpty: true })}
        ${U.infoItem("Title", p.title, { showEmpty: true })}
        ${U.infoItem("Specialty", p.specialty, { showEmpty: true })}
        ${U.infoItem("Provider type", p.providerType, { showEmpty: true })}
        ${U.infoItem("Taxonomy code", p.taxonomyCode, { mono: true, showEmpty: true })}
      </div>

      <div style="margin-top:16px;">
        ${U.sectionLabel("Practice")}
        <div class="info-grid">
          ${U.infoItem("Practice name", p.practiceName, { full: true, showEmpty: true })}
          ${U.infoItem("NPI", p.npi, { mono: true })}
          ${U.infoItem("Group NPI", p.groupNpi, { mono: true, showEmpty: true })}
          ${U.infoItem("Tax ID / EIN", p.taxId, { mono: true, showEmpty: true })}
          ${U.infoItem("Address", address, { full: true, body: true, showEmpty: true })}
        </div>
      </div>

      <div style="margin-top:16px;">
        ${U.sectionLabel("Contact")}
        <div class="info-grid">
          ${U.infoItem("Phone", p.phone, { showEmpty: true })}
          ${U.infoItem("Email", p.email, { showEmpty: true })}
          ${U.infoItem("Last updated", p.updatedAt ? U.fmtDate(String(p.updatedAt).slice(0, 10)) : "", { showEmpty: true })}
        </div>
      </div>

      <div style="display:flex;gap:8px;margin-top:18px;">
        <button class="btn btn-outline btn-sm" id="prvDetailEdit">${U.ICONS.edit} Edit record</button>
        <button class="btn btn-red btn-sm" id="prvDetailDel">${U.ICONS.trash} Delete</button>
      </div>`;

    $("prvDetailEdit").addEventListener("click", () => openForm(p.npi));
    $("prvDetailDel").addEventListener("click", () => removeProvider(p.npi));
  }

  /* ---------------- NPI lookup ---------------- */

  async function lookup() {
    const npi = U.clean($("prvNpi").value);
    const note = $("prvLookupNote");

    if (!/^\d{10}$/.test(npi)) {
      note.textContent = "NPI must be exactly 10 digits.";
      note.style.color = "var(--red-600)";
      return;
    }

    const btn = $("prvLookup");
    btn.disabled = true;
    note.textContent = "Searching the source system…";
    note.style.color = "var(--ink-500)";

    try {
      const found = await window.PROVIDER_API.getByNpi(npi);
      if (!found) {
        note.textContent = "Not found in the source system.";
        note.style.color = "var(--amber-600)";
        return;
      }
      /* Keep the list in step if the record is new to this session. */
      if (!providers.some(p => String(p.npi) === String(found.npi))) {
        providers = providers.concat(found);
      }
      note.textContent = "Record found.";
      note.style.color = "var(--green-600)";
      showProvider(found);
    } catch (e) {
      note.textContent = e.message || "Lookup failed.";
      note.style.color = "var(--red-600)";
    } finally {
      btn.disabled = false;
    }
  }

  /* ---------------- Add / edit / delete ---------------- */

  function control(f, value) {
    return `<input data-field="${f.key}" value="${esc(value)}"` +
      (f.mono ? ` style="font-family:var(--mono)"` : "") +
      (f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : "") +
      (f.key === "npi" && editing ? " readonly" : "") + `>`;
  }

  function openForm(npi) {
    editing = npi || null;
    const source = npi ? providers.find(p => String(p.npi) === String(npi)) || {} : {};

    /* Hide fields this table has no column for, so the form matches
       what the source system can actually hold. */
    const schema = window.PROVIDER_API.schema();
    const fields = (schema.columnMap && Object.keys(schema.columnMap).length)
      ? FIELDS.filter(f => schema.columnMap[f.key])
      : FIELDS;

    $("prvFormTitle").textContent = editing ? "Edit provider " + editing : "Add provider";
    $("prvFormSub").textContent = editing
      ? "Updating the providers table · the NPI cannot be changed"
      : "Saved as an upsert keyed on NPI, so an existing NPI updates that record";

    $("prvFormGrid").innerHTML = fields.map(f => `
      <div class="form-field ${f.full ? "full" : ""}">
        <label>${esc(f.label)}${f.required ? " *" : ""}</label>
        ${control(f, source[f.key] || "")}
      </div>`).join("");

    $("prvFormNote").innerHTML = "";
    $("prvFormOverlay").classList.add("open");
    const first = $("prvFormGrid").querySelector("[data-field]:not([readonly])");
    if (first) first.focus();
  }

  function closeForm() {
    editing = null;
    $("prvFormOverlay").classList.remove("open");
  }

  function formNote(text, tone) {
    const el = $("prvFormNote");
    if (!el) return;
    el.innerHTML = text
      ? `<div class="empty-hint" style="color:${tone === "error" ? "var(--red-600)" : "var(--ink-500)"}">${esc(text)}</div>`
      : "";
  }

  async function saveForm() {
    const form = {};
    $("prvFormGrid").querySelectorAll("[data-field]").forEach(el => {
      form[el.dataset.field] = el.value.trim();
    });

    if (!/^\d{10}$/.test(form.npi || "")) {
      formNote("NPI must be exactly 10 digits.", "error");
      return;
    }

    const btn = $("prvFormSave");
    btn.disabled = true;
    btn.textContent = "Saving…";

    try {
      const result = await window.PROVIDER_API.save(form, Boolean(editing));

      U.toast("Provider " + form.npi + (editing ? " updated." : " saved."), "success");

      /* Be explicit when the table has no column for something typed in,
         rather than silently discarding it. */
      /* The table demanded values the form does not collect, so ids were
         generated. Worth saying out loud. */
      if (result && result.generated && result.generated.length) {
        U.toast("Generated a value for: " + result.generated.join(", "), "success");
      }

      if (result && result.unmapped && result.unmapped.length) {
        const labels = result.unmapped
          .map(k => (FIELDS.find(f => f.key === k) || {}).label || k)
          .join(", ");
        U.toast("Saved, but this table has no column for: " + labels, "error");
      }

      closeForm();
      await load();
      const fresh = providers.find(p => String(p.npi) === String(form.npi));
      if (fresh) showProvider(fresh);
      else if (result && result.provider) showProvider(result.provider);
    } catch (e) {
      formNote(e.message || "Save failed", "error");
      U.toast(e.message || "Save failed", "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Save provider";
    }
  }

  async function removeProvider(npi) {
    const p = providers.find(x => String(x.npi) === String(npi));
    const label = p ? (fullName(p) || npi) : npi;

    if (!confirm(`Delete provider ${npi} — ${label}?\n\nThis cannot be undone.`)) return;

    try {
      const res = await window.PROVIDER_API.remove(npi);
      console.log("[provider] delete", npi, res);
      if (selected && String(selected.npi) === String(npi)) {
        selected = null;
        $("prvDetail").innerHTML = U.emptyState("No provider selected",
          "Search by NPI, or choose a row to see the full source record.");
        $("prvDetailSub").textContent = "Select a provider";
      }
      U.toast("Provider " + npi + " deleted.", "success");
      await load();
    } catch (e) {
      console.error("[provider] delete failed", npi, e);
      U.toast(e.message || "Delete failed.", "error");
    }
  }

  /* ---------------- Loading ---------------- */

  function banner(err) {
    const el = $("prvBanner");
    if (!el) return;
    el.innerHTML = err
      ? `<div class="card" style="border-left:4px solid var(--red-600);margin-bottom:12px;">
           <div class="card-head"><div class="card-title">Provider source system unavailable</div>
             <button class="btn btn-outline btn-sm" id="prvRetry">${U.ICONS.refresh} Retry</button>
           </div>
           <div class="card-body">
             <div style="font-size:12px;color:var(--ink-700);margin-bottom:10px;">
               Provider records are read through the <span class="cell-mono">${esc(CONFIG.functions.read)}</span>
               Edge Function. Check that it is deployed and that the
               <span class="cell-mono">${esc(CONFIG.tables.providers)}</span> table exists.
             </div>
             ${U.infoItem("Error", err, { full: true, mono: true })}
           </div>
         </div>`
      : "";
    const retry = $("prvRetry");
    if (retry) retry.addEventListener("click", load);
  }

  async function load() {
    const state = $("prvState");
    if (state) {
      state.textContent = "● Loading provider records…";
      state.style.color = "var(--amber-500)";
    }
    try {
      providers = await window.PROVIDER_API.list();
      loadError = null;
      banner(null);
      if (state) {
        state.textContent = "● Source system connected · " + providers.length +
          " provider" + (providers.length === 1 ? "" : "s");
        state.style.color = "var(--green-600)";
      }
    } catch (e) {
      providers = [];
      loadError = e.message || "Unable to load providers.";
      banner(loadError);
      if (state) {
        state.textContent = "● Source system read failed";
        state.style.color = "var(--red-600)";
      }
    }
    render();
  }

  /* Read-only view for cross-module pages. */
  window.PROVIDER_RECORDS = function () { return providers.slice(); };

  window.EHR_MODULES.providers = {
    config: CONFIG,
    mount(container) {
      providers = [];
      selected = null;
      container.innerHTML = shell();

      $("prvRefresh").addEventListener("click", load);
      $("prvNew").addEventListener("click", () => openForm(null));
      $("prvLookup").addEventListener("click", lookup);
      $("prvNpi").addEventListener("keydown", e => { if (e.key === "Enter") lookup(); });
      $("prvFormClose").addEventListener("click", closeForm);
      $("prvFormCancel").addEventListener("click", closeForm);
      $("prvFormSave").addEventListener("click", saveForm);
      $("prvFormOverlay").addEventListener("click", e => {
        if (e.target.id === "prvFormOverlay") closeForm();
      });
      ["prvSearch", "prvSpecialty"].forEach(id => {
        $(id).addEventListener("input", render);
        $(id).addEventListener("change", render);
      });

      render();
      load();
    }
  };
})();


/* ===== pages/caregap/caregap.js ===== */
/* =========================================================
   MODULE — CARE GAP  (Mock Epic care gap POC)

   Stands in as the system of record for the care gap automation:
   load a worklist, look a patient up, review their gaps, send
   outreach, then chart it and reconcile the run data.

   Entirely self-contained. No Edge Function, no table, no API
   call. State is kept in localStorage so a run survives a
   refresh, and the three patients are synthetic.

   BOT-FACING SELECTORS ARE FIXED. UiPath targets these ids, so
   none of them may be renamed:

     Tabs      #tabLoadWorklist #tabPatientSearch #tabPatientDetails
               #tabSendOutreach #tabOutreachChart #tabRunData
     Load      #worklistFileInput #loadWorklistButton #loadResult
               #worklistPreviewTable
     Search    #patientSearchInput #searchButton #searchStatus
               #openDetailsButton
     Details   #detailPatientId #detailPatientName #detailDob
               #detailAge #detailSex #detailEmail #detailProvider
               #detailLocation #detailNextVisit #careGapTable
     Outreach  #outreachPatientId #outreachRecipient #outreachSubject
               #outreachMessage #sendOutreachButton #outreachResult
     Chart     #outreachDetails
     Run data  #runDataTable #status-row-<rowId> #save

   The page's own markup and class names are kept for the same
   reason. Its classes are styled to the portal's tokens in
   caregap.css, scoped under .cg, so it looks like EPIC without
   the structure changing.
   ========================================================= */

(function () {
  "use strict";

  const U = window.EHR;


  /* ============================================================
     MOCK EPIC — CARE GAP POC

     Bot-facing selectors (stable, do not rename):

     Tabs          #tabLoadWorklist #tabPatientSearch #tabPatientDetails
                   #tabSendOutreach #tabOutreachChart #tabRunData
     Load          #worklistFileInput #loadWorklistButton #loadResult
                   #worklistPreviewTable
     Search        #patientSearchInput #searchButton #searchStatus
                   #openDetailsButton
     Details       #detailPatientId #detailPatientName #detailDob #detailAge
                   #detailSex #detailEmail #detailProvider #detailLocation
                   #detailNextVisit #careGapTable
     Outreach      #outreachPatientId #outreachRecipient #outreachSubject
                   #outreachMessage #sendOutreachButton #outreachResult
     Chart         #outreachDetails
     Run data      #runDataTable #status-row-<rowId> #saveStatusButton
                   #saveResult #runSummary
     ============================================================ */

  const STORAGE_KEY = "mockEpicCareGapPoc.v2";
  const INITIAL_STATUS = "Pending Validation";
  const DEFAULT_REPORT_DATE = "2026-08-01";

  const STATUS_OPTIONS = [
    "Pending Validation",
    "Outreach Sent",
    "Outreach Not Approved",
    "Invalid Care Gap - Confirmed",
    "Requires Further Review",
    "Patient Not Found"
  ];

  const CRITERIA = {
    BCS: { name: "Breast Cancer Screening", lookbackMonths: 24 },
    HBD: { name: "HbA1c Testing",           lookbackMonths: 12 }
  };

  const PATIENTS = {
    "E-100234": {
      id:"E-100234", name:"Maria Delgado", dob:"1968-03-12", age:58, sex:"F",
      email:"maria.delgado.sim@test.aspirus.org",
      provider:"Dr. Karen Howell, MD",
      location:"Aspirus Wausau Hospital - Women's Health",
      nextVisit:"None scheduled",
      labs:[],
      screenings:[{ procedure:"Mammogram", completed:"2023-11-04", result:"Negative" }]
    },
    "E-100571": {
      id:"E-100571", name:"Angela Whitfield", dob:"1963-02-20", age:63, sex:"F",
      email:"angela.whitfield.sim@test.aspirus.org",
      provider:"Dr. James Reilly, MD",
      location:"Aspirus Antigo Clinic - Primary Care",
      nextVisit:"None scheduled",
      labs:[{ test:"HbA1c", date:"2024-12-02", value:"7.4%" }],
      screenings:[]
    },
    "E-100892": {
      id:"E-100892", name:"Susan Park", dob:"1971-01-09", age:55, sex:"F",
      email:"susan.park.sim@test.aspirus.org",
      provider:"Dr. Linda Tran, MD",
      location:"Aspirus Rhinelander Clinic - Internal Medicine",
      nextVisit:"None scheduled",
      labs:[],
      screenings:[{ procedure:"Mammogram", completed:"2026-03-15", result:"Negative" }]
    }
  };


  /* ============================================================
     STATE
     ============================================================ */

  let state = null;
  let tab = "load";
  let searchResultId = null;
  let searchMessage = null;
  let loadMessage = null;
  let outreachResult = null;
  let saveMessage = null;

  function freshState() {
    return { rows: [], outreach: [], selectedPatientId: null, reportDate: "", sourceFile: "" };
  }

  function loadState() {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.rows)) { state = parsed; return; }
      }
    } catch (e) { /* storage unavailable */ }
    state = freshState();
  }

  function saveState() {
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { /* storage unavailable */ }
  }

  function stamp() {
    const d = new Date();
    function p(n) { return String(n).padStart(2, "0"); }
    return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) +
           " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }


  /* ============================================================
     HELPERS
     ============================================================ */

  function el(tag, className, text) {
    const n = document.createElement(tag);
    if (className) n.className = className;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function cell(text, field, className) {
    const td = el("td", className || null, text);
    if (field) td.setAttribute("data-field", field);
    return td;
  }

  function rowsFor(patientId) {
    return state.rows.filter(function (r) { return r.patientId === patientId; });
  }

  function patientNameFor(row) {
    if (row.patientName) return row.patientName;
    const p = PATIENTS[row.patientId];
    return p ? p.name : row.patientId;
  }

  function measureNameFor(row) {
    if (row.measureName) return row.measureName;
    const c = CRITERIA[row.measureCode];
    return c ? c.name : (row.measureCode || "\u2014");
  }

  function lookbackFor(row) {
    const c = CRITERIA[row.measureCode];
    return c ? c.lookbackMonths + " months" : "\u2014";
  }

  function activeReportDate() { return state.reportDate || DEFAULT_REPORT_DATE; }

  function canonicalStatus(value) {
    const needle = String(value || "").trim().toLowerCase();
    return STATUS_OPTIONS.find(function (s) { return s.toLowerCase() === needle; }) || null;
  }

  function isKnownStatus(value) { return canonicalStatus(value) !== null; }

  function statusChipClass(status) {
    if (status === "Outreach Sent" || status === "Invalid Care Gap - Confirmed") return "chip ok";
    if (status === INITIAL_STATUS) return "chip wait";
    return "chip bad";
  }

  function pendingCount() {
    return state.rows.filter(function (r) { return r.statusAfter === INITIAL_STATUS; }).length;
  }

  function selectedPatient() {
    return state.selectedPatientId ? PATIENTS[state.selectedPatientId] : null;
  }


  /* ============================================================
     TABS
     ============================================================ */

  const TABS = [
    { key:"load",     id:"tabLoadWorklist",   label:"Load Worklist" },
    { key:"search",   id:"tabPatientSearch",  label:"Patient Search" },
    { key:"details",  id:"tabPatientDetails", label:"Patient Details" },
    { key:"outreach", id:"tabSendOutreach",   label:"Send Outreach" },
    { key:"chart",    id:"tabOutreachChart",  label:"Outreach Chart" },
    { key:"rundata",  id:"tabRunData",        label:"Run Data" }
  ];

  function tabCount(key) {
    if (key === "load")    return state.rows.length;
    if (key === "chart")   return state.outreach.length;
    if (key === "rundata") return state.rows.length;
    return null;
  }

  function renderTabs() {
    const bar = document.getElementById("tabs");
    bar.innerHTML = "";

    TABS.forEach(function (t) {
      const b = el("button", "tab" + (tab === t.key ? " active" : ""));
      b.id = t.id;
      b.setAttribute("data-tab", t.key);
      b.appendChild(document.createTextNode(t.label));

      const c = tabCount(t.key);
      if (c !== null) b.appendChild(el("span", "count", String(c)));

      b.addEventListener("click", function () { tab = t.key; render(); });
      bar.appendChild(b);
    });
  }


  /* ============================================================
     TAB 1 - LOAD WORKLIST
     ============================================================ */

  const SHEETJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";

  const HEADER_MAP = {
    rowid:"rowId", row:"rowId", srno:"rowId",
    patientide:"patientId", patientid:"patientId", patient:"patientId", mrn:"patientId",
    patientname:"patientName", name:"patientName",
    caregapmeasure:"measureName", measure:"measureName", caregap:"measureName",
    measurecode:"measureCode", code:"measureCode",
    attributedprovider:"provider", provider:"provider",
    primarylocation:"location", location:"location",
    patientemail:"email", email:"email",
    reportdate:"reportDate",
    status:"statusBefore", currentstatus:"statusBefore"
  };

  function normaliseHeader(h) {
    return String(h || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  }

  function mapHeaders(headerRow) {
    return headerRow.map(function (h) { return HEADER_MAP[normaliseHeader(h)] || null; });
  }

  function splitDelimited(text) {
    const lines = String(text).replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n")
      .filter(function (l) { return l.trim() !== ""; });
    if (!lines.length) return [];

    const delimiter = lines[0].indexOf("\t") > -1 ? "\t" : ",";

    return lines.map(function (line) {
      const out = []; let cur = ""; let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
          else inQuotes = !inQuotes;
        } else if (ch === delimiter && !inQuotes) { out.push(cur); cur = ""; }
        else cur += ch;
      }
      out.push(cur);
      return out.map(function (c) { return c.trim(); });
    });
  }

  function rowsFromMatrix(matrix, sourceName) {
    if (!matrix.length) return { error: "The file appears to be empty." };

    const fields = mapHeaders(matrix[0]);

    if (fields.indexOf("patientId") === -1) {
      return { error: "No patient ID column found. Expected a header like \"Patient ID / E#\"." };
    }

    const rows = [];
    let reportDate = "";
    let skipped = 0;

    for (let i = 1; i < matrix.length; i++) {
      const raw = matrix[i];
      const rec = {};

      fields.forEach(function (f, index) {
        if (f) rec[f] = String(raw[index] === undefined || raw[index] === null ? "" : raw[index]).trim();
      });

      if (!rec.patientId) { skipped++; continue; }
      if (!reportDate && rec.reportDate) reportDate = rec.reportDate;

      rows.push({
        rowId:        rec.rowId ? (Number(rec.rowId) || rows.length + 1) : rows.length + 1,
        patientId:    rec.patientId.toUpperCase(),
        patientName:  rec.patientName || "",
        measureCode:  (rec.measureCode || "").toUpperCase(),
        measureName:  rec.measureName || "",
        provider:     rec.provider || "",
        location:     rec.location || "",
        email:        rec.email || "",
        statusBefore: rec.statusBefore || INITIAL_STATUS,
        statusAfter:  INITIAL_STATUS,
        updatedAt:    ""
      });
    }

    if (!rows.length) return { error: "No data rows found under the header row." };

    return { rows: rows, reportDate: reportDate, skipped: skipped, sourceFile: sourceName };
  }

  function applyLoad(result) {
    if (result.error) {
      loadMessage = { kind: "bad", text: result.error };
      render();
      return;
    }

    /* A new file starts a clean run: rows, outreach and selection all reset */
    state.rows = result.rows;
    state.reportDate = result.reportDate || "";
    state.sourceFile = result.sourceFile || "";
    state.outreach = [];
    state.selectedPatientId = null;
    saveState();

    searchResultId = null;
    searchMessage = null;
    outreachResult = null;
    saveMessage = null;

    loadMessage = {
      kind: "ok",
      text: "Loaded " + result.rows.length + " row(s)" +
            (result.skipped ? ", skipped " + result.skipped + " row(s) with no patient ID" : "") + "."
    };

    render();
  }

  function loadSheetJs() {
    return new Promise(function (resolve, reject) {
      if (window.XLSX) { resolve(window.XLSX); return; }
      const s = document.createElement("script");
      s.src = SHEETJS_URL;
      s.onload = function () { window.XLSX ? resolve(window.XLSX) : reject(new Error("unavailable")); };
      s.onerror = function () { reject(new Error("unavailable")); };
      document.head.appendChild(s);
    });
  }

  function readWorkbookFile(file) {
    loadMessage = { kind: "info", text: "Reading " + file.name + "..." };
    render();

    loadSheetJs().then(function (XLSX) {
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, blankrows: false, raw: false });
          applyLoad(rowsFromMatrix(matrix, file.name));
        } catch (err) {
          loadMessage = { kind: "bad", text: "Could not read that workbook. " + err.message };
          render();
        }
      };
      reader.onerror = function () {
        loadMessage = { kind: "bad", text: "Could not read the file from disk." };
        render();
      };
      reader.readAsArrayBuffer(file);
    }).catch(function () {
      loadMessage = {
        kind: "bad",
        text: "The Excel reader could not be loaded, so this machine has no internet access to the CDN. " +
              "Save the sheet as CSV and upload that instead."
      };
      render();
    });
  }

  function readCsvFile(file) {
    const reader = new FileReader();
    reader.onload = function (e) { applyLoad(rowsFromMatrix(splitDelimited(e.target.result), file.name)); };
    reader.onerror = function () {
      loadMessage = { kind: "bad", text: "Could not read the file from disk." };
      render();
    };
    reader.readAsText(file);
  }

  function handleFile(file) {
    if (!file) {
      loadMessage = { kind: "bad", text: "Choose a file first." };
      render();
      return;
    }
    const name = file.name.toLowerCase();
    if (name.endsWith(".csv") || name.endsWith(".tsv") || name.endsWith(".txt")) readCsvFile(file);
    else readWorkbookFile(file);
  }

  function renderLoad() {
    const screen = document.getElementById("screen");

    const card = el("div", "card");
    card.appendChild(el("h2", "card-title", "Load worklist"));
    card.appendChild(el("div", "sub",
      "Upload the care gap worklist. Rows land on the Run Data tab at " + INITIAL_STATUS + "."));

    const row = el("div", "form-row");

    const f = el("div", "field grow");
    const l = el("label", null, "Worklist file (.xlsx, .xls or .csv)");
    l.setAttribute("for", "worklistFileInput");
    f.appendChild(l);

    const input = document.createElement("input");
    input.type = "file";
    input.id = "worklistFileInput";
    input.setAttribute("name", "worklistFileInput");
    input.setAttribute("accept", ".xlsx,.xls,.csv,.tsv,.txt");
    f.appendChild(input);
    row.appendChild(f);

    const btn = el("button", "btn btn-primary", "Load worklist");
    btn.id = "loadWorklistButton";
    btn.type = "button";
    btn.addEventListener("click", function () {
      handleFile(document.getElementById("worklistFileInput").files[0]);
    });
    row.appendChild(btn);

    /* Clears everything: worklist rows, outreach records and statuses. */
    const reset = el("button", "btn btn-ghost", "Reset");
    reset.id = "resetRunButton";
    reset.type = "button";
    reset.addEventListener("click", function () {
      const had = state.rows.length;

      state = freshState();
      saveState();

      searchResultId = null;
      searchMessage = null;
      outreachResult = null;
      saveMessage = null;

      const fileInput = document.getElementById("worklistFileInput");
      if (fileInput) fileInput.value = "";

      loadMessage = { kind: "info",
        text: had
          ? "Reset. Worklist, outreach records and statuses cleared. Upload a file to start again."
          : "Nothing to reset - no worklist is loaded." };

      render();
    });
    row.appendChild(reset);

    card.appendChild(row);

    const res = el("div", loadMessage ? "banner " + loadMessage.kind : "banner info",
      loadMessage ? loadMessage.text : "No worklist loaded yet.");
    res.id = "loadResult";
    res.setAttribute("data-loaded", state.rows.length ? "true" : "false");
    res.setAttribute("data-rows", String(state.rows.length));
    card.appendChild(res);

    card.appendChild(el("div", "note",
      "Recognised headers: Row ID, Patient ID / E#, Patient Name, Care Gap Measure, Measure Code, " +
      "Attributed Provider, Primary Location, Patient Email, Report Date, Status. " +
      "Only the patient ID column is required. Loading a file clears the previous run."));

    screen.appendChild(card);

    if (state.rows.length) {
      const prev = el("div", "card");
      prev.appendChild(el("div", "section-title", "LOADED WORKLIST"));
      prev.appendChild(el("div", "sub",
        state.rows.length + " row(s)" +
        (state.sourceFile ? " from " + state.sourceFile : "") +
        (state.reportDate ? " \u00b7 report date " + state.reportDate : "")));

      const table = document.createElement("table");
      table.id = "worklistPreviewTable";
      table.style.marginTop = "16px";

      const thead = document.createElement("thead");
      const htr = document.createElement("tr");
      ["Row", "Patient ID", "Patient name", "Code", "Care gap measure"]
        .forEach(function (h, i) { htr.appendChild(el("th", i === 4 ? "hide-sm" : null, h)); });
      thead.appendChild(htr);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      state.rows.forEach(function (r) {
        const tr = document.createElement("tr");
        tr.setAttribute("data-row-id", String(r.rowId));
        tr.setAttribute("data-patient-id", r.patientId);
        tr.appendChild(cell(String(r.rowId), "rowId", "mono-soft"));
        tr.appendChild(cell(r.patientId, "patientId", "mono"));
        tr.appendChild(cell(patientNameFor(r), "patientName", "pt-name"));
        tr.appendChild(cell(r.measureCode, "measureCode", "mono"));
        tr.appendChild(cell(measureNameFor(r), "measureName", "soft hide-sm"));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      prev.appendChild(table);
      screen.appendChild(prev);
    }
  }


  /* ============================================================
     TAB 2 - PATIENT SEARCH
     ============================================================ */

  function doSearch() {
    const query = (document.getElementById("patientSearchInput").value || "").trim().toUpperCase();

    if (!query) {
      searchResultId = null;
      searchMessage = { kind: "bad", text: "Enter a patient ID to search." };
      render();
      return;
    }

    if (PATIENTS[query]) {
      searchResultId = query;
      state.selectedPatientId = query;
      saveState();
      searchMessage = { kind: "ok", text: "Patient found: " + PATIENTS[query].name + " (" + query + ")." };
    } else {
      searchResultId = null;
      searchMessage = { kind: "bad", text: "No patient found for ID " + query + "." };
    }

    render();
  }

  function renderSearch() {
    const screen = document.getElementById("screen");

    const card = el("div", "card");
    card.appendChild(el("h2", "card-title", "Patient search"));
    card.appendChild(el("div", "sub", "Search the EHR by patient ID. Report date " + activeReportDate() + "."));

    const row = el("div", "form-row");

    const f = el("div", "field grow");
    const l = el("label", null, "Patient ID");
    l.setAttribute("for", "patientSearchInput");
    f.appendChild(l);

    const input = document.createElement("input");
    input.type = "text";
    input.id = "patientSearchInput";
    input.setAttribute("name", "patientSearchInput");
    input.setAttribute("autocomplete", "off");
    if (searchResultId) input.value = searchResultId;
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") doSearch(); });
    f.appendChild(input);
    row.appendChild(f);

    const btn = el("button", "btn btn-primary", "Search");
    btn.id = "searchButton";
    btn.type = "button";
    btn.addEventListener("click", doSearch);
    row.appendChild(btn);

    card.appendChild(row);

    const status = el("div", searchMessage ? "banner " + searchMessage.kind : "banner info",
      searchMessage ? searchMessage.text : "No search run yet.");
    status.id = "searchStatus";
    status.setAttribute("data-found", searchResultId ? "true" : "false");
    card.appendChild(status);

    screen.appendChild(card);

    if (searchResultId) {
      const p = PATIENTS[searchResultId];
      const result = el("div", "card");
      result.id = "searchResultCard";
      result.setAttribute("data-patient-id", p.id);
      result.appendChild(el("div", "section-title", "SEARCH RESULT"));

      const dl = el("dl", "meta");
      function metaRow(label, value, field, mono) {
        dl.appendChild(el("dt", null, label));
        const dd = el("dd", mono ? "mono" : null, value);
        dd.setAttribute("data-field", field);
        dl.appendChild(dd);
      }
      metaRow("Patient ID", p.id, "resultPatientId", true);
      metaRow("Patient name", p.name, "resultPatientName");
      metaRow("Date of birth", p.dob, "resultDob");
      metaRow("Reported gaps", String(rowsFor(p.id).length), "resultGapCount");

  /* ============================================================

     ============================================================ */

  function sendOutreach() {
    const patientId = (document.getElementById("outreachPatientId").value || "").trim().toUpperCase();
    const recipient = (document.getElementById("outreachRecipient").value || "").trim();
    const subject   = (document.getElementById("outreachSubject").value || "").trim();
    const message   = (document.getElementById("outreachMessage").value || "").trim();

    if (!patientId) {
      outreachResult = { kind: "bad", text: "Patient ID is required." };
      render();
      return;
    }

    if (!recipient || !message) {
      outreachResult = { kind: "bad", text: "Recipient and message are both required." };
      render();
      return;
    }

    const covered = rowsFor(patientId);

    const record = {
      sentAt: stamp(),
      patientId: patientId,
      patientName: covered.length ? patientNameFor(covered[0]) :
                   (PATIENTS[patientId] ? PATIENTS[patientId].name : patientId),
      recipient: recipient,
      subject: subject,
      message: message,
      gapCodes: covered.map(function (r) { return r.measureCode || measureNameFor(r); }).join(", "),
      rowIds: covered.map(function (r) { return r.rowId; }).join(", ")
    };

    /* One outreach entry per patient - a new send replaces the previous one */
    state.outreach = state.outreach.filter(function (o) { return o.patientId !== patientId; });
    state.outreach.push(record);
    saveState();

    outreachResult = { kind: "ok", text: "Outreach sent." };
    render();
  }

  function renderOutreach() {
    const screen = document.getElementById("screen");

    const card = el("div", "card");

      const f = el("div", "field");

      const i = document.createElement("input");
      i.type = "text";
      i.id = id;
      i.setAttribute("name", id);
      i.setAttribute("autocomplete", "off");
      i.value = "";
      f.appendChild(i);
      parent.appendChild(f);
    }

    textField("Patient ID", "outreachPatientId", grid);
    textField("Recipient", "outreachRecipient", grid);
    textField("Subject", "outreachSubject", grid);
    card.appendChild(grid);

    const mf = el("div", "field");
    mf.style.marginTop = "16px";
    const ml = el("label", null, "Message");
    ml.setAttribute("for", "outreachMessage");
    mf.appendChild(ml);
    const ta = document.createElement("textarea");

    ta.setAttribute("name", "outreachMessage");

    card.appendChild(res);

  function renderChart() {
    const screen = document.getElementById("screen");

    const card = el("div", "card");
    card.appendChild(el("h2", "card-title", "Outreach chart"));

    const patientsReached = new Set(state.outreach.map(function (o) { return o.patientId; })).size;
    const gapsCovered = state.outreach.reduce(function (acc, o) {
      return acc + o.rowIds.split(",").filter(function (x) { return x.trim(); }).length;
    }, 0);

    const stats = el("div", "stats");
    function stat(n, label, field) {
      const s = el("div", "stat");

      num.setAttribute("data-field", field);

      s.appendChild(el("div", "l", label));

    }

    stats.appendChild(stat(patientsReached, "Patients reached", "patientsReached"));
    stats.appendChild(stat(gapsCovered, "Care gaps covered", "gapsCovered"));
    card.appendChild(stats);

    screen.appendChild(card);

    const detail = el("div", "card");
    detail.id = "outreachDetails";
    detail.appendChild(el("div", "section-title", "OUTREACH DETAIL"));

  function renderRunData() {
    const screen = document.getElementById("screen");

    const card = el("div", "card");
    card.appendChild(el("h2", "card-title", "Run data"));
    card.appendChild(el("div", "sub",
      "Every row starts at " + INITIAL_STATUS + ". The bot types the outcome into status after."));

    if (!state.rows.length) {
      const empty = el("div", "empty", "No worklist loaded. Upload the file on the Load Worklist tab.");
      empty.id = "runDataEmpty";
      card.appendChild(empty);
      screen.appendChild(card);
      return;
    }

    const table = document.createElement("table");
    table.id = "runDataTable";
    table.style.marginTop = "18px";

    const thead = document.createElement("thead");
    const htr = document.createElement("tr");
    ["Row", "Patient ID", "Patient name", "Code", "Care gap measure",
     "Status before", "Status after", "Updated at"]
      .forEach(function (h, i) { htr.appendChild(el("th", i === 4 ? "hide-sm" : null, h)); });
    thead.appendChild(htr);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");

    state.rows.forEach(function (r) {
      const tr = document.createElement("tr");
      tr.setAttribute("data-row-id", String(r.rowId));
      tr.setAttribute("data-patient-id", r.patientId);

      tr.appendChild(cell(String(r.rowId), "rowId", "mono-soft"));
      tr.appendChild(cell(r.patientId, "patientId", "mono"));
      tr.appendChild(cell(patientNameFor(r), "patientName", "pt-name"));
      tr.appendChild(cell(r.measureCode, "measureCode", "mono"));
      tr.appendChild(cell(measureNameFor(r), "measureName", "soft hide-sm"));

      const before = el("td");
      before.setAttribute("data-field", "statusBefore");
      before.appendChild(el("span", "chip muted", r.statusBefore));
      tr.appendChild(before);

      const after = el("td");
      after.setAttribute("data-field", "statusAfter");
      after.setAttribute("data-value", r.statusAfter);

      const input = document.createElement("input");
      input.type = "text";
      input.id = "status-row-" + r.rowId;
      input.setAttribute("name", "status-row-" + r.rowId);
      input.setAttribute("autocomplete", "off");
      input.setAttribute("data-row-id", String(r.rowId));
      input.setAttribute("data-patient-id", r.patientId);
      input.value = r.statusAfter;
      if (!isKnownStatus(r.statusAfter)) input.className = "unknown-status";

      function commit() {
        const typed = (input.value || "").trim();
        if (!typed) { input.value = r.statusAfter; return; }

        const canonical = canonicalStatus(typed);
        r.statusAfter = canonical || typed;
        r.updatedAt = stamp();
        saveState();

        saveMessage = canonical
          ? { kind: "ok", text: "Row " + r.rowId + " set to " + canonical + "." }
          : { kind: "bad", text: "Row " + r.rowId + " set to \"" + typed + "\", which is not a known status value." };

        render();
      }

      input.addEventListener("change", commit);
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") commit(); });

      after.appendChild(input);
      tr.appendChild(after);

      tr.appendChild(cell(r.updatedAt || "\u2014", "updatedAt", "mono-soft"));

      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    card.appendChild(table);

    const actions = el("div", "actions");
    const save = el("button", "btn btn-primary", "Save status updates");
    save.id = "saveStatusButton";
    save.type = "button";
    save.addEventListener("click", function () {
      state.rows.forEach(function (r) {
        const s = document.getElementById("status-row-" + r.rowId);
        if (!s) return;
        const typed = (s.value || "").trim();
        if (!typed || typed === r.statusAfter) return;
        r.statusAfter = canonicalStatus(typed) || typed;
        r.updatedAt = stamp();
      });
      saveState();
      saveMessage = { kind: "ok", text: "Status updates saved." };
      render();
    });
    actions.appendChild(save);
    card.appendChild(actions);

    const res = el("div", saveMessage ? "banner " + saveMessage.kind : "banner info",
      saveMessage ? saveMessage.text : "No status updates written yet.");
    res.id = "saveResult";
    res.setAttribute("data-pending", String(pendingCount()));
    card.appendChild(res);

    screen.appendChild(card);

    /* run summary, computed from the rows in the table above */
    const sum = el("div", "card");
    sum.id = "runSummary";
    sum.appendChild(el("div", "section-title", "RUN SUMMARY"));

    const counts = {};
    state.rows.forEach(function (r) { counts[r.statusAfter] = (counts[r.statusAfter] || 0) + 1; });

    const table2 = document.createElement("table");
    const thead2 = document.createElement("thead");
    const htr2 = document.createElement("tr");
    ["Status", "Rows"].forEach(function (h) { htr2.appendChild(el("th", null, h)); });
    thead2.appendChild(htr2);
    table2.appendChild(thead2);

    const tbody2 = document.createElement("tbody");

    Object.keys(counts).sort().forEach(function (status) {
      const tr = document.createElement("tr");
      tr.setAttribute("data-status", status);

      const td = el("td");
      td.setAttribute("data-field", "status");
      td.appendChild(el("span", statusChipClass(status), status));
      tr.appendChild(td);

      tr.appendChild(cell(String(counts[status]), "count", "mono"));
      tbody2.appendChild(tr);
    });

    const totalRow = document.createElement("tr");
    totalRow.setAttribute("data-status", "Total");
    totalRow.appendChild(cell("Total rows", "status", "pt-name"));
    totalRow.appendChild(cell(String(state.rows.length), "count", "mono"));
    tbody2.appendChild(totalRow);

    table2.appendChild(tbody2);
    sum.appendChild(table2);

    screen.appendChild(sum);
  }


  /* ============================================================
     ROUTER
     ============================================================ */

  function render() {
    renderTabs();
    const screen = document.getElementById("screen");
    screen.innerHTML = "";

    if (tab === "load")          renderLoad();
    else if (tab === "search")   renderSearch();
    else if (tab === "details")  renderDetails();
    else if (tab === "outreach") renderOutreach();
    else if (tab === "chart")    renderChart();
    else                         renderRunData();
  }

  /* Bootstrap is driven by the module's mount(), not by page load. */
  function bootCareGap() {
    loadState();
    if (state.selectedPatientId) searchResultId = state.selectedPatientId;
    render();
  }


  /* ---------------- Module contract ---------------- */

  window.EHR_MODULES.caregap = {
    mount(container) {
      container.innerHTML = U.pageHead({
        module: "Care Gap",
        title: "Care Gap",
        sub: "System of record for the care gap automation \u2014 worklist, review, outreach and reconciliation"
      }) + `

          <div class="cg">
            <div class="tabs" id="tabs"></div>
            <div id="screen"></div>
          </div>
          <div class="footer-note">
            Synthetic data only \u00b7 stands in for the source EHR during the POC
          </div>
        </div>`;

      bootCareGap();
    }
  };
})();

  function queueNameFor(project) {

  /* ---------------- Rendering ---------------- */

  const VIEWS = {
    home: homeView,
    documents: documentsView,
    applications: applicationsView,
    retrieve: retrieveView,
    api: apiView
  };

  const CRUMBS = {
    home: "Home",
    documents: "Documents",
    applications: "Applications",
    retrieve: "Retrieval",
    api: "Administration"
  };

  function render() {
    $("obViews").innerHTML =
      `<div class="ob-view active">${(VIEWS[view] || homeView)()}</div>`;
    $("obCrumb").textContent = view === "documents" && selected
      ? selected.name
      : CRUMBS[view] || "Home";

    document.querySelectorAll("#obRibbonTabs .ob-ribbon-tab").forEach(b =>
      b.classList.toggle("active", b.dataset.view === view));
    document.querySelectorAll(".onbase .ob-navitem").forEach(n =>
      n.classList.toggle("active", n.dataset.view === view));

    $("obImport").disabled = !selected;

    renderAppList();
    wireView();
  }

  function renderAppList() {
    $("obAppList").innerHTML = projects.length
      ? projects.map(p => `
          <div class="ob-appitem ${selected && selected.id === p.id ? "active" : ""}"
               data-open-app="${esc(p.id)}">
            <span>\u25a6</span>
            <div style="min-width:0;">${esc(p.name)}
              <small>${esc(p.bucket_name || "")}</small></div>
          </div>`).join("")

    $("obAppList").querySelectorAll("[data-open-app]").forEach(el =>
      el.addEventListener("click", () => openApp(el.dataset.openApp)));
