  function switchView(next) {
    view = next;
    render();
  }

  /* ---------------- Per-view wiring ---------------- */

  function wireView() {
    const on = (id, fn) => { const el = $(id); if (el) el.addEventListener("click", fn); };

    on("obHomeNew", () => openCreateModal());
    on("obWelcomeNew", () => openCreateModal());
    on("obAppsNew", () => openCreateModal());
    on("obDocsRefresh", () => loadDocs(true));
    on("obDocsImport", () => { const i = $("obFileInput"); if (i) i.click(); });
    on("obDeleteApp", () => openDeleteModal(selected));
    on("obRetrieveBtn", retrieveNext);

    document.querySelectorAll("#obViews [data-open-app]").forEach(b =>
      b.addEventListener("click", () => openApp(b.dataset.openApp)));
    document.querySelectorAll("#obViews [data-delete-app]").forEach(b =>
      b.addEventListener("click", () => {
        openDeleteModal(projects.find(p => String(p.id) === String(b.dataset.deleteApp)));
      }));

    document.querySelectorAll("#obViews [data-export]").forEach(b =>
      b.addEventListener("click", () => exportDocument(b.dataset.export, b)));
    document.querySelectorAll("#obViews [data-download]").forEach(b =>
      b.addEventListener("click", () => downloadDocument(b.dataset.download, b)));
    document.querySelectorAll("#obViews [data-delete]").forEach(b =>
      b.addEventListener("click", () => deleteDocument(b.dataset.delete)));

    const zone = $("obDropzone");
    const input = $("obFileInput");

    if (input) {
      input.addEventListener("change", () => {
        uploadFiles(input.files);
        input.value = "";
      });
    }
    if (zone) {
      ["dragenter", "dragover"].forEach(ev =>
        zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add("drag"); }));
      ["dragleave", "drop"].forEach(ev =>
        zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove("drag"); }));
      zone.addEventListener("drop", e => {
        if (e.dataTransfer && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
      });
    }
  }

  /* ---------------- Data ---------------- */

  async function listFolder(project) {
    const { data, error } = await sb.storage
      .from(project.bucket_name)
      .list(FOLDER.path, { limit: 1000, sortBy: { column: "created_at", order: "asc" } });

    if (error) throw error;
    /* Storage returns a placeholder for an empty folder; drop it. */
    return (data || []).filter(x =>
      x.name && x.name !== ".folder" && x.name !== ".emptyFolderPlaceholder");
  }

  async function loadProjects() {
    const { data, error } = await sb
      .from(TABLES.projects)
      .select("*")
      .order("created_at", { ascending: false });

    if (error) { toast(error.message, true); return; }

    projects = data || [];

    /* Document counts per application, so the tiles and tables are
       accurate without a second click. */
    await Promise.all(projects.map(async (p) => {
      try {
        const list = await listFolder(p);
        p._docCount = list.length;
        p._docBytes = list.reduce((n, d) => n + ((d.metadata && d.metadata.size) || 0), 0);
      } catch (e) {
        p._docCount = undefined;
        p._docBytes = 0;
      }
    }));

    if (selected) {
      selected = projects.find(p => String(p.id) === String(selected.id)) || null;
    }
    render();
  }

  async function loadDocs(announce) {
    if (!selected) return;
    try {
      docs = await listFolder(selected);
      if (announce) toast(docs.length + " document" + (docs.length === 1 ? "" : "s") + " listed.");
    } catch (e) {
      docs = [];
      toast(e.message || "Unable to list documents.", true);
    }
    render();
  }

  async function openApp(id) {
    const p = projects.find(x => String(x.id) === String(id));
    if (!p) return;
    selected = p;
    docs = [];
    view = "documents";
    render();
    await loadDocs(false);
  }

  /* ---------------- Upload ---------------- */

  async function uploadFiles(files) {
    if (!selected) { toast("Open an application first.", true); return; }

    const list = Array.from(files || []);
    if (!list.length) return;

    const note = $("obUploadNote");
    let done = 0;

    for (let i = 0; i < list.length; i++) {
      const f = list[i];

      if (f.size > 52428800) {
        if (note) note.innerHTML =
          `<div class="ob-callout err">${esc(f.name)} exceeds the 50 MB limit.</div>`;
        continue;
      }

      /* Keep object keys predictable, as the original POC did. */
      const safe = f.name.replace(/[^\w.\- ()]/g, "_");

      if (note) note.innerHTML =
        `<div class="ob-note">Importing ${esc(f.name)} (${i + 1} of ${list.length})\u2026</div>`;

      const { error } = await sb.storage
        .from(selected.bucket_name)
        .upload(FOLDER.path + "/" + safe, f, { upsert: false });

      if (error) {
        if (note) note.innerHTML =
          `<div class="ob-callout err">${esc(f.name)}: ${esc(error.message)}</div>`;
        toast(error.message, true);
      } else {
        done++;
      }
    }

    if (done) {
      if (note) note.innerHTML =
        `<div class="ob-callout ok">${done} document${done === 1 ? "" : "s"} imported into ${esc(FOLDER.label)}.</div>`;
      toast(done + " document" + (done === 1 ? "" : "s") + " imported.");
      await loadDocs(false);
      await loadProjects();
    }
  }

  /* ---------------- Document actions ---------------- */

  async function downloadDocument(name, btn) {
    if (!selected) return;
    btn.disabled = true;

    try {
      const { data, error } = await sb.storage
        .from(selected.bucket_name)
        .download(FOLDER.path + "/" + name);

      if (error) throw error;

      const url = URL.createObjectURL(data);
      const a = document.createElement("a");
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch (e) {
      toast(e.message || "Download failed", true);
    } finally {
      btn.disabled = false;
    }
  }

  async function deleteDocument(name) {
    if (!selected) return;
    if (!confirm("Delete " + name + "?\n\nThis cannot be undone.")) return;

    const { error } = await sb.storage
      .from(selected.bucket_name)
      .remove([FOLDER.path + "/" + name]);

    if (error) { toast(error.message, true); return; }

    delete queued[FOLDER.path + "/" + name];
    toast("Document deleted.");
    await loadDocs(false);
    await loadProjects();
  }

  /*
   * Export sends the document's own details and nothing else. No table
   * is read: name, type, size, folder, path, bucket and application all
   * come from the document and the open application.
   */
  async function exportDocument(name, btn) {
    if (!selected) return;

    const doc = docs.find(d => d.name === name);
    const path = FOLDER.path + "/" + name;
    const label = btn.innerHTML;

    btn.disabled = true;
    btn.innerHTML = "Sending\u2026";

    const specificContent = {
      "Application": selected.name,
      "Bucket": selected.bucket_name || "",
      "Folder": FOLDER.label,
      "File Name": name,
      "File Type": (doc && doc.metadata && doc.metadata.mimetype) || "document",
      "File Size": bytes(doc && doc.metadata && doc.metadata.size),
      "Size Bytes": String((doc && doc.metadata && doc.metadata.size) || 0),
      "Storage Path": path,
      "Imported": when(doc && doc.created_at),
      "Exported By": (window.EHR_SESSION && window.EHR_SESSION.get()
        ? window.EHR_SESSION.get().name : "")
    };

    try {
      const r = await fetch(FUNCTIONS.queuePush, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({
          /* The queue is named after the application, so each one has
             its own. The queue must already exist in Orchestrator. */
          queue: queueNameFor(selected),
          reference: path,          /* dedupes per file in Orchestrator */
          priority: "Normal",
          specificContent: specificContent,
          /* A queue item cannot carry the file, so ask for a signed URL
             the robot can GET with no credential. */
          signFile: {
            bucket: selected.bucket_name,
            path: path,
            expiresIn: 7 * 24 * 60 * 60
          }
        })
      });

      const body = await r.json().catch(() => ({}));
      if (!r.ok || !body.success) {
        throw new Error(body.error || body.message || "Queue push failed");
      }

      queued[path] = body.queueItemId;

      toast('Sent to queue "' + body.queue + '"' +
        (body.queueItemId ? " \u00b7 item #" + body.queueItemId : "") +
        (body.downloadUrl ? " \u00b7 file URL included" : "") + ".");

      btn.innerHTML = body.queueItemId ? "Queued #" + body.queueItemId : "Queued";
      btn.classList.remove("export");
      btn.title = "Already sent this session. Click to send again.";
    } catch (e) {
      toast(e.message || "Queue push failed", true);
      btn.innerHTML = label;
    } finally {
      btn.disabled = false;
    }
  }

  /* ---------------- Retrieval ---------------- */

  async function retrieveNext() {
    const project = $("obRetrieveApp").value;
    const box = $("obRetrieveResult");

    if (!project) { toast("Select an application.", true); return; }

    box.innerHTML = `<div class="ob-note">Calling get-document\u2026</div>`;

    try {
      const r = await fetch(FUNCTIONS.getDocument, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ project })
      });

      if (r.status === 404) {
        let x = {};
        try { x = await r.json(); } catch (e) { /* no body */ }
        box.innerHTML = `
          <div class="ob-callout">
            <b>No document available</b><br>
            ${esc(x.error || "Nothing in " + FOLDER.label + " for this application.")}
          </div>`;
        return;
      }

      if (!r.ok) throw new Error(await r.text());

      const blob = await r.blob();
      const name = decodeURIComponent(
        r.headers.get("X-Document-Name") || "document.pdf");
      const url = URL.createObjectURL(blob);

      box.innerHTML = `
        <div class="ob-callout ok">
          <b>${esc(name)}</b><br>
          Retrieved as an actual file \u00b7 ${esc(bytes(blob.size))}
          <div style="margin-top:10px;">
            <a class="ob-btn primary" href="${url}" download="${esc(name)}">
              Save Retrieved Document</a>
          </div>
        </div>`;
    } catch (e) {
      box.innerHTML =
        `<div class="ob-callout err"><b>Error</b><br>${esc(e.message || e)}</div>`;
    }
  }

  /* ---------------- Modals ---------------- */

  function closeModal() { $("obModal").classList.remove("show"); }

  function openCreateModal() {
    $("obModalTitle").textContent = "Create Application";
    $("obModalBody").innerHTML = `
      <div class="ob-callout" style="margin-bottom:12px;">
        Creates the application record and provisions its dedicated storage
        bucket with the ${esc(FOLDER.label)} folder.
      </div>
      <div class="ob-field">
        <label>Application name</label>
        <input id="obNewName" placeholder="Agentic Referral Management">
      </div>
      <div id="obCreateStatus" class="ob-note"></div>`;
    $("obModalFoot").innerHTML = `
      <button class="ob-btn" id="obCreateCancel">Cancel</button>
      <button class="ob-btn primary" id="obCreateGo">Create Application</button>`;

    $("obModal").classList.add("show");
    $("obNewName").focus();

    $("obCreateCancel").addEventListener("click", closeModal);
    $("obCreateGo").addEventListener("click", createApplication);
    $("obNewName").addEventListener("keydown", e => {
      if (e.key === "Enter") createApplication();
    });
  }

  async function createApplication() {
    const input = $("obNewName");
    const btn = $("obCreateGo");
    const status = $("obCreateStatus");
    const name = U.clean(input.value);

    if (!name) {
      status.innerHTML = `<span style="color:var(--ob-red-600)">Enter an application name.</span>`;
      input.focus();
      return;
    }

    btn.disabled = true;
    btn.textContent = "Creating\u2026";
    status.textContent = "Connecting to create-project\u2026";

    try {
      const r = await fetch(FUNCTIONS.createProject, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ name })
      });

      const text = await r.text();
      let data;
      try { data = JSON.parse(text); }
      catch (e) {
        throw new Error("create-project returned HTTP " + r.status + ": " + text);
      }

      if (!r.ok || !data.success) {
        throw new Error(data.error ||
          "Application creation failed (HTTP " + r.status + ").");
      }

      closeModal();
      toast(data.existing
        ? 'Application "' + data.project.name + '" already exists.'
        : 'Application "' + data.project.name + '" created.');

      await loadProjects();
      if (data.project && data.project.id) await openApp(data.project.id);
    } catch (e) {
      status.innerHTML = `<span style="color:var(--ob-red-600)">${esc(e.message || e)}</span>`;
      toast(e.message || String(e), true);
    } finally {
      btn.disabled = false;
      btn.textContent = "Create Application";
    }
  }

  function openDeleteModal(project) {
    if (!project) return;

    $("obModalTitle").textContent = "Delete Application";
    $("obModalBody").innerHTML = `
      <div class="ob-callout err" style="margin-bottom:12px;">
        <b>This removes everything.</b> The application record, its storage
        bucket and every document in it are deleted permanently.
      </div>
      <div class="ob-field">
        <label>Type the application name to confirm</label>
        <input id="obDeleteConfirm" placeholder="${esc(project.name)}">
      </div>
      <div id="obDeleteStatus" class="ob-note"></div>`;
    $("obModalFoot").innerHTML = `
      <button class="ob-btn" id="obDeleteCancel">Cancel</button>
      <button class="ob-btn danger" id="obDeleteGo">Delete Permanently</button>`;

    $("obModal").classList.add("show");
    $("obDeleteConfirm").focus();

    $("obDeleteCancel").addEventListener("click", closeModal);
    $("obDeleteGo").addEventListener("click", () => deleteApplication(project));
  }

  async function deleteApplication(project) {
    const typed = U.clean($("obDeleteConfirm").value);
    const status = $("obDeleteStatus");
    const btn = $("obDeleteGo");

    if (typed !== project.name) {
      status.innerHTML =
        `<span style="color:var(--ob-red-600)">The name does not match.</span>`;
      return;
    }

    btn.disabled = true;
    btn.textContent = "Deleting\u2026";

    try {
      const r = await fetch(FUNCTIONS.deleteProject, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ name: project.name, project: project.name })
      });

      const text = await r.text();
      let data;
      try { data = JSON.parse(text); }
      catch (e) {
        throw new Error("delete-project returned HTTP " + r.status + ": " + text);
      }

      if (!r.ok || data.success === false) {
        throw new Error(data.error ||
          "Deletion failed (HTTP " + r.status + ").");
      }

      closeModal();
      selected = null;
      docs = [];
      view = "home";
      toast('Application "' + project.name + '" deleted.');
      await loadProjects();
    } catch (e) {
      status.innerHTML = `<span style="color:var(--ob-red-600)">${esc(e.message || e)}</span>`;
      toast(e.message || String(e), true);
    } finally {
      btn.disabled = false;
      btn.textContent = "Delete Permanently";
    }
  }

  /* ---------------- supabase-js loader ---------------- */

  /* Loaded on demand so the portal does not carry the dependency for
     pages that never use it. */
  function ensureClient() {
    return new Promise((resolve, reject) => {
      if (window.supabase && window.supabase.createClient) {
        resolve(window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY));
        return;
      }

      const existing = document.getElementById("obSupabaseSdk");
      if (existing) {
        existing.addEventListener("load", () =>
          resolve(window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)));
        existing.addEventListener("error", () =>
          reject(new Error("Could not load the Supabase client library.")));
        return;
      }

      const s = document.createElement("script");
      s.id = "obSupabaseSdk";
      s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
      s.onload = () =>
        resolve(window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY));
      s.onerror = () =>
        reject(new Error("Could not load the Supabase client library."));
      document.head.appendChild(s);
    });
  }

  /* ---------------- Module contract ---------------- */

  window.EHR_MODULES.pocsource = {
    config: { SUPABASE_URL, FUNCTIONS, TABLES, FOLDER },

    mount(container) {
      projects = [];
      selected = null;
      docs = [];
      view = "home";

      container.innerHTML = shell();

      const user = (window.EHR_SESSION && window.EHR_SESSION.get()) || {};
      if (user.name) {
        $("obUserName").textContent = user.name;
        $("obAvatar").textContent = U.initials(user.name);
      }

      document.querySelectorAll("#obRibbonTabs .ob-ribbon-tab").forEach(b =>
        b.addEventListener("click", () => switchView(b.dataset.view)));
      document.querySelectorAll(".onbase .ob-navitem").forEach(n =>
        n.addEventListener("click", () => switchView(n.dataset.view)));

      $("obNewApp").addEventListener("click", () => openCreateModal());
      $("obSideNew").addEventListener("click", () => openCreateModal());
      $("obRefresh").addEventListener("click", () => loadProjects());
      $("obImport").addEventListener("click", () => {
        if (!selected) { toast("Open an application first.", true); return; }
        switchView("documents");
        const i = $("obFileInput");
        if (i) i.click();
      });
      $("obGoDocs").addEventListener("click", () => switchView("documents"));
      $("obGoRetrieve").addEventListener("click", () => switchView("retrieve"));
      $("obGoApi").addEventListener("click", () => switchView("api"));
      $("obModalClose").addEventListener("click", closeModal);
      $("obModal").addEventListener("click", e => {
        if (e.target.id === "obModal") closeModal();
      });

      render();

      ensureClient()
        .then(client => { sb = client; return loadProjects(); })
        .catch(e => {
          $("obViews").innerHTML = `
            <div class="ob-view active">
              <div class="ob-panel"><div class="ob-panel-body">
                <div class="ob-callout err">
                  <b>Could not start</b><br>${esc(e.message)}
                </div>
              </div></div>
            </div>`;
        });
    }
  };
})();

(function () {

  /* ---------------- Helpers ---------------- */

  function headers() {
    return {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    };
  }

  async function call(action, payload) {
    const r = await fetch(ENDPOINT, {
      method: "POST",
      headers: headers(),
      body: JSON.stringify(Object.assign({ module: MODULE, action }, payload || {}))
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || action + " failed");
    }
    return body;
  }

  /* The process stores confidence as a fraction, but may also send a
     whole number for a perfect score. Both render as a percentage. */
  function pct(v) {
    const n = Number(v);
    if (!Number.isFinite(n)) return null;
    return n <= 1 ? Math.round(n * 100) : Math.round(n);
  }

  function confRow(label, value) {
    const p = pct(value);
    if (p === null) return "";
    const shown = Number(value);
    return `
      <div class="conf-row">
        <div class="conf-label">${esc(label)}</div>
        <div class="conf-bar-track">
          <div class="conf-bar-fill ${p < 80 ? "low" : ""}" style="width:${p}%"></div>
        </div>
        <div class="conf-pct">${esc(shown <= 1 ? shown : p)}</div>
      </div>`;
  }

  function decisionBadge(value) {
    const v = U.clean(value).toUpperCase() || "PENDING";
    return `<span class="badge ${DECISION[v] || "badge-new"}">
      <span class="badge-dot"></span>${esc(v)}</span>`;

  function codeBadge(value) {

    keep("sigCode", [...new Set(records
      .map(r => U.clean(r.sig_code)).filter(Boolean))].sort());

  function render() {
    const q = U.clean($("sigSearch").value).toLowerCase();
    const dec = $("sigDecision").value;

      ${U.sectionLabel("Record information")}
      <div class="info-grid">
        ${U.infoItem("Record ID", r.record_id, { mono: true })}
        ${U.infoItem("Rx number", r.rx_number, { mono: true })}
        ${U.infoItem("Source PDF", r.source_pdf, { full: true, showEmpty: true })}
        ${U.infoItem("Retry count", String(r.retry_count ?? 0))}
      </div>

      <div style="margin-top:16px;">

          <div class="doc-row" style="display:block;padding:9px 11px;">

            <div class="info-item-value mono" style="margin-top:3px;">${esc(r.normalized_sig_text)}</div>

          ? `<div class="empty-hint">No SIG text on this record.</div>` : ""}
      </div>

      <div style="margin-top:16px;">
        ${U.sectionLabel("Extraction and classification")}
        ${confRow("Extraction confidence", r.extraction_confidence)}
        ${confRow("Classification confidence", r.classification_confidence)}

          ${U.infoItem("SIG code", r.sig_code, { mono: true, showEmpty: true })}
          ${U.infoItem("Final SIG code", r.final_sig_code, { mono: true, showEmpty: true })}

        ${r.classification_reasoning ? `
          <div class="ai-reasoning-box" style="margin-top:12px;">
            <b>Classification reasoning</b><br>${esc(r.classification_reasoning)}
          </div>` : ""}
      </div>

      <div style="margin-top:16px;">
        ${U.sectionLabel("Review and processing")}
        <div class="info-grid">
          ${U.infoItem("Reviewer decision", U.clean(r.reviewer_decision) || "PENDING")}
          ${U.infoItem("Processed at", r.processed_at, { mono: true, showEmpty: true })}
          ${U.infoItem("Created by", r.created_by, { showEmpty: true })}
          ${U.infoItem("Last updated", r.updated_at
              ? U.fmtDate(String(r.updated_at).slice(0, 10)) : "", { showEmpty: true })}
        </div>
      </div>

      <div style="display:flex;gap:8px;margin-top:18px;">
        <button class="btn btn-outline btn-sm" id="sigDetailEdit">${U.ICONS.edit} Edit record</button>
        <button class="btn btn-red btn-sm" id="sigDetailDel">${U.ICONS.trash} Delete</button>
      </div>`;

    $("sigDetailEdit").addEventListener("click", () => openForm(r.record_id));
    $("sigDetailDel").addEventListener("click", () => deleteRecord(r.record_id));
  }

  /* ---------------- Add / edit / delete ---------------- */

  function control(f, value) {
    const locked = f.lockOnEdit && editing ? " readonly" : "";

    if (f.options) {
      return `<select data-field="${f.key}">` +
        f.options.map(o =>
          `<option${o === value ? " selected" : ""}>${esc(o)}</option>`).join("") +
        `</select>`;
    }
    if (f.textarea) {
      return `<textarea data-field="${f.key}"${f.placeholder
        ? ` placeholder="${esc(f.placeholder)}"` : ""}>${esc(value)}</textarea>`;
    }
    return `<input data-field="${f.key}" value="${esc(value)}"` +
      (f.mono ? ` style="font-family:var(--mono)"` : "") +
      (f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : "") +
      locked + `>`;
  }

  function openForm(recordId) {
    editing = recordId || null;
    const src = recordId
      ? records.find(r => r.record_id === recordId) || {}
      : {};

    $("sigFormTitle").textContent = editing
      ? "Edit " + editing
      : "Add SIG record";
    $("sigFormSub").textContent = editing
      ? "Updating " + TABLE + " \u00b7 the record ID cannot be changed"
      : "A record ID is generated if you leave it blank";

    $("sigFormGrid").innerHTML = FIELDS.map(f => {
      const v = src[f.key] === null || src[f.key] === undefined ? "" : src[f.key];
      return `
        <div class="form-field ${f.full ? "full" : ""}">
          <label>${esc(f.label)}${f.required && !editing ? " *" : ""}</label>
          ${control(f, String(v))}
        </div>`;
    }).join("");

    $("sigFormNote").innerHTML = "";
    $("sigFormOverlay").classList.add("open");
    const first = $("sigFormGrid").querySelector("[data-field]:not([readonly])");
    if (first) first.focus();
  }

  function closeForm() {
    editing = null;
    $("sigFormOverlay").classList.remove("open");
  }

  function formNote(text, tone) {
    const el = $("sigFormNote");
    if (!el) return;
    el.innerHTML = text
      ? `<div class="empty-hint" style="color:${tone === "error"
          ? "var(--red-600)" : "var(--ink-500)"}">${esc(text)}</div>`
      : "";
  }

  async function saveForm() {
    const data = {};
    $("sigFormGrid").querySelectorAll("[data-field]").forEach(el => {
      data[el.dataset.field] = el.value.trim();
    });

    if (!data.rx_number) {
      formNote("Rx number is required.", "error");
      return;
    }

    const btn = $("sigFormSave");
    btn.disabled = true;
    btn.textContent = "Saving\u2026";

    try {
      let savedId;
      if (editing) {
        const body = await call("update", { caseId: editing, data });
        savedId = body.case.record_id;
        U.toast(editing + " updated.", "success");
      } else {
        const body = await call("create", { data });
        savedId = body.case.record_id;
        U.toast("Record " + savedId + " created.", "success");
      }
      closeForm();
      await load();
      const fresh = records.find(r => r.record_id === savedId);
      if (fresh) showRecord(fresh);
    } catch (e) {
      formNote(e.message || "Save failed", "error");
      U.toast(e.message || "Save failed", "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Save record";
    }
  }

  async function deleteRecord(recordId) {
    const r = records.find(x => x.record_id === recordId);
    if (!r) return;

    if (!confirm(`Delete ${recordId}\u2014 ${r.patient_name || r.rx_number}?` +
      `\n\nThis cannot be undone.`)) return;

    try {
      const res = await call("delete", { caseId: recordId });

      if (selected && selected.record_id === recordId) {
        selected = null;
        $("sigDetail").innerHTML = U.emptyState("No record selected",
          "Choose a row to see its extraction, classification and review detail.");
        $("sigDetailSub").textContent = "Select a record";
      }

      U.toast(recordId + " deleted" +
        (res.rowsDeleted ? " \u00b7 " + res.rowsDeleted + " row" : "") + ".", "success");
      await load();
    } catch (e) {
      U.toast(e.message || "Delete failed", "error");
    }
  }

  /* ---------------- Loading ---------------- */

  function banner(err) {
    const el = $("sigBanner");
    if (!el) return;
    el.innerHTML = err
      ? `<div class="card" style="border-left:4px solid var(--red-600);margin-bottom:12px;">
           <div class="card-head"><div class="card-title">SIG records could not be loaded</div>
             <button class="btn btn-outline btn-sm" id="sigRetry">${U.ICONS.refresh} Retry</button>
           </div>
           <div class="card-body">
             <div style="font-size:12px;color:var(--ink-700);margin-bottom:8px;">
               Records come from <span class="cell-mono">${esc(TABLE)}</span> through
               <span class="cell-mono">case-crud2o</span> with module
               <span class="cell-mono">${esc(MODULE)}</span>. Check that the table exists
               and the function has been redeployed with the sig registry entry.
             </div>
             ${U.infoItem("Error", err, { full: true, mono: true })}
           </div>
         </div>`
      : "";
    const retry = $("sigRetry");
    if (retry) retry.addEventListener("click", load);
  }

  async function load() {
    const state = $("sigState");
    if (state) {
      state.textContent = "\u25cf Loading SIG records\u2026";
      state.style.color = "var(--amber-500)";
    }
    try {
      const body = await call("list");
      records = body.cases || [];
      loadError = null;
      banner(null);
      if (state) {
        state.textContent = "\u25cf Live records connected \u00b7 " + records.length +
          " record" + (records.length === 1 ? "" : "s");
        state.style.color = "var(--green-600)";
      }
      if (selected) {
        selected = records.find(r => r.record_id === selected.record_id) || null;
      }
    } catch (e) {
      records = [];
      loadError = e.message || "Unable to load SIG records.";
      banner(loadError);
      if (state) {
        state.textContent = "\u25cf Record read failed";
        state.style.color = "var(--red-600)";
      }
    }
    render();
  }

  /* Read-only view for cross-module pages. */
  window.SIG_RECORDS = function () { return records.slice(); };

  window.EHR_MODULES.sig = {
    config: { SUPABASE_URL, ENDPOINT, MODULE, TABLE },

    mount(container) {
      records = [];
      selected = null;
      container.innerHTML = shell();

      $("sigRefresh").addEventListener("click", load);
      $("sigNew").addEventListener("click", () => openForm(null));
      $("sigFormClose").addEventListener("click", closeForm);
      $("sigFormCancel").addEventListener("click", closeForm);
      $("sigFormSave").addEventListener("click", saveForm);
      $("sigFormOverlay").addEventListener("click", e => {
        if (e.target.id === "sigFormOverlay") closeForm();
      });
      ["sigSearch", "sigDecision", "sigCode"].forEach(id => {
        $(id).addEventListener("input", render);
        $(id).addEventListener("change", render);
      });

      render();
      load();
    }
  };
})();

    [
      "ELMNumber",
      "ELM #",
      "ELM",
      1
    ]
  ]
};


/* ===== pages/protocol/protocol.js ===== */
/* =========================================================
   MODULE — PROTOCOL VALIDATION

   Laboratory manifest rule configuration: protocol rule sets,
   visit schedules, sample rules, visit aliases and field mappings,
   plus a resolver that shows which rule set a given protocol, study
   part, cohort and sample type lands on.

   Static by design. No Edge Function, no table, no API call. The
   configuration comes from protocol.data.js and can be replaced in
   the browser by uploading the source workbook; Reset returns to
   the seeded configuration.

   The uploaded workbook is parsed client-side with SheetJS, loaded
   on demand so the portal does not carry the dependency for pages
   that never use it.
   ========================================================= */

(function () {
  "use strict";

  const U = window.EHR;
  const $ = (id) => document.getElementById(id);
  const esc = U.esc;

  const SHEETJS_URL =
    "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";

  /* Sheet names the workbook may use, in order of preference. The
     first that exists wins, so a sheet renamed slightly still loads. */
  const SHEETS = {
    protocols: ["ProtocolConfig", "Protocols", "ProtocolConfigurations", "RuleSets"],
    visits:    ["VisitRules", "Visits", "VisitSchedules"],
    rules:     ["SampleRules", "Rules"],
    aliases:   ["VisitAliases", "Aliases"],
    fields:    ["FieldMappings", "Fields", "FieldMap"]

    { id: "overview",  label: "Overview" },
    { id: "protocols", label: "Protocol Configurations" },
    { id: "visits",    label: "Visit Schedules" },
    { id: "rules",     label: "Sample Rules" },
    { id: "aliases",   label: "Visit Aliases" },
    { id: "fields",    label: "Field Mappings" }
  ];

  let data = null;
  let view = "overview";
  let source = "Seeded configuration";
  let uploadNote = null;
  let search = { protocols: "", rules: "", aliases: "", fields: "" };

  /* Severity values the rules sheet uses, mapped to portal badges. */
  const SEVERITY = {
    "Reject": "badge-denied",
    "Review": "badge-review",
    "Warn":   "badge-review",
    "Info":   "badge-info",
    "Pass":   "badge-approved"
  };

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function resetData() {
    data = clone(window.PROTOCOL_SEED || {
      protocols: [], visits: {}, rules: [], aliases: [], fields: []
    });
    source = "Seeded configuration";
  }

  /* ---------------- Shell ---------------- */

  function shell() {

  /* ---------------- Overview ---------------- */

  function overviewHTML() {
    const protocolCount = new Set(data.protocols.map(p => p.protocol)).size;

      <div class="card">
        <div class="card-head">
          <div class="card-title">Test configuration resolution</div>
          <div class="card-sub">Which rule set a manifest would resolve to</div>
        </div>
        <div class="card-body">
          <div class="form-grid">

            </div>

                <option>Part 1</option>

  }

  function cohortGroup() {
    const part = $("pvPart").value;
    const cohort = $("pvCohort").value;
    if (part === "Part 1") return "SAD";
    if (["1", "2", "3", "4"].includes(cohort)) return "Escalation 1-4";
    if (cohort === "5") return "Escalation 5";
    return "Expansion";
  }

  function setCohorts() {
    const part = $("pvPart").value;
    const sel = $("pvCohort");

    if (part === "Part 1") {
      sel.innerHTML = "<option>SAD</option>";
      sel.disabled = true;
      $("pvCohortHelp").textContent =
        "Part 1 uses the configured SAD cohort group.";
    } else {
      sel.disabled = false;
      sel.innerHTML =
        "<option>1</option><option>2</option><option selected>3</option>" +
        "<option>4</option><option>5</option><option>Expansion</option>";
      $("pvCohortHelp").textContent =
        "For Part 2: cohorts 1\u20134 map to Escalation 1-4; cohort 5 maps to Escalation 5.";
    }
    resolve();
  }

  function resolve() {
    const g = cohortGroup();
    const match = data.protocols.find(x =>
      x.protocol === $("pvProtocol").value &&
      x.studyPart === $("pvPart").value &&
      x.cohortGroup === g);

    const type = $("pvSampleType").value;
    const scheduleConfigured = match && data.visits[match.ruleSetId] &&
      data.visits[match.ruleSetId][type];

    $("pvResolution").innerHTML = match
      ? `<div class="auth-callout">
           <div>
             <div class="info-item-label">Matched rule set</div>
             <div class="auth-num">${esc(match.ruleSetId)}</div>
             <div class="empty-hint" style="padding:6px 0 0;">
               Cohort group ${esc(g)} \u00b7 sample type ${esc(type)} \u00b7
               schedule ${scheduleConfigured ? "configured" : "not configured"} \u00b7
               configuration ${esc(match.status || "Active")}
             </div>
           </div>
           <span class="badge ${scheduleConfigured ? "badge-approved" : "badge-review"}">
             ${scheduleConfigured ? "Resolved" : "No schedule"}</span>
         </div>`
      : `<div class="ai-reasoning-box" style="background:var(--red-050);border-color:#E9B6B0;border-left-color:var(--red-600);">
           <b>No active configuration match</b><br>
           Review the protocol, study part and cohort. Looking for cohort group
           <span class="cell-mono">${esc(g)}</span>.
         </div>`;
  }

  function wireOverview() {
    $("pvProtocol").innerHTML = [...new Set(data.protocols.map(x => x.protocol))]
      .map(x => `<option>${esc(x)}</option>`).join("");

    const types = new Set();
    Object.keys(data.visits).forEach(k =>
      Object.keys(data.visits[k] || {}).forEach(t => types.add(t)));
    const typeList = [...types];

    $("pvSampleType").innerHTML = (typeList.length ? typeList : ["ADA", "CYTOKINE"])
      .map((t, i) => `<option${i === typeList.length - 1 ? " selected" : ""}>${esc(t)}</option>`)
      .join("");

    $("pvPart").addEventListener("change", setCohorts);
    $("pvProtocol").addEventListener("change", resolve);
    $("pvCohort").addEventListener("change", resolve);
    $("pvSampleType").addEventListener("change", resolve);

    setCohorts();
  }

  /* ---------------- Protocol configurations ---------------- */

  function protocolsHTML() {
    const q = search.protocols.toLowerCase();
    const rows = data.protocols.filter(x =>
      !q || Object.values(x).join(" ").toLowerCase().includes(q));

      <div class="filter-bar">

      <div class="card">

        </div>
        <div class="card-body flush">

                    <td>${esc(x.studyPart)}</td>
                    <td>${esc(x.cohortGroup)}</td>
                    <td class="cell-mono">${esc(x.ruleSetId)}</td>
                    <td>${esc(x.description)}</td>
                    <td><span class="badge badge-approved">
                      <span class="badge-dot"></span>${esc(x.status || "Active")}</span></td>

                  : `<tr><td colspan="6">${U.emptyState("No configurations match",
                      "Clear the search to see every rule set.")}</td></tr>`}

  /* ---------------- Visit schedules ---------------- */

  function visitsHTML() {
    return `
      <div class="card">
        <div class="card-head">
          <div class="card-title">Visit schedules</div>
          <div class="card-sub">Allowed visits per sample type</div>
        </div>
        <div class="card-body">
          <div class="form-grid">
            <div class="form-field full">
              <label>Rule set</label>
              <select id="pvRuleSet"></select>
            </div>
          </div>
          <div class="empty-hint" id="pvScheduleContext"></div>
          <div id="pvSchedule" style="margin-top:10px;"></div>
        </div>
      </div>`;
  }

  function showVisits() {
    const id = $("pvRuleSet").value;
    const v = data.visits[id] || {};
    const match = data.protocols.find(x => x.ruleSetId === id) || {};

    $("pvScheduleContext").textContent =
      [match.protocol, match.studyPart, match.cohortGroup]
        .filter(Boolean).join(" \u00b7 ") +
      " \u00b7 loaded from the active visit rules";

    const types = Object.keys(v);

    $("pvSchedule").innerHTML = types.length
      ? types.map((t, i) => `
          <div style="margin-top:${i ? 16 : 0}px;">
            ${U.sectionLabel(t + " allowed visits (" + v[t].length + ")")}
            <div style="display:flex;flex-wrap:wrap;gap:5px;">
              ${v[t].map(x => `<span class="badge ${i % 2 ? "badge-info" : "badge-teal"}">${esc(x)}</span>`).join("")}
            </div>
          </div>`).join("")
      : `<div class="empty-hint">No visit schedule configured for this rule set.</div>`;
  }

  function wireVisits() {
    const sel = $("pvRuleSet");
    sel.innerHTML = data.protocols.map(x =>
      `<option value="${esc(x.ruleSetId)}">${esc(x.ruleSetId)} \u2014 ${esc(x.protocol)}, ${esc(x.studyPart)}, ${esc(x.cohortGroup)}</option>`
    ).join("");
    sel.addEventListener("change", showVisits);
    if (data.protocols.length) showVisits();
    else $("pvSchedule").innerHTML =
      `<div class="empty-hint">No rule sets configured.</div>`;
  }

  /* ---------------- Sample rules ---------------- */

  function rulesHTML() {
    const q = search.rules.toLowerCase();
    const rows = data.rules.filter(r =>
      !q || r.join(" ").toLowerCase().includes(q));

    return `
      <div class="filter-bar">
        <div class="search-box">${U.ICONS.search}
          <input id="pvSearchRules" placeholder="Search rules"
            value="${esc(search.rules)}">
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">Sample rules</div>
          <div class="card-sub">${rows.length} rule${rows.length === 1 ? "" : "s"}</div>
        </div>
        <div class="card-body flush">
          <div class="table-wrap">
            <table class="data">
              <thead><tr>
                <th>Order</th><th>Rule</th><th>Sample Type</th>
                <th>Severity</th><th>Message</th>
              </tr></thead>
              <tbody>
                ${rows.length ? rows.map(r => `
                  <tr>
                    <td class="cell-mono">${esc(r[0])}</td>
                    <td class="cell-strong">${esc(r[1])}</td>
                    <td>${esc(r[2])}</td>
                    <td><span class="badge ${SEVERITY[r[3]] || "badge-new"}">${esc(r[3])}</span></td>
                    <td>${esc(r[4] || "Control rule")}</td>
                  </tr>`).join("")
                  : `<tr><td colspan="5">${U.emptyState("No rules match",
                      "Clear the search to see every rule.")}</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
      </div>`;
  }

  /* ---------------- Visit aliases ---------------- */

  function aliasesHTML() {
    const q = search.aliases.toLowerCase();
    const rows = data.aliases.filter(r =>
      !q || r.join(" ").toLowerCase().includes(q));

    return `
      <div class="filter-bar">
        <div class="search-box">${U.ICONS.search}
          <input id="pvSearchAliases" placeholder="Search aliases"
            value="${esc(search.aliases)}">
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">Visit aliases</div>
          <div class="card-sub">${rows.length} alias${rows.length === 1 ? "" : "es"}</div>
        </div>
        <div class="card-body flush">
          <div class="table-wrap">
            <table class="data">
              <thead><tr>
                <th>Incoming Value</th><th>Canonical Visit</th><th>Type</th>
              </tr></thead>
              <tbody>
                ${rows.length ? rows.map(r => `
                  <tr>
                    <td class="cell-mono">${esc(r[0])}</td>
                    <td class="cell-strong">${esc(r[1])}</td>
                    <td><span class="badge badge-teal">${esc(r[2])}</span></td>
                  </tr>`).join("")
                  : `<tr><td colspan="3">${U.emptyState("No aliases match",
                      "Clear the search to see every alias.")}</td></tr>`}
              </tbody>

      </div>`;
  }

  /* ---------------- Field mappings ---------------- */

  function fieldsHTML() {
    const q = search.fields.toLowerCase();
    const rows = data.fields.filter(r =>
      !q || r.join(" ").toLowerCase().includes(q));

    return `
      <div class="filter-bar">
        <div class="search-box">${U.ICONS.search}
          <input id="pvSearchFields" placeholder="Search field mappings"
            value="${esc(search.fields)}">
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">Field mappings</div>
          <div class="card-sub">${rows.length} mapping${rows.length === 1 ? "" : "s"}</div>
        </div>
        <div class="card-body flush">
          <div class="table-wrap">
            <table class="data">
              <thead><tr>
                <th>Canonical Field</th><th>Source Column</th>
                <th>Source System</th><th>Required</th>
              </tr></thead>
              <tbody>
                ${rows.length ? rows.map(r => `
                  <tr>
                    <td class="cell-strong">${esc(r[0])}</td>
                    <td>${esc(r[1])}</td>
                    <td><span class="badge badge-info">${esc(r[2])}</span></td>
                    <td class="cell-mono">${String(r[3]) === "1" || r[3] === 1
                      ? `<span class="badge badge-approved">Yes</span>`
                      : `<span class="badge">No</span>`}</td>
                  </tr>`).join("")
                  : `<tr><td colspan="4">${U.emptyState("No mappings match",
                      "Clear the search to see every mapping.")}</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
      </div>`;
  }

  /* ---------------- Workbook upload ---------------- */

  function loadSheetJs() {
    return new Promise((resolve, reject) => {
      if (window.XLSX) { resolve(window.XLSX); return; }

      const existing = document.getElementById("pvSheetJs");
      if (existing) {
        existing.addEventListener("load", () =>
          window.XLSX ? resolve(window.XLSX) : reject(new Error("unavailable")));
        existing.addEventListener("error", () => reject(new Error("unavailable")));
        return;
      }

      const s = document.createElement("script");
      s.id = "pvSheetJs";
      s.src = SHEETJS_URL;
      s.onload = () => window.XLSX ? resolve(window.XLSX) : reject(new Error("unavailable"));
      s.onerror = () => reject(new Error("unavailable"));
      document.head.appendChild(s);
    });
  }

  function pickSheet(wb, candidates) {
    for (const name of candidates) {
      const hit = wb.SheetNames.find(n =>
        n.toLowerCase().replace(/[\s_]/g, "") ===
        name.toLowerCase().replace(/[\s_]/g, ""));
      if (hit) return hit;
    }
    return null;
  }

  function rowsOf(wb, sheetName) {
    if (!sheetName) return [];
    return window.XLSX.utils.sheet_to_json(wb.Sheets[sheetName],
      { header: 1, blankrows: false, raw: false })
      .map(r => r.map(c => (c === undefined || c === null ? "" : String(c).trim())));
  }

  /* Header row is dropped when the first cell looks like a label rather
     than data, which is how these sheets are normally shaped. */
  function dropHeader(rows, firstColumnLooksLikeHeader) {
    if (!rows.length) return rows;
    const first = String(rows[0][0] || "").toLowerCase();
    return firstColumnLooksLikeHeader.some(h => first.includes(h))
      ? rows.slice(1) : rows;
  }

  function parseWorkbook(wb) {
    const next = { protocols: [], visits: {}, rules: [], aliases: [], fields: [] };

    /* Protocol configurations */
    const pRows = dropHeader(rowsOf(wb, pickSheet(wb, SHEETS.protocols)),
      ["rule", "protocol"]);
    pRows.forEach(r => {
      if (!r[0]) return;
      next.protocols.push({
        ruleSetId: r[0], protocol: r[1], studyPart: r[2],
        cohortGroup: r[3], description: r[4], status: r[5] || "Active"
      });
    });

    /* Visit rules: rule set, sample type, visit */
    const vRows = dropHeader(rowsOf(wb, pickSheet(wb, SHEETS.visits)),
      ["rule", "visit"]);
    vRows.forEach(r => {
      const id = r[0], type = r[1], visit = r[2];
      if (!id || !type || !visit) return;
      next.visits[id] = next.visits[id] || {};
      next.visits[id][type] = next.visits[id][type] || [];
      if (!next.visits[id][type].includes(visit)) next.visits[id][type].push(visit);
    });

    /* Sample rules, visit aliases and field mappings stay as arrays,
       which is the shape the tables already render. */
    next.rules   = dropHeader(rowsOf(wb, pickSheet(wb, SHEETS.rules)),
      ["order", "rule", "seq"]).filter(r => r[1]);
    next.aliases = dropHeader(rowsOf(wb, pickSheet(wb, SHEETS.aliases)),
      ["incoming", "alias", "source"]).filter(r => r[0]);
    next.fields  = dropHeader(rowsOf(wb, pickSheet(wb, SHEETS.fields)),
      ["canonical", "field", "target"]).filter(r => r[0]);

    return next;
  }

  function note(kind, text) {
    uploadNote = { kind, text };
    renderNote();
  }

  function renderNote() {
    const el = $("pvNote");
    if (!el) return;

    if (!uploadNote) { el.innerHTML = ""; return; }

    const tone = uploadNote.kind === "bad"
      ? "background:var(--red-050);border-color:#E9B6B0;border-left-color:var(--red-600);"
      : uploadNote.kind === "ok"
      ? "background:var(--green-050);border-color:#BFE3CE;border-left-color:var(--green-600);"
      : "";

    el.innerHTML =
      `<div class="ai-reasoning-box" style="margin-bottom:14px;${tone}">${uploadNote.text}</div>`;
  }

  function handleFile(file) {
    if (!file) return;

    note("info", "Reading <b>" + esc(file.name) + "</b>\u2026");

    loadSheetJs().then(XLSX => {
      const reader = new FileReader();

      reader.onload = (e) => {
        try {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
          const parsed = parseWorkbook(wb);

          if (!parsed.protocols.length) {
            note("bad",
              "<b>No protocol configurations found.</b><br>" +
              "Expected a sheet named one of: " +
              SHEETS.protocols.map(s => "<span class='cell-mono'>" + s + "</span>").join(", ") +
              ". The workbook has: " +
              wb.SheetNames.map(s => "<span class='cell-mono'>" + esc(s) + "</span>").join(", ") + ".");
            return;
          }

          data = parsed;
          source = file.name;
          U.toast("Configuration loaded from " + file.name, "success");

          note("ok",
            "<b>Configuration loaded from " + esc(file.name) + "</b><br>" +
            parsed.protocols.length + " rule sets \u00b7 " +
            Object.keys(parsed.visits).length + " visit schedules \u00b7 " +
            parsed.rules.length + " rules \u00b7 " +
            parsed.aliases.length + " aliases \u00b7 " +
            parsed.fields.length + " field mappings. " +
            "This session only \u2014 nothing is saved.");

          switchView("overview");
        } catch (err) {
          note("bad", "<b>Could not read that workbook.</b><br>" + esc(err.message));
        }
      };

      reader.onerror = () =>
        note("bad", "<b>Could not read the file from disk.</b>");

      reader.readAsArrayBuffer(file);
    }).catch(() => {
      note("bad",
        "<b>The Excel reader could not be loaded.</b><br>" +
        "This machine cannot reach the CDN. Save the sheet as CSV and upload that instead.");
    });
  }

  /* ---------------- Rendering ---------------- */

  const VIEWS = {
    overview: overviewHTML,
    protocols: protocolsHTML,
    visits: visitsHTML,
    rules: rulesHTML,
    aliases: aliasesHTML,
    fields: fieldsHTML
  };

  function switchView(next) {
    view = next;

    document.querySelectorAll("#pvTabs .tab").forEach(b =>
      b.classList.toggle("active", b.dataset.view === next));

    $("pvView").innerHTML = (VIEWS[next] || overviewHTML)();
    $("pvSource").textContent = "Configuration source: " + source;

    if (next === "overview") wireOverview();
    if (next === "visits") wireVisits();

    /* Search boxes re-render their own tab, so the value is carried
       back in from state rather than lost on each keystroke. */
    const searchBoxes = {
      protocols: "pvSearchProtocols",
      rules: "pvSearchRules",
      aliases: "pvSearchAliases",
      fields: "pvSearchFields"
    };
    const boxId = searchBoxes[next];
    if (boxId && $(boxId)) {
      const box = $(boxId);
      box.addEventListener("input", () => {
        search[next] = box.value;
        const at = box.selectionStart;
        switchView(next);
        const again = $(boxId);
        if (again) { again.focus(); again.setSelectionRange(at, at); }
      });
    }
  }

  /* ---------------- Module contract ---------------- */

  window.EHR_MODULES.protocol = {
    mount(container) {
      resetData();
      view = "overview";
      uploadNote = null;
      search = { protocols: "", rules: "", aliases: "", fields: "" };

      container.innerHTML = shell();

      document.querySelectorAll("#pvTabs .tab").forEach(b =>
        b.addEventListener("click", () => switchView(b.dataset.view)));

      $("pvUploadBtn").addEventListener("click", () => $("pvFileInput").click());
      $("pvFileInput").addEventListener("change", () => {

/* ===== pages/reports/reports.js ===== */
/* =========================================================
   MODULE — REPORTS
   Operational summary across every area of the portal. Like
   Patient Lookup, it reads what the modules already hold rather
   than issuing queries of its own, so no table, endpoint or Edge
   Function is involved.
   ========================================================= */

(function () {
  "use strict";

  const U = window.EHR;
  const $ = (id) => document.getElementById(id);
  const esc = U.esc;

  function referrals() {
    return (window.REFERRAL_PATIENTS && window.REFERRAL_PATIENTS()) || [];
  }
  function paCases() {
    return (window.PRIORAUTH_CASES_LIVE && window.PRIORAUTH_CASES_LIVE()) || window.PRIORAUTH_CASES || [];
  }
  function payerCases() {
    return (window.PAYER_CASES && window.PAYER_CASES()) || [];
  }
  function providerRecords() {
    return (window.PROVIDER_RECORDS && window.PROVIDER_RECORDS()) || [];
  }

  /* Count occurrences of a field, biggest first. */
  function tally(rows, pick) {
    const counts = {};
    rows.forEach(r => {
      const v = U.clean(pick(r)) || "Not recorded";
      counts[v] = (counts[v] || 0) + 1;
    });
    return Object.entries(counts).sort((a, b) => b[1] - a[1]);
  }

  function barTable(pairs, total, emptyMsg) {
    if (!pairs.length) return `<div class="empty-hint">${esc(emptyMsg)}</div>`;
    const max = Math.max(...pairs.map(p => p[1])) || 1;
    return pairs.map(([label, n]) => `
      <div class="conf-row">
        <div class="conf-label">${esc(label)}</div>
        <div class="conf-bar-track">
          <div class="conf-bar-fill" style="width:${Math.round((n / max) * 100)}%"></div>
        </div>
        <div class="conf-pct">${n}</div>
      </div>`).join("");
  }

  function card(title, sub, body) {
    return `
      <div class="card">
        <div class="card-head">
          <div class="card-title">${esc(title)}</div>
          ${sub ? `<div class="card-sub">${esc(sub)}</div>` : ""}
        </div>
        <div class="card-body">${body}</div>
      </div>`;
  }

  function render() {
    const refs = referrals();
    const pa = paCases();
    const payer = payerCases();

    const urgent = refs.filter(r =>
      /urgent|stat/i.test(U.clean(r.urgency))).length;
    const withDocs = refs.filter(r => r.docs && r.docs.length).length;
    const submitted = pa.filter(c => c.status === "Submitted").length;
    const decided = payer.filter(c =>
      ["APPROVED", "APPROVED_WITH_CONDITIONS", "DENIED"].includes(c.status)).length;

    $("rpKpi").innerHTML = [
      U.kpi("Referrals", refs.length, "navy"),
      U.kpi("Urgent referrals", urgent, "red"),
      U.kpi("PA cases", pa.length, "amber"),
      U.kpi("PA submitted", submitted, "green"),
      U.kpi("Payer requests", payer.length, ""),
      U.kpi("Determinations", decided, "green"),
    ].join("");

    $("rpBody").innerHTML = `
      ${U.sectionLabel("Referral Management")}
      <div class="home-grid">
        ${card("Referrals by specialty", refs.length + " total",
          barTable(tally(refs, r => r.type), refs.length,
            "Open Referral Management once to load live records."))}
        ${card("Referrals by status", "",
          barTable(tally(refs, r => r.status), refs.length,
            "No referral records loaded yet."))}
        ${card("Documentation", withDocs + " of " + refs.length + " have documents",
          barTable(tally(refs, r => (r.docs && r.docs.length) ? "Has documents" : "No documents"),
            refs.length, "No referral records loaded yet."))}
      </div>

      ${U.sectionLabel("Prior Authorization")}
      <div class="home-grid">
        ${card("Cases by status", pa.length + " in queue",
          barTable(tally(pa, c => c.status), pa.length, "No PA cases."))}
        ${card("Cases by payer", "",
          barTable(tally(pa, c => c.payer), pa.length, "No PA cases."))}
        ${card("Cases by priority", "",
          barTable(tally(pa, c => c.priority), pa.length, "No PA cases."))}
      </div>

      ${U.sectionLabel("Payer Review")}
      <div class="home-grid">
        ${card("Requests by status", payer.length + " total",
          barTable(tally(payer, c => c.status), payer.length, "No payer requests."))}
        ${card("Requests by plan", "",
          barTable(tally(payer, c => c.payerShort || c.payer), payer.length, "No payer requests."))}
        ${card("Requested procedures", "",
          barTable(tally(payer, c => c.procedure), payer.length, "No payer requests."))}
      </div>

      ${U.sectionLabel("Provider source system")}
      <div class="home-grid">
        ${card("Providers by specialty", providerRecords().length + " on file",
          barTable(tally(providerRecords(), p => p.specialty), providerRecords().length,
            "Open Provider once to load the source system."))}
        ${card("Providers by state", "",
          barTable(tally(providerRecords(), p => p.state), providerRecords().length,
            "No provider records loaded yet."))}
        ${card("Providers by practice", "",
          barTable(tally(providerRecords(), p => p.practiceName), providerRecords().length,
            "No provider records loaded yet."))}
      </div>

      ${U.sectionLabel("Referring providers")}
      <div class="card"><div class="card-body">
        ${barTable(tally(refs, r => r.provider), refs.length,
          "Provider activity appears once referral records are loaded.")}
      </div></div>

      <div class="footer-note">
        Figures reflect what is currently loaded in this session, not a historical report.
      </div>`;
  }

  window.EHR_MODULES.reports = {
    mount(container) {
      container.innerHTML = U.pageHead({
        module: "Reports",
        title: "Operational Reports",
        sub: "Activity across referrals, prior authorization and payer review",
        actions: `<button class="btn btn-outline btn-sm" id="rpRefresh">${U.ICONS.refresh} Refresh</button>`
      }) + `
        <div class="module-body">
          <div class="kpi-row six" id="rpKpi"></div>
          <div id="rpBody"></div>
        </div>`;

      $("rpRefresh").addEventListener("click", () => {
        render();
        U.toast("Reports refreshed.", "success");
      });

      render();

      /* Referral figures only exist after that module has read Supabase. */
      setTimeout(render, 1800);
    }
  };
})();

  /* The original script ran at page load and attached its listeners
     immediately. In the portal it runs when the module mounts, once
     the markup above is in the document. */
  function bootClaims() {

    /* =========================================================================
       DATA FORMAT — full batch (Load Data)
       {
         "batch": { "batchId": "string", "sourceFile": "string", "payer": "string" },
         "claims": [
           { "claimId","channel":"EDI|PAPER","member","memberId","provider","providerNpi",
             "dateOfService","receivedDate","placeOfService","diagnoses":[],
             "lineItems":[{"cpt","modifiers":[],"units","billed"}], "totalBilled",
             "findings": [{"rule","label","severity","detail","duplicateOf"}] }
         ]
       }
       band and disposition are DERIVED from findings — you never set them directly:
         - band: Critical if any finding is Critical, else High if any is High, else Low
         - disposition: "Pending" if any finding present, else "AutoCleared"

       DATA FORMAT — additive findings (Add Findings)
       {
         "rule": "R001", "label": "Duplicate Claim", "severity": "Critical",
         "detail": "default text applied to every matched claim",
         "match": { "claimIds": ["CLM-012"] }        // or { "providerNpi": "2384710655" }
         // OR, for per-claim overrides:
         "items": [{ "claimId": "CLM-012", "detail": "...", "duplicateOf": "CLM-011" }]
       }
       ========================================================================= */

    const RULE_TABS = ["R001","R002","R003","R004","R005","R006"];

      const best = [p.utilization, p.coding].sort((a,b)=>b.score-a.score)[0];
      return {
        score: best.score,
        band: best.band,
        indicator: best.indicator,
        claimIds: Array.from(new Set([...(p.utilization.claimIds||[]), ...(p.coding.claimIds||[])])),

    function computeBand(findings) {
      if ((findings||[]).some(f => f.severity === "Critical")) return "Critical";
      if ((findings||[]).some(f => f.severity === "High")) return "High";
      return "Low";
    }
    function computeDisposition(findings) { return (findings||[]).length ? "Pending" : "AutoCleared"; }

    function rebuildIndex() {
      claimsById = {};
      DATA.claims.forEach(c => {
        c.band = computeBand(c.findings);
        // Preserve the persisted review state returned by get-batch.
        // Only derive the initial state when the claim has never been reviewed.
        if (!c.disposition) {
          c.disposition = computeDisposition(c.findings);
        }
        if (c.disposition === "Reviewed" && !c.reviewAction) {
          c.reviewAction = null;
        }
        claimsById[c.claimId] = c;
      });

          headers: { "Authorization": `Bearer ${SUPABASE_ANON_KEY}` },

        if (!res.ok) throw new Error(obj.error || `HTTP ${res.status}`);

    async function loadAvailableBatches() {
      const select = document.getElementById("supabase-batch-id");
      const meta = document.getElementById("supabase-batch-meta");
      if (!select) return;

      select.disabled = true;
      select.innerHTML = '<option value="">Loading batches...</option>';
      if (meta) meta.textContent = "";

      try {
        const res = await fetch(`${SUPABASE_FUNCTIONS_BASE}/list-batches`, {
          headers: { "Authorization": `Bearer ${SUPABASE_ANON_KEY}` },
        });
        const payload = await res.json();
        if (!res.ok) throw new Error(payload.error || `HTTP ${res.status}`);

        const batches = Array.isArray(payload.batches) ? payload.batches : [];
        select.innerHTML = "";

        if (!batches.length) {
          select.innerHTML = '<option value="">No batches available</option>';
          select.disabled = true;
          if (meta) meta.textContent = "No batches are currently available.";
          return;
        }

        select.disabled = false;
        select.insertAdjacentHTML("beforeend", '<option value="">Select a batch...</option>');

        batches.forEach((batch) => {
          const option = document.createElement("option");
          option.value = batch.batchId;
          option.textContent = batch.batchId + (batch.sourceFile ? ` — ${batch.sourceFile}` : "");
          option.dataset.sourceFile = batch.sourceFile || "";
          option.dataset.payer = batch.payer || "";
          select.appendChild(option);
        });

        select.onchange = async () => {
          const batchId = select.value;
          const selected = select.options[select.selectedIndex];

          if (meta) {
            const parts = [];
            if (selected?.dataset?.sourceFile) parts.push(selected.dataset.sourceFile);
            if (selected?.dataset?.payer) parts.push(selected.dataset.payer);
            meta.textContent = parts.join(" • ");
          }

          if (!batchId) return;

          select.disabled = true;
          try {
            await loadSupabaseBatch(batchId);
          } finally {
            select.disabled = false;
          }
        };

        batchesLoadedForModal = true;
      } catch (err) {
        console.error(err);
        select.innerHTML = '<option value="">Unable to load batches</option>';
        select.disabled = true;
        showLoadError(err.message || "Unable to load available batches.");
      }

    /* ---------------- Add Findings modal (additive merge) ---------------- */
    document.getElementById("apply-findings-btn").addEventListener("click", () => {
      const errEl = document.getElementById("findings-error"), noteEl = document.getElementById("findings-note");

      let payload;
      try { payload = JSON.parse(document.getElementById("findings-paste").value); }

      // Shape 1: the Provider Utilization & Coding Distribution agent's actual
      // output — { batchId, providers: [{ providerNpi, providerName, ...,
      // currentBatch, utilization, codingDistribution }] }. Updates both the
      // dedicated R005/R006 provider tables AND attaches claim-level findings.
      if (Array.isArray(payload.providers)) {
        let providersUpdated = 0, findingsApplied = 0; const missingClaims = []; const npiMismatches = [];

        payload.providers.forEach(p => {
          const claimIds = (p.currentBatch && p.currentBatch.claimIds) || [];
          const u = p.utilization || {}, c = p.codingDistribution || {};
          const [baseLow, baseHigh] = (u.typicalDayRange || "0-0").split("-").map(n => parseInt(n, 10));

          // Match by NPI first; fall back to an exact name match if the NPI
          // doesn't line up. Reference data sources sometimes disagree on a
          // provider's NPI (e.g. a corrected check-digit vs. an older value)
          // while agreeing on the name — without this fallback, that mismatch
          // creates a second, duplicate row for the same real-world provider.
          let existingIdx = PROVIDER_ANALYSIS.findIndex(x => x.npi === p.providerNpi);
          let matchedByName = false;
          if (existingIdx < 0 && p.providerName) {
            existingIdx = PROVIDER_ANALYSIS.findIndex(x => x.name === p.providerName);
            if (existingIdx >= 0) {
              matchedByName = true;
              npiMismatches.push({ name: p.providerName, dashboardNpi: PROVIDER_ANALYSIS[existingIdx].npi, agentNpi: p.providerNpi });
              console.warn(`Provider "${p.providerName}" matched by name, not NPI — `
                + `dashboard has ${PROVIDER_ANALYSIS[existingIdx].npi}, agent sent ${p.providerNpi}. `
                + `These should be reconciled at the data source.`);
            }
          }
          // On a name-only match, keep the dashboard's existing NPI rather than
          // overwriting it with the agent's — the existing one is presumably
          // already-corrected reference data; only the analysis figures should
          // update from the agent's output.
          const resolvedNpi = matchedByName ? PROVIDER_ANALYSIS[existingIdx].npi : p.providerNpi;

          const entry = {
            npi: resolvedNpi, name: p.providerName, specialty: p.specialty, peerGroup: p.peerGroup,
            utilization: {
              currentClaimCount: (p.currentBatch && p.currentBatch.claimCount) || 0,
              providerBaselineLow: baseLow, providerBaselineHigh: baseHigh,
              score: u.priorityScore || 0, band: u.band || "Low",
              indicator: u.materiallyDivergent ? "UTILIZATION_VOLUME" : "NO_MATERIAL_VOLUME_ANOMALY",
              reasoning: u.reasoning || "", claimIds,
              dateOfService: (claimsById[claimIds[0]] || {}).dateOfService || "",
            },
            coding: {
              codingCpt: p.monitoredCpt, currentBatchCptCount: (p.currentBatch && p.currentBatch.claimCount) || 0,
              historicalCptCount: c.historicalMonitoredCptCount || 0, historicalTotalClaimCount: c.historicalTotalClaimCount || 0,
              providerPercentage: c.historicalCptPercentage || 0, peerPercentage: c.peerCptPercentage || 0,
              differencePp: Math.round(((c.historicalCptPercentage || 0) - (c.peerCptPercentage || 0)) * 10) / 10,
              score: c.priorityScore || 0, band: c.band || "Low",
              indicator: c.materiallyDivergent ? "CODING_DISTRIBUTION" : "NO_MATERIAL_DIVERGENCE",
              reasoning: c.reasoning || "", claimIds: c.materiallyDivergent ? claimIds : [],
            },
          };

          if (existingIdx >= 0) PROVIDER_ANALYSIS[existingIdx] = entry; else PROVIDER_ANALYSIS.push(entry);
          providersUpdated++;

          [["utilization", "R005", "Provider Utilization Volume", u.materiallyDivergent, u.band, u.reasoning],
           ["codingDistribution", "R006", "Peer-Relative Coding Intensity", c.materiallyDivergent, c.band, c.reasoning]]
            .forEach(([, rule, label, divergent, band, reasoning]) => {
              if (!divergent) return;
              claimIds.forEach(claimId => {
                const claim = claimsById[claimId];
                if (!claim) { missingClaims.push(claimId); return; }
                claim.findings = (claim.findings || []).filter(f => f.rule !== rule);
                claim.findings.push({ rule, label, severity: band === "Critical" ? "Critical" : "High", detail: reasoning });
                findingsApplied++;
              });
            });
        });

        rebuildIndex();
        renderAll();
        let msg = `Updated ${providersUpdated} provider(s), applied ${findingsApplied} claim-level finding(s).`;
        if (missingClaims.length) msg += ` Claims not found: ${[...new Set(missingClaims)].join(", ")}.`;
        if (npiMismatches.length) {
          msg += ` NPI mismatch reconciled by name for: ${npiMismatches.map(m => `${m.name} (dashboard has ${m.dashboardNpi}, agent sent ${m.agentNpi})`).join("; ")}. Fix the source reference data when possible.`;
        }
        noteEl.textContent = msg; noteEl.classList.add("show");
        showToast(`<strong>Agent output applied</strong> — ${providersUpdated} provider(s) updated.`);
        return;
      }

      if (!payload.rule) { errEl.textContent = "Missing \"rule\" (or provide a \"providers\" array from the agent)."; errEl.classList.add("show"); return; }
      const rule = payload.rule, label = payload.label || RULE_LABELS[rule] || rule, severity = payload.severity || "High";

      let targets = [];
      if (Array.isArray(payload.items)) {
        targets = payload.items.map(it => ({
          claimId: it.claimId, detail: it.detail || payload.detail, duplicateOf: it.duplicateOf || payload.duplicateOf,
          severity: it.severity || severity, label: it.label || label, rule: it.rule || rule,

      } else if (payload.match) {
        let matched = DATA.claims;
        if (payload.match.claimIds) matched = matched.filter(c => payload.match.claimIds.includes(c.claimId));
        else if (payload.match.providerNpi) matched = matched.filter(c => c.providerNpi === payload.match.providerNpi);
        else { errEl.textContent = "\"match\" needs \"claimIds\" or \"providerNpi\"."; errEl.classList.add("show"); return; }
        targets = matched.map(c => ({ claimId: c.claimId, detail: payload.detail, duplicateOf: payload.duplicateOf, severity, label, rule }));
      } else {
        errEl.textContent = "Provide either \"items\" or \"match\"."; errEl.classList.add("show"); return;

      let matchedCount = 0; const missing = [];
      targets.forEach(t => {
        const claim = claimsById[t.claimId];
        if (!claim) { missing.push(t.claimId); return; }
        claim.findings = (claim.findings||[]).filter(f => f.rule !== t.rule);
        claim.findings.push({ rule: t.rule, label: t.label, severity: t.severity, detail: t.detail, duplicateOf: t.duplicateOf });
        matchedCount++;
      });
      rebuildIndex();
      renderAll();

      let msg = `Applied "${label}" (${rule}) to ${matchedCount} claim${matchedCount===1?"":"s"}.`;
      if (missing.length) msg += ` Not found: ${missing.join(", ")}.`;
      noteEl.textContent = msg; noteEl.classList.add("show");
      showToast(`<strong>Findings applied</strong> — ${matchedCount} claim${matchedCount===1?"":"s"} updated.`);

      // Each rule tab has its own copy of the claim rows. Do NOT use

      Array.prototype.forEach.call(tbody.querySelectorAll(".claim-row"), row => {

          const id = row.dataset.claim;

          if (!wrap) return;

          const isOpen = wrap.classList.contains("open");
          Array.prototype.forEach.call(tbody.querySelectorAll(".detail-wrap"), w => w.classList.remove("open"));
          Array.prototype.forEach.call(tbody.querySelectorAll(".claim-row"), r => r.classList.remove("expanded"));

            wrap.classList.add("open");
            row.classList.add("expanded");
