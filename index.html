  }

  function closeCase() { openId = null; $("paOverlay").classList.remove("open"); }

  function startPA(id) {
    const c = cases.find(x => x.id === id);
    c.status = "In Progress"; c.owner = "PA Team";
    render(); openCase(id);
    U.toast(id + " moved to In Progress", "success");
  }

  function submitPA(id) {
    const c = cases.find(x => x.id === id);
    if (c.scenario === "complex" && c.status !== "Ready for Nurse Review") {
      c.status = "Ready for Nurse Review"; c.owner = "Nurse Review";
      render(); openCase(id);
      U.toast(id + " sent to nurse review", "success");
    } else {
      c.status = "Submitted";
      render(); openCase(id);
      U.toast(id + " submitted successfully", "success");
    }
  }

  /* ---------------- Case create / edit / delete ----------------
     Cases are stored in pa_case_s through case-crud2o. Workflow
     state (Start PA, Submit PA) stays in memory. */

  const FORM_FIELDS = [
    { key: "patient",     label: "Patient name",        required: true },
    { key: "dob",         label: "Date of birth",       placeholder: "MM/DD/YYYY" },
    { key: "member",      label: "Member ID" },
    { key: "payer",       label: "Payer" },
    { key: "procedure",   label: "Procedure" },
    { key: "cpt",         label: "CPT code" },
    { key: "diagnosis",   label: "Diagnosis",           full: true },
    { key: "physician",   label: "Referring physician" },
    { key: "npi",         label: "NPI" },
    { key: "requirement", label: "Prior auth required", full: true },
    { key: "priority",    label: "Priority",  options: ["Standard", "High"] },
    { key: "status",      label: "Status",
      options: ["Pending Intake", "In Progress", "Ready for Nurse Review", "Submitted"] },
    { key: "owner",       label: "Owner" },
    { key: "label",       label: "Case label" },
    { key: "outcome",     label: "Expected outcome", full: true, textarea: true },
  ];

  function formControl(f, value) {
    if (f.options) {
      return `<select data-field="${f.key}">` +
        f.options.map(o =>
          `<option${o === value ? " selected" : ""}>${esc(o)}</option>`).join("") +
        `</select>`;
    }
    if (f.textarea) {
      return `<textarea data-field="${f.key}">${esc(value)}</textarea>`;
    }
    return `<input data-field="${f.key}" value="${esc(value)}"` +
      (f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : "") + `>`;
  }

  function openCaseForm(caseId) {
    editingCase = caseId ? cases.find(c => c.id === caseId) : null;
    const source = editingCase || {};

    $("paFormTitle").textContent = editingCase
      ? "Edit " + editingCase.id
      : "New PA case";
    $("paFormSub").textContent = editingCase
      ? "Updating pa_case_s \u00b7 the case ID cannot be changed"
      : "A case ID is generated automatically";

    $("paFormGrid").innerHTML = FORM_FIELDS.map(f => `
      <div class="form-field ${f.full ? "full" : ""}">
        <label>${esc(f.label)}${f.required ? " *" : ""}</label>
        ${formControl(f, source[f.key] || "")}
      </div>`).join("");

    $("paFormNote").innerHTML = "";
    $("paFormOverlay").classList.add("open");
    const first = $("paFormGrid").querySelector("[data-field]");
    if (first) first.focus();
  }

  function closeCaseForm() {
    editingCase = null;
    $("paFormOverlay").classList.remove("open");
  }

  function formNote(text, tone) {
    const el = $("paFormNote");
    if (!el) return;
    el.innerHTML = text
      ? `<div class="empty-hint" style="color:${tone === "error" ? "var(--red-600)" : "var(--ink-500)"}">${esc(text)}</div>`
      : "";
  }

  async function saveCaseForm() {
    const form = {};
    $("paFormGrid").querySelectorAll("[data-field]").forEach(el => {
      form[el.dataset.field] = el.value.trim();
    });

    if (!form.patient) {
      formNote("Patient name is required.", "error");
      return;
    }

    const btn = $("paFormSave");
    btn.disabled = true;
    btn.textContent = "Saving\u2026";

    try {
      if (editingCase) {
        await window.PA_CASES.update(editingCase.id, form);
        U.toast(editingCase.id + " updated.", "success");
      } else {
        const created = await window.PA_CASES.create(form);
        U.toast("Case " + created.id + " created.", "success");
      }
      closeCaseForm();
      await loadCases();
    } catch (e) {
      formNote(e.message || "Save failed", "error");
      U.toast(e.message || "Save failed", "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Save case";
    }
  }

  async function deleteCase(caseId) {
    const c = cases.find(x => x.id === caseId);
    if (!c) return;

    const stored = (uploads[caseId] || []).length;
    const warning = stored
      ? `\n\nThis will also delete ${stored} stored document${stored === 1 ? "" : "s"} and the file${stored === 1 ? "" : "s"} behind them.`
      : "";

    if (!confirm(`Delete ${caseId} \u2014 ${c.patient}?${warning}\n\nThis cannot be undone.`)) return;

    try {
      const res = await window.PA_CASES.remove(caseId);
      delete uploads[caseId];
      if (openId === caseId) closeCase();

      const extra = res.documentsDeleted
        ? ` and ${res.documentsDeleted} document${res.documentsDeleted === 1 ? "" : "s"}`
        : "";
      U.toast(caseId + " deleted" + extra + ".", "success");
      await loadCases();
    } catch (e) {
      U.toast(e.message || "Delete failed", "error");
    }
  }

  function caseBanner(err) {
    const el = $("paCaseBanner");
    if (!el) return;
    el.innerHTML = err
      ? `<div class="card" style="border-left:4px solid var(--red-600);margin-bottom:12px;">
           <div class="card-head"><div class="card-title">Cases could not be loaded</div>
             <button class="btn btn-outline btn-sm" id="paCaseRetry">${U.ICONS.refresh} Retry</button>
           </div>
           <div class="card-body">
             <div style="font-size:12px;color:var(--ink-700);margin-bottom:8px;">
               The case list comes from ${esc(CONFIG.tables.cases)} through ${esc(CONFIG.caseFunction)}.
               Check that the table exists and the function is deployed.
             </div>
             ${U.infoItem("Error", err, { full: true, mono: true })}
           </div>
         </div>`
      : "";
    const retry = $("paCaseRetry");
    if (retry) retry.addEventListener("click", loadCases);
  }

  async function loadCases() {
    try {
      cases = await window.PA_CASES.list();
      caseError = null;
    } catch (e) {
      cases = [];
      caseError = e.message || "Unable to load cases.";
    }
    caseBanner(caseError);
    render();
  }

  /* Read-only view of the live PA cases for cross-module pages. */
  window.PRIORAUTH_CASES_LIVE = function () { return cases.slice(); };

  window.EHR_MODULES.priorauth = {
    config: CONFIG,
    mount(container) {
      cases = [];
      container.innerHTML = shell();

      ["paSearch", "paStatus", "paScenario"].forEach(id => {
        $(id).addEventListener("input", render);
        $(id).addEventListener("change", render);
      });
      $("paNewCase").addEventListener("click", () => openCaseForm(null));
      $("paReload").addEventListener("click", loadCases);
      $("paFormClose").addEventListener("click", closeCaseForm);
      $("paFormCancel").addEventListener("click", closeCaseForm);
      $("paFormSave").addEventListener("click", saveCaseForm);
      $("paFormOverlay").addEventListener("click", e => {
        if (e.target.id === "paFormOverlay") closeCaseForm();
      });
      $("paOverlay").addEventListener("click", e => {
        if (e.target.id === "paOverlay") closeCase();
      });

      render();
      loadCases();
    }
  };
})();


/* ===== pages/payer/payer.cases.js ===== */
/* =========================================================
   PAYER REVIEW — CASE API CLIENT
   Requests now live in Supabase rather than in the browser. Review
   workflow state (IXP extraction, AI validation, case-manager
   decisions, determination letters) stays in memory by design, so
   a demo can be re-run without touching the database.
   ========================================================= */

window.PAYER_CASES_API = (function () {
  "use strict";

  /* ---------- MODULE CONFIG — Payer Review only ---------- */
  const SUPABASE_URL = "https://wysnjsnbraiwopolgxgv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_rUdw6p2HW394IjHoMexMXw_GhEYimpQ";

  const ENDPOINT = SUPABASE_URL + "/functions/v1/case-crud2o";
  const MODULE = "payer";
  const TABLE = "payer_case_s";
  /* ------------------------------------------------------- */

  function headers() {
    return {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    };
  }

  function who() {
    const u = window.EHR_SESSION && window.EHR_SESSION.get();
    return u ? u.name : "";
  }

  async function call(action, payload) {
    const r = await fetch(ENDPOINT, {
      method: "POST",
      headers: headers(),
      body: JSON.stringify(Object.assign({ module: MODULE, action }, payload || {}))
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || action + " failed");
    }
    return body;
  }

  /* Database row -> the shape PayerConnect already renders, with the
     in-memory workflow objects attached so nothing downstream breaks. */
  function toCase(row) {
    return {
      id: row.payer_case_id,
      rowId: row.id,
      memberId: row.member_id || "",
      patientName: row.patient_name || "",
      dob: row.dob || "",
      payer: row.payer || "",
      payerShort: row.payer_short || "",
      planType: row.plan_type || "",
      provider: row.provider || "",
      providerOrg: row.provider_org || "",
      npi: row.npi || "",
      procedure: row.procedure || "",
      cptList: Array.isArray(row.cpt_list) ? row.cpt_list : [],
      diagnosisCode: row.diagnosis_code || "",
      diagnosisName: row.diagnosis_name || "",
      submitted: row.submitted || "",
      channel: row.channel || "Provider Portal",
      priority: row.priority || "Standard",
      status: row.status || "NEW",
      createdBy: row.created_by || "",
      createdAt: row.created_at || "",

      /* Workflow state, memory only. */
      authNumber: null, authValidFrom: null, authValidTo: null,
      documents: [],
      ixp: { ran: false, docs: {} },
      ai: { ran: false, decision: null, confidence: 0,
            criteriaMet: [], criteriaMissing: [], reasoning: "" },
      caseManager: { notes: "", decision: null, name: null, decidedAt: null },
      criteriaRef: null
    };
  }

  function toRow(form) {
    return {
      payer_case_id: form.id || "",
      member_id: form.memberId,
      patient_name: form.patientName,
      dob: form.dob,
      payer: form.payer,
      payer_short: form.payerShort,
      plan_type: form.planType,
      provider: form.provider,
      provider_org: form.providerOrg,
      npi: form.npi,
      procedure: form.procedure,
      cpt_list: form.cptList,
      diagnosis_code: form.diagnosisCode,
      diagnosis_name: form.diagnosisName,
      submitted: form.submitted,
      channel: form.channel,
      priority: form.priority,
      status: form.status,
      created_by: who()
    };
  }

  return {
    async list() {
      const body = await call("list");
      return (body.cases || []).map(toCase);
    },
    async create(form) {
      const body = await call("create", { data: toRow(form) });
      return toCase(body.case);
    },
    async update(caseId, form) {
      const body = await call("update", { caseId, data: toRow(form) });
      return toCase(body.case);
    },
    /* Removes the request, its document rows and the stored files. */
    async remove(caseId) {
      return await call("delete", { caseId });
    },
    config: { SUPABASE_URL, ENDPOINT, MODULE, TABLE }
  };
})();


/* ===== pages/payer/payer.storage.js ===== */
/* =========================================================
   PAYER REVIEW — DOCUMENT STORAGE CLIENT
   This module's own backend configuration. It is intentionally
   declared here rather than shared, so Payer Review can be pointed
   at a different project, bucket or function set without touching
   any other POC.
   ========================================================= */

window.PAYER_STORAGE = (function () {
  "use strict";

  /* ---------- MODULE CONFIG — Payer Review only ---------- */
  const SUPABASE_URL = "https://wysnjsnbraiwopolgxgv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_rUdw6p2HW394IjHoMexMXw_GhEYimpQ";

  const FUNCTIONS_BASE = SUPABASE_URL + "/functions/v1";
  const FUNCTIONS = {
    upload: FUNCTIONS_BASE + "/document-upload2o",
    /* Shared read/delete service. The module parameter selects this
       POC's bucket and table; referral keeps its own default path. */
    documentUrl: FUNCTIONS_BASE + "/document-url2o"
  };
  const MODULE = "payer";

  const TABLES = { documents: "payer_document_s" };
  const BUCKET = "payer-documents";
  /* -------------------------------------------------------------- */

  function headers(extra) {
    return Object.assign({
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY
    }, extra || {});
  }

  function who() {
    const u = window.EHR_SESSION && window.EHR_SESSION.get();
    return u ? u.name : "";
  }

  /* Upload one file against a payer case. Returns the stored document row. */
  async function upload(payerCaseId, file, opts) {
    opts = opts || {};
    const form = new FormData();
    form.append("module", MODULE);
    form.append("file", file);
    form.append("caseId", payerCaseId);
    if (opts.documentKind) form.append("documentKind", opts.documentKind);
    /* Carried so documents can be looked up by member id and name,
       not only by case id. */
    if (opts.memberId) form.append("memberId", opts.memberId);
    if (opts.patientName) form.append("patientName", opts.patientName);
    if (opts.replacesName) form.append("replacesName", opts.replacesName);
    form.append("uploadedBy", who());

    const r = await fetch(FUNCTIONS.upload, {
      method: "POST",
      headers: headers(),          // no Content-Type: the browser sets the boundary
      body: form
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || "Upload failed");
    }
    return body.document;
  }

  async function list(payerCaseId) {
    const r = await fetch(
      FUNCTIONS.documentUrl + "?module=" + MODULE + "&caseId=" + encodeURIComponent(payerCaseId),
      { headers: headers() }
    );
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || "Unable to list documents");
    }
    return body.documents || [];
  }

  async function signedUrl(id) {
    const r = await fetch(
      FUNCTIONS.documentUrl + "?module=" + MODULE + "&id=" + encodeURIComponent(id),
      { headers: headers() }
    );
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.url) {
      throw new Error(body.error || body.message || "Unable to open document");
    }
    return body.url;
  }

  async function remove(id) {
    const r = await fetch(
      FUNCTIONS.documentUrl + "?module=" + MODULE + "&id=" + encodeURIComponent(id),
      { method: "DELETE", headers: headers() }
    );
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || "Delete failed");
    }
    return true;
  }

  return { upload, list, signedUrl, remove, config: { SUPABASE_URL, FUNCTIONS, TABLES, BUCKET } };
})();

function caseFormControl(f, value){
  if(f.options){
    return `<select data-field="${f.key}">` +
      f.options.map(o=>`<option${o===value?' selected':''}>${o}</option>`).join('') +
      `</select>`;
  }
  return `<input data-field="${f.key}" value="${String(value||'').replace(/"/g,'&quot;')}"` +
    (f.placeholder?` placeholder="${f.placeholder}"`:'') + `>`;
}

function openCaseForm(caseId){
  editingCase = caseId ? getCase(caseId) : null;
  const src = editingCase || {};

  document.getElementById('caseFormTitle').textContent =
    editingCase ? 'Edit ' + editingCase.id : 'New PA request';
  document.getElementById('caseFormSub').textContent =
    editingCase ? 'Updating payer_case_s \u00b7 the request ID cannot be changed'
                : 'A request ID is generated automatically';

  document.getElementById('caseFormGrid').innerHTML = CASE_FORM_FIELDS.map(f=>{
    let v = src[f.key] || '';
    if(f.key==='cptList' && Array.isArray(v)) v = v.join(', ');
    return `<div class="form-field ${f.full?'full':''}">
      <label>${f.label}${f.required?' *':''}</label>
      ${caseFormControl(f, v)}
    </div>`;
  }).join('');

  document.getElementById('caseFormNote').innerHTML = '';
  document.getElementById('caseFormOverlay').classList.add('open');
}

function closeCaseForm(){
  editingCase = null;
  document.getElementById('caseFormOverlay').classList.remove('open');
}

function caseFormNote(text, tone){
  const el = document.getElementById('caseFormNote');
  if(!el) return;
  el.innerHTML = text
    ? `<div class="empty-hint" style="color:${tone==='error'?'var(--red-600)':'var(--ink-500)'}">${text}</div>`
    : '';
}

async function saveCaseForm(){
  const form = {};
  document.getElementById('caseFormGrid').querySelectorAll('[data-field]').forEach(el=>{
    form[el.dataset.field] = el.value.trim();
  });

  if(!form.patientName){
    caseFormNote('Patient name is required.', 'error');
    return;
  }

  form.cptList = String(form.cptList||'').split(',').map(s=>s.trim()).filter(Boolean);
  if(!form.submitted) form.submitted = nowStamp();

  const btn = document.getElementById('caseFormSave');
  btn.disabled = true; btn.textContent = 'Saving\u2026';

  try{
    if(editingCase){
      await window.PAYER_CASES_API.update(editingCase.id, form);
      toast(editingCase.id + ' updated.', 'success');
    }else{
      const created = await window.PAYER_CASES_API.create(form);
      toast('Request ' + created.id + ' created.', 'success');
    }
    closeCaseForm();
    await loadPayerCases();
  }catch(e){
    caseFormNote(e.message || 'Save failed', 'error');
    toast(e.message || 'Save failed', 'error');
  }finally{
    btn.disabled = false; btn.textContent = 'Save request';
  }
}

async function deletePayerCase(caseId){
  const c = getCase(caseId);
  if(!c) return;

  const stored = (storedDocs[caseId]||[]).length;
  const warning = stored
    ? `\n\nThis will also delete ${stored} stored document${stored===1?'':'s'} and the file${stored===1?'':'s'} behind them.`
    : '';

  if(!confirm(`Delete ${caseId} \u2014 ${c.patientName}?${warning}\n\nThis cannot be undone.`)) return;

  try{
    const res = await window.PAYER_CASES_API.remove(caseId);
    delete storedDocs[caseId];
    if(state.activeCaseId === caseId) closeCase();

    const extra = res.documentsDeleted
      ? ` and ${res.documentsDeleted} document${res.documentsDeleted===1?'':'s'}`
      : '';
    toast(caseId + ' deleted' + extra + '.', 'success');
    await loadPayerCases();
  }catch(e){
    toast(e.message || 'Delete failed', 'error');
  }
}

async function loadPayerCases(){
  try{
    state.cases = await window.PAYER_CASES_API.list();
    caseError = null;
  }catch(e){
    state.cases = [];
    caseError = e.message || 'Unable to load requests.';
    toast(caseError, 'error');
  }
  switchView(state.activeView || 'dashboard');
}

function renderQueueTableFiltered(){
  let cases = state.cases.slice();
  if(state.queueFilter==='APPROVED_GROUP') cases = cases.filter(c=>['APPROVED','APPROVED_COND','AUTO_APPROVED'].includes(c.status));
  else if(state.queueFilter!=='ALL') cases = cases.filter(c=>c.status===state.queueFilter);
  if(state.queueSearch.trim()){
    const q = state.queueSearch.toLowerCase();
    cases = cases.filter(c=> (c.patientName+c.memberId+c.provider+c.payerShort).toLowerCase().includes(q));
  }
  const holder = document.getElementById('queueTableHolder');
  holder.innerHTML = queueTableHTML(cases);
  wireQueueRowClicks(holder);

/* ============================= CASE DETAIL PANEL ============================= */
function openCase(id){
  /* First open of a case pulls its stored packet documents. */
  if(storedDocs[id] === undefined){
    storedDocs[id] = [];
    refreshStoredDocs(id, true);
  }
  state.activeCaseId = id;
  document.getElementById('caseOverlay').classList.add('open');
  document.body.style.overflow='hidden';
  renderCasePanel();
}
function closeCase(){
  document.getElementById('caseOverlay').classList.remove('open');
  document.body.style.overflow='';
  state.activeCaseId=null;
}

function timelineForCase(c){
  const steps = [
    {key:'received', label:'PA Request Received', sub:c.submitted},
    {key:'ixp', label:'IXP Document Extraction', sub: c.ixp.ran ? 'Completed' : 'Pending'},
    {key:'ai', label:'AI Clinical Validation', sub: c.ai.ran ? (c.ai.decision==='AUTO_APPROVE'?'Auto-approve recommended':'Escalation recommended') : 'Pending'},
    {key:'cm', label:'Case Manager Decision', sub: c.caseManager.decision ? (c.caseManager.decision+' by '+c.caseManager.name) : (c.ai.ran && c.ai.decision==='ESCALATE' ? 'Awaiting review' : 'Not required if auto-approved')},
    {key:'letter', label:'Determination Letter', sub: c.authNumber ? ('Auth '+c.authNumber) : 'Pending'},
  ];
  let activeSet=false;
  return steps.map(s=>{
    let cls='';
    if(s.key==='received') cls='done';
    else if(s.key==='ixp') cls = c.ixp.ran ? 'done' : (!activeSet ? (activeSet=true,'active') : '');
    else if(s.key==='ai') cls = c.ai.ran ? 'done' : (c.ixp.ran && !activeSet ? (activeSet=true,'active') : '');
    else if(s.key==='cm') cls = c.caseManager.decision ? 'done' : (c.ai.ran && c.ai.decision==='ESCALATE' && !activeSet ? (activeSet=true,'active') : '');
    else if(s.key==='letter') cls = c.authNumber ? 'done' : (c.ai.ran && c.ai.decision==='AUTO_APPROVE' && !c.authNumber && !activeSet ? (activeSet=true,'active') : '');
    return `<li><span class="tl-dot ${cls}">${cls==='done'?ICONS.check:''}</span><div><div class="tl-title">${s.label}</div><div class="tl-sub">${s.sub}</div></div></li>`;
  }).join('');
}

function docIcon(){ return `<div class="doc-icon pdf">${ICONS.file}</div>`; }


/* ---- stored document actions ---- */
async function viewStored(id){
  try{
    const url = await window.PAYER_STORAGE.signedUrl(id);
    window.open(url, '_blank', 'noopener');
  }catch(e){ toast(e.message || 'Unable to open document', 'error'); }
}

async function downloadStored(id, name, btn){
  if(btn) btn.disabled = true;
  try{
    const url = await window.PAYER_STORAGE.signedUrl(id);
    const res = await fetch(url);
    if(!res.ok) throw new Error('Stored file could not be read');
    const blob = await res.blob();
    const objectUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objectUrl; a.download = name || 'document.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(objectUrl), 4000);
  }catch(e){ toast(e.message || 'Download failed', 'error'); }
  finally{ if(btn) btn.disabled = false; }
}

async function removeStored(caseId, id){
  if(!confirm('Delete this document from storage? This cannot be undone.')) return;
  try{
    await window.PAYER_STORAGE.remove(id);
    storedDocs[caseId] = (storedDocs[caseId]||[]).filter(d=>d.id!==id);
    toast('Document deleted.', 'success');
    renderCasePanel();
  }catch(e){ toast(e.message || 'Delete failed', 'error'); }
}

function renderCasePanel(){
  const c = getCase(state.activeCaseId);
  if(!c) return;
  /* Cases loaded from the database carry no criteria or AI content, so
     fill those in before rendering. */
  criteriaFor(c); aiFor(c);
  const panel = document.getElementById('casePanel');

  /* Documents come from what is actually stored in Supabase for this
     case. Nothing is shown until a file has really been uploaded. */
  const stored = storedDocs[c.id] || [];

  const docsHTML = (stored.length
    ? stored.map((d,i)=>`
      <div class="doc-row">
        ${docIcon()}
        <div class="doc-meta">
          <div class="doc-name">${d.fileName}</div>
          <div class="doc-sub">${d.documentKind || 'Document'} · ${fmtBytes(d.sizeBytes||0)} · ${d.uploadedBy || 'unknown'}</div>

        <div class="doc-actions">

    ? `<div class="empty-hint">Documents received. Run IXP to extract structured data from the PA packet.</div>

        <div class="case-title">${c.patientName}</div>
        <div class="case-subtitle">${c.procedure} (CPT ${c.cptList.join(', ')}) — ${c.payer}</div>
        <div class="case-header-badges">${statusBadge(c.status)}<span class="badge ${c.priority==='High'?'badge-escalated':'badge-processing'}">${c.priority} Priority</span></div>

      <button class="close-x" id="closeCaseBtn">${ICONS.x}</button>

/* ---------------------- IXP / AI simulation ---------------------- */
function runIXP(caseId){
  const c = getCase(caseId);
  if(c.status==='NEW') c.status='IN_REVIEW';
  const btn = document.getElementById('runIxpBtn');
  if(btn){ btn.disabled=true; btn.innerHTML = '<span class="spinner spinner-dark"></span> Extracting...'; }
  renderCasePanel(); // reflect status change in header while processing shows next tick
  setTimeout(()=>{
    /* Extraction runs over the documents genuinely stored for this case,
       so the results always match what the user actually uploaded. */
    const stored = storedDocs[c.id] || [];
    c.ixp.docs = {};
    stored.forEach(d=>{
      const name = d.fileName;
      const base = /lab/i.test(name) ? 0.97
        : (/history/i.test(name) && c.id.endsWith('002')) ? 0.81
        : (0.90 + Math.random()*0.08);
      c.ixp.docs[name] = {
        conf: Math.min(0.99, base),
        fields: (c.ixp.sample || [['Member ID', c.memberId],['CPT Code', (c.cptList||[]).join(', ')],['Diagnosis Code', c.diagnosisCode],['Provider NPI', c.npi]])
      };
    });
    c.ixp.ran = true;
    toast('IXP extraction complete — structured data extracted from PA packet.', 'success');
    renderCasePanel();
    renderQueueTableFiltered();
  }, 1000);
}

function runAI(caseId){
  const c = getCase(caseId);
  const btn = document.getElementById('runAiBtn');
  if(btn){ btn.disabled=true; btn.innerHTML = '<span class="spinner spinner-dark"></span> Validating...'; }
  setTimeout(()=>{
    const isAutoApprove = c.ai.criteriaMissing.length===0;
    c.ai.decision = isAutoApprove ? 'AUTO_APPROVE' : 'ESCALATE';
    c.ai.confidence = isAutoApprove ? (0.90+Math.random()*0.08) : (0.60+Math.random()*0.12);
    c.ai.ran = true;
    c.status = isAutoApprove ? 'AUTO_APPROVED' : 'ESCALATED';
    toast(isAutoApprove ? 'AI recommends AUTO-APPROVE — all criteria met.' : 'AI flagged missing documentation — escalated to Case Manager.', isAutoApprove?'success':'error');
    renderCasePanel();
    renderQueueTableFiltered();
  }, 1200);
}

/* ---------------------- Decision / letter ---------------------- */
function makeDecision(caseId, decision){
  const c = getCase(caseId);
  c.caseManager.decision = decision;
  c.caseManager.name = 'Dr. Lisa Chen, MD';
  c.caseManager.decidedAt = nowStamp();

  if(decision==='APPROVED'){
    c.status = c.ai.decision==='ESCALATE' ? 'APPROVED_COND' : 'APPROVED';
    c.authNumber = `${c.payerShort==='Aetna'?'AET':'UHC'}-PA-2026-${randDigits(6)}`;
    const from = new Date(); const to = new Date(); to.setDate(to.getDate()+90);
    c.authValidFrom = from.toISOString().slice(0,10);
    c.authValidTo = to.toISOString().slice(0,10);
    toast('Case approved — authorization number generated.', 'success');
  } else if(decision==='DENIED'){
    c.status='DENIED';
    toast('Case denied. Determination letter available for download.', 'error');
  } else {
    c.status='PENDED';
    toast('Case pended — additional information requested from provider.');
  }
  state.letters.push({caseId:c.id, patientName:c.patientName, decisionStatus:c.status, ts:nowStamp()});
  renderCasePanel();
  renderQueueTableFiltered();
}

function buildLetterText(c){
  const lines = [];
  lines.push('PRIOR AUTHORIZATION DETERMINATION LETTER');
  lines.push(c.payer.toUpperCase());
  lines.push('----------------------------------------------------------------');
  lines.push('Case ID: '+c.id);
  lines.push('Date Issued: '+new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}));
  lines.push('');
  lines.push('Member: '+c.patientName+'   (DOB '+c.dob+')');
  lines.push('Member ID: '+c.memberId);
  lines.push('Health Plan: '+c.payer);
  lines.push('');
  lines.push('Requesting Provider: '+c.provider+'  (NPI '+c.npi+')');
  lines.push('Provider Organization: '+c.providerOrg);
  lines.push('');
  lines.push('Requested Procedure(s): '+c.procedure+'  (CPT '+c.cptList.join(', ')+')');
  lines.push('Diagnosis: '+c.diagnosisName+'  ('+c.diagnosisCode+')');
  lines.push('');
  lines.push('DETERMINATION: '+ (STATUS_META[c.status]?STATUS_META[c.status].label.toUpperCase():c.status));
  if(c.authNumber){
    lines.push('Authorization Number: '+c.authNumber);
    lines.push('Valid From: '+c.authValidFrom+'   Valid To: '+c.authValidTo);
  }
  lines.push('');
  lines.push('CLINICAL BASIS FOR DETERMINATION');
  lines.push(c.ai.ran ? c.ai.reasoning : 'Clinical validation pending at time of letter generation.');
  if(c.ai.criteriaMissing && c.ai.criteriaMissing.length){
    lines.push('');
    lines.push('Documentation flagged for review:');
    c.ai.criteriaMissing.forEach(m=> lines.push('  - '+m));
  }
  if(c.caseManager.notes){
    lines.push('');
    lines.push('Case Manager Notes ('+c.caseManager.name+'):');
    lines.push(c.caseManager.notes);
  }
  lines.push('');
  lines.push('NEXT STEPS FOR PROVIDER');
  if(c.status==='APPROVED' || c.status==='AUTO_APPROVED' || c.status==='APPROVED_COND'){
    lines.push('This authorization permits the above procedure(s) to be performed within the validity period. Please reference the authorization number on all related claims.');
  } else if(c.status==='DENIED'){
    lines.push('This request has been denied based on the clinical basis above. The provider or member may submit an appeal with additional supporting documentation within 30 days of this notice.');
  } else {
    lines.push('Additional documentation has been requested. Please submit the missing information listed above to avoid delay in the coverage determination.');
  }
  lines.push('');
  lines.push('This determination was generated with the assistance of AI-based clinical validation and reviewed under the applicable regulatory and payer clinical review standards. This is a demo document generated by the PayerConnect Prior Authorization Portal (Genzeon Services) and does not represent an actual coverage decision.');
  return lines.join('\n');
}

function downloadDeterminationLetter(caseId){
  const c = getCase(caseId);
  if(!c){ toast('Case not found.','error'); return; }
  const text = buildLetterText(c);
  const fileBase = c.patientName.replace(/[^a-z0-9]+/gi,'_') + '_Determination';
  try{
    if(window.jspdf && window.jspdf.jsPDF){
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({unit:'pt', format:'letter'});
      const margin = 54; let y = margin;
      doc.setFont('helvetica','bold'); doc.setFontSize(14);
      doc.setTextColor(11,29,58);
      doc.text('PayerConnect — Prior Authorization Determination', margin, y); y+=22;
      doc.setDrawColor(18,167,155); doc.setLineWidth(1.2); doc.line(margin,y,558,y); y+=18;
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(60,70,88);
      const bodyLines = text.split('\n');
      bodyLines.forEach(line=>{
        const wrapped = doc.splitTextToSize(line, 504);
        wrapped.forEach(w=>{
          if(y>740){ doc.addPage(); y=margin; }
          if(/^[A-Z ]{6,}$/.test(line.trim()) && line.trim().length>0){ doc.setFont('helvetica','bold'); } else { doc.setFont('helvetica','normal'); }
          doc.text(w, margin, y);
          y+=13;
        });
      });
      doc.save(fileBase+'.pdf');
      toast('Determination letter downloaded (PDF).', 'success');
      return;
    }
  }catch(err){ /* fall through to text */ }
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download = fileBase+'.txt'; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Determination letter downloaded.', 'success');
}

/* ---------------------- Document upload / download ---------------------- */
/* ---------------------------------------------------------------
   DOCUMENT STORAGE
   Uploads go to the payer-documents bucket through the
   payer-document-upload Edge Function. The in-memory document
   list is kept in step so the rest of the panel, IXP extraction
   and letter generation keep working exactly as before.
   --------------------------------------------------------------- */

const storedDocs = {};      // caseId -> rows from payer_document_s
let storageError = null;

async function refreshStoredDocs(caseId, rerender){
  try{
    storedDocs[caseId] = await window.PAYER_STORAGE.list(caseId);
    storageError = null;
  }catch(e){
    storedDocs[caseId] = storedDocs[caseId] || [];
    storageError = e.message || 'Unable to reach the document service.';
  }
  if(rerender && state.activeCaseId === caseId) renderCasePanel();
}

function uploadNote(text, tone){
  const el = document.getElementById('payerUploadNote');
  if(!el) return;
  el.innerHTML = text
    ? `<div class="empty-hint" style="color:${tone==='error'?'var(--red-600)':'var(--ink-500)'}">${text}</div>`
    : '';
}

async function storeFiles(caseId, files, opts){
  const list = Array.from(files || []);
  if(!list.length) return [];

  /* Stamp the member id and patient name onto every document so it can
     be retrieved by module + member id + name. */
  const kase = getCase(caseId) || {};
  opts = Object.assign({ memberId: kase.memberId, patientName: kase.patientName }, opts || {});
  const rows = [];
  for(let i=0;i<list.length;i++){
    const f = list[i];
    uploadNote(`Uploading ${f.name} (${i+1} of ${list.length})…`);
    try{
      const row = await window.PAYER_STORAGE.upload(caseId, f, opts || {});
      storedDocs[caseId] = (storedDocs[caseId] || []).concat(row);
      rows.push(row);
    }catch(e){
      uploadNote(`${f.name} failed: ${e.message}`, 'error');
      toast(f.name + ' could not be uploaded: ' + e.message, 'error');
    }
  }
  if(rows.length) uploadNote('');
  return rows;
}

/* Replace one of the packet's required documents. */
async function handleDocUpload(caseId, idx, files){
  if(!files || !files.length) return;
  const c = getCase(caseId);
  const f = files[0];
  const doc = c.documents[idx];

  const rows = await storeFiles(caseId, [f], {
    documentKind: doc.kind || 'supplemental',
    replacesName: doc.name
  });

  /* Keep the local view usable whether or not storage succeeded. */
  doc.preloaded = false;
  doc.fileObj = f;
  doc.size = f.size;
  doc.uploadedAt = nowStamp();
  doc.blobUrl = URL.createObjectURL(f);
  if(rows.length){
    doc.storedId = rows[0].id;
    doc.uploadedBy = rows[0].uploadedBy;
    toast('Replaced "'+doc.name+'" with "'+f.name+'" and stored it in Supabase.', 'success');
  }else{
    toast('Replaced "'+doc.name+'" with "'+f.name+'" locally only.', 'error');
  }
  renderCasePanel();
}

/* Add supplemental documents to the packet. */
async function handleAddDocs(caseId, files){
  if(!files || !files.length) return;
  const c = getCase(caseId);
  const rows = await storeFiles(caseId, files, { documentKind: 'supplemental' });

  Array.from(files).forEach(f=>{
    const row = rows.find(r=>r.fileName === f.name);
    c.documents.push({
      name:f.name, kind:'supplemental', preloaded:false,
      size:f.size, uploadedAt:nowStamp(), fileObj:f,
      blobUrl:URL.createObjectURL(f),
      storedId: row ? row.id : null,
      uploadedBy: row ? row.uploadedBy : null
    });
  });

  if(rows.length){
    toast(rows.length+' document(s) uploaded to the payer-documents bucket.', 'success');
  }else{
    toast(files.length+' document(s) attached locally only.', 'error');
  }
  renderCasePanel();
}

function downloadDocument(caseId, idx){
  const c = getCase(caseId);
  const doc = c.documents[idx];
  if(doc.fileObj && doc.blobUrl){
    const a=document.createElement('a'); a.href=doc.blobUrl; a.download=doc.name; document.body.appendChild(a); a.click(); a.remove();
    toast('Downloaded '+doc.name, 'success');
    return;
  }
  // generate a realistic stand-in PDF for pre-loaded demo documents
  try{
    const { jsPDF } = window.jspdf;
    const doc2 = new jsPDF({unit:'pt', format:'letter'});
    doc2.setFont('helvetica','bold'); doc2.setFontSize(13); doc2.setTextColor(11,29,58);
    doc2.text(doc.name.replace('.pdf',''), 54, 60);
    doc2.setDrawColor(200,205,215); doc2.line(54,72,558,72);
    doc2.setFont('helvetica','normal'); doc2.setFontSize(10); doc2.setTextColor(50,60,75);
    let y=98;
    const stub = stubContentFor(c, doc.kind);
    stub.forEach(row=>{
      const wrapped = doc2.splitTextToSize(row, 504);
      wrapped.forEach(w=>{ doc2.text(w,54,y); y+=15; });
      y+=4;
    });
    doc2.setFontSize(8); doc2.setTextColor(150,150,150);
    doc2.text('Demo document generated by PayerConnect Portal — Genzeon Services. For demonstration purposes only.', 54, 760);
    doc2.save(doc.name);
    toast('Downloaded '+doc.name, 'success');
  }catch(e){
    toast('Could not generate file for download.', 'error');
  }
}
function stubContentFor(c, kind){
  if(kind==='form') return [
    'PRIOR AUTHORIZATION REQUEST FORM',
    'Payer: '+c.payer,
    'Member: '+c.patientName+'  |  Member ID: '+c.memberId+'  |  DOB: '+c.dob,
    'Requesting Provider: '+c.provider+'  (NPI '+c.npi+')',
    'Requested Procedure(s): '+c.procedure+'  |  CPT: '+c.cptList.join(', '),
    'Diagnosis Code(s): '+c.diagnosisCode,
    'Requested Service Date: within 14 days of submission',
    'Provider Signature: [on file]',
  ];
  if(kind==='notes') return [
    'PHYSICIAN / CLINICAL NOTES',
    'Patient: '+c.patientName,
    'Chief Complaint & History: See referral documentation for '+c.diagnosisName+'.',
    'Treatment History: Documented per attached medical history.',
    'Physician Recommendation: '+c.procedure+' clinically indicated based on exam findings and treatment history.',
    'Ordering Physician: '+c.provider,
  ];
  if(kind==='labs') return [
    'LABORATORY RESULTS',
    'Patient: '+c.patientName,
    'FSH: 8.2 mIU/mL (reference < 10 mIU/mL)',
    'AMH: 1.4 ng/mL (reference > 0.5 ng/mL)',
    'Estradiol: 42 pg/mL',
    'Collection Date: Aug 12, 2026',
    'Ordering Physician: '+c.provider,
  ];
  return [
    'MEDICAL HISTORY / REFERRAL RECORD',
    'Patient: '+c.patientName,
    'Diagnosis History: '+c.diagnosisName+' ('+c.diagnosisCode+')',
    'Prior Procedures / Treatments: See physician notes for treatment history detail.',
    'Referring Provider: '+c.provider,
  ];
}

/* ===== pages/providers/provider.api.js ===== */
/* =========================================================
   PROVIDER MANAGEMENT — SOURCE SYSTEM API CLIENT

   Reads go through the existing `provider` Edge Function, which is
   GET-only by design and is the same path Maestro's Intake Bot uses.
   That function is not modified.

   Writes go directly against the `providers` table as an upsert keyed
   on NPI, which is how the current Source System page already works.
   There is deliberately no API path for writing provider data.
   ========================================================= */

window.PROVIDER_API = (function () {
  "use strict";

  /* ---------- MODULE CONFIG — Provider Management only ---------- */
  const SUPABASE_URL = "https://wysnjsnbraiwopolgxgv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_rUdw6p2HW394IjHoMexMXw_GhEYimpQ";

  const FUNCTIONS = {
    /* Reads: the existing read-only function Maestro also uses.
       GET ?npi=1234567890 -> one record, 404 if unknown
       GET                 -> every provider, newest first */
    provider: SUPABASE_URL + "/functions/v1/provider",

    /* Writes: the same record CRUD function Prior Auth and Payer Review
       use, with module="provider". Uses the service-role key server-side,
       so the browser needs no write rights on the table. */
    write: SUPABASE_URL + "/functions/v1/case-crud2o"
  };

  const TABLES = { providers: "providers" };
  /* -------------------------------------------------------------- */

  function headers(extra) {
    return Object.assign({
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    }, extra || {});
  }

  /*
   * The providers table is external to this portal, so its exact column
   * names are discovered from the data rather than assumed. CANDIDATES
   * lists the plausible names for each logical field; the first one that
   * actually appears on a returned row wins, and only discovered columns
   * are ever written back.
   */
  const CANDIDATES = {
    npi:          ["npi", "NPI", "provider_npi"],
    firstName:    ["first_name", "firstName", "fname", "given_name"],
    lastName:     ["last_name", "lastName", "lname", "family_name", "surname"],
    title:        ["title", "credential", "credentials", "suffix"],
    specialty:    ["specialty", "speciality", "specialty_code", "specialtyCode", "primary_specialty"],
    providerType: ["provider_type", "providerType", "type"],
    taxonomyCode: ["taxonomy_code", "taxonomyCode", "taxonomy"],
    taxId:        ["tax_id", "taxId", "tax_identification_number", "tin", "ein",
                   "tax_id_ein", "taxid", "tax_number", "federal_tax_id"],
    practiceName: ["practice_name", "practiceName", "practice", "organization_name", "org_name"],
    groupNpi:     ["group_npi", "groupNpi", "org_npi", "organization_npi"],
    address1:     ["address_line1", "address1", "address_line_1", "addr1", "address", "street_address"],
    address2:     ["address_line2", "address2", "address_line_2", "addr2", "suite"],
    city:         ["city", "town"],
    state:        ["state", "state_code", "province"],
    zip:          ["zip", "zip_code", "zipcode", "postal_code", "postalCode"],
    phone:        ["phone", "phone_number", "telephone", "contact_phone"],
    email:        ["email", "email_address", "contact_email"]
  };

  /* Logical field -> real column name, filled in on the first read. */
  let columnMap = null;
  let knownColumns = [];

  function learnColumns(row) {
    if (!row || typeof row !== "object") return;
    knownColumns = Object.keys(row);
    columnMap = {};
    for (const field in CANDIDATES) {
      const hit = CANDIDATES[field].find(n => knownColumns.indexOf(n) !== -1);
      if (hit) columnMap[field] = hit;
    }
  }

  function pick(row, names, fallback) {
    for (const n of names) {
      if (row && row[n] !== undefined && row[n] !== null && String(row[n]).trim() !== "") {
        return row[n];
      }
    }
    return fallback === undefined ? "" : fallback;
  }

  function toProvider(row) {
    if (!columnMap) learnColumns(row);

    /* Prefer the discovered column, then fall back to the candidates. */
    const get = (field) => {
      if (columnMap && columnMap[field] && row[columnMap[field]] !== undefined) {
        const v = row[columnMap[field]];
        return v === null ? "" : v;
      }
      return pick(row, CANDIDATES[field] || []);
    };

    return {
      raw: row,
      npi: get("npi"),
      firstName: get("firstName"),
      lastName: get("lastName"),
      title: get("title"),
      specialty: get("specialty"),
      providerType: get("providerType"),
      taxonomyCode: get("taxonomyCode"),
      taxId: get("taxId"),
      practiceName: get("practiceName"),
      groupNpi: get("groupNpi"),
      address1: get("address1"),
      address2: get("address2"),
      city: get("city"),
      state: get("state"),
      zip: get("zip"),
      phone: get("phone"),
      email: get("email"),
      updatedAt: pick(row, ["updated_at", "updatedAt"]),
      createdAt: pick(row, ["created_at", "createdAt"])
    };
  }

  const MODULE = "provider";

  /* All writes go through case-crud2o with module="provider". The
     provider_id business id and partial updates are handled there, so
     this client only has to pass the form through. */
  async function write(action, payload) {
    const r = await fetch(FUNCTIONS.write, {
      method: "POST",
      headers: headers(),
      body: JSON.stringify(Object.assign({ module: MODULE, action }, payload || {}))
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.success) {
      throw new Error(body.error || body.message || action + " failed");
    }
    return body;
  }

  return {
    /* ---------- READ: via the provider Edge Function ---------- */

    async list() {
      const r = await fetch(FUNCTIONS.provider, { headers: headers() });
      const body = await r.json().catch(() => null);
      if (!r.ok) {
        throw new Error((body && (body.message || body.error)) || "Unable to load providers");
      }
      return (Array.isArray(body) ? body : []).map(toProvider);
    },

    async getByNpi(npi) {
      const r = await fetch(
        FUNCTIONS.provider + "?npi=" + encodeURIComponent(npi),
        { headers: headers() }
      );
      const body = await r.json().catch(() => null);

      if (r.status === 404) return null;                 // not in the source system
      if (!r.ok) {
        throw new Error((body && (body.message || body.error)) || "Lookup failed");
      }
      return toProvider(body);
    },

    /* ---------- WRITE: direct upsert on the providers table ---------- */

    /*
     * Editing uses PATCH keyed on NPI, which never touches the primary
     * key. Only a genuinely new record needs an INSERT, and this table
     * has a NOT NULL provider_id with no default, so that value has to
     * be supplied. Rather than assume its name or type, the insert is
     * retried once with a generated id for whichever column the database
     * complains about.
     */
    async save(form, isEdit) {
      /* case-crud2o writes real column names, so translate here. */
      const data = {
        npi: form.npi,
        first_name: form.firstName,
        last_name: form.lastName,
        title: form.title,
        specialty: form.specialty,
        provider_type: form.providerType,
        taxonomy_code: form.taxonomyCode,
        tax_id: form.taxId,
        practice_name: form.practiceName,
        group_npi: form.groupNpi,
        address_line1: form.address1,
        address_line2: form.address2,
        city: form.city,
        state: form.state,
        zip: form.zip,
        phone: form.phone,
        email: form.email
      };

      const body = await write(isEdit ? "update" : "create", {
        caseId: form.npi,
        data: data
      });

      return {
        provider: body.case ? toProvider(body.case) : null,
        unmapped: []
      };
    },

    async remove(npi) {
      return await write("delete", { caseId: npi });
    },

    /* Useful when a save fails: shows what the table actually looks like. */
    schema() {
      return { columnMap: columnMap, knownColumns: knownColumns.slice() };
    },

    config: { SUPABASE_URL, FUNCTIONS, TABLES }
  };
})();

    $("prvDetailDel").addEventListener("click", () => removeProvider(p.npi));
  }

  /* ---------------- NPI lookup ---------------- */

  async function lookup() {
    const npi = U.clean($("prvNpi").value);
    const note = $("prvLookupNote");

    if (!/^\d{10}$/.test(npi)) {
      note.textContent = "NPI must be exactly 10 digits.";
      note.style.color = "var(--red-600)";
      return;
    }

    const btn = $("prvLookup");
    btn.disabled = true;
    note.textContent = "Searching the source system…";
    note.style.color = "var(--ink-500)";

    try {
      const found = await window.PROVIDER_API.getByNpi(npi);
      if (!found) {
        note.textContent = "Not found in the source system.";
        note.style.color = "var(--amber-600)";
        return;
      }
      /* Keep the list in step if the record is new to this session. */
      if (!providers.some(p => String(p.npi) === String(found.npi))) {
        providers = providers.concat(found);
      }
      note.textContent = "Record found.";
      note.style.color = "var(--green-600)";
      showProvider(found);
    } catch (e) {
      note.textContent = e.message || "Lookup failed.";
      note.style.color = "var(--red-600)";
    } finally {
      btn.disabled = false;
    }
  }

  /* ---------------- Add / edit / delete ---------------- */

  function control(f, value) {
    return `<input data-field="${f.key}" value="${esc(value)}"` +
      (f.mono ? ` style="font-family:var(--mono)"` : "") +
      (f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : "") +
      (f.key === "npi" && editing ? " readonly" : "") + `>`;
  }

  function openForm(npi) {
    editing = npi || null;
    const source = npi ? providers.find(p => String(p.npi) === String(npi)) || {} : {};

    /* Hide fields this table has no column for, so the form matches
       what the source system can actually hold. */
    const schema = window.PROVIDER_API.schema();
    const fields = (schema.columnMap && Object.keys(schema.columnMap).length)
      ? FIELDS.filter(f => schema.columnMap[f.key])
      : FIELDS;

    $("prvFormTitle").textContent = editing ? "Edit provider " + editing : "Add provider";
    $("prvFormSub").textContent = editing
      ? "Updating the providers table · the NPI cannot be changed"
      : "Saved as an upsert keyed on NPI, so an existing NPI updates that record";

    $("prvFormGrid").innerHTML = fields.map(f => `
      <div class="form-field ${f.full ? "full" : ""}">
        <label>${esc(f.label)}${f.required ? " *" : ""}</label>
        ${control(f, source[f.key] || "")}
      </div>`).join("");

    $("prvFormNote").innerHTML = "";
    $("prvFormOverlay").classList.add("open");
    const first = $("prvFormGrid").querySelector("[data-field]:not([readonly])");
    if (first) first.focus();
  }

  function closeForm() {
    editing = null;
    $("prvFormOverlay").classList.remove("open");
  }

  function formNote(text, tone) {
    const el = $("prvFormNote");
    if (!el) return;
    el.innerHTML = text
      ? `<div class="empty-hint" style="color:${tone === "error" ? "var(--red-600)" : "var(--ink-500)"}">${esc(text)}</div>`
      : "";
  }

  async function saveForm() {
    const form = {};
    $("prvFormGrid").querySelectorAll("[data-field]").forEach(el => {
      form[el.dataset.field] = el.value.trim();
    });

    if (!/^\d{10}$/.test(form.npi || "")) {
      formNote("NPI must be exactly 10 digits.", "error");
      return;
    }

    const btn = $("prvFormSave");
    btn.disabled = true;
    btn.textContent = "Saving…";

    try {
      const result = await window.PROVIDER_API.save(form, Boolean(editing));

      U.toast("Provider " + form.npi + (editing ? " updated." : " saved."), "success");

      /* Be explicit when the table has no column for something typed in,
         rather than silently discarding it. */
      /* The table demanded values the form does not collect, so ids were
         generated. Worth saying out loud. */
      if (result && result.generated && result.generated.length) {
        U.toast("Generated a value for: " + result.generated.join(", "), "success");
      }

      if (result && result.unmapped && result.unmapped.length) {
        const labels = result.unmapped
          .map(k => (FIELDS.find(f => f.key === k) || {}).label || k)
          .join(", ");
        U.toast("Saved, but this table has no column for: " + labels, "error");
      }

      closeForm();
      await load();
      const fresh = providers.find(p => String(p.npi) === String(form.npi));
      if (fresh) showProvider(fresh);
      else if (result && result.provider) showProvider(result.provider);
    } catch (e) {
      formNote(e.message || "Save failed", "error");
      U.toast(e.message || "Save failed", "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Save provider";
    }
  }

  async function removeProvider(npi) {
    const p = providers.find(x => String(x.npi) === String(npi));
    const label = p ? (fullName(p) || npi) : npi;

    if (!confirm(`Delete provider ${npi} — ${label}?\n\nThis cannot be undone.`)) return;

    try {
      const res = await window.PROVIDER_API.remove(npi);
      console.log("[provider] delete", npi, res);
      if (selected && String(selected.npi) === String(npi)) {
        selected = null;
        $("prvDetail").innerHTML = U.emptyState("No provider selected",
          "Search by NPI, or choose a row to see the full source record.");
        $("prvDetailSub").textContent = "Select a provider";
      }
      U.toast("Provider " + npi + " deleted.", "success");
      await load();
    } catch (e) {
      console.error("[provider] delete failed", npi, e);
      U.toast(e.message || "Delete failed.", "error");
    }
  }

  /* ---------------- Loading ---------------- */

  function banner(err) {
    const el = $("prvBanner");
    if (!el) return;
    el.innerHTML = err
      ? `<div class="card" style="border-left:4px solid var(--red-600);margin-bottom:12px;">
           <div class="card-head"><div class="card-title">Provider source system unavailable</div>
             <button class="btn btn-outline btn-sm" id="prvRetry">${U.ICONS.refresh} Retry</button>
           </div>
           <div class="card-body">
             <div style="font-size:12px;color:var(--ink-700);margin-bottom:10px;">
               Provider records are read through the <span class="cell-mono">${esc(CONFIG.functions.read)}</span>
               Edge Function. Check that it is deployed and that the
               <span class="cell-mono">${esc(CONFIG.tables.providers)}</span> table exists.
             </div>
             ${U.infoItem("Error", err, { full: true, mono: true })}
           </div>
         </div>`
      : "";
    const retry = $("prvRetry");
    if (retry) retry.addEventListener("click", load);
  }

  async function load() {
    const state = $("prvState");
    if (state) {
      state.textContent = "● Loading provider records…";
      state.style.color = "var(--amber-500)";
    }
    try {
      providers = await window.PROVIDER_API.list();
      loadError = null;
      banner(null);
      if (state) {
        state.textContent = "● Source system connected · " + providers.length +
          " provider" + (providers.length === 1 ? "" : "s");
        state.style.color = "var(--green-600)";
      }
    } catch (e) {
      providers = [];
      loadError = e.message || "Unable to load providers.";
      banner(loadError);
      if (state) {
        state.textContent = "● Source system read failed";
        state.style.color = "var(--red-600)";
      }
    }
    render();
  }

  /* Read-only view for cross-module pages. */
  window.PROVIDER_RECORDS = function () { return providers.slice(); };

  window.EHR_MODULES.providers = {
    config: CONFIG,
    mount(container) {
      providers = [];
      selected = null;
      container.innerHTML = shell();

      $("prvRefresh").addEventListener("click", load);
      $("prvNew").addEventListener("click", () => openForm(null));
      $("prvLookup").addEventListener("click", lookup);
      $("prvNpi").addEventListener("keydown", e => { if (e.key === "Enter") lookup(); });
      $("prvFormClose").addEventListener("click", closeForm);
      $("prvFormCancel").addEventListener("click", closeForm);
      $("prvFormSave").addEventListener("click", saveForm);
      $("prvFormOverlay").addEventListener("click", e => {
        if (e.target.id === "prvFormOverlay") closeForm();
      });
      ["prvSearch", "prvSpecialty"].forEach(id => {
        $(id).addEventListener("input", render);
        $(id).addEventListener("change", render);
      });

      render();
      load();
    }
  };
})();


/* ===== pages/caregap/caregap.js ===== */
/* =========================================================
   MODULE — CARE GAP  (Mock Epic care gap POC)

   Stands in as the system of record for the care gap automation:
   load a worklist, look a patient up, review their gaps, send
   outreach, then chart it and reconcile the run data.

   Entirely self-contained. No Edge Function, no table, no API
   call. State is kept in localStorage so a run survives a
   refresh, and the three patients are synthetic.

   BOT-FACING SELECTORS ARE FIXED. UiPath targets these ids, so
   none of them may be renamed:

     Tabs      #tabLoadWorklist #tabPatientSearch #tabPatientDetails
               #tabSendOutreach #tabOutreachChart #tabRunData
     Load      #worklistFileInput #loadWorklistButton #loadResult
               #worklistPreviewTable
     Search    #patientSearchInput #searchButton #searchStatus
               #openDetailsButton
     Details   #detailPatientId #detailPatientName #detailDob
               #detailAge #detailSex #detailEmail #detailProvider
               #detailLocation #detailNextVisit #careGapTable
     Outreach  #outreachPatientId #outreachRecipient #outreachSubject
               #outreachMessage #sendOutreachButton #outreachResult
     Chart     #outreachDetails
     Run data  #runDataTable #status-row-<rowId> #save

   The page's own markup and class names are kept for the same
   reason. Its classes are styled to the portal's tokens in
   caregap.css, scoped under .cg, so it looks like EPIC without
   the structure changing.
   ========================================================= */

(function () {
  "use strict";

  const U = window.EHR;


  /* ============================================================
     MOCK EPIC — CARE GAP POC

     Bot-facing selectors (stable, do not rename):

     Tabs          #tabLoadWorklist #tabPatientSearch #tabPatientDetails
                   #tabSendOutreach #tabOutreachChart #tabRunData
     Load          #worklistFileInput #loadWorklistButton #loadResult
                   #worklistPreviewTable
     Search        #patientSearchInput #searchButton #searchStatus
                   #openDetailsButton
     Details       #detailPatientId #detailPatientName #detailDob #detailAge
                   #detailSex #detailEmail #detailProvider #detailLocation
                   #detailNextVisit #careGapTable
     Outreach      #outreachPatientId #outreachRecipient #outreachSubject
                   #outreachMessage #sendOutreachButton #outreachResult
     Chart         #outreachDetails
     Run data      #runDataTable #status-row-<rowId> #saveStatusButton
                   #saveResult #runSummary
     ============================================================ */

  const STORAGE_KEY = "mockEpicCareGapPoc.v2";
  const INITIAL_STATUS = "Pending Validation";
  const DEFAULT_REPORT_DATE = "2026-08-01";

  const STATUS_OPTIONS = [
    "Pending Validation",
    "Outreach Sent",
    "Outreach Not Approved",
    "Invalid Care Gap - Confirmed",
    "Requires Further Review",
    "Patient Not Found"
  ];

  const CRITERIA = {
    BCS: { name: "Breast Cancer Screening", lookbackMonths: 24 },
    HBD: { name: "HbA1c Testing",           lookbackMonths: 12 }
  };

  const PATIENTS = {
    "E-100234": {
      id:"E-100234", name:"Maria Delgado", dob:"1968-03-12", age:58, sex:"F",
      email:"maria.delgado.sim@test.aspirus.org",
      provider:"Dr. Karen Howell, MD",
      location:"Aspirus Wausau Hospital - Women's Health",
      nextVisit:"None scheduled",
      labs:[],
      screenings:[{ procedure:"Mammogram", completed:"2023-11-04", result:"Negative" }]
    },
    "E-100571": {
      id:"E-100571", name:"Angela Whitfield", dob:"1963-02-20", age:63, sex:"F",
      email:"angela.whitfield.sim@test.aspirus.org",
      provider:"Dr. James Reilly, MD",
      location:"Aspirus Antigo Clinic - Primary Care",
      nextVisit:"None scheduled",
      labs:[{ test:"HbA1c", date:"2024-12-02", value:"7.4%" }],
      screenings:[]
    },
    "E-100892": {
      id:"E-100892", name:"Susan Park", dob:"1971-01-09", age:55, sex:"F",
      email:"susan.park.sim@test.aspirus.org",
      provider:"Dr. Linda Tran, MD",
      location:"Aspirus Rhinelander Clinic - Internal Medicine",
      nextVisit:"None scheduled",
      labs:[],
      screenings:[{ procedure:"Mammogram", completed:"2026-03-15", result:"Negative" }]
    }
  };


  /* ============================================================
     STATE
     ============================================================ */

  let state = null;
  let tab = "load";
  let searchResultId = null;
  let searchMessage = null;
  let loadMessage = null;
  let outreachResult = null;
  let saveMessage = null;

  function freshState() {
    return { rows: [], outreach: [], selectedPatientId: null, reportDate: "", sourceFile: "" };
  }

  function loadState() {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.rows)) { state = parsed; return; }
      }
    } catch (e) { /* storage unavailable */ }
    state = freshState();
  }

  function saveState() {
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { /* storage unavailable */ }
  }

  function stamp() {
    const d = new Date();
    function p(n) { return String(n).padStart(2, "0"); }
    return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) +
           " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }


  /* ============================================================
     HELPERS
     ============================================================ */

  function el(tag, className, text) {
    const n = document.createElement(tag);
    if (className) n.className = className;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function cell(text, field, className) {
    const td = el("td", className || null, text);
    if (field) td.setAttribute("data-field", field);
    return td;
  }

  function rowsFor(patientId) {
    return state.rows.filter(function (r) { return r.patientId === patientId; });
  }

  function patientNameFor(row) {
    if (row.patientName) return row.patientName;
    const p = PATIENTS[row.patientId];
    return p ? p.name : row.patientId;
  }

  function measureNameFor(row) {
    if (row.measureName) return row.measureName;
    const c = CRITERIA[row.measureCode];
    return c ? c.name : (row.measureCode || "\u2014");
  }

  function lookbackFor(row) {
    const c = CRITERIA[row.measureCode];
    return c ? c.lookbackMonths + " months" : "\u2014";
  }

  function activeReportDate() { return state.reportDate || DEFAULT_REPORT_DATE; }

  function canonicalStatus(value) {
    const needle = String(value || "").trim().toLowerCase();
    return STATUS_OPTIONS.find(function (s) { return s.toLowerCase() === needle; }) || null;
  }

  function isKnownStatus(value) { return canonicalStatus(value) !== null; }

  function statusChipClass(status) {
    if (status === "Outreach Sent" || status === "Invalid Care Gap - Confirmed") return "chip ok";
    if (status === INITIAL_STATUS) return "chip wait";
    return "chip bad";
  }

  function pendingCount() {
    return state.rows.filter(function (r) { return r.statusAfter === INITIAL_STATUS; }).length;
  }

  function selectedPatient() {
    return state.selectedPatientId ? PATIENTS[state.selectedPatientId] : null;
  }


  /* ============================================================
     TABS
     ============================================================ */

  const TABS = [
    { key:"load",     id:"tabLoadWorklist",   label:"Load Worklist" },
    { key:"search",   id:"tabPatientSearch",  label:"Patient Search" },
    { key:"details",  id:"tabPatientDetails", label:"Patient Details" },
    { key:"outreach", id:"tabSendOutreach",   label:"Send Outreach" },
    { key:"chart",    id:"tabOutreachChart",  label:"Outreach Chart" },
    { key:"rundata",  id:"tabRunData",        label:"Run Data" }
  ];

  function tabCount(key) {
    if (key === "load")    return state.rows.length;
    if (key === "chart")   return state.outreach.length;
    if (key === "rundata") return state.rows.length;
    return null;
  }

  function renderTabs() {
    const bar = document.getElementById("tabs");
    bar.innerHTML = "";

    TABS.forEach(function (t) {
      const b = el("button", "tab" + (tab === t.key ? " active" : ""));
      b.id = t.id;
      b.setAttribute("data-tab", t.key);
      b.appendChild(document.createTextNode(t.label));

      const c = tabCount(t.key);
      if (c !== null) b.appendChild(el("span", "count", String(c)));

      b.addEventListener("click", function () { tab = t.key; render(); });
      bar.appendChild(b);
    });
  }


  /* ============================================================
     TAB 1 - LOAD WORKLIST
     ============================================================ */

  const SHEETJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";

  const HEADER_MAP = {
    rowid:"rowId", row:"rowId", srno:"rowId",
    patientide:"patientId", patientid:"patientId", patient:"patientId", mrn:"patientId",
    patientname:"patientName", name:"patientName",
    caregapmeasure:"measureName", measure:"measureName", caregap:"measureName",
    measurecode:"measureCode", code:"measureCode",
    attributedprovider:"provider", provider:"provider",
    primarylocation:"location", location:"location",
    patientemail:"email", email:"email",
    reportdate:"reportDate",
    status:"statusBefore", currentstatus:"statusBefore"
  };

  function normaliseHeader(h) {
    return String(h || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  }

  function mapHeaders(headerRow) {
    return headerRow.map(function (h) { return HEADER_MAP[normaliseHeader(h)] || null; });
  }

  function splitDelimited(text) {
    const lines = String(text).replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n")
      .filter(function (l) { return l.trim() !== ""; });
    if (!lines.length) return [];

    const delimiter = lines[0].indexOf("\t") > -1 ? "\t" : ",";

    return lines.map(function (line) {
      const out = []; let cur = ""; let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
          else inQuotes = !inQuotes;
        } else if (ch === delimiter && !inQuotes) { out.push(cur); cur = ""; }
        else cur += ch;
      }
      out.push(cur);
      return out.map(function (c) { return c.trim(); });
    });
  }

  function rowsFromMatrix(matrix, sourceName) {
    if (!matrix.length) return { error: "The file appears to be empty." };

    const fields = mapHeaders(matrix[0]);

    if (fields.indexOf("patientId") === -1) {
      return { error: "No patient ID column found. Expected a header like \"Patient ID / E#\"." };
    }

    const rows = [];
    let reportDate = "";
    let skipped = 0;

    for (let i = 1; i < matrix.length; i++) {
      const raw = matrix[i];
      const rec = {};

      fields.forEach(function (f, index) {
        if (f) rec[f] = String(raw[index] === undefined || raw[index] === null ? "" : raw[index]).trim();
      });

      if (!rec.patientId) { skipped++; continue; }
      if (!reportDate && rec.reportDate) reportDate = rec.reportDate;

      rows.push({
        rowId:        rec.rowId ? (Number(rec.rowId) || rows.length + 1) : rows.length + 1,
        patientId:    rec.patientId.toUpperCase(),
        patientName:  rec.patientName || "",
        measureCode:  (rec.measureCode || "").toUpperCase(),
        measureName:  rec.measureName || "",
        provider:     rec.provider || "",
        location:     rec.location || "",
        email:        rec.email || "",
        statusBefore: rec.statusBefore || INITIAL_STATUS,
        statusAfter:  INITIAL_STATUS,
        updatedAt:    ""
      });
    }

    if (!rows.length) return { error: "No data rows found under the header row." };

    return { rows: rows, reportDate: reportDate, skipped: skipped, sourceFile: sourceName };
  }

  function applyLoad(result) {
    if (result.error) {
      loadMessage = { kind: "bad", text: result.error };
      render();
      return;
    }

    /* A new file starts a clean run: rows, outreach and selection all reset */
    state.rows = result.rows;
    state.reportDate = result.reportDate || "";
    state.sourceFile = result.sourceFile || "";
    state.outreach = [];
    state.selectedPatientId = null;
    saveState();

    searchResultId = null;
    searchMessage = null;
    outreachResult = null;
    saveMessage = null;

    loadMessage = {
      kind: "ok",
      text: "Loaded " + result.rows.length + " row(s)" +
            (result.skipped ? ", skipped " + result.skipped + " row(s) with no patient ID" : "") + "."
    };

    render();
  }

  function loadSheetJs() {
    return new Promise(function (resolve, reject) {
      if (window.XLSX) { resolve(window.XLSX); return; }
      const s = document.createElement("script");
      s.src = SHEETJS_URL;
      s.onload = function () { window.XLSX ? resolve(window.XLSX) : reject(new Error("unavailable")); };
      s.onerror = function () { reject(new Error("unavailable")); };
      document.head.appendChild(s);
    });
  }

  function readWorkbookFile(file) {
    loadMessage = { kind: "info", text: "Reading " + file.name + "..." };
    render();

    loadSheetJs().then(function (XLSX) {
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, blankrows: false, raw: false });
          applyLoad(rowsFromMatrix(matrix, file.name));
        } catch (err) {
          loadMessage = { kind: "bad", text: "Could not read that workbook. " + err.message };
          render();
        }
      };
      reader.onerror = function () {
        loadMessage = { kind: "bad", text: "Could not read the file from disk." };
        render();
      };
      reader.readAsArrayBuffer(file);
    }).catch(function () {
      loadMessage = {
        kind: "bad",
        text: "The Excel reader could not be loaded, so this machine has no internet access to the CDN. " +
              "Save the sheet as CSV and upload that instead."
      };
      render();
    });
  }

  function readCsvFile(file) {
    const reader = new FileReader();
    reader.onload = function (e) { applyLoad(rowsFromMatrix(splitDelimited(e.target.result), file.name)); };
    reader.onerror = function () {
      loadMessage = { kind: "bad", text: "Could not read the file from disk." };
      render();
    };
    reader.readAsText(file);
  }

  function handleFile(file) {
    if (!file) {
      loadMessage = { kind: "bad", text: "Choose a file first." };
      render();
      return;
    }
    const name = file.name.toLowerCase();
    if (name.endsWith(".csv") || name.endsWith(".tsv") || name.endsWith(".txt")) readCsvFile(file);
    else readWorkbookFile(file);
  }

  function renderLoad() {
    const screen = document.getElementById("screen");

    const card = el("div", "card");
    card.appendChild(el("h2", "card-title", "Load worklist"));
    card.appendChild(el("div", "sub",
      "Upload the care gap worklist. Rows land on the Run Data tab at " + INITIAL_STATUS + "."));

    const row = el("div", "form-row");

    const f = el("div", "field grow");
    const l = el("label", null, "Worklist file (.xlsx, .xls or .csv)");
    l.setAttribute("for", "worklistFileInput");
    f.appendChild(l);

    const input = document.createElement("input");
    input.type = "file";
    input.id = "worklistFileInput";
    input.setAttribute("name", "worklistFileInput");
    input.setAttribute("accept", ".xlsx,.xls,.csv,.tsv,.txt");
    f.appendChild(input);
    row.appendChild(f);

    const btn = el("button", "btn btn-primary", "Load worklist");
    btn.id = "loadWorklistButton";
    btn.type = "button";
    btn.addEventListener("click", function () {
      handleFile(document.getElementById("worklistFileInput").files[0]);

  /* ============================================================

     ============================================================ */

  function sendOutreach() {
    const patientId = (document.getElementById("outreachPatientId").value || "").trim().toUpperCase();
    const recipient = (document.getElementById("outreachRecipient").value || "").trim();
    const subject   = (document.getElementById("outreachSubject").value || "").trim();
    const message   = (document.getElementById("outreachMessage").value || "").trim();

    if (!patientId) {
      outreachResult = { kind: "bad", text: "Patient ID is required." };
      render();
      return;
    }

    if (!recipient || !message) {
      outreachResult = { kind: "bad", text: "Recipient and message are both required." };
      render();
      return;
    }

    const covered = rowsFor(patientId);

    const record = {
      sentAt: stamp(),
      patientId: patientId,
      patientName: covered.length ? patientNameFor(covered[0]) :
                   (PATIENTS[patientId] ? PATIENTS[patientId].name : patientId),
      recipient: recipient,
      subject: subject,
      message: message,
      gapCodes: covered.map(function (r) { return r.measureCode || measureNameFor(r); }).join(", "),
      rowIds: covered.map(function (r) { return r.rowId; }).join(", ")
    };

    /* One outreach entry per patient - a new send replaces the previous one */
    state.outreach = state.outreach.filter(function (o) { return o.patientId !== patientId; });
    state.outreach.push(record);
    saveState();

    outreachResult = { kind: "ok", text: "Outreach sent." };
    render();
  }

  function renderChart() {
    const screen = document.getElementById("screen");

    const card = el("div", "card");

    const patientsReached = new Set(state.outreach.map(function (o) { return o.patientId; })).size;
    const gapsCovered = state.outreach.reduce(function (acc, o) {
      return acc + o.rowIds.split(",").filter(function (x) { return x.trim(); }).length;
    }, 0);

    const stats = el("div", "stats");

      const s = el("div", "stat");

      num.setAttribute("data-field", field);
      s.appendChild(num);
      s.appendChild(el("div", "l", label));
      return s;

    stats.appendChild(stat(patientsReached, "Patients reached", "patientsReached"));
    stats.appendChild(stat(gapsCovered, "Care gaps covered", "gapsCovered"));

    screen.appendChild(card);

    const detail = el("div", "card");
    detail.id = "outreachDetails";

  function renderRunData() {
    const screen = document.getElementById("screen");

    const card = el("div", "card");
    card.appendChild(el("h2", "card-title", "Run data"));
    card.appendChild(el("div", "sub",
      "Every row starts at " + INITIAL_STATUS + ". The bot types the outcome into status after."));

    if (!state.rows.length) {
      const empty = el("div", "empty", "No worklist loaded. Upload the file on the Load Worklist tab.");

      card.appendChild(empty);
      screen.appendChild(card);
      return;
    }

    const table = document.createElement("table");
    table.id = "runDataTable";
    table.style.marginTop = "18px";

    const thead = document.createElement("thead");
    const htr = document.createElement("tr");
    ["Row", "Patient ID", "Patient name", "Code", "Care gap measure",
     "Status before", "Status after", "Updated at"]
      .forEach(function (h, i) { htr.appendChild(el("th", i === 4 ? "hide-sm" : null, h)); });
    thead.appendChild(htr);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");

    state.rows.forEach(function (r) {
      const tr = document.createElement("tr");
      tr.setAttribute("data-row-id", String(r.rowId));
      tr.setAttribute("data-patient-id", r.patientId);

      tr.appendChild(cell(String(r.rowId), "rowId", "mono-soft"));
