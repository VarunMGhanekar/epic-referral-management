      tr.appendChild(cell(patientNameFor(r), "patientName", "pt-name"));
      tr.appendChild(cell(r.measureCode, "measureCode", "mono"));
      tr.appendChild(cell(measureNameFor(r), "measureName", "soft hide-sm"));

      const before = el("td");
      before.setAttribute("data-field", "statusBefore");
      before.appendChild(el("span", "chip muted", r.statusBefore));
      tr.appendChild(before);

      const after = el("td");
      after.setAttribute("data-field", "statusAfter");
      after.setAttribute("data-value", r.statusAfter);

      const input = document.createElement("input");
      input.type = "text";
      input.id = "status-row-" + r.rowId;
      input.setAttribute("name", "status-row-" + r.rowId);
      input.setAttribute("autocomplete", "off");
      input.setAttribute("data-row-id", String(r.rowId));
      input.setAttribute("data-patient-id", r.patientId);
      input.value = r.statusAfter;
      if (!isKnownStatus(r.statusAfter)) input.className = "unknown-status";

      function commit() {
        const typed = (input.value || "").trim();
        if (!typed) { input.value = r.statusAfter; return; }

        const canonical = canonicalStatus(typed);
        r.statusAfter = canonical || typed;
        r.updatedAt = stamp();
        saveState();

        saveMessage = canonical
          ? { kind: "ok", text: "Row " + r.rowId + " set to " + canonical + "." }
          : { kind: "bad", text: "Row " + r.rowId + " set to \"" + typed + "\", which is not a known status value." };

        render();
      }

      input.addEventListener("change", commit);
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") commit(); });

      after.appendChild(input);
      tr.appendChild(after);

      tr.appendChild(cell(r.updatedAt || "\u2014", "updatedAt", "mono-soft"));

      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    card.appendChild(table);

    const actions = el("div", "actions");
    const save = el("button", "btn btn-primary", "Save status updates");
    save.id = "saveStatusButton";
    save.type = "button";
    save.addEventListener("click", function () {
      state.rows.forEach(function (r) {
        const s = document.getElementById("status-row-" + r.rowId);
        if (!s) return;
        const typed = (s.value || "").trim();
        if (!typed || typed === r.statusAfter) return;
        r.statusAfter = canonicalStatus(typed) || typed;
        r.updatedAt = stamp();
      });
      saveState();
      saveMessage = { kind: "ok", text: "Status updates saved." };
      render();
    });
    actions.appendChild(save);
    card.appendChild(actions);

    const res = el("div", saveMessage ? "banner " + saveMessage.kind : "banner info",
      saveMessage ? saveMessage.text : "No status updates written yet.");
    res.id = "saveResult";
    res.setAttribute("data-pending", String(pendingCount()));
    card.appendChild(res);

    screen.appendChild(card);

    /* run summary, computed from the rows in the table above */
    const sum = el("div", "card");
    sum.id = "runSummary";
    sum.appendChild(el("div", "section-title", "RUN SUMMARY"));

    const counts = {};
    state.rows.forEach(function (r) { counts[r.statusAfter] = (counts[r.statusAfter] || 0) + 1; });

    const table2 = document.createElement("table");
    const thead2 = document.createElement("thead");
    const htr2 = document.createElement("tr");
    ["Status", "Rows"].forEach(function (h) { htr2.appendChild(el("th", null, h)); });
    thead2.appendChild(htr2);
    table2.appendChild(thead2);

    const tbody2 = document.createElement("tbody");

    Object.keys(counts).sort().forEach(function (status) {
      const tr = document.createElement("tr");
      tr.setAttribute("data-status", status);

      const td = el("td");
      td.setAttribute("data-field", "status");
      td.appendChild(el("span", statusChipClass(status), status));
      tr.appendChild(td);

      tr.appendChild(cell(String(counts[status]), "count", "mono"));
      tbody2.appendChild(tr);
    });

    const totalRow = document.createElement("tr");
    totalRow.setAttribute("data-status", "Total");
    totalRow.appendChild(cell("Total rows", "status", "pt-name"));
    totalRow.appendChild(cell(String(state.rows.length), "count", "mono"));
    tbody2.appendChild(totalRow);

    table2.appendChild(tbody2);
    sum.appendChild(table2);

    screen.appendChild(sum);
  }


  /* ============================================================
     ROUTER
     ============================================================ */

  function render() {
    renderTabs();
    const screen = document.getElementById("screen");
    screen.innerHTML = "";

    if (tab === "load")          renderLoad();
    else if (tab === "search")   renderSearch();
    else if (tab === "details")  renderDetails();
    else if (tab === "outreach") renderOutreach();
    else if (tab === "chart")    renderChart();
    else                         renderRunData();
  }

    if (state.selectedPatientId) searchResultId = state.selectedPatientId;

          </div>
        </div>`;

      bootCareGap();
    }
  };
})();

  function bytes(n) {
    if (!n) return "0 B";
    const units = ["B", "KB", "MB", "GB"];
    const i = Math.min(3, Math.floor(Math.log(n) / Math.log(1024)));
    return (n / Math.pow(1024, i)).toFixed(i ? 1 : 0) + " " + units[i];
  }

  function when(s) {
    if (!s) return "\u2014";
    try {
      return new Date(s).toLocaleString("en-US", {
        month: "short", day: "numeric", year: "numeric",
        hour: "2-digit", minute: "2-digit"
      });
    } catch (e) { return String(s); }
  }

  function headers(extra) {
    return Object.assign({
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    }, extra || {});
  }

  function toast(message, isError) {
    U.toast(message, isError ? "error" : "success");
  }

  /*
   * Queue name comes from the application, so each one feeds its own
   * queue rather than everything landing in a single shared one.
   *
   * Spaces are stripped and anything outside letters, digits, dash and
   * underscore is replaced, because Orchestrator queue names are used
   * verbatim in API paths and a space is awkward to type and easy to
   * get wrong when creating the queue by hand.
   *
   *   "Agentic Referral Management"  ->  "AgenticReferralManagement"
   *
   * A matching queue must already exist in Orchestrator; it will not
   * create one on demand and returns 404 if the name is unknown. Set a
   * queue_name column on the projects row to override.
   */
  function queueNameFor(project) {
    if (project && project.queue_name) return U.clean(project.queue_name);

    return U.clean(project && project.name)
      .replace(/\s+/g, "")
      .replace(/[^\w-]/g, "")
      .slice(0, 200);
  }

  /* ---------------- Per-view wiring ---------------- */

  function wireView() {
    const on = (id, fn) => { const el = $(id); if (el) el.addEventListener("click", fn); };

    on("obHomeNew", () => openCreateModal());
    on("obWelcomeNew", () => openCreateModal());
    on("obAppsNew", () => openCreateModal());
    on("obDocsRefresh", () => loadDocs(true));
    on("obDocsImport", () => { const i = $("obFileInput"); if (i) i.click(); });
    on("obDeleteApp", () => openDeleteModal(selected));
    on("obRetrieveBtn", retrieveNext);

    document.querySelectorAll("#obViews [data-open-app]").forEach(b =>
      b.addEventListener("click", () => openApp(b.dataset.openApp)));
    document.querySelectorAll("#obViews [data-delete-app]").forEach(b =>
      b.addEventListener("click", () => {
        openDeleteModal(projects.find(p => String(p.id) === String(b.dataset.deleteApp)));
      }));

    document.querySelectorAll("#obViews [data-export]").forEach(b =>
      b.addEventListener("click", () => exportDocument(b.dataset.export, b)));
    document.querySelectorAll("#obViews [data-download]").forEach(b =>
      b.addEventListener("click", () => downloadDocument(b.dataset.download, b)));
    document.querySelectorAll("#obViews [data-delete]").forEach(b =>
      b.addEventListener("click", () => deleteDocument(b.dataset.delete)));

    const zone = $("obDropzone");
    const input = $("obFileInput");

    if (input) {
      input.addEventListener("change", () => {
        uploadFiles(input.files);
        input.value = "";
      });
    }
    if (zone) {
      ["dragenter", "dragover"].forEach(ev =>
        zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add("drag"); }));
      ["dragleave", "drop"].forEach(ev =>
        zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove("drag"); }));
      zone.addEventListener("drop", e => {
        if (e.dataTransfer && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
      });
    }
  }

  /* ---------------- Data ---------------- */

  async function listFolder(project) {
    const { data, error } = await sb.storage
      .from(project.bucket_name)
      .list(FOLDER.path, { limit: 1000, sortBy: { column: "created_at", order: "asc" } });

    if (error) throw error;
    /* Storage returns a placeholder for an empty folder; drop it. */
    return (data || []).filter(x =>
      x.name && x.name !== ".folder" && x.name !== ".emptyFolderPlaceholder");
  }

  async function loadProjects() {
    const { data, error } = await sb
      .from(TABLES.projects)
      .select("*")
      .order("created_at", { ascending: false });

    if (error) { toast(error.message, true); return; }

    projects = data || [];

    /* Document counts per application, so the tiles and tables are
       accurate without a second click. */
    await Promise.all(projects.map(async (p) => {
      try {
        const list = await listFolder(p);
        p._docCount = list.length;
        p._docBytes = list.reduce((n, d) => n + ((d.metadata && d.metadata.size) || 0), 0);
      } catch (e) {
        p._docCount = undefined;
        p._docBytes = 0;
      }
    }));

    if (selected) {
      selected = projects.find(p => String(p.id) === String(selected.id)) || null;
    }
    render();
  }

  async function loadDocs(announce) {
    if (!selected) return;
    try {
      docs = await listFolder(selected);
      if (announce) toast(docs.length + " document" + (docs.length === 1 ? "" : "s") + " listed.");
    } catch (e) {
      docs = [];
      toast(e.message || "Unable to list documents.", true);
    }
    render();
  }

  async function openApp(id) {
    const p = projects.find(x => String(x.id) === String(id));
    if (!p) return;
    selected = p;
    docs = [];
    view = "documents";
    render();
    await loadDocs(false);
  }

  /* ---------------- Upload ---------------- */

  async function uploadFiles(files) {
    if (!selected) { toast("Open an application first.", true); return; }

    const list = Array.from(files || []);
    if (!list.length) return;

    const note = $("obUploadNote");
    let done = 0;

    for (let i = 0; i < list.length; i++) {
      const f = list[i];

      if (f.size > 52428800) {
        if (note) note.innerHTML =
          `<div class="ob-callout err">${esc(f.name)} exceeds the 50 MB limit.</div>`;
        continue;
      }

      /* Keep object keys predictable, as the original POC did. */
      const safe = f.name.replace(/[^\w.\- ()]/g, "_");

      if (note) note.innerHTML =
        `<div class="ob-note">Importing ${esc(f.name)} (${i + 1} of ${list.length})\u2026</div>`;

      const { error } = await sb.storage
        .from(selected.bucket_name)
        .upload(FOLDER.path + "/" + safe, f, { upsert: false });

      if (error) {
        if (note) note.innerHTML =
          `<div class="ob-callout err">${esc(f.name)}: ${esc(error.message)}</div>`;
        toast(error.message, true);
      } else {
        done++;
      }
    }

    if (done) {
      if (note) note.innerHTML =
        `<div class="ob-callout ok">${done} document${done === 1 ? "" : "s"} imported into ${esc(FOLDER.label)}.</div>`;
      toast(done + " document" + (done === 1 ? "" : "s") + " imported.");
      await loadDocs(false);
      await loadProjects();
    }
  }

  /* ---------------- Document actions ---------------- */

  async function downloadDocument(name, btn) {
    if (!selected) return;
    btn.disabled = true;

    try {
      const { data, error } = await sb.storage
        .from(selected.bucket_name)
        .download(FOLDER.path + "/" + name);

      if (error) throw error;

      const url = URL.createObjectURL(data);
      const a = document.createElement("a");
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch (e) {
      toast(e.message || "Download failed", true);
    } finally {
      btn.disabled = false;
    }
  }

  async function deleteDocument(name) {
    if (!selected) return;
    if (!confirm("Delete " + name + "?\n\nThis cannot be undone.")) return;

    const { error } = await sb.storage
      .from(selected.bucket_name)
      .remove([FOLDER.path + "/" + name]);

    if (error) { toast(error.message, true); return; }

    delete queued[FOLDER.path + "/" + name];
    toast("Document deleted.");
    await loadDocs(false);
    await loadProjects();
  }

  /*
   * Export sends the document's own details and nothing else. No table
   * is read: name, type, size, folder, path, bucket and application all
   * come from the document and the open application.
   */
  async function exportDocument(name, btn) {
    if (!selected) return;

    const doc = docs.find(d => d.name === name);
    const path = FOLDER.path + "/" + name;
    const label = btn.innerHTML;

    btn.disabled = true;
    btn.innerHTML = "Sending\u2026";

    const specificContent = {
      "Application": selected.name,
      "Bucket": selected.bucket_name || "",
      "Folder": FOLDER.label,
      "File Name": name,
      "File Type": (doc && doc.metadata && doc.metadata.mimetype) || "document",
      "File Size": bytes(doc && doc.metadata && doc.metadata.size),
      "Size Bytes": String((doc && doc.metadata && doc.metadata.size) || 0),
      "Storage Path": path,
      "Imported": when(doc && doc.created_at),
      "Exported By": (window.EHR_SESSION && window.EHR_SESSION.get()
        ? window.EHR_SESSION.get().name : "")
    };

    try {
      const r = await fetch(FUNCTIONS.queuePush, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({
          /* The queue is named after the application, so each one has
             its own. The queue must already exist in Orchestrator. */
          queue: queueNameFor(selected),
          reference: path,          /* dedupes per file in Orchestrator */
          priority: "Normal",
          specificContent: specificContent,
          /* A queue item cannot carry the file, so ask for a signed URL
             the robot can GET with no credential. */
          signFile: {
            bucket: selected.bucket_name,
            path: path,
            expiresIn: 7 * 24 * 60 * 60
          }
        })
      });

      const body = await r.json().catch(() => ({}));
      if (!r.ok || !body.success) {
        throw new Error(body.error || body.message || "Queue push failed");
      }

      queued[path] = body.queueItemId;

      toast('Sent to queue "' + body.queue + '"' +
        (body.queueItemId ? " \u00b7 item #" + body.queueItemId : "") +
        (body.downloadUrl ? " \u00b7 file URL included" : "") + ".");

      btn.innerHTML = body.queueItemId ? "Queued #" + body.queueItemId : "Queued";
      btn.classList.remove("export");
      btn.title = "Already sent this session. Click to send again.";
    } catch (e) {
      toast(e.message || "Queue push failed", true);
      btn.innerHTML = label;
    } finally {
      btn.disabled = false;
    }
  }

  /* ---------------- Retrieval ---------------- */

  async function retrieveNext() {
    const project = $("obRetrieveApp").value;
    const box = $("obRetrieveResult");

    if (!project) { toast("Select an application.", true); return; }

    box.innerHTML = `<div class="ob-note">Calling get-document\u2026</div>`;

    try {
      const r = await fetch(FUNCTIONS.getDocument, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ project })
      });

      if (r.status === 404) {
        let x = {};
        try { x = await r.json(); } catch (e) { /* no body */ }
        box.innerHTML = `
          <div class="ob-callout">
            <b>No document available</b><br>
            ${esc(x.error || "Nothing in " + FOLDER.label + " for this application.")}
          </div>`;
        return;
      }

      if (!r.ok) throw new Error(await r.text());

      const blob = await r.blob();
      const name = decodeURIComponent(
        r.headers.get("X-Document-Name") || "document.pdf");
      const url = URL.createObjectURL(blob);

      box.innerHTML = `
        <div class="ob-callout ok">
          <b>${esc(name)}</b><br>
          Retrieved as an actual file \u00b7 ${esc(bytes(blob.size))}
          <div style="margin-top:10px;">
            <a class="ob-btn primary" href="${url}" download="${esc(name)}">
              Save Retrieved Document</a>
          </div>
        </div>`;
    } catch (e) {
      box.innerHTML =
        `<div class="ob-callout err"><b>Error</b><br>${esc(e.message || e)}</div>`;
    }
  }

  /* ---------------- Modals ---------------- */

  function closeModal() { $("obModal").classList.remove("show"); }

  function openCreateModal() {
    $("obModalTitle").textContent = "Create Application";
    $("obModalBody").innerHTML = `
      <div class="ob-callout" style="margin-bottom:12px;">
        Creates the application record and provisions its dedicated storage
        bucket with the ${esc(FOLDER.label)} folder.
      </div>
      <div class="ob-field">
        <label>Application name</label>
        <input id="obNewName" placeholder="Agentic Referral Management">
      </div>
      <div id="obCreateStatus" class="ob-note"></div>`;
    $("obModalFoot").innerHTML = `
      <button class="ob-btn" id="obCreateCancel">Cancel</button>
      <button class="ob-btn primary" id="obCreateGo">Create Application</button>`;

    $("obModal").classList.add("show");
    $("obNewName").focus();

    $("obCreateCancel").addEventListener("click", closeModal);
    $("obCreateGo").addEventListener("click", createApplication);
    $("obNewName").addEventListener("keydown", e => {
      if (e.key === "Enter") createApplication();
    });
  }

  async function createApplication() {
    const input = $("obNewName");
    const btn = $("obCreateGo");
    const status = $("obCreateStatus");
    const name = U.clean(input.value);

    if (!name) {
      status.innerHTML = `<span style="color:var(--ob-red-600)">Enter an application name.</span>`;
      input.focus();
      return;
    }

    btn.disabled = true;
    btn.textContent = "Creating\u2026";
    status.textContent = "Connecting to create-project\u2026";

    try {
      const r = await fetch(FUNCTIONS.createProject, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ name })
      });

      const text = await r.text();
      let data;
      try { data = JSON.parse(text); }
      catch (e) {
        throw new Error("create-project returned HTTP " + r.status + ": " + text);
      }

      if (!r.ok || !data.success) {
        throw new Error(data.error ||
          "Application creation failed (HTTP " + r.status + ").");
      }

      closeModal();
      toast(data.existing
        ? 'Application "' + data.project.name + '" already exists.'
        : 'Application "' + data.project.name + '" created.');

      await loadProjects();
      if (data.project && data.project.id) await openApp(data.project.id);
    } catch (e) {
      status.innerHTML = `<span style="color:var(--ob-red-600)">${esc(e.message || e)}</span>`;
      toast(e.message || String(e), true);
    } finally {
      btn.disabled = false;
      btn.textContent = "Create Application";
    }
  }

  function openDeleteModal(project) {
    if (!project) return;

    $("obModalTitle").textContent = "Delete Application";
    $("obModalBody").innerHTML = `
      <div class="ob-callout err" style="margin-bottom:12px;">
        <b>This removes everything.</b> The application record, its storage
        bucket and every document in it are deleted permanently.
      </div>
      <div class="ob-field">
        <label>Type the application name to confirm</label>
        <input id="obDeleteConfirm" placeholder="${esc(project.name)}">
      </div>
      <div id="obDeleteStatus" class="ob-note"></div>`;
    $("obModalFoot").innerHTML = `
      <button class="ob-btn" id="obDeleteCancel">Cancel</button>
      <button class="ob-btn danger" id="obDeleteGo">Delete Permanently</button>`;

    $("obModal").classList.add("show");
    $("obDeleteConfirm").focus();

    $("obDeleteCancel").addEventListener("click", closeModal);
    $("obDeleteGo").addEventListener("click", () => deleteApplication(project));
  }

  async function deleteApplication(project) {
    const typed = U.clean($("obDeleteConfirm").value);
    const status = $("obDeleteStatus");
    const btn = $("obDeleteGo");

    if (typed !== project.name) {
      status.innerHTML =
        `<span style="color:var(--ob-red-600)">The name does not match.</span>`;
      return;
    }

    btn.disabled = true;
    btn.textContent = "Deleting\u2026";

    try {
      const r = await fetch(FUNCTIONS.deleteProject, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ name: project.name, project: project.name })
      });

      const text = await r.text();
      let data;
      try { data = JSON.parse(text); }
      catch (e) {
        throw new Error("delete-project returned HTTP " + r.status + ": " + text);
      }

      if (!r.ok || data.success === false) {
        throw new Error(data.error ||
          "Deletion failed (HTTP " + r.status + ").");
      }

      closeModal();
      selected = null;
      docs = [];
      view = "home";
      toast('Application "' + project.name + '" deleted.');
      await loadProjects();
    } catch (e) {
      status.innerHTML = `<span style="color:var(--ob-red-600)">${esc(e.message || e)}</span>`;
      toast(e.message || String(e), true);
    } finally {
      btn.disabled = false;
      btn.textContent = "Delete Permanently";
    }
  }

  /* ---------------- supabase-js loader ---------------- */

  /* Loaded on demand so the portal does not carry the dependency for
     pages that never use it. */
  function ensureClient() {
    return new Promise((resolve, reject) => {
      if (window.supabase && window.supabase.createClient) {
        resolve(window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY));
        return;
      }

      const existing = document.getElementById("obSupabaseSdk");
      if (existing) {
        existing.addEventListener("load", () =>
          resolve(window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)));
        existing.addEventListener("error", () =>
          reject(new Error("Could not load the Supabase client library.")));
        return;
      }

      const s = document.createElement("script");
      s.id = "obSupabaseSdk";
      s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
      s.onload = () =>
        resolve(window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY));
      s.onerror = () =>
        reject(new Error("Could not load the Supabase client library."));
      document.head.appendChild(s);
    });
  }

  /* ---------------- Module contract ---------------- */

  window.EHR_MODULES.pocsource = {
    config: { SUPABASE_URL, FUNCTIONS, TABLES, FOLDER },

    mount(container) {
      projects = [];
      selected = null;
      docs = [];
      view = "home";

      container.innerHTML = shell();

      const user = (window.EHR_SESSION && window.EHR_SESSION.get()) || {};
      if (user.name) {
        $("obUserName").textContent = user.name;
        $("obAvatar").textContent = U.initials(user.name);
      }

      document.querySelectorAll("#obRibbonTabs .ob-ribbon-tab").forEach(b =>
        b.addEventListener("click", () => switchView(b.dataset.view)));
      document.querySelectorAll(".onbase .ob-navitem").forEach(n =>
        n.addEventListener("click", () => switchView(n.dataset.view)));

      $("obNewApp").addEventListener("click", () => openCreateModal());
      $("obSideNew").addEventListener("click", () => openCreateModal());
      $("obRefresh").addEventListener("click", () => loadProjects());
      $("obImport").addEventListener("click", () => {
        if (!selected) { toast("Open an application first.", true); return; }
        switchView("documents");
        const i = $("obFileInput");
        if (i) i.click();
      });
      $("obGoDocs").addEventListener("click", () => switchView("documents"));
      $("obGoRetrieve").addEventListener("click", () => switchView("retrieve"));
      $("obGoApi").addEventListener("click", () => switchView("api"));
      $("obModalClose").addEventListener("click", closeModal);
      $("obModal").addEventListener("click", e => {
        if (e.target.id === "obModal") closeModal();
      });

      render();

      ensureClient()
        .then(client => { sb = client; return loadProjects(); })
        .catch(e => {
          $("obViews").innerHTML = `
            <div class="ob-view active">
              <div class="ob-panel"><div class="ob-panel-body">
                <div class="ob-callout err">
                  <b>Could not start</b><br>${esc(e.message)}
                </div>
              </div></div>
            </div>`;
        });
    }
  };
})();


/* ===== pages/reports/reports.js ===== */
/* =========================================================
   MODULE — REPORTS
   Operational summary across every area of the portal. Like
   Patient Lookup, it reads what the modules already hold rather
   than issuing queries of its own, so no table, endpoint or Edge
   Function is involved.
   ========================================================= */

(function () {
  "use strict";

  const U = window.EHR;
  const $ = (id) => document.getElementById(id);
  const esc = U.esc;

  function referrals() {
    return (window.REFERRAL_PATIENTS && window.REFERRAL_PATIENTS()) || [];
  }
  function paCases() {
    return (window.PRIORAUTH_CASES_LIVE && window.PRIORAUTH_CASES_LIVE()) || window.PRIORAUTH_CASES || [];
  }
  function payerCases() {
    return (window.PAYER_CASES && window.PAYER_CASES()) || [];
  }
  function providerRecords() {
    return (window.PROVIDER_RECORDS && window.PROVIDER_RECORDS()) || [];
  }

  /* Count occurrences of a field, biggest first. */
  function tally(rows, pick) {
    const counts = {};
    rows.forEach(r => {
      const v = U.clean(pick(r)) || "Not recorded";
      counts[v] = (counts[v] || 0) + 1;
    });
    return Object.entries(counts).sort((a, b) => b[1] - a[1]);
  }

  function barTable(pairs, total, emptyMsg) {
    if (!pairs.length) return `<div class="empty-hint">${esc(emptyMsg)}</div>`;
    const max = Math.max(...pairs.map(p => p[1])) || 1;
    return pairs.map(([label, n]) => `
      <div class="conf-row">
        <div class="conf-label">${esc(label)}</div>
        <div class="conf-bar-track">
          <div class="conf-bar-fill" style="width:${Math.round((n / max) * 100)}%"></div>
        </div>
        <div class="conf-pct">${n}</div>
      </div>`).join("");
  }

  function card(title, sub, body) {
    return `
      <div class="card">
        <div class="card-head">
          <div class="card-title">${esc(title)}</div>
          ${sub ? `<div class="card-sub">${esc(sub)}</div>` : ""}
        </div>
        <div class="card-body">${body}</div>
      </div>`;
  }

  function render() {
    const refs = referrals();
    const pa = paCases();
    const payer = payerCases();

    const urgent = refs.filter(r =>
      /urgent|stat/i.test(U.clean(r.urgency))).length;
    const withDocs = refs.filter(r => r.docs && r.docs.length).length;
    const submitted = pa.filter(c => c.status === "Submitted").length;
    const decided = payer.filter(c =>
      ["APPROVED", "APPROVED_WITH_CONDITIONS", "DENIED"].includes(c.status)).length;

    $("rpKpi").innerHTML = [
      U.kpi("Referrals", refs.length, "navy"),
      U.kpi("Urgent referrals", urgent, "red"),
      U.kpi("PA cases", pa.length, "amber"),
      U.kpi("PA submitted", submitted, "green"),
      U.kpi("Payer requests", payer.length, ""),
      U.kpi("Determinations", decided, "green"),
    ].join("");

    $("rpBody").innerHTML = `
      ${U.sectionLabel("Referral Management")}
      <div class="home-grid">
        ${card("Referrals by specialty", refs.length + " total",
          barTable(tally(refs, r => r.type), refs.length,
            "Open Referral Management once to load live records."))}
        ${card("Referrals by status", "",
          barTable(tally(refs, r => r.status), refs.length,
            "No referral records loaded yet."))}
        ${card("Documentation", withDocs + " of " + refs.length + " have documents",
          barTable(tally(refs, r => (r.docs && r.docs.length) ? "Has documents" : "No documents"),
            refs.length, "No referral records loaded yet."))}
      </div>

      ${U.sectionLabel("Prior Authorization")}
      <div class="home-grid">
        ${card("Cases by status", pa.length + " in queue",
          barTable(tally(pa, c => c.status), pa.length, "No PA cases."))}
        ${card("Cases by payer", "",
          barTable(tally(pa, c => c.payer), pa.length, "No PA cases."))}
        ${card("Cases by priority", "",
          barTable(tally(pa, c => c.priority), pa.length, "No PA cases."))}
      </div>

      ${U.sectionLabel("Payer Review")}
      <div class="home-grid">
        ${card("Requests by status", payer.length + " total",
          barTable(tally(payer, c => c.status), payer.length, "No payer requests."))}
        ${card("Requests by plan", "",
          barTable(tally(payer, c => c.payerShort || c.payer), payer.length, "No payer requests."))}
        ${card("Requested procedures", "",
          barTable(tally(payer, c => c.procedure), payer.length, "No payer requests."))}
      </div>

      ${U.sectionLabel("Provider source system")}
      <div class="home-grid">
        ${card("Providers by specialty", providerRecords().length + " on file",
          barTable(tally(providerRecords(), p => p.specialty), providerRecords().length,
            "Open Provider once to load the source system."))}
        ${card("Providers by state", "",
          barTable(tally(providerRecords(), p => p.state), providerRecords().length,
            "No provider records loaded yet."))}
        ${card("Providers by practice", "",
          barTable(tally(providerRecords(), p => p.practiceName), providerRecords().length,
            "No provider records loaded yet."))}
      </div>

      ${U.sectionLabel("Referring providers")}
      <div class="card"><div class="card-body">
        ${barTable(tally(refs, r => r.provider), refs.length,
          "Provider activity appears once referral records are loaded.")}
      </div></div>

      <div class="footer-note">
        Figures reflect what is currently loaded in this session, not a historical report.
      </div>`;
  }

  window.EHR_MODULES.reports = {
    mount(container) {
      container.innerHTML = U.pageHead({
        module: "Reports",
        title: "Operational Reports",
        sub: "Activity across referrals, prior authorization and payer review",
        actions: `<button class="btn btn-outline btn-sm" id="rpRefresh">${U.ICONS.refresh} Refresh</button>`
      }) + `
        <div class="module-body">
          <div class="kpi-row six" id="rpKpi"></div>
          <div id="rpBody"></div>
        </div>`;

      $("rpRefresh").addEventListener("click", () => {
        render();
        U.toast("Reports refreshed.", "success");
      });

      render();

      /* Referral figures only exist after that module has read Supabase. */
      setTimeout(render, 1800);
    }
  };
})();


/* ===== pages/claims/claims.js ===== */
/* =========================================================
   MODULE — CLAIMS
   The step after a determination. A claim is derived from an
   approved payer request plus the referral and PA context for
   the same procedure, so this page needs no data of its own.

   Claim numbers and amounts are illustrative: this is a demo of
   how the areas connect, not a billing system.
   ========================================================= */

(function () {
  "use strict";

  const U = window.EHR;
  const $ = (id) => document.getElementById(id);
  const esc = U.esc;

  /* Indicative allowed amounts so the page has something to total. */
  const FEE_SCHEDULE = {
    "72148": 1180,   // MRI lumbar spine without contrast
    "70553": 2240,   // MRI brain with and without contrast
    "58970": 3650,   // Oocyte retrieval
    "default": 940,
  };

  const STATUS_CLS = {
    "Ready to bill": "badge-info",
    "Submitted": "badge-processing",
    "Paid": "badge-approved",
    "Blocked": "badge-denied",
    "Awaiting determination": "badge-review",
  };

  let claims = [];

  function payerCases() {
    return (window.PAYER_CASES && window.PAYER_CASES()) || [];
  }
  function paCases() {
    return (window.PRIORAUTH_CASES_LIVE && window.PRIORAUTH_CASES_LIVE()) || window.PRIORAUTH_CASES || [];
  }

  function amountFor(cpt) {
    return FEE_SCHEDULE[U.clean(cpt)] || FEE_SCHEDULE.default;
  }

  function money(n) {
    return "$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2 });
  }

  /*
   * A claim exists for every payer request that reached a decision.
   * Approved becomes billable; denied is blocked; anything still in
   * review is shown as awaiting a determination so the pipeline is
   * visible end to end.
   */
  function build() {
    const pa = paCases();

    return payerCases().map((c, i) => {
      const cpt = (c.cptList && c.cptList[0]) || "";
      const approved = ["APPROVED", "APPROVED_WITH_CONDITIONS"].includes(c.status);
      const denied = c.status === "DENIED";

      const status = approved ? "Ready to bill"
        : denied ? "Blocked"
        : "Awaiting determination";

      /* Link back to the provider-side PA case for the same patient. */
      const paMatch = pa.find(p =>
        U.clean(p.patient).toLowerCase() === U.clean(c.patientName).toLowerCase());

      return {
        claimId: "CLM-2026-" + String(1001 + i),
        patient: c.patientName,
        dob: c.dob,
        memberId: c.memberId,
        payer: c.payerShort || c.payer,
        provider: c.provider,
        npi: c.npi,
        cpt: cpt,
        procedure: c.procedure,
        diagnosis: c.diagnosisCode,
        authNumber: c.authNumber,
        amount: approved ? amountFor(cpt) : 0,
        status: status,
        payerCaseId: c.id,
        paCaseId: paMatch ? paMatch.id : null,
      };
    });
  }

  function badge(status) {
    return `<span class="badge ${STATUS_CLS[status] || "badge-new"}">
      <span class="badge-dot"></span>${esc(status)}</span>`;
  }

  function render() {
    const q = U.clean($("clSearch").value).toLowerCase();
    const st = $("clStatus").value;

    const view = claims.filter(c => {
      const hay = [c.claimId, c.patient, c.memberId, c.payer, c.cpt, c.procedure]
        .map(U.clean).join(" ").toLowerCase();
      return (!q || hay.includes(q)) && (!st || c.status === st);
    });

    const billable = claims.filter(c => c.status === "Ready to bill");
    const total = billable.reduce((sum, c) => sum + c.amount, 0);

    $("clKpi").innerHTML = [
      U.kpi("Claims", claims.length, "navy"),
      U.kpi("Ready to bill", billable.length, "green"),
      U.kpi("Blocked", claims.filter(c => c.status === "Blocked").length, "red"),
      U.kpi("Billable value", money(total), ""),
    ].join("");

    $("clCount").textContent = view.length + " claim" + (view.length === 1 ? "" : "s");

    $("clRows").innerHTML = view.length ? view.map(c => `
      <tr>
        <td><div class="cell-strong cell-mono">${esc(c.claimId)}</div>
            <div class="cell-sub">${esc(c.payer)}</div></td>
        <td><div class="cell-strong">${esc(c.patient)}</div>
            <div class="cell-sub cell-mono">${esc(c.memberId)}</div></td>
        <td>${esc(c.procedure)}<div class="cell-sub cell-mono">CPT ${esc(c.cpt)} · ${esc(c.diagnosis)}</div></td>
        <td>${esc(c.provider)}<div class="cell-sub cell-mono">${esc(c.npi)}</div></td>
        <td class="cell-mono">${c.authNumber ? esc(c.authNumber) : "—"}</td>
        <td class="cell-mono">${c.amount ? money(c.amount) : "—"}</td>
        <td>${badge(c.status)}</td>
      </tr>`).join("")
      : `<tr><td colspan="7">${U.emptyState("No claims yet",
          "A claim appears here once a payer request reaches a determination. Work a case in Payer Review to create one.")}</td></tr>`;
  }

  window.EHR_MODULES.claims = {
    mount(container) {
      container.innerHTML = U.pageHead({
        module: "Claims",
        title: "Claims",
        sub: "Derived from payer determinations and their linked authorizations",
        actions: `<button class="btn btn-outline btn-sm" id="clRefresh">${U.ICONS.refresh} Refresh</button>`
      }) + `
        <div class="module-body">
          <div class="kpi-row" id="clKpi"></div>

          <div class="filter-bar">
            <div class="search-box">${U.ICONS.search}
              <input id="clSearch" placeholder="Search claim, patient, member ID, CPT…">
            </div>
            <select class="field-select" id="clStatus">
              <option value="">All statuses</option>
              <option>Ready to bill</option>
              <option>Awaiting determination</option>
              <option>Blocked</option>
            </select>
          </div>

          <div class="card">
            <div class="card-head">
              <div class="card-title">Claim worklist</div>
              <div class="card-sub" id="clCount"></div>
            </div>
            <div class="card-body flush">
              <div class="table-wrap">
                <table class="data">
                  <thead><tr>
                    <th>Claim</th><th>Patient</th><th>Service</th>
                    <th>Provider</th><th>Auth #</th><th>Allowed</th><th>Status</th>
                  </tr></thead>
                  <tbody id="clRows"></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="footer-note">
            Allowed amounts are indicative and shown to illustrate the flow from
            authorization to billing.
          </div>
        </div>`;

      claims = build();

      ["clSearch", "clStatus"].forEach(id => {
        $(id).addEventListener("input", render);
        $(id).addEventListener("change", render);
      });
      $("clRefresh").addEventListener("click", () => {
        claims = build();
        render();
        U.toast("Claims refreshed.", "success");
      });

      render();
    }
  };
})();


/* ===== js/app.js ===== */
/* =========================================================
   EHR PORTAL — SHELL + ROUTER
   Gates on sign-in, renders the Hyperspace chrome once, then
   hands a clean canvas to whichever module the route points at.
   Modules register on window.EHR_MODULES and are mounted lazily.
   ========================================================= */

window.EHR_MODULES = window.EHR_MODULES || {};

(function () {
  "use strict";

  const I = window.EHR.ICONS;
  const esc = window.EHR.esc;
  const mounted = {};
  let current = null;

  /* Workspace tabs sit above the activity rail, as in Hyperspace. */
  const WORKSPACES = [
    { id: "dashboard", label: "Home", icon: "dashboard" },
    { id: "referrals", label: "Referrals", icon: "referral" },
    { id: "priorauth", label: "Prior Auth", icon: "queue" },
    { id: "payer", label: "Payer Review", icon: "payer" },
    { id: "providers", label: "Provider", icon: "patients" },
    { id: "caregap", label: "Care Gap", icon: "criteria" },
    { id: "pocsource", label: "POC Source", icon: "file" },
  ];

  function shellHTML(user) {
    return `
      <div class="topbar">
        <div class="brand">
          <div class="brand-mark">E</div>
          <div class="brand-name">EPIC</div>
          <div class="brand-sub">Clinical Operations</div>
        </div>
        <div class="env-chip">DEMO</div>
        <div class="topbar-spacer"></div>
        <button class="topbar-icon-btn" title="Search">${I.search}</button>
        <button class="topbar-icon-btn" title="Notifications" style="position:relative;">
          ${I.bell}
          <span style="position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--amber-500);"></span>
        </button>
        <div class="topbar-user">
          <div class="avatar" id="userAvatar">${esc(user.initials)}</div>
          <div class="user-meta">
            <div class="user-name" id="userName">${esc(user.name)}</div>
            <div class="user-role" id="userRole">${esc(user.role)} · ${esc(user.dept)}</div>
          </div>
          <button class="signout" id="signOutBtn">Sign out</button>
        </div>
      </div>

      <div class="workspacebar" id="workspacebar">
        ${WORKSPACES.map(w => `
          <button class="ws-tab" data-nav="${w.id}">${I[w.icon] || ""}<span>${esc(w.label)}</span></button>
        `).join("")}
      </div>

      <div class="shell">
        <nav class="sidebar" id="sidebar" aria-label="Activities"></nav>
        <main class="main" id="moduleHost"></main>
      </div>

      <div class="statusbar">
        <span>Signed in as <b id="sbUser">${esc(user.name)}</b></span>
        <span class="sb-sep"></span>
        <span>${esc(user.role)}</span>
        <span class="sb-sep"></span>
        <span>Session started <b>${new Date().toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" })}</b></span>
        <div style="flex:1"></div>
        <span id="sbContext">Ready</span>
      </div>`;
  }

  function routeId() {
    const id = (location.hash || "").replace(/^#\/?/, "").split("/")[0];
    return id || "dashboard";
  }

  function paint(activeId) {
    document.getElementById("sidebar").innerHTML = window.EHR_NAV_RENDER(activeId);
    document.querySelectorAll("#workspacebar .ws-tab").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.nav === activeId);
    });
    document.querySelectorAll("[data-nav]").forEach(btn => {
      if (btn.dataset.wired) return;
      btn.dataset.wired = "1";
      btn.addEventListener("click", () => { location.hash = "#/" + btn.dataset.nav; });
    });
    /* Sidebar is re-rendered each route, so rewire it every time. */
    document.querySelectorAll("#sidebar [data-nav]").forEach(btn => {
      btn.addEventListener("click", () => { location.hash = "#/" + btn.dataset.nav; });
    });
  }

  function setContext(text) {
    const el = document.getElementById("sbContext");
    if (el) el.textContent = text;
  }

  function placeholder(host, id) {
    const label = (window.EHR_NAV.flatMap(g => g.items).find(i => i.id === id) || {}).label || id;
    host.innerHTML = `
      <div class="activity-head">
        ${window.EHR.pageHead({ module: label, title: label, sub: "Reserved in the portal. No backend wired up yet." })}
      </div>
      <div class="module-body">
        <div class="card"><div class="card-body">
          ${window.EHR.emptyState(
            "Activity not connected",
            "The shell, theme and navigation slot are ready. Add the module file under /pages and register it in navigation.js to bring it online."
          )}
        </div></div>
      </div>`;
  }

  function mount(id) {
    const host = document.getElementById("moduleHost");
    if (current && mounted[current] && typeof mounted[current].unmount === "function") {
      mounted[current].unmount();
    }
    host.innerHTML = "";
    window.scrollTo({ top: 0 });

    const mod = window.EHR_MODULES[id];
    if (!mod) { placeholder(host, id); current = id; setContext("Activity not connected"); return; }

    mounted[id] = mod;
    current = id;
    try {
      mod.mount(host);
      setContext("Ready");
    } catch (err) {
      console.error("[EHR] module failed to mount:", id, err);
      host.innerHTML = `<div class="module-body">${window.EHR.emptyState(
        "This activity could not load", "Check the browser console for details."
      )}</div>`;
      setContext("Load error");
    }
  }

  function go() {
    const id = routeId();
    paint(id);
    mount(id);
  }

  window.EHR_SET_CONTEXT = setContext;

  document.addEventListener("DOMContentLoaded", () => {
    window.EHR_SESSION.require((user) => {
      document.getElementById("app").innerHTML = shellHTML(user);
      document.getElementById("signOutBtn").addEventListener("click", () => {
        if (confirm("Sign out of the EHR workspace?")) window.EHR_SESSION.signOut();
      });
      window.addEventListener("hashchange", go);
      if (!location.hash) location.hash = "#/dashboard";
      go();
      window.EHR.toast("Welcome, " + user.name.replace(/,.*$/, "") + ".", "success");
    });
  });
})();

</script>
</body>
</html>
